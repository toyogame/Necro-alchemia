        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        if (u.guardOf !== best) { best.guardN = (best.guardN || 0) + 1; u.markT = 0.7; }
        u.guardOf = best; u.tgt = best; return;
      }
    }
  }
  u.guardOf = null;
  // 将狙い
  if (L >= 3 && B.boss && isAlive(B.boss) && isHunter(u) && dist2(B.boss.x, B.boss.y, N.x, N.y) < 440 * 440) {
    if (u.tgt !== B.boss) u.markT = 0.7;
    u.tgt = B.boss; u.hunt = true; return;
  }
  // ふだんの索敵：持ち場に近い敵を受け持つ。あなたから離れた敵は深追いしない
  const er = (125 + unitRange(u) * 0.5) * M.aggro;
  // 近衛はあなたのそばを離れない
  const bodyguard = !B.ring && u.fa < 0.26 && !isRangedAlly(u);
  const leashM = bodyguard ? R * 0.5 + 45 : (R + 80) * M.aggro, leashR = bodyguard ? R * 0.5 + 45 : (R + 140) * M.aggro;
  if (dN2 > (leashR + 70) * (leashR + 70)) { u.tgt = null; return; }
  const sl = formationSlot(u);
  const ranged = isRangedAlly(u);
  const reach = unitRange(u) + u.size * 0.5;
  let best = null, bs = 1e18;
  G.tgrid[ENEMY].query(u.x, u.y, er, (e) => {
    if (e.team !== ENEMY || e.dead || e.air > 0) return;
    const lsh = e.range > 40 ? leashR : leashM;
    const dn2 = dist2(e.x, e.y, N.x, N.y);
    if (dn2 > lsh * lsh) return;
    const d2 = dist2(u.x, u.y, e.x, e.y);
    if (d2 > er * er) return;
    const d = Math.sqrt(d2);
    let s = d + 0.6 * Math.sqrt(dist2(sl[0], sl[1], e.x, e.y));
    if (L >= 4) {
      // 射手・術師：その場から届く敵の中で選び直す（狙いのために前へ出ない）
      if (ranged) {
        if (d < reach + e.size) {
          if (e.range > 40 || e.special === 'purge' || e.special === 'haste') s *= 0.6;   // 危険な敵から
          if (e !== u.tgt && e.aimDps > 0 && e.aimDps * 1.3 > e.hp) s += 35;              // もう倒れる敵は任せる
        }
      } else {
        s += 0.25 * Math.sqrt(dn2);                                                      // あなたに近い敵から
        if (e !== u.tgt && e.aimN > 5 + e.size * 0.3) s += 25;                           // 群がりすぎ
      }
    }
    if (e === u.tgt) s -= 12;   // むやみに狙いを変えない
    if (s < bs) { bs = s; best = e; }
  });
  u.tgt = best;
}

// 狙う敵がいないときの行き先（統率力1以上）
function ledIdleTarget(u) {
  const N = G.necro, B = G.brain;
  if (u.retreatT > 0 && B) return [N.x - Math.cos(B.ang) * 12, N.y - Math.sin(B.ang) * 10];
  return formationSlot(u);
}

// ==== 07_units.js ====
// ---------- ユニット・戦闘 ----------
const ALLY = 0, ENEMY = 1;

// 陣営ごとの空間グリッド
function foeGrid(team) { return G.tgrid[team === ALLY ? ENEMY : ALLY]; }

// 普通の死者は脆い素材（ポンポン倒れて、また蘇らせる）。戦いの主役は合成体
// 序盤から脆い。倒れたら近くの死体を蘇らせて補充する前提
const UNDEAD_HP = 0.5, UNDEAD_ATK = 1.1;   // 普通の死者
// レベルによる守り・力の伸びは、普通の死者には一部しか掛からない（群れだけで押し切れないように）
const ORD_LV_SHARE = 0.4;
function isOrdinary(u) { return u.kind !== 'syn' && !u.isBoss && !u.mid && !u.unique; }
const SYNTH_HP = 4.3, SYNTH_ATK = 3.8;     // 合成体
function hpScale(g) { return 1 + 0.12 * (g - 1); }
function atkScale(g) { return 1 + 0.08 * (g - 1); }

// 敵のボスの強さ（体力と攻撃の倍率）。蘇らせた後には掛からない
const BOSS_ENEMY_HP = { 1: 10, 2: 14, 3: 24 }, BOSS_ENEMY_ATK = { 1: 2.0, 2: 2.0, 3: 1.6 };
// 中ボス
// 中ボスの体力は種類の差を縮める（民兵でも硬い）：(元の体力×3＋150)×格×3
const MID_HP = 3, MID_ATK = 2.5, MID_ALLY_HP = 2.6, MID_ALLY_ATK = 1.6;

function baseOf(u) {
  if (u.kind === 'syn') return SYNTH[u.synKey];
  return ETYPES[u.type] || BOSSES[u.type];
}

// ユニットの能力値を算出
function computeStats(u) {
  const b = baseOf(u);
  const M = G.mods;
  let hp = b.hp, atk = b.atk, spd = b.spd, range = b.range, cd = b.cd, atkType = b.atkType, aoe = b.aoe || 0;
  u.isBoss = !!BOSSES[u.type] && u.kind !== 'syn' || u.unique;
  if (u.team === ALLY && u.kind !== 'syn') {
    const f = FORMS[u.form];
    const soft = M.undecay; // 劣化の軽減（0〜1）
    hp *= lerp(f.hp, Math.max(1, f.hp), soft);
    atk *= lerp(f.atk, Math.max(1, f.atk), soft);
    spd *= f.spd;
    cd *= f.cd;
    // スケルトン・怨霊は系統ごとの戦い方になる
    if (u.form === 'skeleton' || u.form === 'wraith') {
      if (u.lin === 'bu') { atkType = 'melee'; range = 13; }
      else if (u.lin === 'sha') { atkType = u.form === 'wraith' ? 'pierce' : 'arrow'; range = 96; cd = Math.max(cd, 1.3); }
      else { atkType = 'bolt'; range = 100; cd = Math.max(cd, 1.6); }
      aoe = 0;
    }
    if (u.form === 'risen' || u.form === 'zombie') hp *= 1 + G.mods.fleshhorde;
    if (u.form === 'wraith') u.life = FORMS.wraith.life;
    if (atkType === 'blast') atkType = 'allyblast';
    if (b.special === 'burn' || b.special === 'rob' || b.special === 'purge' || b.special === 'charge') { /* 味方になると特殊行動はしない */ }
    u.phase = u.form === 'wraith';
    // 普通の死者は脆い。格が低いとすぐ倒れる（合成で精鋭にする前提）
    hp *= UNDEAD_HP; atk *= UNDEAD_ATK;
    // 種類ごとの得意・苦手
    const ar = ALLY_ROLE[u.type];
    if (ar) { hp *= ar.hp; atk *= ar.atk; spd *= ar.spd; cd /= ar.as; }
  }
  if (u.kind === 'syn' || (u.isBoss && b.phase)) u.phase = !!b.phase;
  u.mhp = Math.round(hp * hpScale(u.g));
  u.atk = atk * atkScale(u.g);
  if (u.team === ENEMY && u.isBoss) { u.mhp = Math.round(u.mhp * (b.hpMul || BOSS_ENEMY_HP[b.tier || 1])); u.atk *= BOSS_ENEMY_ATK[b.tier || 1]; }
  if (u.mid) {
    if (u.team === ENEMY) { u.mhp = Math.round((b.hp * 3 + 150) * hpScale(u.g) * MID_HP); u.atk *= MID_ATK; }
    else { u.mhp = Math.round(u.mhp * MID_ALLY_HP); u.atk *= MID_ALLY_ATK; }
  }
  u.spd = spd;
  u.range = range;
  u.cd = cd;
  // 合成体：基礎能力（種と★）× 格 × サブで伸びた能力
  if (u.kind === 'syn') {
    const st = synthStatBlock(u.synKey, u.g, u.grow);
    u.mhp = st.hp; u.atk = st.atk; u.spd = st.spd; u.cd = st.cd; u.range = st.range;
    u.sz = st.sz;
    aoe *= st.sz;
  } else u.sz = u.mid ? 1.5 : u.isBoss ? 1.3 : 1;
  u.atkType = atkType;
  u.aoe = aoe;
  u.hp = u.mhp;
  u.ability = (u.isBoss && (u.team === ENEMY || u.unique || u.form === 'risen' || u.form === 'zombie')) ? b.ability : null;
  if (u.mid && MIDBOSS[u.type] && (u.team === ENEMY || u.form === 'risen' || u.form === 'zombie')) u.ability = MIDBOSS[u.type].ability;
  u.size = u.kind === 'syn' ? Math.round(8 * (u.sz || 1) * (b.huge ? 1.6 : 1)) : u.isBoss ? (b.huge ? 15 : 9) : u.mid ? 8 : (b.mount ? 7 : 5);
  u.huge = !!b.huge;
  u.scale = u.mid ? 1.5 : 1;
  u.big = u.isBoss || u.kind === 'syn' || !!u.mid;
  const ax = u.kind === 'syn' && u.affix ? AFFIXES[u.affix] : null;
  u.taunt = !!b.taunt || !!(ax && ax.taunt);
  u.special = u.team === ENEMY ? b.special || null : null;
  u.holy = u.team === ENEMY && !!b.holy;
  u.altar = u.kind === 'syn' && !!b.altar;
  u.lich = u.kind === 'syn' && !!b.lich;
  u.dash = u.kind === 'syn' && !!b.dash;
  if (u.kind === 'syn' && u.tr) u.tr = Object.assign({}, u.tr, u.tr.tauntR ? { tauntR: u.tr.tauntR * (u.sz || 1) } : {});
  u.chimera = false;
  u.tr = u.kind === 'syn' ? mergeTraits(b.traits, ax ? ax.tr : null) : {};
}

function unitSprite(u) {
  if (u.kind === 'syn') {
    const c = sizeClassOf(u.sz || 1);
    return c ? ensureSprite('syn_' + u.synKey + '@' + SIZE_CLASS[c]) : 'syn_' + u.synKey;
  }
  if (u.type === 'reaper') return 'reaper_a';
  if (u.team === ENEMY) return u.type + (u.elite ? '_g' : '_e');
  if (u.form === 'risen') return u.type + '_r';
  if (u.form === 'zombie') return u.type + '_z';
  if (u.form === 'skeleton') return 'skel_' + u.lin;
  return 'wr_' + u.lin;
}

function makeUnit(o) {
  const u = Object.assign({
    id: G.idSeq++, team: ENEMY, kind: 'h', type: 'soldier', form: 'risen', lin: 'bu', g: 1, elite: false, unique: false, synKey: null,
    x: 0, y: 0, vx: 0, vy: 0, face: 1, tgt: null, tgtT: rng() * 0.3, anim: rng(), atkAnim: 0, flash: 0, cdT: rng() * 0.5,
    slowT: 0, slowF: 0, poisonT: 0, poisonDps: 0, plagueT: 0, buffT: 0, life: 0, dead: false, abT: 3 + rng() * 2, abState: null,
    anchor: null, ox: 0, oy: 0, slotT: 0, stormUsed: false, busy: 0, carry: null, chargeT: 0, chargeCd: 3, air: 0, summoned: false,
    hpHalf: false, born: G.t, tr: {},
  }, o);
  computeStats(u);
  u.spr = unitSprite(u);
  pickSlot(u);
  // 陣形での持ち場（兵ごとに固定。向きは陣が回る）
  u.fa = rng(); u.fd = Math.sqrt(rng());
  G.units.push(u);
  if (u.team === ENEMY) G.seenEnemies[u.type] = true;
  return u;
}

function pickSlot(u) {
  const n = G.allyCount || 0;
  const a = rng() * TAU, d = 16 + Math.sqrt(rng()) * (28 + Math.min(105, n * 0.38));
  u.ox = Math.cos(a) * d; u.oy = Math.sin(a) * d * 0.8;
  u.slotT = 4 + rng() * 4;
}

// ---- 討伐隊の勢い（緩急） ----
// 節目（2:30・5:00・7:30・10:00・12:30・15:00、延長戦は2分30秒ごと）に敵が一気に強く・多くなり（やばい）、
// その後ゆっくり落ち着いて、育った軍勢が追い越す（最強）。これを繰り返す。後半ほど全体も強くなる
const SURGE_TIMES = [150, 300, 450, 600, 750, 900];
function lastSurge(t) {
  let k = -1e9;
  for (const s of SURGE_TIMES) if (t >= s) k = s;
  if (t >= 900) k = 900 + Math.floor((t - 900) / 150) * 150;
  return k;
}
function surgeLevel(t) { return Math.exp(-(t - lastSurge(t)) / 75); }   // 1（節目の直後）→ 0
function enemyPressure() {
  const t = G.t;
  const late = 1 + TU.foe_late * clamp((t - 420) / 480, 0, 1);   // 後半の上乗せ（v43 で 22%→5% に下げた）
  return late * (1 + TU.foe_surge * surgeLevel(t));
}
function enemyGrade(gm) {
  const e = expectedLevel(G.t / 60);
  const extra = G.endless ? 1 + (G.t - 900) / 600 * 0.25 : 1;
  return Math.max(1, Math.round(e * TU.foe_base * gm * STAGES[G.stage].gradeMul * extra * enemyPressure() * rng.range(0.88, 1.12)));
}

function spawnEnemy(type, x, y, elite) {
  const t = ETYPES[type];
  let g = enemyGrade(t.gm);
  if (elite) g = Math.round(g * 1.25) + 1;
  return makeUnit({ team: ENEMY, kind: 'h', type, lin: t.lin, g, elite, x, y, form: 'alive' });
}

function spawnBoss(key, x, y) {
  const b = BOSSES[key];
  const mul = b.tier === 3 ? 2.4 : 2;
  const e = expectedLevel(G.t / 60);
  const g = Math.max(4, Math.round(e * mul * STAGES[G.stage].gradeMul * (G.endless ? 1.15 : 1)));
  const u = makeUnit({ team: ENEMY, kind: 'h', type: key, lin: b.lin, g, x, y, form: 'alive' });
  G.bossAlive.push(u);
  return u;
}

// 中ボス：その時間帯の敵の種類から選び、ひと回り大きく強くする
function spawnMid(type, x, y) {
  const t = ETYPES[type];
  const g = Math.max(3, Math.round(enemyGrade(t.gm) * 1.5) + 2);
  const u = makeUnit({ team: ENEMY, kind: 'h', type, lin: t.lin, g, elite: true, mid: true, x, y, form: 'alive' });
  G.midAlive.push(u);
  return u;
}

// 死体から味方を起こす
function allyFromCorpse(c) {
  let u;
  if (c.raiseSyn) {
    const sk = c.raiseSyn;
    const S = SYNTH[sk];
    u = makeUnit({ team: ALLY, kind: 'syn', synKey: sk, unique: !!S.unique, lin: S.lin, g: Math.max(1, Math.round(c.g * 0.9)), grow: c.grow || null, affix: c.affix || null, x: c.x, y: c.y, type: S.unique ? S.boss : sk });
    G.stats.reraised++;
  } else {
    const form = c.raiseForm;
    const kind = form === 'skeleton' ? 'skel' : form === 'wraith' ? 'wr' : 'h';
    u = makeUnit({ team: ALLY, kind, type: c.type, lin: c.lin, g: c.g, x: c.x, y: c.y, form, elite: false, mid: !!c.mid });
    if (form === 'skeleton') G.stats.raisedSkeleton++;
    if (c.look !== 'e' || c.kind === 'skel') G.stats.reraised++;
    if (BOSSES[c.type] && form === 'risen') {
      G.stats.bossesRaised++;
      G.discovered['boss_' + c.type] = true;
      if (c.type === 'hero') { G.stats.heroRaised++; onHeroRaised(); }
      banner(BOSSES[c.type].name + 'を配下にした', BOSSES[c.type].risenDesc, 'ally');
      sfx('raiseBig');
    }
    if (c.mid && form === 'risen' && MIDBOSS[c.type]) { banner(MIDBOSS[c.type].name + 'を配下にした', 'メインにすると★2として扱われる', 'ally'); sfx('raiseBig'); }
  }
  G.stats.raised++;
  return u;
}

// =========================================================
// 修正値（味方の攻撃・速度など）
// =========================================================
// ネクロマンサーのレベルが上がるほど、全ての死者が強くなる
function necroPower() { return 1 + 0.045 * (G.necro.lv - 1); }
function necroGuard() { return 1 + 0.032 * (G.necro.lv - 1); }

// 道の効果（その場で効く。後から位階が上がっても、今いる死者にも効く）
// 系統の道の効果が届く系統：系統の術式を持つ系統（血統の覚醒は軍勢で一番多い系統）
function linPathOn(u) { const M = G.mods; return (M.linOwn && M.linOwn[u.lin]) || (M.blood > 0 && u.lin === G.mainLin); }
// 同族の絆：軍勢にその系統が kinship_n 体いれば満額
function kinshipF(lin) { const i = lin === 'bu' ? 0 : lin === 'sha' ? 1 : lin === 'jutsu' ? 2 : -1; return i < 0 || !G.linN ? 0 : Math.min(1, G.linN[i] / TU.kinship_n); }
// 三系の調和：一番少ない系統が軍勢の harmony_share 以上なら満額（どれかが0なら効かない）
function harmonyMul() { const M = G.mods; return M.harmony > 0 && G.harmonyF > 0 ? 1 + M.harmony * G.harmonyF : 1; }
function pathAtkMul(u) {
  const M = G.mods;
  let m = 1;
  if (u.kind === 'syn') m *= M.synMul || 1;
  if (M.linG && isOrdinary(u) && linPathOn(u)) m *= atkScale(u.g + M.linG) / atkScale(u.g);
  if (M.horde) m *= 1 + Math.min(TU.p_mure3_max, TU.p_mure3 * Math.floor((G.armyN || 0) / 10));
  if (M.wrath && G.wrath > 0) m *= 1 + Math.min(TU.p_junkan2_max, TU.p_junkan2 * G.wrath);
  if (M.blood && u.lin === G.mainLin) m *= 1 + M.blood;   // 血統の覚醒
  if (M.harmony > 0 && u.lin) m *= harmonyMul();   // 三系の調和
  if (M.kinship > 0 && u.lin) m *= 1 + kinshipF(u.lin) * M.kinship;   // 同族の絆
  if (M.kingR > 0 && inKingAura(u)) m *= atkScale(u.g + TU.king_lv) / atkScale(u.g);   // 死王の威光
  return m;
}
// 死王の威光の範囲の中か（あなたのすぐそば）
function inKingAura(u) { const N = G.necro, r = G.mods.kingR; return !N.dead && dist2(u.x, u.y, N.x, N.y) < r * r; }
// 受けるダメージの割り算（大きいほど硬い）
function pathGuard(u) {
  const M = G.mods;
  let m = 1;
  if (u.kind === 'syn') m *= M.synMul || 1;
  if (M.linHp && linPathOn(u)) m *= 1 + TU.p_lin1;
  if (M.linG && isOrdinary(u) && linPathOn(u)) m *= hpScale(u.g + M.linG) / hpScale(u.g);
  if (M.auraGuard) { const N = G.necro; if (dist2(u.x, u.y, N.x, N.y) < M.auraR * M.auraR) m /= 1 - TU.p_toosotsu2; }
  if (M.blood && u.lin === G.mainLin) m *= 1 + M.blood;   // 血統の覚醒
  if (M.harmony > 0 && u.lin) m *= harmonyMul();   // 三系の調和
  if (M.kingR > 0 && inKingAura(u)) m *= hpScale(u.g + TU.king_lv) / hpScale(u.g);   // 死王の威光
  return m;
}

function allyAtkMul(u) {
  const M = G.mods;
  let m = isOrdinary(u) ? 1 + (necroPower() - 1) * ORD_LV_SHARE : necroPower();
  if (u.lin === 'bu') m *= 1 + G.mods.linbu;
  else if (u.lin === 'sha') m *= 1 + G.mods.linsha;
  else if (u.lin === 'jutsu') m *= 1 + G.mods.linjutsu;
  if (u.kind === 'syn') m *= 1 + G.mods.mastery;
  if (G.lead) m *= 1 + TU.lead_bonus * G.lead;   // 統率の取れた軍勢は強い
  m *= pathAtkMul(u);
  const N = G.necro;
  if (M.auraAtk > 0 && dist2(u.x, u.y, N.x, N.y) < M.auraR * M.auraR) m *= 1 + M.auraAtk;
  if (u.buffT > 0) m *= 1.6;
  // 亜種〈狂乱〉：体力が減るほど激しく
  if (u.tr && u.tr.frenzy) m *= 1 + 0.9 * (1 - u.hp / Math.max(1, u.mhp));
  // 傭兵隊長（味方）の鼓舞
  if (u.atkType === 'melee' || u.atkType === 'cleave') {
    for (const c of G.allyCaptains) if (c !== u && dist2(u.x, u.y, c.x, c.y) < 70 * 70) { m *= c.unique ? 1.4 : 1.25; break; }
  }
  return m;
}

function unitSpeed(u) {
  let s = u.spd;
  const M = G.mods;
  if (u.team === ALLY) {
    if (u.form === 'skeleton') s *= 1 + M.bonelegion;
    if (G.evos.warmarch) s *= 1.3;
    if (M.rallyMove > 0) { const N = G.necro; if (dist2(u.x, u.y, N.x, N.y) < M.auraR * M.auraR) s *= 1 + M.rallyMove; }   // 疾駆の号令
  }
  if (u.slowT > 0) s *= 1 - u.slowF;
  if (u.hasteT > 0) s *= 1.35;
  return s;
}

function unitCd(u) {
  let c = u.cd;
  if (u.hasteT > 0) c *= 0.75;
  if (u.team === ALLY && u.kind === 'syn' && G.mods.linAs && linPathOn(u)) c /= 1 + TU.p_lin3;
  if (u.team === ALLY && G.mods.rallyAs > 0) { const N = G.necro; if (dist2(u.x, u.y, N.x, N.y) < G.mods.auraR * G.mods.auraR) c /= 1 + G.mods.rallyAs; }   // 疾駆の号令
  if (u.team === ALLY && u.form === 'skeleton') {
    c /= 1 + G.mods.bonelegion;
    if (G.char === 'boneprist') c /= 1 + TU.trait_boneprist;
  }
  return c;
}

function unitRange(u) {
  let r = u.range;
  if (u.team === ALLY) {
    if (r > 30) {
      r *= 1 + G.mods.command;
      if (u.lin === 'sha') r *= 1 + G.mods.linsha;
    }
  }
  return r;
}

// =========================================================
// ダメージ・死亡
// =========================================================
function isAlive(t) { return t && !t.dead && t.hp > 0; }

function hitFx(x, y, col) {
  const n = (G.allyCount || 0) > 300 ? 1 : (G.allyCount || 0) > 150 ? 2 : 3;
  for (let i = 0; i < n; i++) spawnFx(x + rng.range(-2, 2), y - 6 + rng.range(-3, 3), rng.range(-30, 30), rng.range(-40, -10), 0.25, 'px', col, false, 60);
}

function damage(t, amt, src) {
  if (!isAlive(t) || amt <= 0) return;
  if (t.isNecro) { damageNecro(amt, src); return; }
  if (t.isPot) { damagePot(t, amt, src); return; }
  if (t.air > 0 || t.popT > 0) return;
  if (t.immortal) { t.flash = 0.05; return; } // 死神は倒れない
  if (t.team === ALLY) { amt /= isOrdinary(t) ? 1 + (necroGuard() - 1) * ORD_LV_SHARE : necroGuard(); if (G.lead) amt /= 1 + TU.lead_bonus * G.lead; amt /= pathGuard(t); }
  if (t.tr && t.tr.armor) amt *= 1 - t.tr.armor;
  if (src && src.tr && src.team === ALLY && !src.dead) {
    const tr = src.tr;
    if (tr.lifesteal) src.hp = Math.min(src.mhp, src.hp + amt * tr.lifesteal);
    if (tr.slowHit) { t.slowT = Math.max(t.slowT, 2); t.slowF = Math.max(t.slowF || 0, tr.slowHit); }
    if (tr.poisonHit) { t.poisonT = 3; t.poisonDps = Math.max(t.poisonDps || 0, src.atk * tr.poisonHit); }
  }
  t.hp -= amt;
  t.flash = 0.09;
  // 伝承の死霊〈デスナイト〉：一度だけ死の淵から立ち上がり、しばらく怒りに燃える
  if (t.hp <= 0 && t.team === ALLY && !t.undyingUsed && ((t.tr && t.tr.undying) || (t.kind === 'syn' && G.mods.synUndying))) {
    t.undyingUsed = true;
    const legend = !!(t.tr && t.tr.undying);
    t.hp = t.mhp * (legend ? 0.45 : TU.p_seiei3);
    t.buffT = legend ? 7 : 3;
    ringFx(t.x, t.y - 6, 26, rgba32(255, 60, 60, 255));
    for (let i = 0; i < 16; i++) spawnFx(t.x + rng.range(-8, 8), t.y - rng.range(0, 18), rng.range(-30, 30), -rng.range(20, 60), 0.6, 'px2', rgba32(255, 70 + Math.floor(rng() * 60), 50, 240), true);
    sfx('boss');
    return;
  }
  // 死に損ない：普通の死者は、倒れるはずの一撃を一度だけ耐える（姿ごとに1回。姿が変わると新しい死者になるので、また1回）
  if (t.hp <= 0 && t.team === ALLY && isOrdinary(t) && !t.deathlessUsed && G.mods.deathless > 0) {
    t.deathlessUsed = true;
    if (rng() < G.mods.deathless) {
      t.hp = Math.max(1, t.mhp * TU.deathless_hp);
      for (let i = 0; i < 6; i++) spawnFx(t.x + rng.range(-5, 5), t.y - rng.range(2, 12), rng.range(-15, 15), -rng.range(20, 45), 0.45, 'px', rgba32(230, 255, 210, 240), true);
      G.stats.deathless = (G.stats.deathless || 0) + 1;
      return;
    }
  }
  if (t.hp <= 0) killUnit(t, src);
  else if (t.team === ENEMY && t.isBoss && !t.hpHalf && t.hp < t.mhp * 0.5) { t.hpHalf = true; if (t.ability === 'hero') heroRally(t); }
}

function damageNecro(amt, src) {
  const N = G.necro;
  if (N.dead || N.invuln > 0) return;
  // 護衛のために、誰に傷つけられたかを覚えておく
  if (src && src.team === ENEMY && src.hp !== undefined) { G.necroAttacker = src; G.necroHitT = G.t; }
  amt *= G.mods.dmgTaken;
  // 神の屍の儀式中は、屍の加護で受ける傷が半分
  if (G.godRitual) amt *= 0.5;
  // 1回の被弾は最大体力の65%まで（ひ弱だが、一撃で消し飛ばされはしない）
  amt = Math.min(amt, N.mhp * 0.65);
  N.hp -= amt;
  // 大きな一撃のあとは少し長く無敵（連続した範囲攻撃で一瞬で溶けないように）
  N.invuln = amt >= N.mhp * 0.2 ? 0.9 : 0.4;
  N.flash = 0.12;
  N.hurtT = 0.4;
  G.shake = Math.max(G.shake, 2);
  sfx('hurt');
  if (N.hp <= 0) { N.hp = 0; N.dead = true; onNecroDeath(); }
}

function killUnit(u, src) {
  if (u.dead) return;
  u.dead = true;
  u.hp = 0;
  sfx('die');
  for (let i = 0; i < 5; i++) spawnFx(u.x + rng.range(-3, 3), u.y - 4, rng.range(-25, 25), rng.range(-35, -5), 0.4, 'px2', u.team === ENEMY ? rgba32(120, 30, 30, 230) : rgba32(80, 200, 140, 200), false, 80);
  if (u.team === ENEMY) onEnemyDeath(u, src);
  else onAllyDeath(u, src);
}

function onEnemyDeath(u, src) {
  G.stats.kills++;
  if (u.carry) { u.carry.dead = false; u.carry.robbed = false; u.carry.x = u.x; u.carry.y = u.y; G.corpses.push(u.carry); u.carry = null; }
  // 魂
  let v = 0.5 + u.g * 0.1;
  if (u.elite) v *= 3;
  if (u.isBoss) v *= 25;
  if (u.mid) v *= 8;
  dropSouls(u.x, u.y, v);
  if (u.isBoss || u.mid || (u.elite && rng() < 0.35) || rng() < 0.002) G.pickups.push({ x: u.x, y: u.y, t: 0, dead: false });
  if (u.isBoss) onBossDeath(u);
  if (u.mid) onMidDeath(u);
  if (u.holy) {
    // 聖騎士：光になって消える
    for (let i = 0; i < 10; i++) spawnFx(u.x + rng.range(-4, 4), u.y - rng.range(0, 10), 0, -rng.range(20, 50), 0.8, 'px2', rgba32(255, 240, 170, 255), true);
    sfx('holy');
    return;
  }
  // 即座に起き上がる条件（屍化の呪い・疫病・リッチ）
  let instant = false;
  const room = armyRoom() > 0;
  if (room && src && src.team === ALLY && rng() < G.mods.infect) { instant = true; G.stats.infected++; }
  if (room && u.plagueT > 0 && G.evos.plague) instant = true;
  if (room && !instant && G.lichs.length) {
    for (const l of G.lichs) if (dist2(l.x, l.y, u.x, u.y) < 120 * 120 && rng() < 0.35 + (l.tr.lichBoost || 0)) { instant = true; break; }
  }
  const keep = u.isBoss ? 90 : u.mid ? 60 : 24 * G.mods.decayMul;
  const c = addCorpse({ x: u.x, y: u.y, kind: 'h', type: u.type, look: 'e', raiseForm: 'risen', lin: u.lin, g: u.g, elite: u.elite, boss: u.isBoss, mid: !!u.mid,
    decay: keep, decayMax: keep });
  if (u.type === 'hero') { G.heroCorpse = c; c.decay = c.decayMax = 75; }
  // 倒したボス・中ボスの亡骸は、画面の外でも方向を出す（倒した瞬間に見失わないように）
  if ((u.isBoss || u.mid) && u.type !== 'god') { c.t0 = G.t; c.bossName = u.mid ? (MIDBOSS[u.type] ? MIDBOSS[u.type].name : ETYPES[u.type].name) : BOSSES[u.type].name; (G.bossCorpses = G.bossCorpses || []).push(c); }
  // 神の屍：朽ちず、焼けず、運び去られない。ここで止まって1分間ネクロマンスすると死神になる
  if (u.type === 'god') { c.sacred = true; c.decay = c.decayMax = Infinity; G.godCorpse = c; G.godProg = G.godProg || 0; G.godCorpseT = G.t; }
  if (instant && !u.isBoss && !u.mid) {
    c.dead = true;
    const a = allyFromCorpse(c);
    if (a) raiseFx(a.x, a.y, false);
  }
}

function onAllyDeath(u, src) {
  G.stats.lost++;
  const M = G.mods;
  const N = G.necro;
  // 死の爆ぜ
  if (M.burst > 0) {
    const r = M.burstR, dmg = u.atk * M.burst;
    G.tgrid[ENEMY].query(u.x, u.y, r, (e) => { if (e.team === ENEMY && !e.dead && dist2(e.x, e.y, u.x, u.y) < r * r) damage(e, dmg, null); });
    for (let i = 0; i < 8; i++) spawnFx(u.x, u.y - 4, Math.cos(i / 8 * TAU) * 60, Math.sin(i / 8 * TAU) * 45, 0.3, 'px2', rgba32(150, 255, 120, 255), true);
  }
  if (M.reap > 0) gainXp((TU.reap_base + u.g * TU.reap_g) * M.reap);
  // 循環の道
  if (M.deathHeal) {
    let n = 0;
    G.tgrid[ALLY].query(u.x, u.y, 44, (a) => { if (a.team === ALLY && !a.dead && a !== u && n < 6 && dist2(a.x, a.y, u.x, u.y) < 44 * 44) { a.hp = Math.min(a.mhp, a.hp + a.mhp * TU.p_junkan1); n++; } });
  }
  if (M.wrath) G.wrath = Math.min(Math.ceil(TU.p_junkan2_max / Math.max(1e-6, TU.p_junkan2)), (G.wrath || 0) + 1);
  if (G.evos.martyr && dist2(u.x, u.y, N.x, N.y) < M.auraR * M.auraR) {
    G.tgrid[ALLY].query(u.x, u.y, 60, (a) => { if (a.team === ALLY && !a.dead) a.buffT = 4; });
  }
  // 黄泉帰り：姿を保ったまま、その場ですぐ起き上がる（劣化しない。合成体も）
  if (M.yomigaeri > 0 && armyRoom() > 0 && rng() < M.yomigaeri) {
    const n = makeUnit({ team: ALLY, kind: u.kind, synKey: u.synKey, unique: u.unique, type: u.type, lin: u.lin, g: u.g, grow: u.grow || null, affix: u.affix || null,
      x: u.x, y: u.y, form: u.form, elite: false, mid: !!u.mid });
    n.stormUsed = u.stormUsed;
    raiseFx(n.x, n.y, u.kind === 'syn');
    for (let i = 0; i < 6; i++) spawnFx(n.x + rng.range(-5, 5), n.y - rng.range(0, 10), 0, -rng.range(20, 45), 0.6, 'px2', rgba32(200, 140, 255, 240), true);
    G.stats.yomigaeri = (G.stats.yomigaeri || 0) + 1;
    return;
  }
  // 骨の嵐：スケルトンは一度だけその場で起き上がる
  if (u.form === 'skeleton' && G.evos.bonestorm && !u.stormUsed) {
    const n = makeUnit({ team: ALLY, kind: 'skel', type: u.type, lin: u.lin, g: u.g, x: u.x, y: u.y, form: 'skeleton' });
    n.stormUsed = true;
    raiseFx(n.x, n.y, false);
    return;
  }
  // 劣化して死体になる
  if (u.kind === 'syn') {
    G.stats.synDeaths = (G.stats.synDeaths || 0) + 1;
    const next = synthDecayKey(u);
    if (!next) { fadeFx(u); return; }
    addCorpse({ x: u.x, y: u.y, kind: 'syn', sprKey: u.synKey, raiseSyn: next, lin: u.lin || 'bu', g: u.g, grow: decayedGrow(u.grow), affix: u.affix || null,
      type: u.type, unique: !!u.unique, boss: !!u.unique, decay: 45 * M.decayMul * (u.unique ? 2 : 1), decayMax: 45 * M.decayMul * (u.unique ? 2 : 1) });
    return;
  }
  const f = FORMS[u.form];
  if (!f.next) { fadeFx(u); return; }
  const look = u.form === 'risen' ? 'r' : 'z';
  const c = addCorpse({ x: u.x, y: u.y, kind: u.form === 'skeleton' ? 'skel' : 'h', type: u.type, look, raiseForm: f.next, lin: u.lin, g: u.g,
    boss: u.isBoss, mid: !!u.mid, decay: 30 * M.decayMul * (u.isBoss ? 2 : 1), decayMax: 30 * M.decayMul * (u.isBoss ? 2 : 1) });
  // 循環の道・三：普通の死者の4体に1体は、その場で即座に一つ下の姿で起き上がる
  if (M.rerise && isOrdinary(u) && !u.isBoss && rng() < M.rerise && armyRoom() > 0) {
    c.dead = true;
    const a = allyFromCorpse(c);
    if (a) raiseFx(a.x, a.y, false);
  }
}

function fadeFx(u) {
  for (let i = 0; i < 8; i++) spawnFx(u.x + rng.range(-4, 4), u.y - rng.range(0, 12), rng.range(-8, 8), -rng.range(10, 30), 0.9, 'px2', rgba32(140, 255, 210, 180), true);
}

function dropSouls(x, y, v) {
  v *= G.mods.xpMul;
  if (v >= 40) {
    const n = Math.min(12, Math.floor(v / 20));
    for (let i = 0; i < n; i++) G.souls.push({ x: x + rng.range(-10, 10), y: y + rng.range(-8, 8), v: v / n, big: true, mag: false, t: rng() });
  } else {
    G.souls.push({ x: x + rng.range(-3, 3), y: y + rng.range(-3, 3), v, big: v >= 15, mag: false, t: rng() });
  }
}

// =========================================================
// 攻撃
// =========================================================
function fireProj(u, tgt, kind, dmg, opts) {
  const sp = opts && opts.speed || 170;
  const dx = tgt.x - u.x, dy = (tgt.y - 5) - (u.y - 6);
  const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
  G.projs.push(Object.assign({
    x: u.x + u.face * 4, y: u.y - 6, vx: dx / d * sp, vy: dy / d * sp, spd: sp, team: u.team, dmg, kind,
    tgt, life: (unitRange(u) + 40) / sp, pierce: null, homing: false, aoe: 0, src: u, poison: 0, slow: 0, burnHit: false,
  }, opts || {}));
}

function doAttack(u, t) {
  const atk = u.team === ALLY ? u.atk * allyAtkMul(u) : u.atk;
  u.atkAnim = 0.18;
  // 分裂：別の敵にも同じ攻撃を放つ
  if (u.tr && u.tr.split && u.range > 40 && !u._splitting) {
    const n = u.tr.split === true ? 1 : u.tr.split;
    const cand = [];
    foeGrid(u.team).query(u.x, u.y, unitRange(u) + 20, (e) => { if (e === t || e.team === u.team || e.dead || e.air > 0) return; cand.push(e); });
    cand.sort((a, b) => dist2(u.x, u.y, a.x, a.y) - dist2(u.x, u.y, b.x, b.y));
    u._splitting = true;
    for (let i = 0; i < n && i < cand.length; i++) doAttack(u, cand[i]);
    u._splitting = false;
  }
  switch (u.atkType) {
    case 'melee':
      damage(t, atk, u);
      if (u.team === ALLY && u.lin === 'bu' && G.mods.apex > 0) apexSweep(u, t, atk);
      if (u.tr && u.tr.shrapnel && u.team === ALLY) {
        const r = 18, sd = atk * u.tr.shrapnel;
        foeGrid(ALLY).query(t.x, t.y, r, (e) => { if (e !== t && e.team === ENEMY && !e.dead && dist2(e.x, e.y, t.x, t.y) < r * r) damage(e, sd, u); });
        ringFx(t.x, t.y, r, rgba32(200, 230, 255, 200));
      }
      if (u.tr && u.tr.altShot && ((u.altN = (u.altN || 0) + 1) % 2 === 0 || u.tr.altShot === 'lob')) altShot(u, t, atk);
      hitFx(t.x, t.y, u.team === ALLY ? rgba32(220, 255, 220, 255) : rgba32(255, 200, 180, 255));
      sfx('hit');
      if (u.team === ALLY && u.form === 'zombie' && G.evos.plague && t.team === ENEMY) t.plagueT = 6;
      break;
    case 'cleave': {
      const r = u.aoe;
      foeGrid(u.team).query(t.x, t.y, r, (e) => { if (e.team !== u.team && !e.dead && dist2(e.x, e.y, t.x, t.y) < r * r) damage(e, atk, u); });
      if (u.team === ENEMY) hitTargetsNonUnit(u, t.x, t.y, r, atk);
      ringFx(t.x, t.y, r, u.team === ALLY ? rgba32(230, 225, 200, 200) : rgba32(255, 120, 90, 200));
      sfx('hit');
      break;
    }
    case 'arrow':
      // 系統の極み（射）：矢が敵を貫き、後ろの敵にも（攻撃の apex 倍で）当たる
      if (u.team === ALLY && u.lin === 'sha' && G.mods.apex > 0) fireProj(u, t, 'bonearrow', atk, { speed: 210, pierce: new Set(), apexMul: G.mods.apex, wide: G.mods.apexWide, life: (unitRange(u) + 60) / 210 });
      else fireProj(u, t, u.form === 'skeleton' || (u.kind === 'syn') ? 'bonearrow' : 'arrow', atk, { speed: 190 });
      sfx('shoot');
      break;
    case 'pierce':
      fireProj(u, t, 'bonearrow', atk, { speed: 210, pierce: new Set(), life: (unitRange(u) + 60) / 210 });
      sfx('shoot');
      break;
    case 'bolt': {
      const k = u.team === ENEMY ? (u.type === 'priest' || u.type === 'saint' || u.type === 'archbishop' ? 'orbGold' : 'orbBlue') : 'orbPurple';
      fireProj(u, t, k, atk, { speed: 120, homing: true });
      sfx('magic');
      break;
    }
    case 'fire':
      fireProj(u, t, 'orbFire', atk, { speed: 130, homing: true, burnHit: true });
      sfx('magic');
      break;
    case 'poison':
      fireProj(u, t, 'orbGreen', atk * 0.6, { speed: 110, aoe: u.aoe, poison: atk * 0.5, lob: true, tx: t.x, ty: t.y });
      sfx('shoot');
      break;
    case 'curse': {
      const r = u.aoe * (1 + G.mods.linjutsu) * apexGrow(u);
      foeGrid(u.team).query(t.x, t.y, r, (e) => { if (e.team !== u.team && !e.dead && dist2(e.x, e.y, t.x, t.y) < r * r) { damage(e, atk, u); e.slowT = 2.5; e.slowF = 0.4; } });
      if (u.tr.curseHeal) G.tgrid[u.team].query(t.x, t.y, r, (a) => { if (a.team === u.team && !a.dead && dist2(a.x, a.y, t.x, t.y) < r * r) a.hp = Math.min(a.mhp, a.hp + a.mhp * u.tr.curseHeal); });
      ringFx(t.x, t.y, r, rgba32(170, 255, 100, 220));
      sfx('magic');
      break;
    }
    case 'blast': {
      // 敵の魔術師：止まっているネクロマンサーを優先して狙う
      let tx = t.x, ty = t.y;
      const N = G.necro;
      if (N.still > 0.3 && dist2(u.x, u.y, N.x, N.y) < (u.range + 30) ** 2) { tx = N.x; ty = N.y; }
      const tl = { x: tx, y: ty, r: u.aoe, t: u.tele || 0.95, max: u.tele || 0.95, team: ENEMY, dmg: atk, kind: 'blast', src: u };
      // 錬金術師の火炎瓶：爆ぜた所の死体を燃やし、少しの間火が残る
      if (u.special === 'firebomb') {
        tl.fire = true;
        tl.onHit = (t) => {
          G.cgrid.query(t.x, t.y, t.r, (c) => { if (!c.dead && c.burn <= 0 && !c.boss && c !== G.heroCorpse && dist2(c.x, c.y, t.x, t.y) < t.r * t.r) c.burn = 1.8; });
          G.zones.push({ x: t.x, y: t.y, r: t.r * 0.7, t: 2.5, max: 2.5, kind: 'fire', team: ENEMY, dps: atk * 0.3 });
        };
      }
      G.teles.push(tl);
      sfx('magic');
      break;
    }
    case 'allyblast': {
      const r = (u.aoe || 22) * (1 + G.mods.linjutsu) * apexGrow(u);
      G.teles.push({ x: t.x, y: t.y, r, t: 0.45, max: 0.45, team: ALLY, dmg: atk, kind: 'blast', src: u });
      sfx('magic');
      break;
    }
  }
}

// 系統の極み（武）：近接の一撃が、狙った敵の向きの扇の範囲（前方）をなぎ払う
function apexSweep(u, t, atk) {
  const reach = unitRange(u) + G.mods.apexReach, sd = atk * G.mods.apex;
  const ang = Math.atan2(t.y - u.y, t.x - u.x), cosA = Math.cos(G.mods.apexArc * Math.PI / 180);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  let n = 0;
  foeGrid(ALLY).query(u.x, u.y, reach, (e) => {
    if (e === t || e.team !== ENEMY || e.dead || e.air > 0) return;
    const dx = e.x - u.x, dy = e.y - u.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > reach + e.size * 0.5) return;
    if (d > 1 && (dx * ca + dy * sa) / d < cosA) return;   // 前方の扇の外
    damage(e, sd, u); n++;
  });
  if (n) G.stats.apexSweep = (G.stats.apexSweep || 0) + n;
  // 見た目：前方に弧を描く斬撃（見た目の乱数。数が多いときは間引く）
  if (vrng() < ((G.allyCount || 0) > 150 ? 0.15 : 0.4)) {
    const col = rgba32(255, 150, 110, 210), arc = G.mods.apexArc * Math.PI / 180, r = reach * 0.75, n = 6 + Math.round(G.mods.apexArc / 12);
    for (let i = 0; i <= n; i++) { const a = ang - arc + (2 * arc) * i / n; spawnFx(u.x + Math.cos(a) * r, u.y - 5 + Math.sin(a) * r * 0.7, Math.cos(a) * 14, Math.sin(a) * 10, 0.3, i % 2 ? 'px2' : 'spark', col, true); }
  }
}
// 系統の極み（術）：もとから範囲の術は範囲が広がる
function apexGrow(u) { return u.team === ALLY && u.lin === 'jutsu' && G.mods.apex > 0 ? 1 + G.mods.apexJgrow : 1; }
// 系統の極み（術）：魔弾が当たった所の円の中の敵にも当たる
function apexBlast(p, hit) {
  const r = G.mods.apexJr, sd = p.dmg * G.mods.apex, x = hit.x, y = hit.y;
  let n = 0;
  foeGrid(ALLY).query(x, y, r, (e) => { if (e !== hit && e.team === ENEMY && !e.dead && !(e.air > 0) && dist2(e.x, e.y, x, y) < r * r) { damage(e, sd, p.src); n++; } });
  if (n) G.stats.apexBlast = (G.stats.apexBlast || 0) + n;
  if (vrng() < 0.5) ringFx(x, y - 4, r * 0.8, rgba32(190, 140, 255, 190));
}

// 近接の合間に飛び道具（遠くの別の敵を優先）
function altShot(u, t, atk) {
  let tgt = t, bd = 0;
  foeGrid(u.team).query(u.x, u.y, 130, (e) => { if (e === t || e.team === u.team || e.dead || e.air > 0) return; const d = dist2(u.x, u.y, e.x, e.y); if (d > bd && d < 130 * 130) { bd = d; tgt = e; } });
  const k = u.tr.altShot;
  if (k === 'lob') fireProj(u, tgt, 'orbGreen', atk * 0.6, { speed: 110, aoe: 14, poison: atk * 0.2, lob: true, tx: tgt.x, ty: tgt.y, life: 2 });
  else if (k === 'knife') fireProj(u, tgt, 'bonearrow', atk * 0.6, { speed: 210, life: 1 });
  else fireProj(u, tgt, 'orbPurple', atk * 0.6, { speed: 130, homing: true, life: 1.4 });
}

// 範囲攻撃がネクロマンサーや窯に当たるか
function hitTargetsNonUnit(src, x, y, r, dmg) {
  const N = G.necro;
  if (src.team === ENEMY) {
    if (dist2(N.x, N.y, x, y) < r * r) damageNecro(dmg, src);
    for (const p of G.pots) if (!p.dead && dist2(p.x, p.y, x, y) < (r + 8) * (r + 8)) damagePot(p, dmg, src);
  }
}

function findNearestEnemyOf(u, r) {
  let best = null, bd = r * r;
  foeGrid(u.team).query(u.x, u.y, r, (e) => {
    if (e.team === u.team || e.dead || e.air > 0) return;
    const d = dist2(u.x, u.y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  });
  return best;
}

// =========================================================
// 索敵
// =========================================================
function retargetAlly(u) {
  const N = G.necro;
  const anc = u.anchor && !u.anchor.dead ? u.anchor : N;
  const M = G.mods;
  const er = (125 + unitRange(u) * 0.5) * M.aggro;
  // 近接の敵は主の近くまで来たものだけ、遠距離の敵は少し遠くまで追う
  const leashM = 165 * M.aggro, leashR = 240 * M.aggro;
  // 窯の守り：窯が攻撃されていれば窯を攻撃している敵を優先
  if (u.anchor && u.anchor.isPot && u.anchor.attacker && isAlive(u.anchor.attacker) && dist2(u.x, u.y, u.anchor.x, u.anchor.y) < 150 * 150) {
    u.tgt = u.anchor.attacker; return;
  }
  // 統率力があれば、あなたについている兵は賢く動く（窯の守りは昔のまま）
  const L = anc === N ? leadLv() : 0;
  if (L > 0) { retargetLed(u, L); return; }
  if (dist2(u.x, u.y, anc.x, anc.y) > 310 * 310) { u.tgt = null; return; }
  let best = null, bd = er * er;
  G.tgrid[ENEMY].query(u.x, u.y, er, (e) => {
    if (e.team !== ENEMY || e.dead || e.air > 0) return;
    const lsh = e.range > 40 ? leashR : leashM;
    if (dist2(e.x, e.y, anc.x, anc.y) > lsh * lsh) return;
    const d = dist2(u.x, u.y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  });
  u.tgt = best;
}

function retargetEnemy(u) {
  const N = G.necro;
  // 特殊行動
  if (u.special === 'rob') {
    const pot = nearestPot(u.x, u.y, 600);
    if (pot) { u.tgt = pot; return; }
    if (u.carry) { u.tgt = null; return; }
    let best = null, bd = 220 * 220;
    G.cgrid.query(u.x, u.y, 220, (c) => { if (c.dead || c.burn > 0 || c.boss) return; const d = dist2(u.x, u.y, c.x, c.y); if (d < bd) { bd = d; best = c; } });
    if (best) { u.tgtCorpse = best; u.tgt = null; return; }
  }
  if (u.special === 'burn') {
    let nearAlly = false;
    G.tgrid[ALLY].query(u.x, u.y, 36, (a) => { if (a.team === ALLY && !a.dead) nearAlly = true; });
    if (!nearAlly) {
      let best = null, bd = 140 * 140;
      G.cgrid.query(u.x, u.y, 140, (c) => { if (c.dead || c.burn > 0 || c === G.heroCorpse || c.sacred) return; const d = dist2(u.x, u.y, c.x, c.y); if (d < bd) { bd = d; best = c; } });
      if (best) { u.tgtCorpse = best; u.tgt = null; return; }
    }
  }
  u.tgtCorpse = null;
  // 挑発（屍肉の巨漢）
  let taunter = null;
  G.tgrid[ALLY].query(u.x, u.y, 115, (a) => { if (a.team === ALLY && a.taunt && !a.dead && dist2(a.x, a.y, u.x, u.y) < (a.tr.tauntR || 70) ** 2) taunter = a; });
  if (taunter) { u.tgt = taunter; return; }
  let best = null, bd = 150 * 150;
  G.tgrid[ALLY].query(u.x, u.y, 150, (a) => {
    if (a.team !== ALLY || a.dead) return;
    const d = dist2(u.x, u.y, a.x, a.y);
    if (d < bd) { bd = d; best = a; }
  });
  // ネクロマンサーは、味方より明らかに近いときだけ狙う（軍勢が盾になる）
  const dn = dist2(u.x, u.y, N.x, N.y);
  if (!best || dn < bd * 0.6) { best = N; bd = dn; }
  for (const p of G.pots) { if (p.dead) continue; const d = dist2(u.x, u.y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
  u.tgt = best || N;
}

function nearestPot(x, y, r) {
  let best = null, bd = r * r;
  for (const p of G.pots) { if (p.dead) continue; const d = dist2(x, y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
  return best;
}

// =========================================================
// 毎フレームの更新
// =========================================================
function moveToward(u, tx, ty, spd, dt, stopDist) {
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d <= (stopDist || 0.5)) { u.vx *= 0.5; u.vy *= 0.5; return d; }
  const s = Math.min(spd, d / dt);
  u.vx = dx / d * s; u.vy = dy / d * s;
  if (Math.abs(dx) > 1) u.face = dx > 0 ? 1 : -1;
  return d;
}

function updateUnits(dt) {
  const N = G.necro;
  const units = G.units;
  // 補助リスト
  updateArmyBrain(dt);
  const lead = leadLv();
  G.allyCaptains = [];
  G.lichs = [];
  G.altars = [];
  let armyN = 0, nBu = 0, nSha = 0, nJutsu = 0;
  if (G.wrath > 0) G.wrath *= Math.exp(-dt / 5);
  for (const u of units) {
    if (u.dead || u.team !== ALLY) continue;
    armyN++;
    if (u.lin === 'bu') nBu++; else if (u.lin === 'sha') nSha++; else if (u.lin === 'jutsu') nJutsu++;
    if (u.ability === 'spin') G.allyCaptains.push(u);
    if (u.lich) G.lichs.push(u);
    if (u.altar) G.altars.push(u);
  }
  G.armyN = armyN;
  // 血統の覚醒：軍勢で一番多い系統（同じ数なら今のまま）
  G.linN = [nBu, nSha, nJutsu];
  const LINS = ['bu', 'sha', 'jutsu'];
  let best = LINS.indexOf(G.mainLin);
  for (let i = 0; i < 3; i++) if (best < 0 || G.linN[i] > G.linN[best]) best = i;
  G.mainLin = G.linN[best] > 0 ? LINS[best] : null;
  // 三系の調和：一番少ない系統の割合
  { const tot = nBu + nSha + nJutsu, lo = Math.min(nBu, nSha, nJutsu); G.harmonyF = tot > 0 && lo > 0 ? Math.min(1, lo / (tot * TU.harmony_share)) : 0; }
  // 窯の近くの味方は窯を守る
  for (const p of G.pots) {
    if (p.dead || p.guardSet) continue;
    p.guardSet = true;
    G.tgrid[ALLY].query(p.x, p.y, 70, (a) => { if (a.team === ALLY && !a.dead && rng() < 0.7) a.anchor = p; });
  }

  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.dead) continue;
    if (u.flash > 0) u.flash -= dt;
    if (u.atkAnim > 0) u.atkAnim -= dt;
    if (u.slowT > 0) u.slowT -= dt;
    if (u.buffT > 0) u.buffT -= dt;
    if (u.plagueT > 0) { u.plagueT -= dt; damage(u, u.mhp * 0.03 * dt, null); if (u.dead) continue; }
    if (u.poisonT > 0) { u.poisonT -= dt; damage(u, u.poisonDps * dt, null); if (u.dead) continue; }
    u.cdT -= dt;
    u.anim += dt;
    if (u.life > 0) { u.life -= dt; if (u.life <= 0) { u.dead = true; fadeFx(u); continue; } }
    if (u.tr.regen && u.hp < u.mhp) u.hp = Math.min(u.mhp, u.hp + u.mhp * u.tr.regen * dt);
    if (u.tr.fearAura) {
      u.fearT = (u.fearT || 0) - dt;
      if (u.fearT <= 0) { u.fearT = 0.5; G.tgrid[ENEMY].query(u.x, u.y, 52, (e) => { if (e.team === ENEMY && !e.dead && dist2(e.x, e.y, u.x, u.y) < 52 * 52) { e.slowT = Math.max(e.slowT, 0.7); e.slowF = Math.max(e.slowF || 0, u.tr.fearAura); } }); }
    }
    // 伝承の死霊〈アークリッチ〉：敵の群れへ冥府の星を降らせる
    if (u.tr.meteor && u.team === ALLY) {
      u.metT = (u.metT == null ? 2 + rng() * 2 : u.metT) - dt;
      if (u.metT <= 0) {
        u.metT = 1;
        let best = null, bn = 2;
        G.tgrid[ENEMY].query(u.x, u.y, 170, (e) => {
          if (e.team !== ENEMY || e.dead || best === e) return;
          let n = 0;
          G.tgrid[ENEMY].query(e.x, e.y, 36, (o) => { if (o.team === ENEMY && !o.dead) n++; });
          if (e.isBoss || e.mid) n += 3;
          if (n > bn) { bn = n; best = e; }
        });
        if (best) {
          u.metT = 6.5;
          u.atkAnim = 0.3;
          const dmg = u.atk * allyAtkMul(u) * 1.5;
          for (let k = 0; k < 3; k++) {
            const x = best.x + (k ? rng.range(-24, 24) : 0), y = best.y + (k ? rng.range(-18, 18) : 0);
            G.teles.push({ x, y, r: 28, t: 0.55 + k * 0.18, max: 0.55 + k * 0.18, team: ALLY, dmg, kind: 'blast', src: u });
            // 空から落ちる紫の星
            for (let j = 0; j < 7; j++) spawnFx(x - 30 + j * 4, y - 90 + j * 12, 55, 170, 0.5 - j * 0.05 + k * 0.18, 'px2', j % 2 ? rgba32(200, 150, 255, 230) : rgba32(255, 230, 255, 240), true);
          }
          sfx('magic');
        }
      }
    }
    if (u.tr.healAura) {
      u.auraT = (u.auraT || 0) - dt;
      if (u.auraT <= 0) { u.auraT = 1; G.tgrid[ALLY].query(u.x, u.y, 64, (a) => { if (a.team === ALLY && !a.dead && dist2(a.x, a.y, u.x, u.y) < 64 * 64) a.hp = Math.min(a.mhp, a.hp + a.mhp * u.tr.healAura); }); }
    }
    if (u.anchor && (u.anchor.dead)) u.anchor = null;
    if (u.ability) updateBossAbility(u, dt);
    if (u.team === ENEMY && u.isBoss) { updateBossPattern(u, dt); updateBossChase(u, dt); }
    if (u.dead) continue;
    if (u.air > 0) { u.air -= dt; continue; }
    // 窯から飛び出している最中（弧を描いて着地するまで、戦わない・傷つかない）
    if (u.popT > 0) {
      u.popT -= dt;
      const p = clamp(1 - u.popT / u.popMax, 0, 1);
      u.x = lerp(u.popX0, u.popX1, p); u.y = lerp(u.popY0, u.popY1, p);
      u.vx = 0; u.vy = 0;
      if (u.popT <= 0) landFromPot(u);
      continue;
    }
    if (u.busy > 0) { u.busy -= dt; u.vx = 0; u.vy = 0; continue; }
    if (u.team === ALLY) {
      if (u.markT > 0) u.markT -= dt;
      if (u.retreatT > 0) u.retreatT -= dt;
      // 見切り：予告攻撃の外へ飛びのく（その間は攻撃しない）
      if (u.dodgeT > 0) {
        u.dodgeT -= dt;
        if (moveToward(u, u.dodgeX, u.dodgeY, unitSpeed(u) * 1.35, dt, 2) > 2) continue;
        u.dodgeT = Math.min(u.dodgeT, 0.08);
        continue;
      }
      // 護衛：騎兵の突進の前に立ちはだかる
      if (u.blockT > 0) {
        u.blockT -= dt;
        if (moveToward(u, u.blockX, u.blockY, unitSpeed(u) * 1.5, dt, 1.5) <= 1.5) { u.vx = 0; u.vy = 0; }
        continue;
      }
    }

    u.tgtT -= dt;
    if (u.tgtT <= 0 || (u.tgt && !isAlive(u.tgt))) {
      u.tgtT = 0.3 + rng() * 0.15;
      if (u.team === ALLY) retargetAlly(u); else retargetEnemy(u);
    }
    const spd = unitSpeed(u);

    if (u.hasteT > 0) u.hasteT -= dt;
    if (u.team === ENEMY && u.special === 'purge') updatePurge(u, dt);
    if (u.team === ENEMY && u.special === 'haste') updateHaste(u, dt);
    if (u.team === ENEMY && u.special === 'charge') { if (updateCharge(u, dt, spd)) continue; }
    if (u.team === ENEMY && u.tgtCorpse) { updateCorpseSeeker(u, dt, spd); continue; }
    if (u.team === ENEMY && u.special === 'rob' && u.carry) {
      // 死体を担いで逃げる
      const dx = u.x - N.x, dy = u.y - N.y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      moveToward(u, u.x + dx / d * 50, u.y + dy / d * 50, spd * 1.1, dt);
      if (d > 520) { u.dead = true; }
      continue;
    }

    const t = u.tgt;
    if (t && isAlive(t)) {
      const rng_ = unitRange(u) + (t.size || 5) + u.size * 0.5;
      const d = dist(u.x, u.y, t.x, t.y);
      if (Math.abs(t.x - u.x) > 1) u.face = t.x > u.x ? 1 : -1;
      if (d > rng_ * 0.92) {
        moveToward(u, t.x, t.y, u.guardOf ? spd * 1.25 : spd, dt);
      } else {
        // 遠距離は近すぎると少し下がる
        if (u.range > 40 && d < rng_ * 0.45 && u.team === ALLY) moveToward(u, u.x - (t.x - u.x), u.y - (t.y - u.y), spd * 0.6, dt);
        else { u.vx *= 0.6; u.vy *= 0.6; }
        if (u.cdT <= 0) { u.cdT = unitCd(u); doAttack(u, t); if (u.dash) synthDash(u, t); }
      }
    } else if (u.team === ALLY) {
      // 隊列に戻る
      const anc = u.anchor && !u.anchor.dead ? u.anchor : N;
      let tx, ty;
      if (lead > 0 && anc === N) {
        // 陣形の持ち場へ（倒れかけの合成体はあなたのそばへ）
        const p = ledIdleTarget(u);
        tx = p[0]; ty = p[1];
      } else {
        u.slotT -= dt;
        if (u.slotT <= 0) pickSlot(u);
        tx = anc.x + u.ox; ty = anc.y + u.oy;
      }
      const dd = dist(u.x, u.y, tx, ty);
      let s = spd;
      const dA = dist(u.x, u.y, anc.x, anc.y);
      if (dA > 110) s *= 1.8;
      if (dd > 6) moveToward(u, tx, ty, s, dt, 3); else { u.vx *= 0.7; u.vy *= 0.7; }
    } else {
      moveToward(u, N.x, N.y, spd, dt);
    }
  }

  // 分離（重なりを避ける）と移動の適用。分離の計算は半数ずつ交互に行い、押し出しを保持する
  const half = (G.frameNo = (G.frameNo || 0) + 1) & 1;
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.dead || u.air > 0 || u.popT > 0) continue;
    if ((u.id & 1) !== half) {
      u.x += (u.vx + (u.sepx || 0)) * dt;
      u.y += (u.vy + (u.sepy || 0)) * dt;
      u.x = clamp(u.x, 24, MAP - 24);
      u.y = clamp(u.y, 24, MAP - 24);
      continue;
    }
    separation(u);
    u.x += (u.vx + u.sepx) * dt;
    u.y += (u.vy + u.sepy) * dt;
    u.x = clamp(u.x, 24, MAP - 24);
    u.y = clamp(u.y, 24, MAP - 24);
  }
}

// 重なりを避ける押し出し。毎フレーム全員が呼ぶので、クロージャを作らずにグリッドを直接走査する
function separation(u) {
  const g = G.sgrid, s = g.size, w = g.w, off = g.off, cells = g.cells;
  const r = u.size * 1.7 + 6;
  let x0 = Math.floor((u.x - r) / s) + off, x1 = Math.floor((u.x + r) / s) + off;
  let y0 = Math.floor((u.y - r) / s) + off, y1 = Math.floor((u.y + r) / s) + off;
  if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
  if (x1 >= w) x1 = w - 1; if (y1 >= w) y1 = w - 1;
  let px = 0, py = 0, n = 0;
  const ux = u.x, uy = u.y, us = u.size, team = u.team, phase = u.phase;
  outer:
  for (let cy = y0; cy <= y1; cy++) {
    const row = cy * w;
    for (let cx = x0; cx <= x1; cx++) {
      const b = cells[row + cx];
      for (let i = 0; i < b.length; i++) {
        const o = b[i];
        if (o === u || o.dead) continue;
        if (phase && o.team !== team) continue;
        const dx = ux - o.x, dy = uy - o.y;
        const rr2 = (us + o.size) * 0.85;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr2 * rr2) {
          if (d2 > 0.0001) {
            const d = Math.sqrt(d2);
            const push = (rr2 - d) / rr2 * (o.team === team ? 1 : 0.6);
            px += dx / d * push; py += dy / d * push;
            if (++n > 6) break outer;
          } else { px += rng() - 0.5; py += rng() - 0.5; }
        }
      }
    }
  }
  u.sepx = px * 55; u.sepy = py * 55;
}

// 司祭の浄化：周囲のアンデッドを焼き、仲間を癒やす（窯も削る）
// 祈祷師：周りの討伐隊を速く、荒々しくする
function updateHaste(u, dt) {
  u.hasteCd = (u.hasteCd == null ? 1 + rng() * 2 : u.hasteCd) - dt;
  if (u.hasteCd > 0) return;
  u.hasteCd = 6;
  const r = 70;
  G.tgrid[ENEMY].query(u.x, u.y, r, (e) => { if (e.team === ENEMY && !e.dead && dist2(e.x, e.y, u.x, u.y) < r * r) e.hasteT = 4.5; });
  ringFx(u.x, u.y - 4, r, rgba32(160, 230, 110, 230));
  u.atkAnim = 0.3;
  sfx('magic');
}

function updatePurge(u, dt) {
  u.purgeT = (u.purgeT == null ? 2 + rng() * 2 : u.purgeT) - dt;
  if (u.purgeT > 0) return;
  const r = 52;
  let any = false;
  G.tgrid[ALLY].query(u.x, u.y, r, (a) => { if (a.team === ALLY && !a.dead && dist2(a.x, a.y, u.x, u.y) < r * r) any = true; });
  const pot = nearestPot(u.x, u.y, r + 10);
  if (!any && !pot) { u.purgeT = 0.6; return; }
  u.purgeT = 5;
  const dmg = u.atk * 1.6;
  G.ugrid.query(u.x, u.y, r, (a) => {
    if (a.dead || dist2(a.x, a.y, u.x, u.y) > r * r) return;
    if (a.team === ALLY) damage(a, dmg * (a.form === 'wraith' ? 1.5 : 1), u);
    else a.hp = Math.min(a.mhp, a.hp + a.mhp * 0.08);
  });
  if (pot) damagePot(pot, dmg * 1.5, u);
  ringFx(u.x, u.y - 4, r, rgba32(255, 240, 170, 255));
  u.atkAnim = 0.3;
  sfx('holy');
}

// 騎兵の突進：止まっているネクロマンサーを狙う。進路上の死者は3体まで（大型に当たると止まる）
function updateCharge(u, dt, spd) {
  const N = G.necro;
  u.chargeCd -= dt;
  // 突進の前の溜め：その場で構えて、狙った地点に印が出る（避ける猶予）
  if (u.windT > 0) {
    u.windT -= dt;
    u.vx = 0; u.vy = 0;
    u.face = u.cx > u.x ? 1 : -1;
    if (rng() < 0.4) spawnFx(u.x - u.face * 6, u.y, -u.face * 20, -10, 0.3, 'px2', rgba32(150, 130, 100, 180), false);
    if (u.windT <= 0) u.chargeT = 1.5;
    return true;
  }
  if (u.chargeT > 0) {
    u.chargeT -= dt;
    const d = moveToward(u, u.cx, u.cy, spd * 3.0, dt, 2);
    let blocked = false;
    G.tgrid[ALLY].query(u.x, u.y, 10, (a) => {
      if (blocked || a.team !== ALLY || a.dead || u.chHit.has(a.id)) return;
      if (dist2(a.x, a.y, u.x, u.y) > (a.size + 6) * (a.size + 6)) return;
      u.chHit.add(a.id);
      damage(a, u.atk * 0.9, u);
      if (u.chHit.size >= 3 || a.kind === 'syn' || a.isBoss) blocked = true;
    });
    if (dist2(u.x, u.y, N.x, N.y) < 12 * 12) { damageNecro(u.atk * 1.15, u); blocked = true; }
    if (d < 3 || u.chargeT <= 0 || blocked) { u.chargeT = 0; u.busy = 0.6; }
    if (rng() < 0.5) spawnFx(u.x - u.face * 8, u.y, 0, -10, 0.3, 'px2', rgba32(140, 120, 90, 160), false);
    return true;
  }
  if (u.chargeCd <= 0 && N.still > 0.8 && dist2(u.x, u.y, N.x, N.y) < 230 * 230 && dist2(u.x, u.y, N.x, N.y) > 50 * 50) {
    u.windT = 0.65; u.chargeCd = 12 + rng() * 4; u.cx = N.x; u.cy = N.y;
    u.chHit = new Set();
    G.teles.push({ x: N.x, y: N.y, r: 10, t: 1.1, max: 1.1, team: ENEMY, dmg: 0, kind: 'mark' });
    return true;
  }
  return false;
}

// 死体を狙う敵（火葬兵・盗掘者）
function updateCorpseSeeker(u, dt, spd) {
  const c = u.tgtCorpse;
  if (!c || c.dead || (u.special === 'burn' && c.burn > 0)) { u.tgtCorpse = null; u.tgtT = 0; return; }
  const d = moveToward(u, c.x, c.y, spd, dt, 6);
  if (d < 9) {
    if (u.special === 'burn') {
      c.burn = 1.6; u.busy = 1.0; u.atkAnim = 0.4; sfx('burn');
    } else if (u.special === 'rob') {
      c.dead = true; c.robbed = true; u.carry = c; u.busy = 0.5;
    }
    u.tgtCorpse = null;
  }
}

// 亡霊騎士の突進
function synthDash(u, t) {
  if (u.dashCd > G.t) return;
  u.dashCd = G.t + 3;
  const dx = t.x - u.x, dy = t.y - u.y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
  const len = 70;
  const ex = u.x + dx / d * len, ey = u.y + dy / d * len;
  const hit = new Set();
  const steps = 8;
  for (let i = 1; i <= steps; i++) {
    const px = lerp(u.x, ex, i / steps), py = lerp(u.y, ey, i / steps);
    G.tgrid[ENEMY].query(px, py, 12, (e) => { if (e.team === ENEMY && !e.dead && !hit.has(e)) { hit.add(e); damage(e, u.atk * allyAtkMul(u), u); } });
    spawnFx(px, py - 6, 0, 0, 0.3, 'glow', rgba32(160, 255, 220, 140), true);
    // 伝承の死霊〈デュラハン〉：通った跡に蒼い鬼火が残り、踏んだ敵を焼く
    if (u.tr.ghostTrail && i % 2 === 0) G.zones.push({ x: px, y: py, r: 13, t: 2.6, max: 2.6, kind: 'gfire', team: ALLY, dps: u.atk * allyAtkMul(u) * 0.45 });
  }
  u.x = clamp(ex, 24, MAP - 24); u.y = clamp(ey, 24, MAP - 24);
}

// =========================================================
// 弾・予告円・領域
// =========================================================
function updateProjs(dt) {
  const N = G.necro;
  for (const p of G.projs) {
    if (p.dead) continue;
    p.life -= dt;
    if (p.life <= 0) {
      p.dead = true;
      if (p.lob) poisonBurst(p, p.x, p.y);
      continue;
    }
    if (p.homing && isAlive(p.tgt)) {
      const dx = p.tgt.x - p.x, dy = (p.tgt.y - 5) - p.y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      p.vx = lerp(p.vx, dx / d * p.spd, Math.min(1, dt * 8)); p.vy = lerp(p.vy, dy / d * p.spd, Math.min(1, dt * 8));
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.lob) {
      if (dist2(p.x, p.y, p.tx, p.ty - 5) < 36) { p.dead = true; poisonBurst(p, p.tx, p.ty); }
      continue;
    }
    // 命中判定
    let hit = null;
    if (p.team === ENEMY) {
      if (dist2(p.x, p.y + 6, N.x, N.y) < 36) hit = N;
      if (!hit) for (const pot of G.pots) if (!pot.dead && dist2(p.x, p.y, pot.x, pot.y - 6) < 120) { hit = pot; break; }
    }
    if (!hit) {
      foeGrid(p.team).query(p.x, p.y + 5, 10 + (p.wide || 0), (e) => {
        if (e.team === p.team || e.dead || e.air > 0) return;
        if (p.pierce && p.pierce.has(e.id)) return;
        const r = e.size + 2 + (p.wide || 0);
        if (dist2(p.x, p.y + 5, e.x, e.y) < r * r) { hit = e; return false; }
      });
    }
    if (hit) {
      // 系統の極み（射）：貫いた後ろの敵には攻撃の apex 倍
      const later = p.apexMul && p.pierce && p.pierce.size > 0;
      damage(hit, later ? p.dmg * p.apexMul : p.dmg, p.src);
      if (later && hit.team === ENEMY) G.stats.apexPierce = (G.stats.apexPierce || 0) + 1;
      // 系統の極み（術）：魔弾が当たった所の円の範囲にも
      if (p.team === ALLY && p.src && p.src.lin === 'jutsu' && G.mods.apex > 0 && !p.lob && hit.team === ENEMY) apexBlast(p, hit);
      if (p.src && p.src.tr && p.src.tr.chain && p.team === ALLY && !hit.isNecro) {
        let from = hit, left = p.src.tr.chain;
        const done = new Set([hit]);
        while (left-- > 0) {
          let nx = null, bd = 48 * 48;
          foeGrid(ALLY).query(from.x, from.y, 48, (e) => { if (done.has(e) || e.team !== ENEMY || e.dead) return; const d = dist2(e.x, e.y, from.x, from.y); if (d < bd) { bd = d; nx = e; } });
          if (!nx) break;
          done.add(nx);
          damage(nx, p.dmg * 0.6, p.src);
          for (let i = 0; i <= 4; i++) spawnFx(lerp(from.x, nx.x, i / 4), lerp(from.y, nx.y, i / 4) - 6, 0, 0, 0.25, 'px2', rgba32(210, 160, 255, 255), true);
          from = nx;
        }
      }
      if (p.src && p.src.tr && p.src.tr.shrapnel && p.team === ALLY) {
        const r = 16, sx = p.x, sy = p.y + 5, sd = p.dmg * p.src.tr.shrapnel;
        foeGrid(ALLY).query(sx, sy, r, (e) => { if (e !== hit && e.team === ENEMY && !e.dead && dist2(e.x, e.y, sx, sy) < r * r) damage(e, sd, p.src); });
        ringFx(sx, sy, r, rgba32(230, 225, 200, 200));
      }
      if (p.burnHit && hit.team !== undefined) { hit.poisonT = 2; hit.poisonDps = p.dmg * 0.25; }
      hitFx(p.x, p.y + 5, p.kind === 'orbPurple' ? rgba32(220, 160, 255, 255) : rgba32(255, 230, 200, 255));
      if (p.pierce) { p.pierce.add(hit.id); }
      else p.dead = true;
    }
  }
  compact(G.projs, notDead);
}

function poisonBurst(p, x, y) {
  const r = p.aoe || 18;
  G.zones.push({ x, y, r, t: 3, max: 3, kind: 'poison', team: p.team, dps: p.poison || p.dmg });
  foeGrid(p.team).query(x, y, r, (e) => { if (e.team !== p.team && !e.dead && dist2(e.x, e.y, x, y) < r * r) damage(e, p.dmg, p.src); });
  ringFx(x, y, r, rgba32(160, 255, 90, 220));
}

// ---- 予告つきの範囲攻撃 ----
// kind: blast（円）/ line（帯）/ cone（扇）/ ring（輪）/ mark（印だけ）
// 円と輪は画面の奥行きに合わせて縦を 0.75 倍に潰した楕円で当たる（見た目と当たりを一致させる）
// necro: ネクロマンサーへのダメージを最大体力に対する割合で与える（後半のボスの技）
// delay: その秒数たってから予告が見え始める（連続技の順番づけ）
function teleHit(t, x, y, pad) {
  pad = pad || 0;
  const dx = x - t.x, dy = y - t.y;
  switch (t.kind) {
    case 'line': {
      const c = Math.cos(t.ang), s = Math.sin(t.ang);
      const al = dx * c + dy * s, pe = -dx * s + dy * c;
      return al > -pad && al < t.len + pad && Math.abs(pe) < t.w / 2 + pad;
    }
    case 'cone': {
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > t.len + pad) return false;
      if (d < 8) return true;
      let da = Math.atan2(dy, dx) - t.ang;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      return Math.abs(da) < t.spread + pad / Math.max(8, d);
    }
    case 'ring': {
      const e = Math.sqrt(dx * dx + (dy / 0.75) * (dy / 0.75));
      return e > t.r0 - pad && e < t.r1 + pad;
    }
    case 'mark': return false;
    default: {
      const r = t.r + pad;
      return dx * dx + (dy / 0.75) * (dy / 0.75) < r * r;
    }
  }
}
function teleReach(t) {
  if (t.kind === 'line' || t.kind === 'cone') return t.len + 10;
  if (t.kind === 'ring') return t.r1 / 0.75 + 10;
  return t.r / 0.75 + 10;
}
function teleActive(t) { return !(t.delay > 0); }

function updateTeles(dt) {
  const N = G.necro;
  for (const t of G.teles) {
    if (t.delay > 0) { t.delay -= dt; if (t.delay > 0) continue; t.delay = 0; }
    t.t -= dt;
    if (t.t > 0) continue;
    t.dead = true;
    if (t.kind === 'mark') continue;
    // 発動
    const reach = teleReach(t);
    foeGrid(t.team).query(t.x, t.y, reach, (e) => {
      if (e.team === t.team || e.dead || e.air > 0) return;
      if (teleHit(t, e.x, e.y, e.size * 0.5)) {
        damage(e, t.dmg * (e.form === 'wraith' && t.holy ? 1.5 : 1), t.src || null);
      }
    });
    if (t.team === ENEMY) {
      if (!N.dead && teleHit(t, N.x, N.y, 2)) {
        damageNecro(t.necro ? N.mhp * t.necro : t.dmg, t.src || { type: 'aoe' });
      }
      for (const p of G.pots) if (!p.dead && teleHit(t, p.x, p.y, 8)) damagePot(p, t.dmg, t.src || { team: ENEMY });
    }
    if (t.onHit) t.onHit(t);
    const col = t.team === ENEMY ? (t.holy ? rgba32(255, 240, 170, 255) : t.fire ? rgba32(255, 150, 40, 255) : rgba32(255, 120, 60, 255)) : rgba32(190, 120, 255, 255);
    if (t.kind === 'line' || t.kind === 'cone') {
      const n = Math.round(t.len / 14), c = Math.cos(t.ang), s = Math.sin(t.ang);
      for (let i = 0; i <= n; i++) {
        const d = t.len * i / n;
        spawnFx(t.x + c * d, t.y + s * d - 4, rng.range(-15, 15), -rng.range(15, 45), 0.4, 'px2', col, true);
      }
    } else if (t.kind === 'ring') {
      for (let i = 0; i < 18; i++) { const a = i / 18 * TAU, r = (t.r0 + t.r1) / 2; spawnFx(t.x + Math.cos(a) * r, t.y + Math.sin(a) * r * 0.75, Math.cos(a) * 30, Math.sin(a) * 22 - 10, 0.4, 'px2', col, true); }
    } else {
      ringFx(t.x, t.y, t.r, col);
      for (let i = 0; i < 10; i++) spawnFx(t.x + rng.range(-t.r, t.r) * 0.6, t.y + rng.range(-t.r, t.r) * 0.45, rng.range(-20, 20), -rng.range(20, 60), 0.4, 'px2', col, true);
    }
    if (reach > 40) G.shake = Math.max(G.shake, 3);
    sfx('blast');
  }
  compact(G.teles, notDead);
}

function updateZones(dt) {
  for (const z of G.zones) {
    z.t -= dt;
    if (z.t <= 0) { z.dead = true; continue; }
    // 炎の地面：敵の側が置き、死者とネクロマンサーを焼く
    if (z.kind === 'fire') {
      z.tick = (z.tick || 0) - dt;
      if (z.tick <= 0) {
        z.tick = 0.5;
        foeGrid(z.team).query(z.x, z.y, z.r, (e) => { if (e.team !== z.team && !e.dead && dist2(e.x, e.y, z.x, z.y) < z.r * z.r) damage(e, z.dps * 0.5, null); });
        const N = G.necro;
        if (z.team === ENEMY && !N.dead && dist2(N.x, N.y, z.x, z.y) < z.r * z.r) damageNecro(N.mhp * 0.08, { type: 'fire' });
      }
      continue;
    }
    if (z.kind === 'poison' || z.kind === 'curse' || z.kind === 'gfire') {
      foeGrid(z.team).query(z.x, z.y, z.r, (e) => {
        if (e.team === z.team || e.dead) return;
        if (dist2(e.x, e.y, z.x, z.y) < z.r * z.r) { damage(e, z.dps * dt, null); if (z.kind === 'curse') { e.slowT = 0.3; e.slowF = 0.4; } }
      });
    }
  }
  compact(G.zones, notDead);
}

// 死体の腐敗・燃焼
// 戦場に転がる死体が多すぎると画面が埋まるので、数が多いほど早く朽ちる
// （対象：戦いで生まれ、時間で朽ちる普通の死体。始めから戦場にある死体・ボス・中ボス・合成体・神の屍・勇者の屍は対象外）
const CORPSE_SOFT = 80;      // これを超えると朽ちる速さが上がる（数の比の2乗、最大6倍）
function isClutterCorpse(c) { return c.decay !== Infinity && !c.seed && !c.boss && !c.mid && !c.sacred && c.kind !== 'syn' && c !== G.heroCorpse; }
function corpseRot() {
  let n = 0;
  for (const c of G.corpses) if (!c.dead && isClutterCorpse(c)) n++;
  G.clutterN = n;
  if (n <= CORPSE_SOFT || G.noRot) return 1;   // noRot：検証用（早めない）
  return Math.min(6, (n / CORPSE_SOFT) * (n / CORPSE_SOFT));
}
function updateCorpses(dt) {
  const rot = corpseRot();
  for (const c of G.corpses) {
    if (c.dead) continue;
    if (c.burn > 0) {
      c.burn -= dt;
      if (rng() < 0.4) spawnFx(c.x + rng.range(-5, 5), c.y - 2, rng.range(-5, 5), -rng.range(15, 35), 0.5, 'px2', rng() < 0.5 ? rgba32(255, 140, 40, 255) : rgba32(255, 220, 80, 255), true);
      if (c.burn <= 0) { c.dead = true; addProp('ash', c.x, c.y, true); if (c === G.heroCorpse) heroCorpseLost(); }
      continue;
    }
    if (c.decay !== Infinity) {
      // 味方の死体は蘇らせ直す元手なので、早まり方を半分にする
      c.decay -= rot > 1 && isClutterCorpse(c) ? dt * (c.look === 'e' ? rot : 1 + (rot - 1) * 0.5) : dt;
      if (c.decay <= 0) {
        c.dead = true;
        for (let i = 0; i < 4; i++) spawnFx(c.x + rng.range(-4, 4), c.y - 2, 0, -rng.range(5, 15), 0.6, 'px', rgba32(90, 80, 70, 200), false);
        if (c === G.heroCorpse) heroCorpseLost();
      }
    }
  }
  compact(G.corpses, notDead);
}

// =========================================================
// エフェクト
// =========================================================
// エフェクトの粒は大量に生まれては消えるので、使い回してガベージコレクションを減らす
const FXPOOL = [];
function spawnFx(x, y, vx, vy, life, spr, col, add, grav) {
  const arr = add ? G.fxAdd : G.fx;
  if (arr.length > fxCap()) return;
  // 軽量のとき：小さな粒の4割を省く（見た目の乱数を使う。戦いの乱数の流れは変えない）
  if (PERF.lite && (spr === 'px' || spr === 'px2') && vrng() < 0.4) return;
  const f = FXPOOL.length ? FXPOOL.pop() : {};
  f.x = x; f.y = y; f.vx = vx; f.vy = vy; f.life = life; f.max = life; f.spr = spr; f.col = col; f.grav = grav || 0;
  arr.push(f);
}
function compactFx(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) { const f = arr[i]; if (f.life > 0) arr[j++] = f; else if (FXPOOL.length < 3000) FXPOOL.push(f); }
  arr.length = j;
}
function ringFx(x, y, r, col) {
  const n = Math.max(10, Math.floor(r * 0.9));
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    spawnFx(x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.22, Math.cos(a) * r * 2.4, Math.sin(a) * r * 1.8, 0.28, 'px', col, true);
  }
}
function raiseFx(x, y, big) {
  spawnFx(x, y + 1, 0, 0, 0.5, 'pillarfx', rgba32(110, 255, 160, 200), true);
  for (let i = 0; i < (big ? 14 : 6); i++) spawnFx(x + rng.range(-6, 6), y - rng.range(0, 4), rng.range(-6, 6), -rng.range(20, 50), 0.7, 'px', rgba32(130, 255, 170, 255), true);
}
function updateFx(dt) {
  for (const arr of [G.fx, G.fxAdd]) {
    for (const f of arr) {
      f.life -= dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vy += f.grav * dt;
      f.vx *= 0.96; f.vy *= 0.96;
    }
  }
  compactFx(G.fx);
  compactFx(G.fxAdd);
  for (const t of G.texts) { t.life -= dt; t.y -= 12 * dt; }
  compact(G.texts, hasLife);
}
function floatText(str, x, y, col) {
  if (G.texts.length > 40) return;
  G.texts.push({ str, x, y, col, life: 0.9 });
}

// ==== 08_bosses.js ====
// ---------- ボスの能力（敵のときと、蘇生後の味方のとき） ----------

function opp(team) { return team === ALLY ? ENEMY : ALLY; }

function forEachFoe(u, x, y, r, fn) {
  foeGrid(u.team).query(x, y, r, (e) => { if (e.team !== u.team && !e.dead && e.air <= 0 && dist2(e.x, e.y, x, y) < r * r) fn(e); });
}
function forEachFriend(u, x, y, r, fn) {
  G.tgrid[u.team].query(x, y, r, (e) => { if (e.team === u.team && !e.dead && dist2(e.x, e.y, x, y) < r * r) fn(e); });
}
function abilityPower(u) {
  if (u.team === ENEMY) return u.atk;
  return u.atk * allyAtkMul(u) * (u.unique ? 1.4 : 1);
}

function updateBossAbility(u, dt) {
  u.abT -= dt * (u.unique ? 1.3 : 1);
  const N = G.necro;
  const pow = abilityPower(u);
  switch (u.ability) {
    case 'divine': {
      // 神：死者が最も集まった所へ裁きの光を落とす（赤い予告。ネクロマンサーにも当たる）
      if (u.team !== ENEMY || u.abT > 0) return;
      u.abT = 5.5;
      let best = null, bn = 0;
      for (let i = 0; i < 24; i++) {
        const a = G.units[Math.floor(rng() * G.units.length)];
        if (!a || a.dead || a.team !== ALLY || dist2(a.x, a.y, u.x, u.y) > 300 * 300) continue;
        let n = 0;
        G.tgrid[ALLY].query(a.x, a.y, 44, () => { n++; });
        if (n > bn) { bn = n; best = a; }
      }
      if (best) addTele({ x: best.x, y: best.y, r: 48, t: 1.1, dmg: pow * 1.3, necro: 0.2, holy: true, src: u });
      return;
    }
    case 'reap': {
      // 死神：敵の群れへ一瞬で飛び込み、大鎌のひと振りで周りをまとめて刈り取る
      if (u.abT > 0) return;
      let best = null, bn = 0;
      for (let i = 0; i < 40; i++) {
        const e = G.units[Math.floor(rng() * G.units.length)];
        if (!e || e.dead || e.team !== ENEMY || dist2(e.x, e.y, N.x, N.y) > 210 * 210) continue;
        let n = 0;
        G.tgrid[ENEMY].query(e.x, e.y, 70, () => { n++; });
        if (e.isBoss || e.mid) n += 8;
        if (n > bn) { bn = n; best = e; }
      }
      if (!best) { u.abT = 0.3; return; }
      u.abT = 0.75;
      for (let i = 0; i < 12; i++) { const t = i / 12; spawnFx(u.x + (best.x - u.x) * t, u.y + (best.y - u.y) * t - 8, 0, -10, 0.35, 'px2', rgba32(40, 20, 60, 220), true); }
      u.x = best.x; u.y = best.y;
      const r = 92;
      forEachFoe(u, u.x, u.y, r, (e) => damage(e, e.isBoss ? e.mhp * 0.07 + pow * 6 : e.mid ? e.mhp * 0.35 + pow * 6 : e.hp + pow * 10, u));
      hitTargetsNonUnit(u, u.x, u.y, r, pow * 6);
      // 大鎌の弧
      for (let i = 0; i < 26; i++) {
        const a = -Math.PI * 0.9 + i / 25 * Math.PI * 1.8;
        spawnFx(u.x + Math.cos(a) * r * 0.85, u.y + Math.sin(a) * r * 0.6 - 6, Math.cos(a) * 40, Math.sin(a) * 30, 0.45, 'px2', i % 3 ? rgba32(200, 240, 255, 255) : rgba32(170, 110, 255, 255), true);
      }
      ringFx(u.x, u.y, r, rgba32(170, 110, 255, 255));
      u.atkAnim = 0.4;
      G.shake = Math.max(G.shake, 3);
      sfx('blast');
      return;
    }
    case 'spin': {
      if (u.abT > 0) return;
      const t = u.tgt;
      if (!isAlive(t) || dist2(u.x, u.y, t.x, t.y) > 50 * 50) { u.abT = 0.5; return; }
      u.abT = 5;
      const r = 44;
      forEachFoe(u, u.x, u.y, r, (e) => damage(e, pow * 1.3, u));
      if (u.team === ENEMY) hitTargetsNonUnit(u, u.x, u.y, r, pow * 1.3);
      ringFx(u.x, u.y - 4, r, u.team === ENEMY ? rgba32(255, 120, 80, 255) : rgba32(150, 255, 170, 255));
      u.atkAnim = 0.4;
      G.shake = Math.max(G.shake, 2);
      sfx('blast');
      return;
    }
    case 'pyre': {
      if (u.team === ENEMY) {
        if (u.abT > 0) return;
        u.abT = 6;
        let n = 0;
        G.cgrid.query(u.x, u.y, 115, (c) => {
          if (n >= 5 || c.dead || c.burn > 0 || c === G.heroCorpse || c.sacred || dist2(c.x, c.y, u.x, u.y) > 115 * 115) return;
          c.burn = 1.8; n++;
          spawnFx(c.x, c.y, 0, 0, 0.6, 'pillarfx', rgba32(255, 120, 40, 220), true);
        });
        if (n) sfx('burn');
      } else {
        // 炎をまとう
        u.auraT = (u.auraT || 0) - dt;
        if (u.auraT <= 0) {
          u.auraT = 1;
          forEachFoe(u, u.x, u.y, 36, (e) => damage(e, pow * 0.6, u));
          for (let i = 0; i < 6; i++) { const a = rng() * TAU; spawnFx(u.x + Math.cos(a) * 20, u.y + Math.sin(a) * 14, 0, -25, 0.5, 'px2', rgba32(255, 150, 50, 255), true); }
        }
      }
      return;
    }
    case 'pack': {
      if (u.abT > 0) return;
      u.abT = u.team === ENEMY ? 9 : 10;
      const n = u.team === ENEMY ? 3 : Math.min(2, armyRoom());
      for (let i = 0; i < n; i++) {
        const a = rng() * TAU;
        const x = u.x + Math.cos(a) * 18, y = u.y + Math.sin(a) * 14;
        const g = Math.max(1, Math.round(u.g * 0.45));
        const w = u.team === ENEMY
          ? makeUnit({ team: ENEMY, kind: 'h', type: 'wolf', lin: 'bu', g, x, y, form: 'alive' })
          : makeUnit({ team: ALLY, kind: 'h', type: 'wolf', lin: 'bu', g, x, y, form: 'risen' });
        w.summoned = true;
        if (u.team === ALLY) raiseFx(x, y, false);
      }
      return;
    }
    case 'sanctify': {
      if (u.abT > 0) return;
      if (u.team === ENEMY) {
        u.abT = 8.5;
        const r = 82;
        G.cgrid.query(u.x, u.y, r, (c) => {
          if (c.dead || c.boss || dist2(c.x, c.y, u.x, u.y) > r * r) return;
          c.dead = true;
          spawnFx(c.x, c.y, 0, 0, 0.6, 'pillarfx', rgba32(255, 245, 190, 200), true);
          if (c === G.heroCorpse) heroCorpseLost();
        });
        forEachFriend(u, u.x, u.y, r, (e) => { e.hp = Math.min(e.mhp, e.hp + e.mhp * 0.25); });
        forEachFoe(u, u.x, u.y, r, (e) => damage(e, pow * 0.6 * (e.form === 'wraith' ? 1.5 : 1), u));
        ringFx(u.x, u.y, r, rgba32(255, 245, 190, 255));
        sfx('holy');
      } else {
        u.abT = 5;
        forEachFriend(u, u.x, u.y, 85, (e) => { e.hp = Math.min(e.mhp, e.hp + e.mhp * 0.2); });
        ringFx(u.x, u.y, 85, rgba32(140, 255, 190, 255));
      }
      return;
    }
    case 'leap': {
      if (u.team === ENEMY) return; // 敵の竜騎士は技の表（ネクロマンサーへ急降下）で動く
      if (u.abState === 'air') {
        if (u.air > 0) return;
        // 着地
        u.abState = null;
        u.x = u.lx; u.y = u.ly;
        G.shake = Math.max(G.shake, 4);
        return;
      }
      if (u.abT > 0) return;
      let tx, ty;
      if (u.team === ENEMY) {
        // 止まっているネクロマンサーを狙う。動いていれば近くの死者へ
        if (N.still > 0.3 && dist2(u.x, u.y, N.x, N.y) < 270 * 270) { tx = N.x; ty = N.y; }
        else if (isAlive(u.tgt)) { tx = u.tgt.x; ty = u.tgt.y; }
      } else {
        let best = null, bd = 0;
        forEachFoe(u, u.x, u.y, 220, (e) => { const d = dist2(u.x, u.y, e.x, e.y); if (d > bd) { bd = d; best = e; } });
        if (best) { tx = best.x; ty = best.y; }
      }
      if (tx == null) { u.abT = 1; return; }
      u.abT = 7;
      u.abState = 'air';
      u.air = 1.05;
      u.lx = tx; u.ly = ty;
      G.teles.push({ x: tx, y: ty, r: 38, t: 1.05, max: 1.05, team: u.team, dmg: pow * 1.6, kind: 'blast', src: u });
      for (let i = 0; i < 10; i++) spawnFx(u.x + rng.range(-6, 6), u.y, rng.range(-30, 30), -rng.range(10, 40), 0.5, 'px2', rgba32(150, 140, 120, 200), false);
      return;
    }
    case 'sanctum': {
      if (u.abT > 0) return;
      if (u.team === ENEMY) {
        u.abT = 9;
        if (dist2(u.x, u.y, N.x, N.y) > 320 * 320) { u.abT = 2; return; }
        G.zones.push({ x: N.x, y: N.y, r: 62, t: 10, max: 10, kind: 'sanctum', team: ENEMY });
        sfx('holy');
      } else {
        const t = isAlive(u.tgt) ? u.tgt : findNearestEnemyOf(u, 160);
        if (!t) { u.abT = 1; return; }
        u.abT = 8;
        G.zones.push({ x: t.x, y: t.y, r: 52, t: 6, max: 6, kind: 'curse', team: ALLY, dps: pow * 0.45 });
        sfx('magic');
      }
      return;
    }
    // 配下の巨人：足踏みの衝撃で周りの敵をなぎ倒す
    case 'stomp': {
      if (u.team === ENEMY) return;
      if (u.abT > 0) return;
      u.abT = 4.5;
      G.teles.push({ x: u.x, y: u.y, r0: 0, r1: 46, t: 0.35, max: 0.35, team: ALLY, dmg: pow * 1.6, kind: 'ring', src: u });
      G.teles.push({ x: u.x, y: u.y, r0: 40, r1: 78, t: 0.35, max: 0.35, delay: 0.3, team: ALLY, dmg: pow * 1.0, kind: 'ring', src: u });
      return;
    }
    // 配下の黒竜：敵の群れへ炎の息
    case 'breath': {
      if (u.team === ENEMY) return;
      if (u.abT > 0) return;
      const t = isAlive(u.tgt) ? u.tgt : findNearestEnemyOf(u, 150);
      if (!t) { u.abT = 0.6; return; }
      u.abT = 5;
      const ang = Math.atan2(t.y - u.y, t.x - u.x);
      G.teles.push({ x: u.x, y: u.y - 6, ang, len: 140, spread: 0.45, t: 0.4, max: 0.4, team: ALLY, dmg: pow * 1.8, kind: 'cone', fire: true, src: u });
      return;
    }
    // 中ボス（近接）：地面に印を出してから叩きつける
    case 'slam': {
      if (u.abT > 0) return;
      const t = u.tgt;
      if (!isAlive(t) || dist2(u.x, u.y, t.x, t.y) > 46 * 46) { u.abT = 0.4; return; }
      u.abT = u.team === ENEMY ? 4.5 : 5;
      const r = u.team === ENEMY ? 36 : 32;
      G.teles.push({ x: u.x, y: u.y, r, t: u.team === ENEMY ? 0.75 : 0.35, max: u.team === ENEMY ? 0.75 : 0.35, team: u.team, dmg: pow * 1.2, kind: 'blast', src: u });
      u.atkAnim = 0.3;
      return;
    }
    // 中ボス（射撃・魔法）：扇状に5発を撃つ
    case 'volley': {
      if (u.abT > 0) return;
      const t = isAlive(u.tgt) ? u.tgt : null;
      if (!t || dist2(u.x, u.y, t.x, t.y) > (u.range + 30) ** 2) { u.abT = 0.5; return; }
      u.abT = u.team === ENEMY ? 5 : 5.5;
      const base = Math.atan2(t.y - u.y, t.x - u.x);
      const ty = u.type;
      const kind = u.team === ALLY ? (ty === 'archer' || ty === 'robber' ? 'bonearrow' : 'orbPurple')
        : (ty === 'archer' || ty === 'robber' ? 'arrow' : ty === 'priest' ? 'orbGold' : 'orbBlue');
      for (let i = -2; i <= 2; i++) {
        const a = base + i * 0.2, d = 60;
        fireProj(u, { x: u.x + Math.cos(a) * d, y: u.y + Math.sin(a) * d + 5 }, kind, pow * 0.75, { speed: 150, tgt: null, life: (u.range + 50) / 150 });
      }
      u.atkAnim = 0.25;
      sfx('shoot');
      return;
    }
    case 'hero': {
      u.abT2 = (u.abT2 == null ? 6 : u.abT2) - dt;
      // 聖剣の突進。ネクロマンサーを狙うときは、先に地面へ印を出して一瞬溜める
      if (u.heroWind > 0) {
        u.heroWind -= dt;
        if (u.heroWind > 0) return;
      }
      if (u.abT <= 0 || u.heroAim) {
        let t = u.heroAim || u.tgt;
        if (false) {
          u.heroAim = { x: N.x, y: N.y };
          u.heroWind = 0.75;
          G.teles.push({ x: N.x, y: N.y, r: 16, t: 0.75, max: 0.75, team: ENEMY, kind: 'mark' });
          u.abT = 4.5;
          return;
        }
        u.heroAim = null;
        if (!t || (t.dead !== undefined && !isAlive(t))) { u.abT = 0.5; }
        else {
          u.abT = 4.5;
          const dx = t.x - u.x, dy = t.y - u.y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const len = Math.min(100, d + 10);
          const ex = u.x + dx / d * len, ey = u.y + dy / d * len;
          const hit = new Set();
          for (let i = 1; i <= 10; i++) {
            const px = lerp(u.x, ex, i / 10), py = lerp(u.y, ey, i / 10);
            forEachFoe(u, px, py, 14, (e) => { if (!hit.has(e)) { hit.add(e); damage(e, pow * 1.4, u); } });
            if (u.team === ENEMY && dist2(px, py, N.x, N.y) < 14 * 14 && !hit.has(N)) { hit.add(N); damageNecro(pow * 1.2, u); }
            spawnFx(px, py - 8, 0, 0, 0.35, 'glow', u.team === ENEMY ? rgba32(255, 250, 200, 200) : rgba32(220, 120, 255, 200), true);
          }
          u.x = clamp(ex, 24, MAP - 24); u.y = clamp(ey, 24, MAP - 24);
          u.atkAnim = 0.3;
          sfx('blast');
        }
      }
      // 聖なる波動
      if (u.abT2 <= 0) {
        u.abT2 = 9;
        const r = 64;
        G.teles.push({ x: u.x, y: u.y, r, t: 0.8, max: 0.8, team: u.team, dmg: pow * 1.3, kind: 'blast', holy: u.team === ENEMY, src: u });
      }
      return;
    }
  }
}

// 勇者：体力が半分になると援軍を呼ぶ
function heroRally(u) {
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU;
    spawnEnemy(i % 2 ? 'paladin' : 'knight', u.x + Math.cos(a) * 30, u.y + Math.sin(a) * 24, true);
  }
  banner('勇者の援軍', '聖騎士団が駆けつけた', 'enemy');
}

function onBossDeath(u) {
  G.stats.bossKills++;
  G.bossAlive = G.bossAlive.filter((b) => b !== u);
  G.discovered['bossKill_' + u.type] = true;
  G.shake = 6;
  sfx('raiseBig');
  if (BOSS_POOL[1].indexOf(u.type) >= 0) unlockFoes('boss1');
  if (u.type === 'giant') unlockFoes('giant');
  if (u.type === 'hero') {
    unlockFoes('win');
    G.heroDown = true;
    if (stageFinal() === 'hero') heroVictory();
    else {
      // 聖都：勇者のあとに神が降りる
      G.godAt = G.t + 9;
      banner('勇者を討伐した', '…空が裂ける。神が降りてくる', 'win');
      sfx('win');
    }
  } else if (u.type === 'god') {
    G.rush = true;
    G.rushStart = G.t;
    G.nextRushBoss = G.t + 20;
    G.nextRushMid = G.t + 6;
    banner('神を討伐した', '屍の上で1分止まり、死神にせよ', 'win');
    setTimeout(() => { if (G && G.rush) banner('総攻撃', '儀式中は被ダメージ半分。離れても続きから', 'enemy'); }, 3000);
    sfx('boss');
    G.shake = 10;
  } else if (!G.reapWave) {
    banner(BOSSES[u.type].name + 'を討伐', '亡骸を蘇らせれば配下にできる', 'win');
  }
}

function onMidDeath(u) {
  G.midAlive = G.midAlive.filter((b) => b !== u);
  G.stats.midKills = (G.stats.midKills || 0) + 1;
  if (!G.reapWave) banner(MIDBOSS[u.type].name + 'を討伐', '亡骸を蘇らせれば配下にできる', 'win');
}

// 古戦場：勇者を倒せばクリア（亡骸を蘇らせれば勇者も配下になる）。このまま続ければ延長戦
function heroVictory() {
  G.victory = true;
  G.cleared = true;
  G.clearT = G.t;
  banner('勇者を討伐した', '勝利。いつでも凱旋できる', 'win');
  sfx('win');
  G.shake = 10;
  UI.showReturn(true);
  G.endless = true;
  G.endlessStart = G.t;
  G.nextEndlessBoss = G.t + 120;
}

// 勇者の亡骸を蘇らせたとき
function onHeroRaised() {
  G.heroCorpse = null;
}

function heroCorpseLost() {
  if (!G.heroCorpse) return;
  G.heroCorpse = null;
}

// ---- 神の屍のネクロマンス（1分・固定）：止まっている間だけ進み、離れても進み具合は残る ----
function updateGodRitual(dt) {
  const c = G.godCorpse;
  G.godRitual = false;
  if (!c || c.dead) return;
  const N = G.necro;
  if (N.dead) return;
  const near = dist2(c.x, c.y, N.x, N.y) < (G.mods.raiseR + 14) ** 2;
  if (!near || N.moving || N.still < CHANT_DELAY) return;
  G.godRitual = true;
  G.godProg = Math.min(GOD_RAISE_T, (G.godProg || 0) + dt);
  // 魂が屍へ吸い込まれていく
  if (rng() < 0.8) {
    const a = rng() * TAU, r = 30 + rng() * 40;
    spawnFx(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r * 0.75, -Math.cos(a) * r * 1.6, -Math.sin(a) * r * 1.2, 0.6, 'px2', rng() < 0.5 ? rgba32(170, 110, 255, 230) : rgba32(110, 255, 170, 230), true);
  }
  const s0 = Math.floor((G.godProg - dt) / 10), s1 = Math.floor(G.godProg / 10);
  if (s1 > s0 && G.godProg < GOD_RAISE_T) { sfx('chantStart'); ringFx(c.x, c.y, 40, rgba32(190, 130, 255, 255)); }
  if (G.godProg >= GOD_RAISE_T) raiseReaper(c);
}

// 死神の誕生：総攻撃は終わり、すべての敵を一瞬で消し飛ばす（クリア）
function raiseReaper(c) {
  c.dead = true;
  G.godCorpse = null;
  G.godRitual = false;
  G.rush = false;
  const N = G.necro;
  const g = Math.max(90, Math.round(N.lv * 2.4));
  const u = makeUnit({ team: ALLY, kind: 'h', type: 'reaper', lin: 'bu', g, x: c.x, y: c.y, form: 'risen' });
  u.immortal = true;
  u.spr = 'reaper_a';
  G.reaper = u;
  G.victory = true;
  G.cleared = true;
  G.clearT = G.t;
  G.stats.bossesRaised++;
  META.reaperRaised = true;
  G.reapWave = { x: u.x, y: u.y, r: 0 };
  for (const t of G.teles) if (t.team === ENEMY) t.dead = true;
  for (const z of G.zones) if (z.team === ENEMY) z.dead = true;
  raiseFx(u.x, u.y, true);
  banner('死神を従えた', '完全勝利。いつでも凱旋できる', 'win');
  sfx('win'); sfx('raiseBig');
  G.shake = 12;
  UI.showReturn(true);
  // このまま続ければ延長戦（討伐隊は来続けるが、死神が刈り取る）
  G.endless = true;
  G.endlessStart = G.t;
  G.nextEndlessBoss = G.t + 120;
}

// 死神が生まれた瞬間の衝撃：広がる輪に触れた敵はすべて消し飛ぶ
function updateReapWave(dt) {
  const w = G.reapWave;
  if (!w) return;
  const r0 = w.r;
  w.r += 620 * dt;
  for (const e of G.units) {
    if (e.dead || e.team !== ENEMY) continue;
    const d = dist(e.x, e.y, w.x, w.y);
    if (d < w.r || w.r > 1500) {
      for (let i = 0; i < 4; i++) spawnFx(e.x + rng.range(-4, 4), e.y - 6, rng.range(-40, 40), -rng.range(20, 70), 0.5, 'px2', rng() < 0.5 ? rgba32(180, 110, 255, 255) : rgba32(20, 10, 30, 255), true);
      killUnit(e, G.reaper || { team: ALLY, type: 'reaper' });
    }
  }
  if (w.r > 1500) G.reapWave = null;
  if (Math.floor(r0 / 160) !== Math.floor(w.r / 160)) G.shake = Math.max(G.shake, 4);
}

// =========================================================
// 敵のボスの技：ネクロマンサーを狙う予告つきの範囲攻撃
// 後半のボスほど、また体力が半分を切るほど（激昂）、技の間隔が短く、数が多くなる
// 狙いはネクロマンサー。周りの死者への傷は控えめ（軍勢ごと消し飛ばないように）
// =========================================================
const BOSS_PATTERNS = {
  captain: ['axeline', 'axefan'],
  inquisitor: ['firerain', 'closering'],
  beastmaster: ['arrowrain', 'pierceline'],
  saint: ['holycross', 'pillars'],
  dragoon: ['dive', 'lancedash', 'dive'],
  archbishop: ['holycross', 'closering', 'pillars'],
  giant: ['stomp', 'boulder', 'boulder3'],
  dragon: ['breath', 'fireballs', 'flyover'],
  hero: ['swordrain', 'dive', 'holycross', 'closering'],
  god: ['judgment', 'starfall', 'godbeams', 'holycross', 'pillars', 'closering'],
};
// 強さの段階：5分のボス=0 … 勇者=4
function bossIntensity(u) {
  const st = clamp((G.t - 300) / 150, 0, 4.5);
  let I = 1 + 0.25 * st;
  if (u.hp < u.mhp * 0.5) I += 0.35;
  if (u.type === 'god') I += 0.25;
  if (G.endless) I += 0.3;
  return Math.min(I, G.endless ? 2.8 : 2.2);
}
function addTele(o) { G.teles.push(Object.assign({ t: 1, max: o.t || 1, team: ENEMY, kind: 'blast' }, o, { max: o.t || 1 })); }
function rndAround(x, y, r) { const a = rng() * TAU, d = Math.sqrt(rng()) * r; return [clamp(x + Math.cos(a) * d, 20, MAP - 20), clamp(y + Math.sin(a) * d * 0.8, 20, MAP - 20)]; }

function updateBossPattern(u, dt) {
  const N = G.necro;
  // 跳躍の着地
  if (u.patAir) {
    if (u.air > 0) return;
    u.patAir = false;
    u.x = u.lx; u.y = u.ly;
    G.shake = Math.max(G.shake, 5);
    return;
  }
  if (u.patT == null) u.patT = 3;
  u.patT -= dt;
  if (u.patT > 0 || N.dead) return;
  const list = BOSS_PATTERNS[u.type];
  if (!list) return;
  const d = dist(u.x, u.y, N.x, N.y);
  if (d > 280) { u.patT = 0.5; return; }
  const I = bossIntensity(u);
  u.patI = ((u.patI || 0) + 1) % list.length;
  const sk = list[u.patI];
  const pow = u.atk;
  const ang = Math.atan2(N.y - u.y, N.x - u.x);
  let cd = 4.2;
  switch (sk) {
    case 'axeline': {
      // 斧を投げる：ネクロマンサーへ向かう帯
      const n = I >= 1.6 ? 2 : 1;
      for (let i = 0; i < n; i++) addTele({ x: u.x, y: u.y - 4, ang: ang + (n > 1 ? (i - 0.5) * 0.3 : 0), len: 190, w: 20, t: 0.9, kind: 'line', dmg: pow * 0.56, necro: 0.21, src: u });
      cd = 3.6;
      break;
    }
    case 'axefan': {
      const n = 3 + (I >= 1.8 ? 2 : 0);
      for (let i = 0; i < n; i++) addTele({ x: u.x, y: u.y - 4, ang: ang + (i - (n - 1) / 2) * 0.32, len: 170, w: 16, t: 1.0, kind: 'line', dmg: pow * 0.48, necro: 0.19, src: u });
      cd = 4.5;
      break;
    }
    case 'firerain': {
      // 火の雨：最初の1発は足元。残りは周り
      const n = Math.round(4 + 2.5 * I);
