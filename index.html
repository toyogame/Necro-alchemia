      for (let i = 0; i < n; i++) {
        const [x, y] = i === 0 ? [N.x, N.y] : rndAround(N.x, N.y, 75);
        addTele({ x, y, r: 20, t: 0.95, delay: i * 0.12, dmg: pow * 0.44, necro: 0.19, fire: true, src: u,
          onHit: (t) => G.zones.push({ x: t.x, y: t.y, r: 14, t: 3, max: 3, kind: 'fire', team: ENEMY, dps: pow * 0.4 }) });
      }
      cd = 4.8;
      break;
    }
    case 'closering': {
      // 足元を囲む炎の輪（中心は安全）→ すぐ後に中心が爆ぜる。輪が消えたら外へ逃げる
      addTele({ x: N.x, y: N.y, r0: 24, r1: 62, t: 1.0, kind: 'ring', dmg: pow * 0.48, necro: 0.21, src: u });
      addTele({ x: N.x, y: N.y, r: 26, t: 0.75, delay: 1.0, dmg: pow * 0.56, necro: 0.25, src: u });
      cd = 5;
      break;
    }
    case 'arrowrain': {
      const n = Math.round(6 + 3 * I);
      for (let i = 0; i < n; i++) {
        const [x, y] = i === 0 ? [N.x, N.y] : rndAround(N.x, N.y, 70);
        addTele({ x, y, r: 14, t: 0.8, delay: i * 0.07, dmg: pow * 0.36, necro: 0.15, src: u });
      }
      cd = 3.8;
      break;
    }
    case 'pierceline': {
      addTele({ x: u.x, y: u.y - 4, ang, len: 300, w: 12, t: 0.7, kind: 'line', dmg: pow * 0.64, necro: 0.21, src: u });
      if (I >= 1.7) addTele({ x: u.x, y: u.y - 4, ang, len: 300, w: 12, t: 0.6, delay: 0.7, kind: 'line', dmg: pow * 0.64, necro: 0.21, src: u });
      cd = 3.2;
      break;
    }
    case 'holycross': {

      cd = 5.2;

    case 'pillars': {
      // 光の柱が足取りを追ってくる（3〜5本）
      const n = Math.round(2 + 1.2 * I);

    case 'dive': {

      for (let i = 0; i < 3; i++) addTele({ x: u.x, y: u.y, r0: i * 44, r1: i * 44 + 30, t: 0.9, delay: i * 0.45, kind: 'ring', dmg: pow * 0.56, necro: 0.16, src: u });
      if (I >= 1.8) addTele({ x: u.x, y: u.y, r0: 132, r1: 162, t: 0.9, delay: 1.35, kind: 'ring', dmg: pow * 0.48, necro: 0.14, src: u });

      if (I >= 2) addTele({ x: N.x, y: N.y, r: 30, t: 0.9, delay: 1.5, dmg: pow * 0.64, necro: 0.19, src: u });

    case 'breath': {
      // 炎の息：扇の中を焼き、地面に火が残る
      addTele({ x: u.x, y: u.y - 8, ang, len: 190, spread: 0.42, t: 1.1, kind: 'cone', dmg: pow * 0.64, necro: 0.27, fire: true, src: u,
        onHit: (t) => { for (let i = 1; i <= 4; i++) { const dd = t.len * i / 4.5; G.zones.push({ x: t.x + Math.cos(t.ang) * dd, y: t.y + Math.sin(t.ang) * dd + 6, r: 14 + i * 3, t: 4, max: 4, kind: 'fire', team: ENEMY, dps: pow * 0.5 }); } } });
      if (I >= 2.2) addTele({ x: u.x, y: u.y - 8, ang: ang + (rng() < 0.5 ? 0.6 : -0.6), len: 190, spread: 0.42, t: 0.9, delay: 1.1, kind: 'cone', dmg: pow * 0.64, necro: 0.27, fire: true, src: u });
      cd = 4.8;

    }
    case 'fireballs': {
      const n = Math.round(4 + 2 * I);
      for (let i = 0; i < n; i++) {
        const [x, y] = i === 0 ? [N.x, N.y] : rndAround(N.x, N.y, 90);
        addTele({ x, y, r: 24, t: 1.0, delay: i * 0.18, dmg: pow * 0.52, necro: 0.21, fire: true, src: u,
          onHit: (t) => G.zones.push({ x: t.x, y: t.y, r: 16, t: 3.5, max: 3.5, kind: 'fire', team: ENEMY, dps: pow * 0.4 }) });

      for (let i = 0; i < 4; i++) addTele({ x: u.x, y: u.y, r0: i * 52, r1: i * 52 + 34, t: 1.0, delay: i * 0.4, kind: 'ring', dmg: pow * 0.5, necro: 0.17, holy: true, src: u });
      addTele({ x: N.x, y: N.y, r: 30, t: 0.8, delay: 1.7, dmg: pow * 0.56, necro: 0.2, holy: true, src: u });

      for (let k = 0; k < 2; k++) for (let i = 0; i < 6; i++) {
        const a = ang + i / 6 * TAU + k * Math.PI / 6;
        addTele({ x: u.x, y: u.y - 10, ang: a, len: 300, w: 18, t: 1.0, delay: k * 0.9, kind: 'line', dmg: pow * 0.5, necro: 0.19, holy: true, src: u });
      }

      break;
    }
    case 'flyover': {
      // 頭上を飛び越えて反対側へ。通り道を焼き払う
      const len = d + 140;
      addTele({ x: u.x, y: u.y - 4, ang, len, w: 34, t: 1.0, kind: 'line', dmg: pow * 0.6, necro: 0.25, fire: true, src: u,
        onHit: (t) => {
          for (let i = 1; i <= 5; i++) { const dd = t.len * i / 6; G.zones.push({ x: t.x + Math.cos(t.ang) * dd, y: t.y + Math.sin(t.ang) * dd, r: 16, t: 4, max: 4, kind: 'fire', team: ENEMY, dps: pow * 0.45 }); }
          u.x = clamp(t.x + Math.cos(t.ang) * t.len, 24, MAP - 24); u.y = clamp(t.y + Math.sin(t.ang) * t.len, 24, MAP - 24);
        } });

  u.patT = cd * 1.3 / I;
}
// 光の柱が足取りを追う（pillars の続き）
function updateBossChase(u, dt) {
  const c = u.chase;
  if (!c) return;
  c.t -= dt;
  if (c.t > 0) return;
  const N = G.necro;
  addTele({ x: N.x, y: N.y, r: 22, t: 0.7, dmg: u.atk * 0.5, necro: 0.19, holy: true, src: u });
  c.t = 0.45;
  if (--c.n <= 0) u.chase = null;
}

// ==== 09_necro.js ====
// ---------- ネクロマンサー（入力・一斉蘇生・成長） ----------
const INPUT = { jx: 0, jy: 0, keys: {}, active: false, ox: 0, oy: 0, cx: 0, cy: 0, pid: null };
const CHANT_DELAY = 0.2;     // 止まってから詠唱が始まるまで
const BASE_RAISE_R = 40;
const SOUL_RETURN = 8;     // 拾われなかった魂が主のもとへ還り始めるまでの秒数

function newNecro(charKey) {
  const N = {
    isNecro: true, team: ALLY, x: MAPC, y: MAPC, hp: 100, mhp: 100, lv: 1, xp: 0, face: 1, size: 6,
    moving: false, still: 0, chant: null, anim: 0, flash: 0, hurtT: 0, dead: false, invuln: 0,
    spr: 'necro_' + charKey, regen: 0.4, preview: null, previewT: 0,
  };
  return N;
}

// 従えられる死者の上限（レベルで増える）。煮込み中の窯も1体分として数える
function armyCap() {
  const base = (12 + 2.4 * (G.necro.lv - 1)) * (1 + LV('legion', sk('legion'))) * (pathTier('mure') >= 1 ? 1 + TU.p_mure1 : 1);
  // 祭壇「屍の軍旗」：段階ごとの割合（ALTAR_BASE）。少なくとも1段ごとに +1
  const b = META.up.banner || 0;
  return Math.max(Math.round(base * (1 + upEff('banner', b))), Math.round(base) + b);
}
function armyUsed() {
  let n = 0;
  for (const u of G.units) if (u.team === ALLY && !u.dead) n++;
  for (const p of G.pots) if (!p.dead) n++;
  return n;
}
function armyRoom() { return armyCap() - armyUsed(); }
// 円の中の死体から、空き枠の分だけ格の高い順に選ぶ
function pickRaise(list, room) {
  if (room <= 0) return [];
  if (list.length <= room) return list;
  return list.slice().sort((a, b) => b.g - a.g).slice(0, room);
}

function xpNeed(lv) { return Math.floor((6 + 5 * lv + 1.1 * lv * lv) * 0.5); }

// ---- 修正値の再計算 ----
function recomputeMods() {
  // 実効Lv（効き目）と道の位階
  G.eff = {};
  for (const k in G.skills) G.eff[k] = skillEff(k, G.skills[k]);
  G.pathT = {};
  for (const c in PATHS) G.pathT[c] = pathTierOf(c, pathPts(c));
  const S = G.eff, up = META.up;
  const T = G.pathT;
  const M = {
    raiseR: BASE_RAISE_R * (1 + LV('ring', S.ring) + upEff('ring', up.ring || 0)),
    raiseSpeed: (1 + LV('chant', S.chant)) * (1 + upEff('chant', up.chant || 0)),
    // 境界の超越：格上の死体の蘇生と、格上の合成の煮込みが速くなる
    transcend: LV('transcend', S.transcend),
    simmer: 1 / Math.max(0.05, 1 - LV('alchemy', S.alchemy)),
    potHp: (1 + LV('ironpot', S.ironpot)) * (G.char === 'witch' ? 1 + TU.trait_witch : 1),
    thorns: LV('thornpot', S.thornpot),
    yomigaeri: LV('yomigaeri', S.yomigaeri),
    kingR: S.kingaura ? LV('kingaura', S.kingaura) * (T.toosotsu >= 1 ? 1 + TU.p_toosotsu1 : 1) : 0,
    giantSz: LV('giant_sz', S.giant), giantAll: LV('giant_all', S.giant),
    deathless: LV('deathless', S.deathless),
    rallyMove: LV('rally_move', S.rally), rallyAs: LV('rally_as', S.rally),
    twin: LV('twinpot', S.twinpot),
    blood: LV('blood', S.blood),
    kinship: LV('kinship', S.kinship), harmony: LV('harmony', S.harmony), apex: LV('apex', S.apex),
    apexArc: LV('apex_arc', S.apex), apexReach: LV('apex_reach', S.apex), apexWide: LV('apex_wide', S.apex), apexJr: LV('apex_jr', S.apex), apexJgrow: LV('apex_jgrow', S.apex),
    burst: LV('burst', S.burst), burstR: LV('burst_r', S.burst),
    infect: LV('infect', S.infect),
    undecay: LV('undecay_soft', S.undecay),
    decayMul: (1 + LV('undecay_rot', S.undecay)) * (G.char === 'plaguedoc' ? 1 + TU.trait_plaguedoc : 1),
    reap: LV('reap', S.reap),
    auraR: 75 * (1 + LV('command', S.command)) * (G.char === 'general' ? 1 + TU.trait_general : 1) * (T.toosotsu >= 1 ? 1 + TU.p_toosotsu1 : 1),
    auraAtk: LV('presence', S.presence),
    mist: LV('mist', S.mist),
    aggro: 1 + LV('command', S.command),
    moveSpd: (1 + LV('swift', S.swift)) * (1 + upEff('feet', up.feet || 0)),
    hpMul: 1 + LV('vessel_hp', S.vessel),
    regen: 0.12 + LV('vessel_regen', S.vessel),
    pickup: 1 + LV('pull', S.pull),
    xpMul: (1 + LV('wisdom', S.wisdom)) * (1 + upEff('thirst', up.thirst || 0)),
    dmgTaken: (1 - LV('mantle', S.mantle)) * (T.toosotsu >= 2 ? 1 - TU.p_toosotsu2 : 1),
    // 術式の効き目（毎フレーム使うもの。ここで1回だけ引いておく）
    legion: LV('legion', S.legion), fleshhorde: LV('fleshhorde', S.fleshhorde), bonelegion: LV('bonelegion', S.bonelegion), mastery: LV('mastery', S.mastery),
    command: LV('command', S.command), presence: LV('presence', S.presence),
    linbu: LV('linbu', S.linbu), linsha: LV('linsha', S.linsha), linjutsu: LV('linjutsu', S.linjutsu),
    // 道の効果
    rush: T.mure >= 2,
    horde: T.mure >= 3,
    synMul: T.seiei >= 1 ? 1 + TU.p_seiei1 : 1,
    subPlus: T.seiei >= 2 ? TU.p_seiei2 : 0,
    synUndying: T.seiei >= 3,
    deathHeal: T.junkan >= 1,
    wrath: T.junkan >= 2,
    rerise: T.junkan >= 3 ? TU.p_junkan3 : 0,
    auraGuard: T.toosotsu >= 2,
    necroBolt: T.toosotsu >= 3,
    linHp: T.lin >= 1, linG: T.lin >= 2 ? TU.p_lin2 : 0, linAs: T.lin >= 3,
    linOwn: { bu: !!G.skills.linbu, sha: !!G.skills.linsha, jutsu: !!G.skills.linjutsu },
  };
  G.mods = M;
  const N = G.necro;
  if (N) {
    const old = N.mhp;
    // ネクロマンサー本人はひ弱。軍勢に守らせる前提
    N.mhp = Math.round((24 + 1.2 * (N.lv - 1)) * (1 + upEff('body', up.body || 0)) * M.hpMul);
    if (N.mhp > old) N.hp += N.mhp - old;
    N.hp = Math.min(N.hp, N.mhp);
  }
}

// ---- 経験値 ----
function gainXp(v) {
  const N = G.necro;
  if (N.dead) return;
  N.xp += v;
  while (N.xp >= xpNeed(N.lv)) {
    N.xp -= xpNeed(N.lv);
    N.lv++;
    G.pendingLv++;
    // レベルが上がると、その場に錬金窯が現れる
    addSite(N.x + rng.range(-6, 6), N.y + 10);
    recomputeMods();
    N.hp = Math.min(N.mhp, N.hp + N.mhp * 0.15);
  }
}

// ---- 蘇生時間 ----
function corpseRaiseTime(c, lv) {
  const ratio = c.g / Math.max(1, lv);
  const p = ratio > 1 ? 3.5 : 3;
  // 一度従えた死者（味方だった死体）は絆が残っていて起こしやすい
  const bond = (c.look !== 'e' || c.raiseSyn) ? 0.6 : 1;
  // 境界の超越：格上の死体は速く起こせる
  const tr = ratio > 1 ? 1 + (G.mods.transcend || 0) : 1;
  return Math.max(0.05, 0.2 * Math.pow(ratio, p) * bond / tr);
}

function raiseSpeedNow() {
  const N = G.necro;
  let s = G.mods.raiseSpeed;
  let altar = 0;
  for (const a of G.altars) if (dist2(a.x, a.y, N.x, N.y) < 85 * 85) altar += 0.4 * (a.tr.altarBoost || 1);
  return s * (1 + Math.min(1.2, altar));
}

function inSanctum(x, y) {
  for (const z of G.zones) if (z.kind === 'sanctum' && dist2(x, y, z.x, z.y) < z.r * z.r) return true;
  return false;
}

// 円の中の蘇生できる死体を集める
function corpsesInCircle(x, y, r) {
  const out = [];
  G.cgrid.query(x, y, r, (c) => {
    if (c.dead || c.burn > 0 || c.sacred) return;
    const dx = c.x - x, dy = (c.y - y) / 0.75;
    if (dx * dx + dy * dy > r * r) return;
    if (inSanctum(c.x, c.y)) return;
    out.push(c);
  });
  return out;
}

function totalRaiseTime(list, lv) {
  let t = 0;
  for (const c of list) t += corpseRaiseTime(c, lv);
  return t;
}

// ---- 毎フレーム ----
function updateNecro(dt) {
  const N = G.necro;
  if (N.dead) return;
  if (N.flash > 0) N.flash -= dt;
  if (N.hurtT > 0) N.hurtT -= dt;
  if (N.invuln > 0) N.invuln -= dt;
  N.anim += dt;
  N.hp = Math.min(N.mhp, N.hp + G.mods.regen * dt);

  // 入力（マウスで動かしているときは、ネクロマンサーの今の位置から向きを取り直す）
  if (INPUT.follow && UI.followTick) UI.followTick();
  let ix = INPUT.jx, iy = INPUT.jy;
  // キー設定の割り当て（初期は WASD）
  if (actHeld('left')) ix -= 1;
  if (actHeld('right')) ix += 1;
  if (actHeld('up')) iy -= 1;
  if (actHeld('down')) iy += 1;
  const m = Math.sqrt(ix * ix + iy * iy);
  const spd = 54 * G.mods.moveSpd;
  if (m > 0.08) {
    const s = Math.min(1, m);
    N.x += ix / m * s * spd * dt;
    N.y += iy / m * s * spd * dt;
    N.x = clamp(N.x, 30, MAP - 30); N.y = clamp(N.y, 30, MAP - 30);
    if (Math.abs(ix) > 0.05) N.face = ix > 0 ? 1 : -1;
    if (N.chant) cancelChant();
    N.moving = true;
    N.still = 0;
  } else {
    N.moving = false;
    N.still += dt;
  }

  const R2 = G.mods.raiseR;
  // 予想時間（移動中も表示）
  N.previewT -= dt;
  if (N.previewT <= 0) {
    N.previewT = 0.1;
    const list = corpsesInCircle(N.x, N.y, R2);
    const pick = pickRaise(list, armyRoom());
    N.preview = { n: pick.length, all: list.length, t: totalRaiseTime(pick, N.lv) / raiseSpeedNow(), set: new Set(pick), full: list.length > 0 && pick.length === 0 };
  }

  // 詠唱
  if (!N.moving && N.still >= CHANT_DELAY && !N.chant) {
    const list = pickRaise(corpsesInCircle(N.x, N.y, R2), armyRoom());
    if (list.length) {
      N.chant = { list, total: totalRaiseTime(list, N.lv), prog: 0 };
      sfx('chantStart');
    }
  }
  if (N.chant) {
    const ch = N.chant;
    ch.prog += dt * raiseSpeedNow();
    if (rng() < 0.6) {
      const a = rng() * TAU;
      spawnFx(N.x + Math.cos(a) * R2, N.y + Math.sin(a) * R2 * 0.75, -Math.cos(a) * 30, -Math.sin(a) * 22, 0.6, 'px', rgba32(110, 255, 160, 220), true);
    }
    if (ch.prog >= ch.total) completeChant();
  }

  // 冥府の門
  if (G.evos.hellgate) {
    G.hellgateT -= dt;
    if (G.hellgateT <= 0) {
      G.hellgateT = 14;
      const list = pickRaise(corpsesInCircle(N.x, N.y, 115), armyRoom());
      for (const c of list) { c.dead = true; const u = allyFromCorpse(c); if (u) raiseFx(u.x, u.y, false); }
      ringFx(N.x, N.y, 115, rgba32(120, 255, 170, 255));
      if (list.length) sfx('raise');
    }
  }

  // 魂の回収
  const pr = 24 * G.mods.pickup;
  for (const s of G.souls) {
    if (s.dead) continue;
    s.t += dt;
    const d2 = dist2(s.x, s.y, N.x, N.y - 6);
    // 魂は一定時間たつと自然に主のもとへ還る
    if (s.mag || d2 < pr * pr || s.t > SOUL_RETURN) {
      const d = Math.sqrt(d2);
      let sp = 140 + (1 - Math.min(1, d / 80)) * 120;
      if (!s.mag && d2 >= pr * pr) sp = Math.min(220, 30 + (s.t - SOUL_RETURN) * 60);
      else s.mag = true;
      s.x += (N.x - s.x) / Math.max(1, d) * sp * dt;
      s.y += (N.y - 6 - s.y) / Math.max(1, d) * sp * dt;
      if (d < 6) { s.dead = true; gainXp(s.v); sfx('soul'); }
    }
  }
  compact(G.souls, notDead);

  // 回復の灯（精鋭・ボスが落とす）
  for (const o of G.pickups) {
    if (o.dead) continue;
    o.t += dt;
    if (o.t > 45) { o.dead = true; continue; }
    const d2 = dist2(o.x, o.y, N.x, N.y - 4);
    if (d2 < (pr + 4) * (pr + 4)) {
      const d = Math.sqrt(d2);
      o.x += (N.x - o.x) / Math.max(1, d) * 160 * dt;
      o.y += (N.y - 4 - o.y) / Math.max(1, d) * 160 * dt;
      if (d < 7) {
        o.dead = true;
        const heal = N.mhp * 0.3;
        N.hp = Math.min(N.mhp, N.hp + heal);
        floatText('+' + Math.round(heal), N.x, N.y - 24, rgba32(255, 130, 130, 255));
        for (let i = 0; i < 10; i++) spawnFx(N.x + rng.range(-6, 6), N.y - rng.range(0, 14), 0, -rng.range(10, 30), 0.6, 'px2', rgba32(255, 120, 120, 255), true);
        sfx('heal');
      }
    }
  }
  compact(G.pickups, notDead);

  // 再生の霧
  if (G.mods.mist > 0) {
    N.mistT = (N.mistT || 0) - dt;
    if (N.mistT <= 0) {
      N.mistT = 1;
      const r = G.mods.auraR;
      G.tgrid[ALLY].query(N.x, N.y, r, (a) => {
        if (a.team === ALLY && !a.dead && dist2(a.x, a.y, N.x, N.y) < r * r) a.hp = Math.min(a.mhp, a.hp + a.mhp * G.mods.mist);
      });
    }
  }
  // 威光の道・三：冥府の魔弾（周囲の敵へ、最大2発）
  if (G.mods.necroBolt && !N.dead) {
    N.boltT = (N.boltT || 0) - dt;
    if (N.boltT <= 0) {
      const r = G.mods.auraR * 1.3;
      const cand = [];
      G.tgrid[ENEMY].query(N.x, N.y, r, (e) => { if (e.team === ENEMY && !e.dead && !(e.air > 0) && dist2(e.x, e.y, N.x, N.y) < r * r) cand.push(e); });
      if (cand.length) {
        N.boltT = 0.9;
        cand.sort((a, b) => dist2(a.x, a.y, N.x, N.y) - dist2(b.x, b.y, N.x, N.y));
        const dmg = (6 + 1.6 * N.lv) * (1 + G.mods.presence) * TU.p_toosotsu3;
        for (let i = 0; i < Math.min(2, cand.length); i++) {
          fireProj({ x: N.x, y: N.y, face: N.face || 1, team: ALLY, range: r }, cand[i], 'orbGreen', dmg, { homing: true, speed: 190, life: 1.4, src: null });
        }
        sfx('shoot');
      } else N.boltT = 0.2;
    }
  }
  if (G.evos.warmarch) {
    N.wmT = (N.wmT || 0) - dt;
    if (N.wmT <= 0) { N.wmT = 1; for (const a of G.units) if (a.team === ALLY && !a.dead) a.hp = Math.min(a.mhp, a.hp + a.mhp * 0.015); }
  }
}

function cancelChant() {
  G.necro.chant = null;
}

function completeChant() {
  const N = G.necro;
  const ch = N.chant;
  N.chant = null;
  let n = 0, big = false;
  for (const c of ch.list) {
    if (armyRoom() <= 0) break;
    if (c.dead || c.burn > 0) continue;
    if (inSanctum(c.x, c.y)) continue;
    c.dead = true;
    const u = allyFromCorpse(c);
    if (u) { raiseFx(u.x, u.y, u.isBoss || u.kind === 'syn'); n++; if (c.g > N.lv) big = true; if (G.mods.rush) u.hasteT = TU.p_mure2; }
  }
  if (n > 0) {
    sfx(big ? 'raiseBig' : 'raise');
    ringFx(N.x, N.y, G.mods.raiseR, rgba32(120, 255, 170, 255));
    if (n >= 3) floatText('+' + n, N.x, N.y - 26, rgba32(140, 255, 180, 255));
  }
  // 同じ場所で止まり続けたら、新しい死体を次の詠唱で拾えるよう少し待つ
  N.still = CHANT_DELAY - 0.05;
}

// ==== 10_cauldron.js ====
// ---------- 錬金窯（合成） ----------
// レベルが上がると、その場に「窯」が1つ現れる。窯の近くでだけ合成のメニューを開ける。
// 合成：主（メイン）2体が結果の種類・基礎能力・基礎格を決め、サブ（レベルに応じた数まで）が格と能力の伸びを決める。
const COL_COEF = [1.0, 0.7, 0.5];
const SITE_R = 40;      // 窯のメニューを開ける距離
const SYNTH_BODY = 3.2; // 合成体の体の強さ（普通の死者に対する倍率）

function unitCol(u) {
  if (u.kind === 'syn') return SYNTH[u.synKey].col;
  if (!FORMS[u.form]) return 0;
  return FORMS[u.form].col;
}
// 種の★（合成体は1〜5、堕ちたボスは4〜5、配下のボスは3、配下の中ボスは2、普通の死者は0）
function unitSpRank(u) {
  if (u.kind === 'syn') return SYNTH[u.synKey].rank;
  if (u.isBoss) return 3;
  if (u.mid) return 2;
  return 0;
}
// サブの価値（格がどれだけ上がるか）：格 × 形態の係数
function materialValue(u) { return u.g * COL_COEF[unitCol(u)]; }

// 同族合成に使える種族（普通の死者・中ボスはその種類、同族合成体はその種族）
function kinOf(u) {
  if (u.kind === 'syn') return SYNTH[u.synKey].kin || null;
  if (u.isBoss) return null;
  return KIN[u.type] ? u.type : null;
}
function unitTitle(u) {
  if (u.kind === 'syn') return synthFullName(u.synKey, u.affix);
  if (u.mid && MIDBOSS[u.type]) return MIDBOSS[u.type].name;
  return (ETYPES[u.type] || BOSSES[u.type]).name;
}
function unitDisplayName(u) {
  if (u.kind === 'syn') return unitTitle(u);
  return unitTitle(u) + '・' + FORMS[u.form].name;
}

function synthOutName(key, affix) { return synthFullName(key, affix); }

// サブに入れたときに伸びる能力（同じ格のサブ1体あたりの点数）
function subGrowth(u) {
  if (u.kind === 'syn') {
    if (u.unique) return BOSS_GROW;
    const s = SYNTH[u.synKey], g = s.kin ? GROW[s.kin] : BODY_GROW[s.lin][s.col], m = 1 + 0.5 * s.rank, o = {};
    for (const k in g) o[k] = g[k] * m;
    return o;
  }
  if (BOSSES[u.type]) return BOSS_GROW;
  const o = Object.assign({}, GROW[u.type] || { hp: 1 });
  if (u.mid) for (const k in o) o[k] *= 2.5;
  const fg = FORM_GROW[u.form] || {};
  for (const k in fg) o[k] = (o[k] || 0) + fg[k];
  return o;
}
function growText(gr) {
  const parts = [];
  for (const k of STATS) if (gr[k]) parts.push(STAT_SHORT[k] + '+' + (Math.round(gr[k] * 10) / 10));
  return parts.join(' ');
}

// 煮込み時間：基本4.5秒＋サブ1体ごとに0.35秒＋★が1つ上がるごとに1.2秒
// 完成するLvがあなたのLvより高いと、その差1につき ×SIMMER_GAP（1.08）ずつ長くなる（差だけで決まる。どのLv帯でも同じ差なら同じだけ待つ）
// 術式「境界の超越」でこの伸びを小さくできる。煮込み中にレベルが上がると、残り時間も縮む
// （煮込み中の窯は敵に狙われる。強い合成ほど長く守る必要がある）
const SIMMER_GAP = 1.08;
// 境界の超越があれば、格上の合成は速く煮える（この倍率に含めて、理由の表示にも出す）
function simmerGapMul(outG, lv) {
  const gap = Math.max(0, outG - Math.max(1, lv));
  return gap > 0 ? Math.pow(SIMMER_GAP, gap) / (1 + (G.mods ? G.mods.transcend || 0 : 0)) : 1;
}
function simmerTime(outG, lv, nSub, rank) {
  const base = 4.5 + 0.35 * (nSub || 0) + 1.2 * Math.max(0, (rank || 1) - 1);
  return base * simmerGapMul(outG, lv) / G.mods.simmer / (G.demo ? 4 : 1);
}

// 合成体の能力（表示と実際の能力の両方で使う）。ネクロマンサーのレベルによる補正は含まない
function synthStatBlock(key, g, pts) {
  const b = SYNTH[key];
  pts = pts || {};
  const hp = b.hp * SYNTH_HP * SYNTH_BODY * (1 + (G && G.mods ? G.mods.mastery || 0 : 0));
  const atk = b.atk * SYNTH_ATK * SYNTH_BODY * (1 + (G && G.mods ? G.mods.mastery || 0 : 0));
  // 体格：大きいほど硬く、少し重い一撃になるが、足は遅くなる
  // 屍の巨躯：合成体が大きくなり、全能力も少し伸びる
  const M = G && G.mods || {};
  const sz = growMul('size', pts.size) * (1 + (M.giantSz || 0));
  const all = 1 + (M.giantAll || 0);
  return {
    hp: Math.round(hp * hpScale(g) * growMul('hp', pts.hp) * (1 + 0.6 * (sz - 1)) * all),
    atk: atk * atkScale(g) * growMul('atk', pts.atk) * (1 + 0.25 * (sz - 1)) * all,
    spd: b.spd * growMul('spd', pts.spd) * (1 - 0.3 * (sz - 1)) * all,
    cd: b.cd / growMul('as', pts.as) / all,
    range: b.range + (b.range < 40 ? Math.round((sz - 1) * 12) : 0),
    sz,
  };
}

// 亜種：サブの半分以上（3体以上）が同じ種類ならその種類の亜種。ボス・中ボス・堕ちたボスがサブにいれば「覇王」。
// どれでもなければ主の亜種を受け継ぐ（格の高いほうを優先）
function subAffixInfo(subs) {
  const cnt = {};
  let boss = false;
  for (const u of subs) {
    if (u.isBoss || u.unique) { boss = true; continue; }
    const k = affixOfUnitType(u);
    if (k) cnt[k] = (cnt[k] || 0) + 1;
  }
  let top = null, n = 0;
  for (const k in cnt) if (cnt[k] > n) { n = cnt[k]; top = k; }
  const need = top ? Math.max(0, 3 - n, Math.ceil(subs.length / 2) - n) : 3;
  return { boss, top, n, total: subs.length, ok: boss || (top && n >= 3 && n * 2 >= subs.length) ? (boss ? 'boss' : top) : null, need };
}

// 主2体から結果の種類（キー）を決める：軽い計算だけ（レシピ図で全部の組み合わせを試すのにも使う）
function synthKeyOf(a, b) {
  if (!a || !b || a === b) return null;
  // 格の高いほうが核（戦い方の系統）。同じ格ならボスを核に
  if (b.g > a.g || (b.g === a.g && b.isBoss && !a.isBoss)) { const t = a; a = b; b = t; }
  let col = Math.round((unitCol(a) + unitCol(b)) / 2);
  const bossU = a.isBoss ? a : b.isBoss ? b : null;
  let key, rank;
  if (bossU) {
    const bk = bossU.kind === 'syn' ? SYNTH[bossU.synKey].boss : bossU.type;
    const other = bossU === a ? b : a;
    rank = Math.min(5, Math.max(4, resultRank(unitSpRank(bossU), unitSpRank(other))));
    key = 'u:' + bk + '-' + col + '#' + rank;
  } else {
    rank = resultRank(unitSpRank(a), unitSpRank(b));
    const ka = kinOf(a), kb = kinOf(b);
    // 決まった2種族で、片方が★1以上なら伝承の死霊（体の質はその死霊ごとに決まっている）
    const lg = rank >= 2 ? legendOf(ka, kb) : null;
    if (lg) { key = 'l:' + lg + '#' + rank; col = LEGENDS[lg].col; }
    // 同じ種族どうしなら同族合成
    else if (ka && ka === kb) key = 'k:' + ka + '-' + col + '#' + rank;
    else key = synthBodyKey(a.lin || 'bu', b.lin || 'bu', col) + '#' + rank;
  }
  if (!SYNTH[key]) return null;
  return { key, rank, col, a, b, baseG: Math.max(1, Math.round(a.g * 0.8 + b.g * 0.45)) };
}

// 今の軍勢で作れる合成体：体ごとに「★がいちばん高い組み合わせ」と「新種になる組み合わせ」
function craftableBodies(groups) {
  const out = new Map();
  if (!G || !G.units) return out;
  groups = groups || armyGroups();
  const consider = (x, y) => {
    const k = synthKeyOf(x, y);
    if (!k) return;
    const body = SYNTH[k.key].body;
    let e = out.get(body);
    if (!e) { e = { body, best: null, fresh: null }; out.set(body, e); }
    const better = (o) => !o || k.rank > o.rank || (k.rank === o.rank && k.baseG > o.baseG);
    if (better(e.best)) e.best = k;
    if (!META.recipes[k.key] && better(e.fresh)) e.fresh = k;
  };
  for (let i = 0; i < groups.length; i++) {
    const A = groups[i].list.filter((u) => !u.dead);
    if (!A.length) continue;
    if (A.length >= 2) consider(A[0], A[1]);
    for (let j = i + 1; j < groups.length; j++) {
      const B = groups[j].list.filter((u) => !u.dead);
      if (!B.length) continue;
      // 格の高いほうが核になるので、どちらが核にもなれるかを試す
      consider(A[0], B[0]); consider(B[0], A[0]);
      consider(A[0], B[B.length - 1]); consider(A[A.length - 1], B[0]);
    }
  }
  return out;
}

// 合成結果の予測：mains=[主2体]、subs=[サブ]
function synthPreview(mains, subs) {
  if (!mains || mains.length !== 2 || mains[0] === mains[1]) return null;
  subs = subs || [];
  const K = synthKeyOf(mains[0], mains[1]);
  if (!K) return null;
  const a = K.a, b = K.b, key = K.key, rank = K.rank, col = K.col;
  const S = SYNTH[key];
  const baseG = K.baseG;
  let total = 0;
  const pts = { hp: 0, atk: 0, spd: 0, as: 0, size: 0 };
  for (const u of subs) {
    total += materialValue(u);
    const gr = subGrowth(u), w = clamp(u.g / baseG, 0.3, 2);
    for (const k in gr) pts[k] += gr[k] * w;
  }
  // 主が合成体なら、その伸びの半分を受け継ぐ
  for (const m of [a, b]) if (m.grow) for (const k of STATS) pts[k] += 0.5 * (m.grow[k] || 0);
  const outG = Math.max(1, Math.round(baseG + Math.sqrt(total)));
  const ai = subAffixInfo(subs);
  const affix = ai.ok || a.affix || b.affix || null;
  const affixFrom = ai.ok ? 'sub' : affix ? 'main' : null;
  let gsum = a.g + b.g;
  for (const u of subs) gsum += u.g;
  return {
    core: a, other: b, mains: [a, b], subs, key, rank, outG, baseG, pts, lin: S.lin, col, affix, affixFrom, affixInfo: ai,
    name: synthFullName(key, affix),
    known: !!META.recipes[key],
    affixKnown: !affix || !!META.affixes[S.body + '|' + affix],
    time: simmerTime(outG, G.necro.lv, subs.length, rank),
    gapMul: simmerGapMul(outG, G.necro.lv), gap: Math.max(0, outG - G.necro.lv),
    potHp: Math.round((50 + 6 * gsum) * G.mods.potHp),
    count: 2 + subs.length,
    stats: synthStatBlock(key, outG, pts),
    base: synthStatBlock(key, outG, {}),
  };
}

// ---- 窯の場所（レベルアップで現れる） ----
function addSite(x, y) {
  for (let i = 0; i < 10; i++) {
    if (!G.sites.some((s) => dist2(s.x, s.y, x, y) < 24 * 24) && !G.pots.some((p) => !p.dead && dist2(p.x, p.y, x, y) < 24 * 24)) break;
    x += rng.range(-22, 22); y += rng.range(-18, 18);
  }
  // 使わずに溜めておける窯は8つまで（古いものから消える）
  if (G.sites.length >= 8) G.sites.shift();
  const s = { isSite: true, x: clamp(x, 30, MAP - 30), y: clamp(y, 30, MAP - 30), anim: rng() * 10, born: G.t };
  G.sites.push(s);
  ringFx(s.x, s.y, 26, rgba32(140, 255, 190, 255));
  return s;
}
function nearSite() {
  const N = G.necro;
  let best = null, bd = SITE_R * SITE_R;
  for (const s of G.sites) { const d = dist2(s.x, s.y, N.x, N.y); if (d < bd) { bd = d; best = s; } }
  return best;
}

function activePots() { return G.pots.filter((p) => !p.dead); }

// 窯で煮込み開始
function startSynthesis(site, mains, subs) {
  if (subs && subs.length > subCap()) subs = subs.slice(0, subCap());   // 上限を超えた分は入れない（念のため）
  const pv = synthPreview(mains, subs);
  if (!pv || !site || G.sites.indexOf(site) < 0) return false;
  const list = mains.concat(subs);
  const inputs = list.map((u, i) => ({ main: i < mains.length, kind: u.kind, type: u.type, form: u.form, lin: u.lin, g: u.g, synKey: u.synKey, unique: u.unique, isBoss: u.isBoss, mid: !!u.mid, affix: u.affix || null, grow: u.grow || null }));
  launchFlyers(list, site, mains);
  for (const u of list) u.dead = true;
  G.sites.splice(G.sites.indexOf(site), 1);
  const p = {
    isPot: true, team: ALLY, x: site.x, y: site.y, hp: pv.potHp, mhp: pv.potHp, prog: 0,
    key: pv.key, affix: pv.affix, outG: pv.outG, pts: pv.pts, lin: pv.lin, inputs, dead: false, anim: 0, attacker: null, attackerT: 0,
    shotT: 1, guardSet: false, size: 10, name: pv.name, known: pv.known, nSub: subs.length, rank: pv.rank,
  };
  G.pots.push(p);
  sfx('pot');
  return true;
}

// ---- 窯へ飛んでいく演出 ----
// 合成に使った死者は、その場から弧を描いて窯へ吸い込まれる（どこの兵が減ったか見えるように）
// 見た目だけの存在で、戦いには関わらない。メインは金、サブは緑の光をまとう
function launchFlyers(list, site, mains) {
  let k = 0;
  for (const u of list) {
    const main = mains.indexOf(u) >= 0;
    const d = Math.sqrt(dist2(site.x, site.y, u.x, u.y));
    G.flyers.push({
      spr: u.spr, x0: u.x, y0: u.y, x1: site.x, y1: site.y - 7,
      t: main ? 0 : -Math.min(0.55, 0.06 + 0.04 * k++),          // サブは少しずつ時間をずらして次々に
      dur: clamp(0.5 + d / 520, 0.55, 1.25), h: Math.min(70, 16 + d * 0.2),
      flip: u.face < 0, scale: u.scale || 1, main, done: false,
    });
    // 抜けた場所に小さな光の輪
    ringFx(u.x, u.y - 2, main ? 10 : 7, main ? rgba32(255, 220, 120, 230) : rgba32(120, 255, 170, 200));
  }
  sfx('whoosh');
}
function flyerPos(f, p) {
  const e = p * p * 0.55 + p * 0.45;   // 終わりほど速く（吸い込まれる）
  return [lerp(f.x0, f.x1, e), lerp(f.y0, f.y1, e) - Math.sin(p * Math.PI) * f.h, e];
}
function updateFlyers(dt) {
  if (!G.flyers.length) return;
  let landed = 0;
  for (const f of G.flyers) {
    f.t += dt;
    if (f.t <= 0) continue;
    const p = Math.min(1, f.t / f.dur);
    const [x, y] = flyerPos(f, p);
    if (vrng() < 0.6) spawnFx(x + vrng.range(-2, 2), y - 4 + vrng.range(-2, 2), 0, 0, 0.35, 'px2', f.main ? rgba32(255, 220, 120, 210) : rgba32(120, 255, 170, 190), true);
    if (p >= 1) {
      f.done = true; landed++;
      for (let i = 0; i < (f.main ? 8 : 4); i++) spawnFx(f.x1 + vrng.range(-3, 3), f.y1, vrng.range(-35, 35), -vrng.range(25, 60), 0.45, 'px2', f.main ? rgba32(255, 220, 120, 230) : rgba32(120, 255, 170, 230), true, 140);
    }
  }
  if (landed) sfx('plop');
  compact(G.flyers, (f) => !f.done);
}

function damagePot(p, amt, src) {
  if (p.dead) return;
  if (src && src.special === 'rob') amt *= 2;
  p.hp -= amt;
  p.flash = 0.1;
  if (src && src.team === ENEMY) { p.attacker = src; p.attackerT = 3; }
  // 棘の窯
  if (G.mods.thorns > 0 && src && src.team === ENEMY && !src.dead && src.hp !== undefined) {
    const td = (TU.thorn_base + G.necro.lv * TU.thorn_lv) * G.mods.thorns;
    damage(src, td, null);
    spawnFx(src.x, src.y - 6, 0, -20, 0.3, 'spark', rgba32(230, 225, 200, 255), true);
  }
  if (p.hp <= 0) breakPot(p);
}

// 合成体（と堕ちたボス）が劣化したときの次の姿
function synthDecayKey(s) { return synthNextKey(s.synKey); }
function decayedGrow(g) {
  if (!g) return null;
  const o = {};
  for (const k of STATS) o[k] = (g[k] || 0) * 0.8;
  return o;
}

// 破壊：メインの2体だけが一段劣化した死体として散らばる。サブにした死者は窯と一緒に失われる（窯は失われる）
function breakPot(p) {
  p.dead = true;
  G.stats.potBreaks = (G.stats.potBreaks || 0) + 1;
  sfx('potBreak');
  G.shake = Math.max(G.shake, 4);
  banner('窯が壊された', 'サブは失われ、メインは死体になった', 'enemy');
  for (let i = 0; i < 18; i++) spawnFx(p.x, p.y - 8, rng.range(-70, 70), rng.range(-90, -20), 0.7, 'px2', rng() < 0.5 ? rgba32(60, 200, 110, 255) : rgba32(50, 46, 60, 255), false, 200);
  const M = G.mods;
  for (const s of p.inputs) {
    if (s.main === false) continue;   // サブは消える
    const a = rng() * TAU, d = rng.range(8, 34);
    const x = clamp(p.x + Math.cos(a) * d, 24, MAP - 24), y = clamp(p.y + Math.sin(a) * d * 0.8, 24, MAP - 24);
    const decay = 30 * M.decayMul;
    if (s.kind === 'syn') {
      const next = synthDecayKey(s);
      if (!next) continue;
      addCorpse({ x, y, kind: 'syn', sprKey: s.synKey, type: s.type, unique: !!s.unique, boss: !!s.unique, raiseSyn: next, lin: s.lin, g: s.g, grow: decayedGrow(s.grow), affix: s.affix, decay, decayMax: decay });
      continue;
    }
    const f = FORMS[s.form];
    if (!f.next) continue;
    addCorpse({ x, y, kind: s.form === 'skeleton' ? 'skel' : 'h', type: s.type, look: s.form === 'risen' ? 'r' : 'z', raiseForm: f.next, lin: s.lin, g: s.g,
      boss: s.isBoss, mid: s.mid, decay, decayMax: decay });
  }
}

// 窯から合成体を1体出す（弧を描いて飛び出し、少し離れた所に着地する）。turn：飛ぶ向きをずらす
function popFromPot(p, turn) {
  const S = SYNTH[p.key];
  const u = makeUnit({ team: ALLY, kind: 'syn', synKey: p.key, unique: !!S.unique, type: S.unique ? S.boss : p.key, lin: S.lin, g: p.outG, grow: p.pts, affix: p.affix || null, x: p.x, y: p.y - 8 });
  const N = G.necro;
  const away = Math.atan2(p.y - N.y, p.x - N.x) + Math.PI + rng.range(-0.9, 0.9) + (turn || 0);   // あなたのいる側へ
  const dist = 30 + (u.size || 8);
  u.popMax = u.popT = S.legend ? 0.85 : 0.65;
  u.popX0 = p.x; u.popY0 = p.y - 8;
  u.popX1 = clamp(p.x + Math.cos(away) * dist, 24, MAP - 24); u.popY1 = clamp(p.y + Math.sin(away) * dist * 0.8 + 4, 24, MAP - 24);
  u.popH = S.legend ? 56 : 40;
  u.face = u.popX1 >= p.x ? 1 : -1;
  return u;
}

function completePot(p) {
  p.dead = true;
  const S = SYNTH[p.key];
  popFromPot(p, 0);
  // 双子の窯：もう1体できる（堕ちたボス・伝承の死霊は1体だけ）
  // 軍勢が上限のときは、いちばん格の低い普通の死者を1体、窯が取り込んで枠を空ける（合成体の方がずっと強いので）
  let twin = false;
  if (G.mods.twin > 0 && !S.unique && !S.legend && rng() < G.mods.twin) {
    if (armyRoom() <= 0) {
      let weak = null;
      for (const a of G.units) if (a.team === ALLY && !a.dead && isOrdinary(a) && !a.mid && !(a.popT > 0) && (!weak || a.g < weak.g)) weak = a;
      if (weak) {
        weak.dead = true;
        for (let i = 0; i < 6; i++) spawnFx(weak.x + rng.range(-4, 4), weak.y - rng.range(0, 8), (p.x - weak.x) * 1.5, (p.y - weak.y) * 1.5, 0.5, 'px', rgba32(130, 255, 170, 230), true);
      }
    }
    if (armyRoom() > 0) {
      popFromPot(p, rng() < 0.5 ? 1.4 : -1.4);
      twin = true; G.stats.twins = (G.stats.twins || 0) + 1;
    }
  }
  // 窯がはじける：煮汁と蒸気が噴き上がる
  for (let i = 0; i < 22; i++) spawnFx(p.x + rng.range(-6, 6), p.y - 12, rng.range(-55, 55), -rng.range(60, 150), 0.7, 'px2', i % 3 ? rgba32(110, 240, 150, 240) : rgba32(230, 255, 235, 230), true, 260);
  for (let i = 0; i < 8; i++) spawnFx(p.x + rng.range(-8, 8), p.y - 14, rng.range(-12, 12), -rng.range(20, 45), 1.0, 'px2', rgba32(200, 230, 210, 140), false);
  const first = !META.recipes[p.key];
  const akey = p.affix ? S.body + '|' + p.affix : null;
  const firstAffix = akey && !META.affixes[akey];
  G.discovered['syn_' + p.key] = true;
  META.recipes[p.key] = true;
  if (akey) META.affixes[akey] = true;
  G.stats.synths++;
  ringFx(p.x, p.y, 26, rgba32(120, 255, 170, 255));
  sfx('potDone');
  if (S.legend) {
    // 伝承の死霊は特別な現れ方をする
    for (let i = 0; i < 26; i++) { const a = i / 26 * TAU; spawnFx(p.x + Math.cos(a) * 6, p.y - 8 + Math.sin(a) * 4, Math.cos(a) * 70, Math.sin(a) * 50 - 30, 0.8, 'px2', i % 2 ? rgba32(...LEGENDS[S.legend].fx, 255) : rgba32(255, 255, 255, 230), true); }
    ringFx(p.x, p.y, 60, rgba32(...LEGENDS[S.legend].fx, 255));
    G.shake = Math.max(G.shake, 4);
    sfx('boss');
    banner((first ? '伝承の死霊、目覚める：' : '伝承の死霊：') + synthFullName(p.key, p.affix), LEGENDS[S.legend].feat + '　★' + S.rank + '　Lv ' + p.outG, 'legend');
  } else banner((first ? '新種：' : firstAffix ? '新たな亜種：' : twin ? '双子の窯：' : '合成完了：') + synthFullName(p.key, p.affix) + (twin ? ' ×2' : ''), '★' + S.rank + '　Lv ' + p.outG, 'ally');
}

// 窯から飛び出した合成体が着地したとき
function landFromPot(u) {
  u.x = u.popX1; u.y = u.popY1;
  raiseFx(u.x, u.y, true);
  ringFx(u.x, u.y, 18 + (u.size || 8), rgba32(120, 255, 170, 255));
  for (let i = 0; i < 10; i++) spawnFx(u.x + rng.range(-10, 10), u.y, rng.range(-40, 40), -rng.range(5, 25), 0.45, 'px2', rgba32(150, 140, 120, 200), false);
  G.shake = Math.max(G.shake, SYNTH[u.synKey] && SYNTH[u.synKey].legend ? 4 : 2);
  sfx('raise');
}

function updatePots(dt) {
  const N = G.necro;
  for (const s of G.sites) s.anim += dt;
  for (const p of G.pots) {
    if (p.dead) continue;
    p.anim += dt;
    if (p.flash > 0) p.flash -= dt;
    if (p.attackerT > 0) { p.attackerT -= dt; if (p.attackerT <= 0) p.attacker = null; }
    const tt = simmerTime(p.outG, N.lv, p.nSub, p.rank);
    p.prog += dt / tt;
    p.remain = Math.max(0, (1 - p.prog) * tt);
    if (rng() < 0.3) spawnFx(p.x + rng.range(-8, 8), p.y - 16, rng.range(-4, 4), -rng.range(10, 25), 0.8, 'px', rgba32(110, 240, 150, 200), true);
    // 生きた窯
    if (G.evos.livingpot) {
      p.shotT -= dt;
      if (p.shotT <= 0) {
        p.shotT = 0.7;
        const e = findNearestEnemyOf({ x: p.x, y: p.y, team: ALLY }, 120);
        if (e) {
          const dmg = 4 + N.lv * 0.9;
          const dx = e.x - p.x, dy = e.y - 5 - (p.y - 16), d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          G.projs.push({ x: p.x, y: p.y - 16, vx: dx / d * 140, vy: dy / d * 140, spd: 140, team: ALLY, dmg, kind: 'orbGreen', tgt: e, life: 1.5, homing: true, src: null });
        }
        G.tgrid[ALLY].query(p.x, p.y, 60, (a) => { if (a.team === ALLY && !a.dead) a.hp = Math.min(a.mhp, a.hp + a.mhp * 0.02); });
      }
    }
    if (p.prog >= 1) completePot(p);
  }
  compact(G.pots, notDead);
}

// ---- おまかせ ----
// サブに使ってよい死者（合成体・ボス・中ボスは除く。位が銀以下）
function subCandidates(mains) {
  return G.units.filter((u) => u.team === ALLY && !u.dead && mains.indexOf(u) < 0 && u.kind !== 'syn' && !u.isBoss && !u.mid && unitRank(u) <= 2);
}
// サブに入れられる数の上限（レベルで増える）。序盤から大量に入れて格違いの合成体を作れないように
function subCapPlus() { return G.mods && G.mods.subPlus || 0; }   // 精鋭の道
function subCap(lv) { if (lv == null) lv = G.necro.lv; return 2 + Math.floor(lv * 0.4) + subCapPlus(); }
// 上限が n 体になるレベル
function subCapLv(n) { return Math.max(1, Math.ceil((n - 2 - subCapPlus()) / 0.4)); }
function subTakeCount(n) { return Math.min(n, subCap(), Math.max(6, Math.min(Math.ceil(n * 0.5), Math.round(8 + G.necro.lv * 0.4)))); }

// サブの選び方（押すたびに次の選び方へ）
const SUB_PLANS = [
  { key: 'bal', name: 'バランス' },
  { key: 'hp', name: '体力重視', stat: 'hp' },
  { key: 'atk', name: '攻撃重視', stat: 'atk' },
  { key: 'spd', name: '素早さ重視', stat: 'spd' },
  { key: 'as', name: '手数重視', stat: 'as' },
  { key: 'size', name: '体格重視', stat: 'size' },
  { key: 'g', name: 'Lv重視' },
];
function subPlanList(mains) {
  const pool = subCandidates(mains);
  if (!pool.length) return [];
  const take = subTakeCount(pool.length);
  const plans = [];
  const baseG = mains.length === 2 ? Math.max(1, Math.round(Math.max(mains[0].g, mains[1].g) * 0.8 + Math.min(mains[0].g, mains[1].g) * 0.45)) : 5;
  const val = (u, st) => (subGrowth(u)[st] || 0) * clamp(u.g / baseG, 0.3, 2);
  for (const P of SUB_PLANS) {
    let list;
    if (P.key === 'bal') list = pool.filter((u) => unitRank(u) <= 1).sort((a, b) => a.g - b.g).slice(0, take);
    else if (P.key === 'g') list = pool.slice().sort((a, b) => materialValue(b) - materialValue(a)).slice(0, take);
    else {
      list = pool.filter((u) => val(u, P.stat) > 0).sort((a, b) => val(b, P.stat) - val(a, P.stat)).slice(0, take);
      if (list.length < 3) continue;
    }
    if (list.length) plans.push({ name: P.name, subs: list });
  }
  // 亜種を狙う選び方：同じ種類を半分以上にする
  const byType = {};
  for (const u of pool) { const k = affixOfUnitType(u); if (k) (byType[k] = byType[k] || []).push(u); }
  for (const k in byType) {
    const l = byType[k];
    if (l.length < 3) continue;
    if (take < 3) continue;   // 亜種は同じ種類3体から（上限が3体になるまでは狙えない）
    const main = l.slice().sort((a, b) => b.g - a.g).slice(0, take);
    const others = pool.filter((u) => main.indexOf(u) < 0 && unitRank(u) <= 1).sort((a, b) => a.g - b.g).slice(0, Math.max(0, Math.min(main.length - 1, take - main.length)));
    plans.push({ name: '亜種〈' + AFFIXES[k].name + '〉狙い', subs: main.concat(others), affix: k });
  }
  return plans;
}

// サブの選び方を「並び順＋標準の体数」で返す（スライダーで量だけ決めるため。subPlanList と同じ考え方）
function subPlanOrdered(mains) {
  const pool = subCandidates(mains);
  if (!pool.length) return [];
  const take = subTakeCount(pool.length);
  const out = [];
  const baseG = mains.length === 2 ? Math.max(1, Math.round(Math.max(mains[0].g, mains[1].g) * 0.8 + Math.min(mains[0].g, mains[1].g) * 0.45)) : 5;
  const val = (u, st) => (subGrowth(u)[st] || 0) * clamp(u.g / baseG, 0.3, 2);
  for (const P of SUB_PLANS) {
    let list, def;
    if (P.key === 'bal') { list = pool.filter((u) => unitRank(u) <= 1).sort((a, b) => a.g - b.g); def = take; }
    else if (P.key === 'g') { list = pool.slice().sort((a, b) => materialValue(b) - materialValue(a)); def = take; }
    else { list = pool.filter((u) => val(u, P.stat) > 0).sort((a, b) => val(b, P.stat) - val(a, P.stat)); def = take; if (list.length < 3) continue; }
    if (!list.length) continue;
    out.push({ key: P.key, name: P.name, list, def: Math.min(def, list.length) });
  }
  const byType = {};
  for (const u of pool) { const k = affixOfUnitType(u); if (k) (byType[k] = byType[k] || []).push(u); }
  for (const k in byType) {
    const l = byType[k];
    if (l.length < 3) continue;
    const main = l.slice().sort((a, b) => b.g - a.g);
    const others = pool.filter((u) => main.indexOf(u) < 0 && unitRank(u) <= 1).sort((a, b) => a.g - b.g);
    // 先頭から取るほど亜種の条件（半分以上）を保ちやすい順：同じ種類と他を2:1で交互に
    const list = [];
    let i = 0, j = 0;
    while (i < main.length || j < others.length) {
      if (i < main.length) list.push(main[i++]);
      if (i < main.length) list.push(main[i++]);
      if (j < others.length) list.push(others[j++]);
    }
    if (take < 3) continue;
    const mN = Math.min(main.length, take);
    out.push({ key: 'afx:' + k, name: '亜種〈' + AFFIXES[k].name + '〉狙い', list, def: Math.min(list.length, mN + Math.max(0, Math.min(mN - 1, take - mN))), affix: k });
  }
  return out;
}

// 合成の強さの目安（体力 × 秒間の攻撃 の平方根）
function synthPower(r) { return Math.sqrt(Math.max(1, r.stats.hp) * Math.max(0.1, r.stats.atk / r.stats.cd)); }

// 窯のおすすめ：主もサブも決まった完成形の合成案を、性格の違うものから最大3つ
//  新種を狙う ／ いちばん強い ／ 亜種を狙う（なければ格を上げる）
function potSuggestions(groups) {
  groups = groups || armyGroups();
  const craft = craftableBodies(groups);
  const out = [];
  const usedBody = new Set();
  const make = (k, planPick) => {
    const mains = [k.a, k.b];
    const plans = subPlanList(mains);
    const plan = planPick ? planPick(plans) : plans[0];
    const subs = plan ? plan.subs : [];
    const r = synthPreview(mains, subs);
    return r ? { mains, subs, plan: plan ? plan.name : 'なし', r, power: synthPower(r) } : null;
  };
  const push = (s, kind, label, why) => {
    if (!s) return false;
    s.kind = kind; s.label = label; s.why = why;
    out.push(s); usedBody.add(SYNTH[s.r.key].body);
    return true;
  };
  const bal = (plans) => plans.find((p) => p.name === 'バランス') || plans[0];
  // 強さの順に並べた候補（体ごとに一番★の高い組み合わせ）
  // 強さは「バランス」と「格重視」の強いほうで比べる
  const strong = [];
  for (const e of craft.values()) {
    const a = make(e.best, bal), b = make(e.best, (plans) => plans.find((p) => p.name.startsWith('Lv重視')));
    const s = a && b ? (b.power > a.power * 1.05 ? b : a) : a || b;
    if (s) strong.push(s);
  }
  strong.sort((a, b) => b.power - a.power);
  const topBody = strong.length ? SYNTH[strong[0].r.key].body : null;
  // 1. 新種
  let fresh = null;
  for (const e of craft.values()) if (e.fresh && (!fresh || e.fresh.rank > fresh.rank || (e.fresh.rank === fresh.rank && e.fresh.baseG > fresh.baseG))) fresh = e.fresh;
  if (fresh) {
    const s = make(fresh, bal);
    const best = s && SYNTH[s.r.key].body === topBody;
    push(s, 'new', best ? '新種・いちばん強い' : '新種を狙う', best ? 'まだ見たことのない種で、今の兵で作れる中で最も強い' : 'まだ見たことのない種ができる');
  }
  // 2. いちばん強い（新種のカードがすでに最強なら、次に強いもの）
  const st = strong.find((s) => !usedBody.has(SYNTH[s.r.key].body));
  const topTaken = usedBody.has(topBody);
  if (st) push(st, 'power', topTaken ? '次に強い' : 'いちばん強い', topTaken ? '新種を除くと、今の兵で作れる中で最も強い' : '今の兵で作れる中で最も強い');
  // 3. 亜種を狙う：強い順に見て、まだ見ていない亜種になるもの → 何でも亜種になるもの
  let afx = null;
  for (const pass of [0, 1]) {
    for (const s0 of strong) {
      const body = SYNTH[s0.r.key].body;
      if (usedBody.has(body)) continue;
      const plans = subPlanList(s0.mains).filter((p) => p.affix);
      for (const p of plans) {
        if (pass === 0 && META.affixes[body + '|' + p.affix]) continue;
        const s = make({ a: s0.mains[0], b: s0.mains[1] }, () => p);
        if (s && s.r.affix === p.affix) { afx = s; break; }
      }
      if (afx) break;
    }
    if (afx) break;
  }
  if (afx) push(afx, 'affix', '亜種を狙う', AFFIXES[afx.r.affix].feat);
  // 足りなければ：格を上げる（格の高いサブ）→ 次に強いもの
  if (out.length < 3) {
    const s0 = strong.find((s) => !usedBody.has(SYNTH[s.r.key].body)) || strong[0];
    if (s0) {
      const s = make({ a: s0.mains[0], b: s0.mains[1] }, (plans) => plans.find((p) => p.name.startsWith('Lv重視')));
      if (s && !out.some((o) => o.r.key === s.r.key && o.subs.length === s.subs.length)) push(s, 'grade', 'Lvを上げる', 'Lvの高い死者をサブに入れてLvを上げる');
    }
  }
  for (const s of strong) {
    if (out.length >= 3) break;
    if (!usedBody.has(SYNTH[s.r.key].body)) push(s, 'alt', '別の候補', '強さで次点の組み合わせ');
  }
  return out;
}

// 自動プレイ・旧おまかせ用：主の第一候補＋バランスのサブ
function autoSynthPick() {
  const all = G.units.filter((u) => u.team === ALLY && !u.dead);
  if (all.length < 2) return null;
  const syns = all.filter((u) => u.kind === 'syn');
  const norm = all.filter((u) => u.kind !== 'syn');
  let mains = null;
  if (syns.length >= 4 + Math.floor(G.necro.lv / 5) || (syns.length >= 2 && norm.length < 4)) {
    let best = -1e9;
    for (let i = 0; i < syns.length; i++) for (let j = i + 1; j < syns.length; j++) {
      const a = syns[i], b = syns[j], ra = unitSpRank(a), rb = unitSpRank(b);
      if (ra !== rb || resultRank(ra, rb) <= ra) continue;
      const sc = -ra * 1000 + a.g + b.g;
      if (sc > best) { best = sc; mains = [a, b]; }
    }
  }
  if (!mains && norm.length >= 2) {
    norm.sort((a, b) => (b.isBoss - a.isBoss) || (b.mid ? 1 : 0) - (a.mid ? 1 : 0) || b.g - a.g);
    mains = [norm[0], norm[1]];
  }
  if (!mains) { all.sort((a, b) => b.g - a.g); mains = [all[0], all[1]]; }
  const subs = norm.filter((u) => mains.indexOf(u) < 0 && !u.isBoss && !u.mid && unitRank(u) <= 1);
  subs.sort((x, y) => x.g - y.g);
  return { mains, subs: subs.slice(0, subTakeCount(subs.length)) };
}

// メニュー用：軍勢を種類と格ごとにまとめる
function armyGroups() {
  const map = new Map();
  for (const u of G.units) {
    if (u.dead || u.team !== ALLY) continue;
    // 合成体は1体ずつ（能力の伸びが個体ごとに違うため）
    const key = u.kind === 'syn' || u.isBoss || u.mid ? 's:' + u.id : 'h:' + u.type + ':' + u.form + ':' + u.lin;
    let g = map.get(key);
    if (!g) {
      const title = unitTitle(u);
      const form = u.kind === 'syn' ? '' : FORMS[u.form].name;
      g = { key, name: unitDisplayName(u), title, form, spr: u.spr, scale: u.scale, list: [], col: unitCol(u), lin: u.lin, isBoss: u.isBoss,
        syn: u.kind === 'syn', mid: !!u.mid, rank: unitSpRank(u), grow: subGrowth(u), affix: u.affix || null, subAffix: affixOfUnitType(u) };
      map.set(key, g);
    }
    g.list.push(u);
  }
  const arr = [...map.values()];
  for (const g of arr) g.list.sort((a, b) => b.g - a.g);
  arr.sort((a, b) => (b.rank - a.rank) || (b.syn - a.syn) || b.list[0].g - a.list[0].g || b.list.length - a.list.length);
  return arr;
}

// ---------- 術式（レベルアップ） ----------
const MAX_SKILL_SLOTS = 5, MAX_SUB_SLOTS = 3;
const EVO_NEED = 5;   // 秘術：2つの術式をともに Lv5 以上にすると出る

// 術式の実効Lv（効き目）。recomputeMods で G.eff に入る
function sk(k) { return G.eff ? (G.eff[k] || 0) : 0; }
// 道のLv合計と位階
function pathPts(cat, skills) {
  skills = skills || G.skills;
  let n = charPathBonus(cat);   // ネクロマンサーの得意な道は、最初から Lv計が上乗せされる
  for (const k in skills) if (SKILLS[k] && SKILLS[k].cat === cat) n += skills[k];
  return n;
}
function pathTierOf(cat, pts) {
  const P = PATHS[cat];
  let t = 0;
  while (t < 3 && pts >= P.pts[t]) t++;
  return t;
}
function pathTier(cat) { return G.pathT ? G.pathT[cat] || 0 : 0; }

function ownedCount(sub) {
  let n = 0;
  for (const k in G.skills) if ((SKILLS[k].cat === 'sub') === sub) n++;
  return n;
}

function evoReady(key) {
  const e = EVOS[key];
  if (G.evos[key]) return false;
  return e.req.every((r) => (G.skills[r] || 0) >= EVO_NEED);
}

// 選択肢を作る（3つ）
function rollChoices() {
  const out = [];
  // 秘術は最優先で1枠
  const evo = Object.keys(EVOS).filter(evoReady);
  if (evo.length) out.push({ type: 'evo', key: rng.pick(evo) });
  const skillFull = ownedCount(false) >= MAX_SKILL_SLOTS;
  const subFull = ownedCount(true) >= MAX_SUB_SLOTS;
  const pool = [];
  for (const k in SKILLS) {
    const s = SKILLS[k];
    const lv = G.skills[k] || 0;
    if (lv >= s.max) continue;
    if (!lv && !skillOpen(k)) continue;
    const isSub = s.cat === 'sub';
    if (!lv && ((isSub && subFull) || (!isSub && skillFull))) continue;
    let w = isSub ? 0.7 : 1;
    if (lv > 0) w *= 3;                                   // 持っている術式ほど出やすい（選んだものを伸ばせる）
    else if (!isSub && pathPts(s.cat) > 0) w *= 1.5;      // 歩んでいる道の術式も出やすい
    if (!isSub && CHARS[G.char] && CHARS[G.char].path === s.cat) w *= CHAR_PATH_BONUS.weight;   // ネクロマンサーの得意な道
    pool.push({ k, w, own: lv > 0 });
  }
  const take = (list) => {
    let sum = 0;
    for (const p of list) sum += p.w;
    let r = rng() * sum, idx = 0;
    for (; idx < list.length; idx++) { r -= list[idx].w; if (r <= 0) break; }
    return list[Math.min(idx, list.length - 1)];
  };
  while (out.length < 3 && pool.length) {
    const p = take(pool);
    out.push({ type: 'skill', key: p.k });
    pool.splice(pool.indexOf(p), 1);
  }
  // 伸ばせる術式があるなら、少なくとも1枚は持っている術式の強化にする
  if (!out.some((c) => c.type === 'skill' && G.skills[c.key])) {
    const owned = pool.filter((p) => p.own);
    if (owned.length) {
      let i = out.length - 1;
      while (i >= 0 && (out[i].type !== 'skill')) i--;
      if (i >= 0) out[i] = { type: 'skill', key: take(owned).k };
    }
  }
  if (out.length === 0) out.push({ type: 'heal' }, { type: 'gold' });
  return out;
}

// 統率力は魂の祭壇の恒久強化になった（レベルアップの候補には出ない）

function applyChoice(c) {
  if (c.type === 'skill') G.skills[c.key] = (G.skills[c.key] || 0) + 1;
  else if (c.type === 'evo') G.evos[c.key] = true;
  else if (c.type === 'heal') G.necro.hp = G.necro.mhp;
  else if (c.type === 'gold') G.bonusCrystal = (G.bonusCrystal || 0) + 10;
  recomputeMods();
  sfx('pick');
}

function choiceInfo(c) {
  if (c.type === 'skill') {
    const s = SKILLS[c.key];
    const lv = G.skills[c.key] || 0;
    const info = { name: s.name, cat: s.cat, lv: lv + 1, max: s.max, desc: s.desc(skillEff(c.key, lv + 1)), isNew: lv === 0 };
    if (lv > 0) info.from = s.desc(skillEff(c.key, lv));
    if (lv + 1 === s.max && s.cat !== 'sub') info.master = true;
    // 道の位階が上がるか
    if (PATHS[s.cat]) {
      const P = PATHS[s.cat], pts = pathPts(s.cat), t0 = pathTierOf(s.cat, pts), t1 = pathTierOf(s.cat, pts + 1);
      info.path = { cat: s.cat, name: P.name, pts: pts + 1, next: P.pts[Math.min(2, t1)], tier: t1, up: t1 > t0 ? P.tiers[t1 - 1] : null, maxed: t1 >= 3 };
    }
    return info;
  }
  if (c.type === 'evo') {
    const e = EVOS[c.key];
    return { name: e.name, cat: 'evo', lv: 1, max: 1, desc: e.desc, isNew: true, req: e.req.map((r) => SKILLS[r].name).join(' ＋ ') };
  }
  if (c.type === 'heal') return { name: '命の灯', cat: 'sub', lv: 1, max: 1, desc: '体力を全回復する', isNew: false };
  return { name: '魂の結晶', cat: 'sub', lv: 1, max: 1, desc: '魂の結晶 +10', isNew: false };
}

// ==== 12_meta.js ====
// ---------- 周回データ（保存） ----------
const SAVE_KEY = 'necro_march_save_v1';
const META = {
  crystals: 0, up: {}, recipes: {}, affixes: {}, foes: {}, seen: {}, raisedBoss: {}, killedBoss: {},
  stats: { raisedTotal: 0, raisedSkeleton: 0, synthCount: 0, reraised: 0, bestTime: 0, clears: 0, runs: 0, totalKills: 0, bossKills: 0, bossRaised: 0 },
  skillsOpen: {},
  chars: { gravekeeper: true }, stages: { field: true },
  settings: { sound: true, shake: true, music: true }, keys: {}, tutorial: false, lastChar: 'gravekeeper', lastStage: 'field',
};

function loadMeta() {
  const s = safeStorageGet(SAVE_KEY);
  if (!s) return;
  try {
    const d = JSON.parse(s);
    for (const k in d) {
      if (META[k] && typeof META[k] === 'object' && !Array.isArray(META[k])) Object.assign(META[k], d[k]);
      else META[k] = d[k];
    }
  } catch (e) { /* 壊れた保存データは無視 */ }
  // なくした恒久強化「墓所の加護」（開始地点の死体）に使った結晶は返す
  if (META.up && META.up.crypt) {
    let back = 0;
    for (let i = 0; i < META.up.crypt; i++) back += UPGRADE_COST[i] || 0;
    META.crystals += back;
    delete META.up.crypt;
    META.refunded = (META.refunded || 0) + back;
    saveMeta();
  }
}
function skillOpen(k) { return !SKILL_UNLOCKS[k] || !!META.skillsOpen[k]; }
// デモ中は記録しない（終了時にデモ前の状態へ戻す）
function saveMeta() { if (G && G.demo) return; safeStorageSet(SAVE_KEY, JSON.stringify(META)); }

// ランの結果を反映し、獲得した結晶と新たな解放を返す
function settleRun() {
  const st = G.stats;
  const time = Math.floor(G.t);
  let cry = Math.floor(time / 10) + Math.floor(st.kills / 25) + st.bossKills * 25 + (G.victory ? 100 : 0) + (G.bonusCrystal || 0);
  if (G.stage === 'holy') cry = Math.round(cry * 1.3);
  META.crystals += cry;
  const ms = META.stats;
  ms.raisedTotal = (ms.raisedTotal || 0) + st.raised;
  ms.raisedSkeleton += st.raisedSkeleton;
  ms.synthCount += st.synths;
  ms.reraised += st.reraised;
  ms.totalKills += st.kills;
  ms.bossKills = (ms.bossKills || 0) + st.bossKills;
  ms.bossRaised = (ms.bossRaised || 0) + st.bossesRaised;
  ms.bestTime = Math.max(ms.bestTime, time);
  ms.runs++;
  if (G.victory) ms.clears++;
  for (const k in G.seenEnemies) META.seen[k] = true;
  for (const k in G.discovered) {
    if (k.startsWith('boss_')) META.raisedBoss[k.slice(5)] = true;
    if (k.startsWith('bossKill_')) META.killedBoss[k.slice(9)] = true;
  }
  const unlocks = [];
  for (const ck in CHARS) {
    const c = CHARS[ck];
    if (META.chars[ck] || !c.unlock) continue;
    if ((ms[c.unlock.stat] || 0) >= c.unlock.n) { META.chars[ck] = true; unlocks.push({ kind: 'char', key: ck }); }
  }
  for (const k in SKILL_UNLOCKS) {
    const u = SKILL_UNLOCKS[k];
    if (META.skillsOpen[k]) continue;
    if (unlockValue(u) >= u.n) { META.skillsOpen[k] = true; unlocks.push({ kind: 'skill', key: k }); }
  }
  for (const sk in STAGES) {
    const s = STAGES[sk];
    if (META.stages[sk] || !s.unlock) continue;
    if (G.victory && G.stage === s.unlock) { META.stages[sk] = true; unlocks.push({ kind: 'stage', key: sk }); }
  }
  // この出撃中に解放された新しい敵（次の出撃から現れる）
  for (const k of G.newFoes || []) unlocks.push({ kind: 'foe', key: k });
  saveMeta();
  return { cry, unlocks };
}

// ==== 13_game.js ====
// ---------- ゲーム進行・描画 ----------

function startRun(stageKey, charKey) {
  let seed = Date.now() & 0x7fffffff;
  rng = makeRng(seed ^ 0x5bd1e995);
  G = newGameState(stageKey, charKey);
  perfReset();
  G.seed = seed;
  G.necro = newNecro(charKey);
  snapshotFoes();
  for (const s of CHARS[charKey].start) G.skills[s] = 1;
  recomputeMods();
  G.necro.hp = G.necro.mhp;
  G.allyCaptains = []; G.lichs = []; G.altars = [];
  generateWorld();
  META.lastChar = charKey; META.lastStage = stageKey;
  saveMeta();
  G.state = 'play';
  UI.enterGame();
  banner(STAGES[stageKey].name, '止まると、円の中の死体が蘇る', 'info');
}

// ---- 出現 ----
const SPAWN_MUL = 0.68;
function spawnRate() {
  const m = G.t / 60;
  // 序盤は上乗せして、始まってすぐから敵が途切れずに来るように（2〜3分で元の量に溶け込む）
  let r = (0.35 + 0.55 * m + 0.006 * m * m + 0.3 * Math.exp(-m / 1.5)) * SPAWN_MUL;
  if (G.endless) r *= 1.15;
  if (G.rush) r *= 2;
  r *= 1 + 0.45 * surgeLevel(G.t);
  r *= 1 + (TU.foe_rate_late - 1) * clamp((G.t - 600) / 300, 0, 1);   // 10分以降の数（v43 で 15分に 0.85 倍まで減らした）
  return r * STAGES[G.stage].spawnMul;
}
function spawnWeights() {
  const m = G.t / 60;
  const table = STAGES[G.stage].spawnTable || SPAWN_TABLE;
  let row = table[0];
  for (const r of table) if (m >= r.t) row = r;
  // 解放済みの新しい敵を、それぞれの時間から混ぜる
  let w = row.w;
  for (const U of FOE_UNLOCKS) for (const k of U.keys) {
    if (!G.foes[k] || m < U.from[k]) continue;
    if (w === row.w) w = Object.assign({}, row.w);
    w[k] = U.w[k] * (m >= U.from[k] + 3 ? 1.2 : 1);
  }
  return w;
}
// 出撃の始めに解放済みの敵を確定（途中で解放されても、その出撃では増えない）
function snapshotFoes() { G.foes = {}; for (const U of FOE_UNLOCKS) for (const k of U.keys) if (foeUnlocked(k)) G.foes[k] = true; }
// 解放の条件を満たしたら記録して知らせる
function unlockFoes(cond) {
  for (const U of FOE_UNLOCKS) {
    if (U.cond !== cond) continue;
    const fresh = U.keys.filter((k) => !foeUnlocked(k));
    if (!fresh.length) continue;
    META.foes = META.foes || {};
    for (const k of fresh) META.foes[k] = true;
    saveMeta();
    (G.newFoes = G.newFoes || []).push(...fresh);
    banner('新たな敵が討伐隊に加わる', fresh.map((k) => ETYPES[k].name).join('・') + '（次の出撃から現れる）', 'win');
  }
}
function spawnPoint(minExtra, edge) {
  const N = G.necro;
  const rad = Math.sqrt(R.W * R.W + R.H * R.H) / 2 + (minExtra || 22);
  const m = minExtra || 22;
  for (let i = 0; i < 6; i++) {
    const a = rng() * TAU;
    // edge：画面の縁のすぐ外から現れる（序盤の先遣隊。縦長の画面で、横から来る敵が遠くから延々と歩いてこないように）
    const c = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a));
    const d = edge ? Math.min(c > 1e-3 ? (R.W / 2) / c : 1e9, sn > 1e-3 ? (R.H / 2) / sn : 1e9) + m : rad;
    const x = clamp(N.x + Math.cos(a) * d, 30, MAP - 30), y = clamp(N.y + Math.sin(a) * d, 30, MAP - 30);
    if (Math.abs(x - N.x) > R.W / 2 + 8 || Math.abs(y - N.y) > R.H / 2 + 8) return [x, y];
  }
  const a = rng() * TAU;
  return [clamp(N.x + Math.cos(a) * rad, 30, MAP - 30), clamp(N.y + Math.sin(a) * rad, 30, MAP - 30)];
}

// 序盤の先遣隊：始まってすぐ、数体の群れが画面の外から寄ってくる（最初の「待ち」をなくす）
const PATROL_T = [2, 11, 21, 32, 44];
const PATROL_N = [3, 3, 4, 4, 5];
function spawnPatrol(n) {
  const [x, y] = spawnPoint(16, true);
  const w = STAGES[G.stage].patrol || { militia: 80, soldier: 20 };
  for (let i = 0; i < n; i++) { spawnEnemy(rng.weighted(w), x + rng.range(-16, 16), y + rng.range(-14, 14), false); enemyCount++; }
}

let enemyCount = 0;
function updateSpawner(dt) {
  const MAXE = G.rush ? 260 : 220;
  // 検証で敵を止めているとき（spawnAcc を大きく負にしている）は先遣隊も出さない
  if (G.spawnAcc > -1e6 && !G.rush) {
    G.patrolI = G.patrolI || 0;
    while (G.patrolI < PATROL_T.length && G.t >= PATROL_T[G.patrolI]) { spawnPatrol(PATROL_N[G.patrolI]); G.patrolI++; }
  }
  G.spawnAcc += spawnRate() * dt;
  const W = G.rush ? rushWeights() : null;
  while (G.spawnAcc >= 1) {
    G.spawnAcc -= 1;
    if (enemyCount >= MAXE) continue;
    const type = rng.weighted(W || spawnWeights());
    const [x, y] = spawnPoint();
    const elite = rng() < 0.025 + 0.003 * G.t / 60;
    spawnEnemy(type, x, y, elite);
    enemyCount++;
    // ときどき小さな群れで来る（序盤は多めに）
    if (rng() < 0.06 + 0.012 * G.t / 60 + 0.12 * Math.exp(-G.t / 90)) {
      const n = rng.int(2, G.t < 120 ? 3 : 4);
      for (let i = 0; i < n && enemyCount < MAXE; i++) { spawnEnemy(type, x + rng.range(-14, 14), y + rng.range(-14, 14), false); enemyCount++; }
    }
  }
}

// 総攻撃（神を倒したあと）：出会ったことのある全種類の討伐隊が、ほぼ同じ割合で押し寄せる
function rushWeights() {
  const w = {};
  for (const k in ETYPES) {
    const U = FOE_UNLOCKS.find((x) => x.keys.indexOf(k) >= 0);
    if (U && !(G.foes && G.foes[k])) continue;
    w[k] = k === 'militia' ? 0.4 : k === 'cavalry' ? 0.5 : 1;
  }
  return w;
}

function siege() {
  const N = G.necro;
  const n = Math.min(60, Math.round((12 + G.t / 20) * STAGES[G.stage].spawnMul));
  const w = spawnWeights();
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const type = rng.weighted(w);
    spawnEnemy(type, clamp(N.x + Math.cos(a) * 175, 30, MAP - 30), clamp(N.y + Math.sin(a) * 140, 30, MAP - 30), false);
  }
  banner('包囲された', '討伐隊が四方から迫る', 'enemy');
  sfx('boss');
}

// ネクロマンサーから見た方向（画面の上下左右で言う）
function dirText(x, y) {
  const N = G.necro;
  const a = Math.atan2(y - N.y, x - N.x);
  const i = ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
  return ['→ 右', '↘ 右下', '↓ 下', '↙ 左下', '← 左', '↖ 左上', '↑ 上', '↗ 右上'][i];
}
function summonBoss(key) {
  const [x, y] = spawnPoint(30);
  const u = spawnBoss(key, x, y);
  const b = BOSSES[key];
  u.spawnT = G.t;
  if (!b.final) banner(b.name + ' 出現', dirText(x, y) + 'から接近 ― ' + b.desc, 'boss');
  sfx('boss');
  G.shake = 5;
  return u;
}

// 中ボス：2分から、1分半ほどおきに現れる（ボスの前後は避ける）
function summonMid() {
  const w = Object.assign({}, spawnWeights());
  if (G.t > 180) delete w.militia;
  for (const k in w) if (!MIDBOSS[k]) delete w[k];
  const type = rng.weighted(w);
  const [x, y] = spawnPoint(30);
  const u = spawnMid(type, x, y);
  u.spawnT = G.t;
  // 取り巻き
  for (let i = 0; i < 3; i++) spawnEnemy(type, x + rng.range(-16, 16), y + rng.range(-16, 16), false);
  banner('中ボス ' + MIDBOSS[type].name + ' 出現', dirText(x, y) + 'から接近', 'boss');
  sfx('boss');
  return u;
}

// 5分・10分のボスは、出撃の始めに決めておく
function bossPick(n) {
  G.bossPick = G.bossPick || {};
  if (!G.bossPick[n]) G.bossPick[n] = rng.pick(BOSS_POOL[n]);
  return G.bossPick[n];
}
// 上のカウントダウン：このゲームがあとどれくらいで終盤を迎えるかが分かるよう、最後の敵（勇者）の出現まで数える
function nextEvent() {
  if (!G.endless && !G.rush && !G.cleared) {
    if (!G.bossDone[3]) return { t: 900, name: BOSSES.hero.name, kind: 'boss' };
    if (G.godAt && !G.bossDone.god) return { t: G.godAt, name: '神', kind: 'boss' };
  }
  if (G.endless && G.nextEndlessBoss && G.nextEndlessBoss < 1e8) return { t: G.nextEndlessBoss, name: '次のボス', kind: 'boss' };
  return null;
}

function updateTimeline() {
  const t = G.t;
  bossPick(1); bossPick(2);
  if (G.nextMid == null) G.nextMid = 120;
  if (t >= G.nextMid) {
    const nearBoss = [300, 450, 600, 750, 900].some((bt) => Math.abs(t - bt) < 25);
    if (nearBoss || G.midAlive.length >= 2) G.nextMid = t + 15;
    else { summonMid(); G.nextMid = t + rng.range(75, 105) * (G.endless ? 0.8 : 1); }
  }
  for (const st of [150]) if (t >= st && !G.siegeDone[st]) { G.siegeDone[st] = true; siege(); }
  if (t >= 300 && !G.bossDone[1]) { G.bossDone[1] = true; summonBoss(bossPick(1)); }
  if (t >= 450 && !G.bossDone.giant) { G.bossDone.giant = true; summonBoss('giant'); }
  if (t >= 750 && !G.bossDone.dragon) { G.bossDone.dragon = true; summonBoss('dragon'); }
  if (t >= 600 && !G.bossDone[2]) { G.bossDone[2] = true; summonBoss(bossPick(2)); }
  if (t >= 900 && !G.bossDone[3]) { G.bossDone[3] = true; summonBoss('hero'); }
  // 勇者のあと：神が降りる
  if (G.godAt && t >= G.godAt && !G.bossDone.god) {
    G.bossDone.god = true;
    const g = summonBoss('god');
    banner('神 降臨', '倒して、その屍を死神にせよ', 'boss');
    G.shake = 10;
    for (let i = 0; i < 40; i++) spawnFx(g.x + rng.range(-30, 30), g.y - rng.range(0, 80), 0, rng.range(20, 80), 0.9, 'px2', rgba32(255, 240, 170, 255), true);
  }
  // 総攻撃：中ボスとボスも次々に
  if (G.rush) {
    if (t >= G.nextRushMid) { G.nextRushMid = t + 12; if (G.midAlive.length < 4) summonMid(); }
    if (t >= G.nextRushBoss) { G.nextRushBoss = t + 30; summonBoss(rng.pick(BOSS_POOL[1].concat(BOSS_POOL[2], ['giant']))); }
  }
  if (G.endless && t >= G.nextEndlessBoss) {
    G.nextEndlessBoss = t + 120;
    summonBoss(rng.pick(BOSS_POOL[1].concat(BOSS_POOL[2], ['giant', 'dragon'])));
    if (rng() < 0.6) siege();
  }
}

// 画面から遠く離れた敵は前方に移し替える
function relocateFar() {
  const N = G.necro;
  const lim = Math.max(R.W, R.H) * 1.25 + 120;
  for (const u of G.units) {
    if (u.dead || u.team !== ENEMY || u.isBoss || u.carry) continue;
    if (Math.abs(u.x - N.x) > lim || Math.abs(u.y - N.y) > lim) {
      const [x, y] = spawnPoint();
      u.x = x; u.y = y; u.tgt = null;
    }
  }
}

// ---- 1ステップ ----
function update(dt) {
  if (G.state !== 'play') return;
  const t0 = performance.now();
  G.t += dt;
  // グリッドの再構築
  G.tgrid[0].clear(); G.tgrid[1].clear(); G.sgrid.clear();
  enemyCount = 0;
  let allies = 0;
  for (const u of G.units) {
    if (u.dead) continue;
    G.tgrid[u.team].insert(u);
    if (u.air <= 0) G.sgrid.insert(u);
    if (u.team === ENEMY) enemyCount++; else allies++;
  }
  G.cgrid.clear();
  for (const c of G.corpses) if (!c.dead) G.cgrid.insert(c);
  G.allyCount = allies;
  G.stats.maxArmy = Math.max(G.stats.maxArmy, allies);

  updateNecro(dt);
  updateGodRitual(dt);
  updateUnits(dt);
  updateReapWave(dt);
  updateProjs(dt);
  updateTeles(dt);
  updateZones(dt);
  updatePots(dt);
  updateCorpses(dt);
  updateGraveyards(dt);
  updateFx(dt);
  updateFlyers(dt);
  if (!G.demo) { updateSpawner(dt); updateTimeline(); }
  updateAutoPot(dt);
  if (Math.floor(G.t * 2) !== Math.floor((G.t - dt) * 2)) relocateFar();
  compact(G.units, notDead);
  crumbleExcess(dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 12);
  if (G.ending > 0) { G.ending -= dt; if (G.ending <= 0) endRun(); }
  if (G.pendingLv > 0 && G.state === 'play' && !G.necro.dead) UI.openLevelUp();
  G.perf.upd = G.perf.upd * 0.95 + (performance.now() - t0) * 0.05;
}

// 端末を守るための安全弁：死者が極端に増えたら、最も格の低い者から崩れていく
const ARMY_SOFT_LIMIT = 650;
function crumbleExcess(dt) {
  const n = G.allyCount || 0;
  if (n <= ARMY_SOFT_LIMIT) { G.crumbleAcc = 0; return; }
  G.crumbleAcc = (G.crumbleAcc || 0) + dt * (2 + (n - ARMY_SOFT_LIMIT) * 0.05);
  if (G.crumbleAcc < 1) return;
  let weakest = null;
  for (const u of G.units) {
    if (u.dead || u.team !== ALLY || u.kind === 'syn' || u.isBoss) continue;
    if (!weakest || u.g < weakest.g || (u.g === weakest.g && FORMS[u.form].col > FORMS[weakest.form].col)) weakest = u;
  }
  while (G.crumbleAcc >= 1 && weakest) {
    G.crumbleAcc -= 1;
    weakest.dead = true;
    fadeFx(weakest);
    weakest = null;
    for (const u of G.units) {
      if (u.dead || u.team !== ALLY || u.kind === 'syn' || u.isBoss) continue;
      if (!weakest || u.g < weakest.g) weakest = u;
    }
  }
}

// 地面のタイルの種類は位置だけで決まるので、一度計算して覚えておく（毎フレームの計算を省く）
// 範囲：マップの外側 GROUND_PAD タイルまで
const GROUND_PAD = 24;
let groundCache = null;
function groundTile(tx, ty) {
  const reg = hash2(tx >> 2, ty >> 2, 7);
  const h = hash2(tx, ty, 3);
  return reg < 0.18 ? 5 + Math.floor(h * 3) : Math.floor(h * 5);
}
function groundTiles() {
  if (groundCache) return groundCache;
  const n = MAP / 16 + GROUND_PAD * 2;
  const a = new Uint8Array(n * n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) a[y * n + x] = groundTile(x - GROUND_PAD, y - GROUND_PAD);
  groundCache = { n, a };
  return groundCache;
}
function drawGround() {
  const ts = 16;
  const tx0 = Math.floor(R.camX / ts), ty0 = Math.floor(R.camY / ts);
  const tx1 = Math.floor((R.camX + R.W) / ts), ty1 = Math.floor((R.camY + R.H) / ts);
  const sk = G ? G.stage : 'field';
  const gc = groundTiles();
  // 絵の場所（ステージごとに8種）も先に引いておく
  const frs = [];
  for (let v = 0; v < 8; v++) frs.push(SPR['tile_' + sk + v].frames[0]);
  const dark = rgba32(90, 90, 100, 255);
  for (let ty = ty0; ty <= ty1; ty++) {
    const gy = ty + GROUND_PAD;
    for (let tx = tx0; tx <= tx1; tx++) {
      const gx = tx + GROUND_PAD;
      const v = gx >= 0 && gy >= 0 && gx < gc.n && gy < gc.n ? gc.a[gy * gc.n + gx] : groundTile(tx, ty);
      const outside = tx * ts < 0 || ty * ts < 0 || tx * ts >= MAP || ty * ts >= MAP;
      const fr = frs[v];
      pushQuad(fr.x, fr.y, 16, 16, tx * ts - R.camX, ty * ts - R.camY, 16, 16, false, outside ? dark : WHITE32, 0);
    }
  }
}

function inView(x, y, m) {
  return x > R.camX - m && x < R.camX + R.W + m && y > R.camY - m && y < R.camY + R.H + m + 20;
}

function drawFlatProps() {

function drawZones() {

function drawTeles(outlineOnly) {
  for (const t of G.teles) {
    // 味方の攻撃範囲は描かない（敵の攻撃＝ネクロマンサーに当たるものだけ、赤で示す）
    if (t.team !== ENEMY) continue;
    if (t.kind !== 'line' && t.kind !== 'cone' && !inView(t.x, t.y, teleReach(t))) continue;
    const pre = t.delay > 0;
    const p = pre ? 0 : 1 - t.t / t.max;
    const col = [255, 50, 44];
    // ネクロマンサーに当たる予告は脈打って目立たせる
    const warn = t.team === ENEMY && !pre && teleHit(t, G.necro.x, G.necro.y, 2);
    const pulse = warn ? 0.6 + 0.4 * Math.sin(G.t * 26) : 1;
    const aFill = pre ? 22 : Math.round((50 + 60 * p) * pulse);
    const cFill = rgba32(col[0], col[1], col[2], aFill), cCore = rgba32(col[0], col[1], col[2], pre ? 0 : 80);
    const cLine = rgba32(col[0], col[1], col[2], pre ? 90 : 230);
    if (t.kind === 'mark') {
      if (outlineOnly) drawDotCircle(t.x, t.y, 6 + 4 * (1 - p), rgba32(255, 80, 60, 255), 0);
      continue;
    }
    if (t.kind === 'line') {
      const c = Math.cos(t.ang), s = Math.sin(t.ang), hw = t.w / 2;
      const nx = -s * hw, ny = c * hw;
      const ex = t.x + c * t.len, ey = t.y + s * t.len;
      if (!outlineOnly) {
        drawQuad4(t.x + nx, t.y + ny, ex + nx, ey + ny, ex - nx, ey - ny, t.x - nx, t.y - ny, cFill);
        const px2 = t.x + c * t.len * p, py2 = t.y + s * t.len * p;
        if (p > 0) drawQuad4(t.x + nx, t.y + ny, px2 + nx, py2 + ny, px2 - nx, py2 - ny, t.x - nx, t.y - ny, cCore);
      } else {
        const n = Math.max(2, Math.round(t.len / 5));
        for (let i = 0; i <= n; i += 1) {
          if (i % 2) continue;
          const d = t.len * i / n;
          drawDot(t.x + c * d + nx, t.y + s * d + ny, cLine, 1);
          drawDot(t.x + c * d - nx, t.y + s * d - ny, cLine, 1);
        }
      }
      continue;
    }
    if (t.kind === 'cone') {
      const seg = 10;
      for (let i = 0; i < seg; i++) {
        const a0 = t.ang - t.spread + (2 * t.spread) * i / seg, a1 = t.ang - t.spread + (2 * t.spread) * (i + 1) / seg;
        if (!outlineOnly) {
          drawQuad4(t.x, t.y, t.x + Math.cos(a0) * t.len, t.y + Math.sin(a0) * t.len, t.x + Math.cos(a1) * t.len, t.y + Math.sin(a1) * t.len, t.x, t.y, cFill);
          if (p > 0) drawQuad4(t.x, t.y, t.x + Math.cos(a0) * t.len * p, t.y + Math.sin(a0) * t.len * p, t.x + Math.cos(a1) * t.len * p, t.y + Math.sin(a1) * t.len * p, t.x, t.y, cCore);
        } else drawDot(t.x + Math.cos(a0) * t.len, t.y + Math.sin(a0) * t.len, cLine, 2);
      }
      if (outlineOnly) for (const a of [t.ang - t.spread, t.ang + t.spread]) for (let d = 0; d < t.len; d += 8) drawDot(t.x + Math.cos(a) * d, t.y + Math.sin(a) * d, cLine, 1);
      continue;
    }
    if (t.kind === 'ring') {
      const seg = 28;
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const c0 = Math.cos(a0), s0 = Math.sin(a0) * 0.75, c1 = Math.cos(a1), s1 = Math.sin(a1) * 0.75;
        if (!outlineOnly) {
          drawQuad4(t.x + c0 * t.r0, t.y + s0 * t.r0, t.x + c0 * t.r1, t.y + s0 * t.r1, t.x + c1 * t.r1, t.y + s1 * t.r1, t.x + c1 * t.r0, t.y + s1 * t.r0, cFill);
          if (p > 0) { const rm = t.r0 + (t.r1 - t.r0) * p; drawQuad4(t.x + c0 * t.r0, t.y + s0 * t.r0, t.x + c0 * rm, t.y + s0 * rm, t.x + c1 * rm, t.y + s1 * rm, t.x + c1 * t.r0, t.y + s1 * t.r0, cCore); }
        }
      }
      if (outlineOnly) { drawDotCircle(t.x, t.y, t.r1, cLine, 0); if (t.r0 > 2) drawDotCircle(t.x, t.y, t.r0, cLine, 0); }
      continue;
    }
    if (!outlineOnly) {
      drawSpriteSized('disc32', t.x, t.y, t.r * 2, t.r * 1.5, cFill, 0);
      if (p > 0) drawSpriteSized('disc32', t.x, t.y, t.r * 2 * p, t.r * 1.5 * p, cCore, 0);
    } else {
      drawDotCircle(t.x, t.y, t.r, cLine, pre ? 4 : 0, G.t * 4);
    }
  }
}

function drawCorpses() {
  const N = G.necro;
  const pv = N.preview && N.preview.set;
  const chantSet = N.chant ? new Set(N.chant.list) : null;
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 8);
  for (const c of G.corpses) {
    if (c.dead || !inView(c.x, c.y, 30)) continue;
    let mul = WHITE32, add = 0;
    let a = 255;
    if (c.decay !== Infinity && c.decay < 6) a = Math.round(255 * Math.max(0.25, c.decay / 6));
    if (c.burn > 0) { mul = rgba32(255, 150, 90, a); add = rgba32(255, 90, 20, Math.round(90 + 60 * pulse)); }
    else if (inSanctum(c.x, c.y)) { mul = rgba32(255, 255, 255, a); add = rgba32(255, 230, 150, 70); }
    else if (chantSet && chantSet.has(c)) { mul = rgba32(255, 255, 255, a); add = rgba32(120, 255, 170, Math.round(55 + 45 * pulse)); }
    else if (N.preview && !pv.has(c) && N.preview.all > N.preview.n && dist2(c.x, c.y, N.x, N.y) < (G.mods.raiseR + 4) ** 2) { mul = rgba32(150, 150, 160, a); add = 0; }
    else if (pv && pv.has(c) && corpseRaiseTime(c, N.lv) > 4) { mul = rgba32(255, 255, 255, a); add = rgba32(255, 70, 60, Math.round(60 + 70 * pulse)); }
    else if (pv && pv.has(c)) { mul = rgba32(255, 255, 255, a); add = rgba32(110, 255, 160, Math.round(28 + 22 * pulse)); }
    else mul = rgba32(255, 255, 255, a);
    if (c.boss || c.mid) {
      setBlend(1);
      const gp = 0.6 + 0.4 * Math.sin(G.t * 4 + c.x);
      drawSpriteSized('glow', c.x, c.y + 1, c.boss ? 44 : 34, c.boss ? 26 : 20, c.boss ? rgba32(255, 210, 80, Math.round(120 * gp)) : rgba32(255, 160, 70, Math.round(95 * gp)), 0);
      setBlend(0);
      if (vrng() < 0.08) spawnFx(c.x + vrng.range(-10, 10), c.y - vrng.range(0, 6), 0, -vrng.range(10, 22), 0.8, 'spark', c.boss ? rgba32(255, 230, 120, 255) : rgba32(255, 180, 90, 255), true);
    }
    drawSprite(c.spr, 0, c.x, c.y + 3, c.flip, mul, add, c.scale);
    if (c.burn > 0 && vrng() < 0.5) drawSprite('flame', Math.floor(G.t * 10), c.x + vrng.range(-3, 3), c.y + 2, false, WHITE32, 0);
    if (c === G.heroCorpse && c.decay !== Infinity) drawText(Math.ceil(c.decay) + 's', c.x, c.y - 22, Math.floor(G.t * 4) % 2 ? rgba32(255, 220, 90, 255) : rgba32(255, 255, 220, 255));
    // 格上の死体には格を表示
    if (pv && pv.has(c) && c.g > N.lv) drawText(String(c.g), c.x, c.y - 10 - (c.big ? 8 : 0), c.g > N.lv * 1.6 ? rgba32(255, 90, 80, 255) : rgba32(255, 220, 90, 255));
  }
}

const AFFIX_RGB = {};
for (const k in AFFIXES) AFFIX_RGB[k] = hexToRgb(AFFIXES[k].color);

// 格の位（レベルに対する格の高さ）：0=なし 1=銅 2=銀 3=金 4=紫
const RANK_RGB = [null, [214, 138, 70], [214, 226, 240], [255, 210, 74], [236, 110, 255]];
const RANK_CUT = [0.6, 0.95, 1.3, 1.8];
const RANK_NAME = ['白', '銅', '銀', '金', '紫'];
function rankOfG(g) { const r = g / Math.max(1, G.necro.lv); let k = 0; for (const c of RANK_CUT) if (r >= c) k++; return k; }
function unitRank(u) { return u.team === ALLY ? rankOfG(u.g) : 0; }

function drawShadows() {
  const sh = rgba32(0, 0, 0, 90);
  for (const u of G.units) {
    if (u.dead || !inView(u.x, u.y, 30)) continue;
    if (u.form === 'wraith') continue;
    if (u.air > 0) { drawSprite('shadowL', 0, u.lx, u.ly + 1, false, rgba32(0, 0, 0, 120), 0); continue; }
    drawSprite(u.big ? 'shadowL' : 'shadow', 0, u.x, u.y + 1, false, sh, 0);
    // 敵のボス・中ボスの足元は赤く脈打つ
    if (u.team === ENEMY && (u.isBoss || u.mid)) {
      const pl = 0.5 + 0.5 * Math.sin(G.t * 5 + u.id), w = u.isBoss ? 40 : 30;
      drawSpriteSized('disc32', u.x, u.y + 1, w, w * 0.45, u.isBoss ? rgba32(255, 40, 40, 70 + Math.round(60 * pl)) : rgba32(255, 140, 40, 60 + Math.round(50 * pl)), 0);
    }
    // 足元の位の輪
    const rk = u.team === ALLY ? unitRank(u) : 0;
    if (rk >= 1) {
      const c = RANK_RGB[rk], w = u.big ? 24 : 15;
      drawSpriteSized('disc16', u.x, u.y + 1, w, w * 0.38, rgba32(c[0], c[1], c[2], rk >= 3 ? 150 : 105), 0);
    }
  }
  const N = G.necro;
  drawSprite('shadow', 0, N.x, N.y + 1, false, sh, 0);
  for (const p of G.pots) drawSprite('shadowL', 0, p.x, p.y + 1, false, sh, 0);
  for (const s of G.sites) if (inView(s.x, s.y, 30)) drawSprite('shadowL', 0, s.x, s.y + 1, false, sh, 0);
}

// 空の窯（レベルアップで現れる）。近くにいると範囲の輪が明るくなる
function drawSiteRings() {
  const N = G.necro;

  for (const s of G.sites) {
    if (!inView(s.x, s.y, SITE_R + 10)) continue;

    if (on) drawSpriteSized('disc32', s.x, s.y, SITE_R * 2, SITE_R * 1.5, rgba32(255, 200, 90, 16), 0);

}
function drawSite(s) {
  const pulse = 0.5 + 0.5 * Math.sin(s.anim * 3);
  setBlend(1);
  drawSpriteSized('glow', s.x, s.y - 10, 34, 30, rgba32(110, 255, 170, 40 + Math.round(40 * pulse)), 0);
