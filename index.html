  drawSprite('cauldron', 0, s.x, s.y, false, rgba32(200, 215, 205, 255), 0);
}
// 頭上の目印（軍勢に埋もれないよう最後に描く）：空の窯・敵のボスと中ボス・ボスの亡骸
function drawSiteMarks() {
  const bob = Math.round(Math.abs(Math.sin(G.t * 3)) * 3);
  // 統率力：守りに駆けつけた兵（青緑）・ボスへ向かった兵（橙）の頭上に「!」
  if (G.lead >= 2) for (const u of G.units) {
    if (u.dead || u.team !== ALLY || !(u.markT > 0) || !inView(u.x, u.y, 30)) continue;
    const sp = SPR[u.spr];
    const top = u.y - Math.round((sp ? sp.h : 12) * (u.scale || 1)) - 7 - Math.round((0.7 - u.markT) * 6);
    drawText('!', u.x + 1, top, u.hunt ? rgba32(255, 160, 60, 255) : rgba32(90, 235, 225, 255));
  }
  for (const u of G.bossAlive) {
    if (u.dead || !inView(u.x, u.y, 30)) continue;
    const top = u.y - Math.round(SPR[u.spr].h * (u.scale || 1)) - 10 - bob;
    drawSprite('sitemark', 0, u.x, top, false, rgba32(255, 70, 60, 255), 0, 1.5);
  }
  for (const u of G.midAlive) {
    if (u.dead || !inView(u.x, u.y, 30)) continue;
    const top = u.y - Math.round(SPR[u.spr].h * (u.scale || 1)) - 8 - bob;
    drawSprite('sitemark', 0, u.x, top, false, rgba32(255, 160, 60, 255), 0, 1);
  }
  for (const c of G.corpses) {
    if (c.dead || !(c.boss || c.mid) || !inView(c.x, c.y, 20)) continue;
    drawSprite('sitemark', 0, c.x, c.y - 14 - bob, false, c.boss ? rgba32(255, 225, 90, 255) : rgba32(255, 175, 80, 255), 0, c.boss ? 1.3 : 1);
  }
  for (const s of G.sites) {
    if (!inView(s.x, s.y, 20)) continue;
    const age = G.t - s.born;
    const by = s.y - 18 - Math.round(Math.abs(Math.sin(s.anim * 2.5)) * 3) - (age < 0.6 ? Math.round((0.6 - age) * 30) : 0);
    drawSprite('sitemark', 0, s.x, by, false, rgba32(255, 220, 120, 255), 0);
  }
}

// 蘇生の円。地面側（塗り）と、軍勢の上に重ねる側（線）の2回に分けて描く
// 死王の威光：あなたのすぐそば（この中の味方は Lv が上がって戦う）を、金の輪でうっすら示す
function drawKingAura() {
  const N = G.necro, r = G.mods.kingR;
  if (!r || N.dead) return;
  drawSpriteSized('disc32', N.x, N.y, r * 2, r * 1.5, rgba32(255, 210, 90, 16), 0);
  drawDotCircle(N.x, N.y, r, rgba32(255, 214, 110, 120), 4, -G.t * 3);
}

function drawRaiseCircle(over) {
  const N = G.necro;
  if (N.dead) return;
  const r = G.mods.raiseR;
  const has = N.preview && N.preview.n > 0;
  if (N.chant) {
    const p = Math.min(1, N.chant.prog / Math.max(0.0001, N.chant.total));
    if (!over) drawSpriteSized('disc32', N.x, N.y, r * 2, r * 1.5, rgba32(90, 255, 150, 22), 0);
    else drawDotCircle(N.x, N.y, r, rgba32(80, 200, 130, 140), 0, 0, p, rgba32(170, 255, 200, 255));
  } else if (over) {
    // 暗い影を1ドット下に敷いて、どの地面でも見えるようにする
    drawDotCircle(N.x, N.y + 1, r, rgba32(6, 14, 10, 150), 6, G.t * 5);
    drawDotCircle(N.x, N.y, r, has ? rgba32(140, 255, 185, 235) : rgba32(120, 220, 165, 165), 6, G.t * 5);
  } else if (has) {
    drawSpriteSized('disc32', N.x, N.y, r * 2, r * 1.5, rgba32(90, 255, 150, 14), 0);
  }
}

// ネクロマンサーは軍勢に埋もれないよう、最後にもう一度上に描く
function drawNecroTop() {
  const N = G.necro;
  if (N.dead) return;
  let crowd = 0;
  G.tgrid[ALLY].query(N.x, N.y, 12, (u) => { if (!u.dead && u.y > N.y && Math.abs(u.x - N.x) < 10) crowd++; });
  setBlend(1);
  drawSpriteSized('glow', N.x, N.y - 8, 26, 26, rgba32(170, 110, 255, 70 + Math.round(30 * Math.sin(G.t * 4))), 0);
  setBlend(0);
  if (crowd > 0) drawNecroSprite(N);
  // 頭上の小さな印
  const by = N.y - 22 + Math.round(Math.sin(G.t * 3) * 1.5);
  drawDot(N.x - 1, by, rgba32(200, 160, 255, 230), 2);
  drawDot(N.x, by + 2, rgba32(200, 160, 255, 230), 1);
}

function drawSorted() {
  DRAWLIST.length = 0;
  for (const p of G.props) if (inView(p.x, p.y, 40)) DRAWLIST.push(p);
  for (const u of G.units) if (!u.dead && inView(u.x, u.y, 40)) DRAWLIST.push(u);
  for (const p of G.pots) DRAWLIST.push(p);
  for (const p of G.sites) if (inView(p.x, p.y, 40)) DRAWLIST.push(p);
  DRAWLIST.push(G.necro);
  DRAWLIST.sort((a, b) => a.y - b.y);
  for (const o of DRAWLIST) {
    if (o.isNecro) drawNecroSprite(o);
    else if (o.isPot) drawPot(o);
    else if (o.isSite) drawSite(o);
    else if (o.team !== undefined) drawUnit(o);
    else drawSprite(o.spr, 0, o.x, o.y, o.flip, WHITE32, 0);
  }
}

// 窯へ飛んでいく死者（地面に影、本体は光をまとって小さくなりながら窯へ）
function drawFlyers() {
  for (const f of G.flyers) {
    if (f.t <= 0 || !SPR[f.spr]) continue;
    const p = Math.min(1, f.t / f.dur);
    const [x, y, e] = flyerPos(f, p);
    const gx = lerp(f.x0, f.x1, e), gy = lerp(f.y0, f.y1 + 7, e);
    if (!inView(x, y, 60)) continue;
    drawSprite('shadow', 0, gx, gy + 1, false, rgba32(0, 0, 0, Math.round(90 * (1 - p * 0.6))), 0);
    const sc = f.scale * (1 - 0.5 * p * p);
    const glow = f.main ? rgba32(255, 210, 90, 255) : rgba32(90, 255, 160, 255);
    for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) drawSprite(f.spr, 0, x + ox, y + oy, f.flip, rgba32(255, 255, 255, 220), glow, sc);
    drawSprite(f.spr, 0, x, y, f.flip, rgba32(255, 255, 255, 255), f.main ? rgba32(255, 230, 150, Math.round(40 + 120 * p)) : rgba32(150, 255, 190, Math.round(40 + 120 * p)), sc);
  }
}

function drawUnit(u) {
  let frame = 0, lunge = 0;
  const moving = u.vx * u.vx + u.vy * u.vy > 9;
  // 攻撃の瞬間は前へ踏み込む
  if (u.atkAnim > 0) lunge = u.face * (u.atkAnim > 0.09 ? 2 : 1);
  if (u.atkAnim <= 0 && (moving || u.form === 'wraith' || (u.kind === 'syn' && SYNTH[u.synKey] && SYNTH[u.synKey].col === 2))) frame = Math.floor(u.anim * 6) % 2;
  let add = 0, a = 255;
  if (u.flash > 0) add = u.isBoss || u.huge ? rgba32(255, 255, 255, 70) : rgba32(255, 255, 255, 200);
  else if (u.buffT > 0) add = rgba32(255, 80, 60, 70);
  else if (u.plagueT > 0) add = rgba32(150, 255, 60, 70);
  else if (u.slowT > 0 && u.team === ENEMY) add = rgba32(170, 90, 255, 60);
  if (u.life > 0 && u.life < 3) a = Math.round(255 * (0.3 + 0.7 * u.life / 3));
  let y = u.y;
  // 窯から飛び出している最中：弧の高さだけ持ち上げ、少し回転の代わりに伸び縮みする
  if (u.popT > 0) {
    const p = clamp(1 - u.popT / u.popMax, 0, 1);
    y -= Math.sin(p * Math.PI) * (u.popH || 40);
    const sc = (u.scale || 1) * (0.7 + 0.3 * Math.min(1, p * 2.5));
    drawSprite(u.spr, 0, u.x, y, u.face < 0, WHITE32, rgba32(170, 255, 200, Math.round(160 * (1 - p))), sc);
    return;
  }
  if (u.air > 0) {
    const p = 1 - u.air / 1.05;
    y = lerp(u.y, u.ly, p) - Math.sin(p * Math.PI) * 60;
    drawSprite(u.spr, 2, lerp(u.x, u.lx, p), y, u.face < 0, rgba32(255, 255, 255, a), add, u.scale);
    return;
  }
  const bob = u.form === 'wraith' ? Math.round(Math.sin(u.anim * 4 + u.id) * 1) - 2 : 0;
  // 位の縁取り：合成体・ボスは銅から、普通の死者は金から。色の付いた輪郭で格の高さが一目でわかる
  const rk = u.team === ALLY ? unitRank(u) : 0;
  if (rk >= (u.big ? 1 : 3)) {
    const c = RANK_RGB[rk], m = rgba32(255, 255, 255, Math.round(a * (rk >= 3 ? 0.95 : 0.8))), ad = rgba32(c[0], c[1], c[2], 255);
    for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) drawSprite(u.spr, frame, u.x + lunge + ox, y + bob + oy, u.face < 0, m, ad, u.scale);
    if (rk >= 3 && vrng() < (rk === 4 ? 0.09 : 0.05)) spawnFx(u.x + vrng.range(-6, 6), y - vrng.range(2, 14), 0, -vrng.range(8, 18), 0.6, 'spark', rgba32(c[0], c[1], c[2], 230), true);
  }
  // 敵のボス・中ボスは赤く光る縁取り
  if (u.team === ENEMY && (u.isBoss || u.mid)) {
    const pl = 0.5 + 0.5 * Math.sin(G.t * 6 + u.id);
    const ad = u.isBoss ? rgba32(255, 50 + Math.round(60 * pl), 40, 255) : rgba32(255, 150, 40, 255);
    for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) drawSprite(u.spr, frame, u.x + lunge + ox, y + bob + oy, u.face < 0, rgba32(255, 255, 255, 230), ad, u.scale);
  }
  drawSprite(u.spr, frame, u.x + lunge, y + bob, u.face < 0, rgba32(255, 255, 255, a), add, u.scale);
  const sh = Math.round(SPR[u.spr].h * (u.scale || 1));
  // 伝承の死霊は、その死霊の色の光をまとう
  if (u.kind === 'syn' && u.team === ALLY) {
    const LS = SYNTH[u.synKey];
    if (LS && LS.legend && vrng() < 0.16) {
      const c = LEGENDS[LS.legend].fx;
      spawnFx(u.x + vrng.range(-8, 8), y + bob - vrng.range(2, sh * 0.9), vrng.range(-4, 4), -vrng.range(8, 20), 0.7, 'px2', rgba32(c[0], c[1], c[2], 220), true);
    }
  }
  // 合成体とボスは頭上に格を表示。亜種は格の横に色の印
  if (u.big && u.team === ALLY) {
    const c = rk ? RANK_RGB[rk] : [170, 190, 175];
    const str = String(u.g), ty = y + bob - sh - (u.hp < u.mhp ? 9 : 5);
    drawText(str, u.x, ty, rgba32(c[0], c[1], c[2], 255));
    if (u.affix) {
      const ac = AFFIX_RGB[u.affix];
      const px = u.x + str.length * 2 + 2;
      drawDot(px - 1, ty, rgba32(0, 0, 0, 220), 5);
      drawDot(px, ty + 1, rgba32(ac[0], ac[1], ac[2], 255), 3);
      if (vrng() < 0.04) spawnFx(u.x + vrng.range(-7, 7), y - vrng.range(2, sh), 0, -vrng.range(6, 16), 0.7, 'spark', rgba32(ac[0], ac[1], ac[2], 230), true);
    }
  }
  // 体力バー（ボス・合成体・精鋭のみ、減っているとき）
  if ((u.isBoss || u.kind === 'syn' || u.elite || u.mid) && u.hp < u.mhp) {
    const w = u.isBoss && u.team === ENEMY ? 28 : u.big ? 20 : 12;
    const top = y - sh - 2;
    hpBar(u.x, top, w, u.hp / u.mhp, u.team === ALLY ? rgba32(90, 230, 140, 255) : rgba32(230, 70, 60, 255));
  }
}

function hpBar(x, y, w, p, col) {
  const px = SPR.px.frames[0];
  const dx = Math.round(x - R.camX - w / 2), dy = Math.round(y - R.camY);
  pushQuad(px.x, px.y, 1, 1, dx - 1, dy - 1, w + 2, 4, false, rgba32(10, 6, 10, 220), 0);
  pushQuad(px.x, px.y, 1, 1, dx, dy, Math.max(0, Math.round(w * clamp(p, 0, 1))), 2, false, col, 0);
}

function drawNecroSprite(N) {
  if (N.dead) {
    drawSprite(N.spr, 0, N.x, N.y + 2, N.face < 0, rgba32(120, 120, 140, 200), 0);
    return;
  }
  let frame = 0;
  if (N.chant) frame = 2;
  else if (N.moving) frame = Math.floor(N.anim * 7) % 2;
  let add = 0;
  if (N.flash > 0) add = rgba32(255, 60, 60, 200);
  if (N.chant) {
    setBlend(1);
    drawSpriteSized('glow', N.x, N.y - 6, 30 + Math.sin(G.t * 10) * 3, 30, rgba32(90, 255, 150, 120), 0);
    setBlend(0);
  }
  drawSprite(N.spr, frame, N.x, N.y, N.face < 0, WHITE32, add);
  if (N.hp < N.mhp) hpBar(N.x, N.y + 4, 16, N.hp / N.mhp, N.hp / N.mhp < 0.3 ? rgba32(255, 70, 60, 255) : rgba32(230, 200, 80, 255));
}

function drawPot(p) {
  const add = p.flash > 0 ? rgba32(255, 120, 100, 160) : 0;
  // 窯の下の火
  setBlend(1);
  drawSpriteSized('glow', p.x, p.y - 2, 30, 14, rgba32(255, 140, 50, 90 + Math.round(30 * Math.sin(p.anim * 9))), 0);
  setBlend(0);
  drawSprite('flame', Math.floor(p.anim * 10), p.x - 4, p.y + 1, false, WHITE32, 0);
  drawSprite('flame', Math.floor(p.anim * 10) + 1, p.x + 4, p.y + 1, true, WHITE32, 0);
  const spr = SPR['cauldron_' + p.lin] && !SYNTH[p.key].unique ? 'cauldron_' + p.lin : 'cauldron';
  drawSprite(spr, Math.floor(p.anim * 5) % 3, p.x, p.y, false, WHITE32, add);
  const top = p.y - 26;
  hpBar(p.x, top, 22, p.hp / p.mhp, rgba32(230, 120, 70, 255));
  // 進行度
  const px = SPR.px.frames[0];
  const w = 22;
  const dx = Math.round(p.x - R.camX - w / 2), dy = Math.round(top + 4 - R.camY);
  pushQuad(px.x, px.y, 1, 1, dx - 1, dy - 1, w + 2, 3, false, rgba32(10, 6, 10, 220), 0);
  pushQuad(px.x, px.y, 1, 1, dx, dy, Math.round(w * clamp(p.prog, 0, 1)), 1, false, rgba32(110, 255, 160, 255), 0);
  drawText(fmtSec(p.remain || 0) + 's', p.x, top - 7, rgba32(160, 255, 190, 255));
}

function drawProjs() {
  for (const p of G.projs) {
    if (!inView(p.x, p.y, 10)) continue;
    // 系統の極み（射）の矢は太い（当たる幅に合わせて大きく描く）
    if (p.kind === 'arrow' || p.kind === 'bonearrow') drawRot(p.kind, 0, p.x, p.y, Math.atan2(p.vy, p.vx), p.wide ? rgba32(255, 236, 170, 255) : WHITE32, p.wide ? 1 + p.wide * 0.12 : 1);
    else {
      drawSprite(p.kind, 0, p.x, p.y + 2, false, WHITE32, 0);
    }
  }
  setBlend(1);
  for (const p of G.projs) {
    // 太い矢の光（当たる幅が見えるように）
    if (p.wide && inView(p.x, p.y, 20)) { const s = 6 + p.wide * 2; drawSpriteSized('glow', p.x, p.y, s * 1.6, s, rgba32(232, 184, 60, 120), 0); }
    if (p.kind.startsWith('orb') && inView(p.x, p.y, 10)) {
      const c = p.kind === 'orbPurple' ? [200, 120, 255] : p.kind === 'orbGreen' ? [140, 255, 100] : p.kind === 'orbGold' ? [255, 230, 140] : p.kind === 'orbFire' ? [255, 140, 40] : [120, 200, 255];
      drawSpriteSized('glow', p.x, p.y, 12, 12, rgba32(c[0], c[1], c[2], 150), 0);
    }
  }
  setBlend(0);
}

function drawFxList(list, mode) {
  for (const f of list) {
    if (!inView(f.x, f.y, 30)) continue;
    const a = clamp(f.life / f.max, 0, 1);
    const c = f.col;
    const alpha = Math.round(((c >>> 24) & 255) * (f.spr === 'pillarfx' ? a : Math.min(1, a * 1.5)));
    const mul = ((alpha & 255) << 24 | (c & 0xffffff)) >>> 0;
    if (f.spr === 'glow') drawSpriteSized('glow', f.x, f.y, 10, 10, mul, 0);
    else if (f.spr === 'pillarfx') drawSprite('pillarfx', 0, f.x, f.y, false, mul, 0, 1);
    else drawSprite(f.spr, Math.floor(G.t * 10), f.x, f.y, false, mul, 0);
  }
}

function drawSoulGlow() {
  for (const s of G.souls) {
    if (!inView(s.x, s.y, 10)) continue;
    drawSpriteSized('glow', s.x, s.y - 3, s.big ? 14 : 9, s.big ? 14 : 9, s.big ? rgba32(255, 180, 80, 110) : rgba32(80, 255, 210, 90), 0);
  }
}
function drawPickups() {
  for (const o of G.pickups) {
    if (!inView(o.x, o.y, 12)) continue;
    const blink = o.t > 38 && Math.floor(o.t * 8) % 2 === 0;
    if (blink) continue;
    setBlend(1);
    drawSpriteSized('glow', o.x, o.y - 5, 16, 16, rgba32(255, 90, 90, 120 + Math.round(40 * Math.sin(o.t * 5))), 0);
    setBlend(0);
    drawSprite('healorb', 0, o.x, o.y + Math.round(Math.sin(o.t * 4) * 1.5), false, WHITE32, 0);
  }
}
function drawSouls() {
  for (const s of G.souls) {
    if (!inView(s.x, s.y, 10)) continue;
    const bob = Math.round(Math.sin(s.t * 5) * 1.5);
    drawSprite(s.big ? 'soulBig' : 'soul', Math.floor(s.t * 4) % 2, s.x, s.y + bob, false, WHITE32, 0);
  }
}

function drawWorldText() {
  const N = G.necro;
  const r = G.mods.raiseR;
  if (!N.dead && N.preview && N.preview.n > 0) {
    let t = N.preview.t;
    if (N.chant) t = Math.max(0, (N.chant.total - N.chant.prog) / raiseSpeedNow());
    const col = t < 1 ? rgba32(140, 255, 180, 255) : t < 4 ? rgba32(255, 225, 100, 255) : rgba32(255, 110, 90, 255);
    const n = N.chant ? N.chant.list.length : N.preview.n;
    // 枠が足りず全部は起こせないときは「起こせる数/円の中の数」
    const str = 'x' + n + (!N.chant && N.preview.all > n ? '/' + N.preview.all : '') + ' ' + fmtSec(t) + 's';
    drawText(str, N.x, N.y - r * 0.75 - 9, col);
  } else if (!N.dead && N.preview && N.preview.full) {
    // 軍勢が上限：これ以上は起こせない
    drawText('MAX', N.x, N.y - r * 0.75 - 9, Math.floor(G.t * 3) % 2 ? rgba32(255, 200, 80, 255) : rgba32(255, 120, 80, 255));
  }
  // 足元に軍勢の数（今/上限）。画面の中央だけ見ていても分かるように
  if (!N.dead) {
    const used = armyUsed(), cap = armyCap();
    const col = used >= cap ? rgba32(255, 140, 90, 255) : used >= cap * 0.85 ? rgba32(255, 215, 110, 255) : rgba32(170, 235, 190, 230);
    drawText(used + '/' + cap, N.x, N.y + (N.hp < N.mhp ? 9 : 5), col);
  }
  for (const t of G.texts) drawText(t.str, t.x, t.y, t.col);
}

// 神の屍：儀式の輪（進み具合で満ちていく）と残り秒数
function drawGodRitual() {
  const c = G.godCorpse;
  if (!c || c.dead) return;
  const f = clamp((G.godProg || 0) / GOD_RAISE_T, 0, 1);
  const R0 = G.mods.raiseR + 14;
  const on = G.godRitual;
  const pulse = 0.5 + 0.5 * Math.sin(G.t * (on ? 8 : 3));
  setBlend(1);
  drawSpriteSized('glow', c.x, c.y, R0 * 1.6, R0 * 1.1, rgba32(170, 110, 255, Math.round((on ? 90 : 50) * (0.6 + 0.4 * pulse))), 0);
  setBlend(0);
  drawDotCircle(c.x, c.y, R0, rgba32(170, 120, 255, on ? 200 : 120), 3, G.t * 2);
  const n = 64, k = Math.round(n * f);
  for (let i = 0; i < k; i++) {
    const a = -Math.PI / 2 + i / n * TAU;
    drawDot(c.x + Math.cos(a) * R0, c.y + Math.sin(a) * R0 * 0.75, rgba32(220, 180, 255, 255), 3);
  }
  const txt = Math.floor(G.godProg || 0) + '/' + GOD_RAISE_T + 's';
  drawText(txt, c.x, c.y - 30, on ? rgba32(230, 200, 255, 255) : rgba32(255, 255, 255, Math.round(160 + 90 * pulse)));
}
// 死神が生まれた瞬間の衝撃の輪
function drawReapWave() {
  const w = G.reapWave;
  if (!w) return;
  for (const [dr, col] of [[0, rgba32(230, 210, 255, 255)], [-14, rgba32(150, 90, 230, 220)], [-30, rgba32(60, 30, 90, 200)]]) {
    const r = w.r + dr;
    if (r > 4 && r < 700) drawDotCircle(w.x, w.y, r, col, 4, G.t * 10);
  }
}

// 画面外のボスと窯の方向を示す
function drawIndicators() {
  const N = G.necro;
  const list = [];
  for (const b of G.bossAlive) if (!b.dead) list.push({ x: b.x, y: b.y, col: rgba32(255, 80, 70, 255) });
  for (const p of G.pots) list.push({ x: p.x, y: p.y, col: rgba32(110, 255, 160, 255) });
  for (const p of G.sites) list.push({ x: p.x, y: p.y, col: rgba32(255, 215, 110, 230) });
  for (const u of G.midAlive) if (!u.dead) list.push({ x: u.x, y: u.y, col: rgba32(255, 150, 50, 255) });
  for (const c of G.corpses) if (!c.dead && (c.boss || c.mid) && c !== G.heroCorpse) list.push({ x: c.x, y: c.y, col: rgba32(255, 235, 140, 255) });
  if (G.heroCorpse && !G.heroCorpse.dead) list.push({ x: G.heroCorpse.x, y: G.heroCorpse.y, col: rgba32(255, 220, 90, 255) });
  if (G.godCorpse && !G.godCorpse.dead) list.push({ x: G.godCorpse.x, y: G.godCorpse.y, col: rgba32(200, 140, 255, 255) });
  for (const o of list) {
    if (inView(o.x, o.y, -10)) continue;
    const cx = R.camX + R.W / 2, cy = R.camY + R.H / 2;
    const dx = o.x - cx, dy = o.y - cy;
    const a = Math.atan2(dy, dx);
    const k = Math.min((R.W / 2 - 12) / Math.max(1, Math.abs(dx)), (R.H / 2 - 12) / Math.max(1, Math.abs(dy)));
    const x = cx + dx * k, y = cy + dy * k;
    drawRot('arrow', 0, x, y, a, o.col, 2);
  }
}

// タイトル背景（ゆっくり流れる古戦場。死者がさまよう）
let titleT = 0, titleScene = null;
function buildTitleScene() {
  const r = makeRng(777);
  const sc = { props: [], flat: [], corpses: [], walkers: [] };
  for (let i = 0; i < 260; i++) {
    const x = r.range(600, 2000), y = r.range(700, 1300), k = r();
    if (k < 0.12) sc.props.push({ spr: 'tree' + r.int(0, 1), x, y, flip: r() < 0.5 });
    else if (k < 0.2) sc.props.push({ spr: 'tomb' + r.int(0, 2), x, y, flip: false });
    else if (k < 0.26) sc.props.push({ spr: 'banner' + r.int(0, 1), x, y, flip: r() < 0.5 });
    else if (k < 0.3) sc.props.push({ spr: 'stucksword', x, y, flip: false });
    else if (k < 0.75) sc.flat.push({ spr: 'grass' + r.int(0, 2), x, y, flip: r() < 0.5 });
    else if (k < 0.85) sc.flat.push({ spr: 'bones', x, y, flip: r() < 0.5 });
    else sc.corpses.push({ spr: r.pick(['soldier_e_c', 'knight_e_c', 'archer_e_c', 'militia_e_c', 'skel_c']), x, y, flip: r() < 0.5 });
  }
  for (let i = 0; i < 26; i++) {
    const t = r.pick(['soldier', 'knight', 'archer', 'militia', 'mage']);
    const f = r.pick(['_r', '_z', '_r']);
    const sk = r() < 0.25 ? 'skel_' + r.pick(LIN_KEYS) : r() < 0.15 ? 'wr_' + r.pick(LIN_KEYS) : t + f;
    sc.walkers.push({ spr: sk, x: r.range(700, 1900), y: r.range(760, 1260), sp: r.range(4, 9), ph: r() * 10 });
  }
  sc.props.sort((a, b) => a.y - b.y);
  return sc;
}
function renderTitleBg() {
  if (!titleScene) titleScene = buildTitleScene();
  titleT += 1 / 60;
  R.camX = Math.round(800 + (titleT * 5) % 700); R.camY = Math.round(900 + Math.sin(titleT * 0.1) * 30);
  beginFrame(0.06, 0.07, 0.06);
  drawGround();
  const sc = titleScene;
  for (const p of sc.flat) drawSprite(p.spr, 0, p.x, p.y, p.flip, WHITE32, 0);
  for (const c of sc.corpses) drawSprite(c.spr, 0, c.x, c.y, c.flip, WHITE32, 0);
  const list = sc.props.slice();
  for (const w of sc.walkers) {
    const wx = w.x + ((titleT * w.sp) % 400) - 200;
    list.push({ spr: w.spr, x: wx, y: w.y + Math.sin(titleT + w.ph) * 3, walker: true, ph: w.ph });
  }
  list.sort((a, b) => a.y - b.y);
  for (const o of list) drawSprite(o.spr, o.walker ? Math.floor(titleT * 4 + o.ph) % 2 : 0, o.x, o.y, false, WHITE32, 0);
  flush();
}

const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  hudT: 0, selChar: 'gravekeeper', selStage: 'field', potSel: new Map(), potGroups: [], lvLock: 0, hints: {}, hintT: 0,
};

function showScreen(id, on) { $(id).classList.toggle('hidden', !on); }
function anyOverlay() { return ['title', 'levelup', 'pot', 'roster', 'pause', 'result', 'altar', 'book', 'howto', 'recipe'].some((id) => !$(id).classList.contains('hidden')); }

UI.init = function () {
  // ジョイスティック
  const touch = $('touch'), joy = $('joy'), knob = $('joyk');
  const MAXR = 44;
  // 指（スマホ）：押した所が基点のジョイスティック（指が大きく離れたら基点を引き寄せる）
  // マウス：基点はいつもネクロマンサー。ネクロマンサーからカーソルへ向かって歩く（基点は動かさない）
  const start = (e) => {
    if (!G || G.state !== 'play') return;
    audioInit();
    INPUT.active = true; INPUT.pid = e.pointerId;
    INPUT.follow = e.pointerType === 'mouse' && inputMode() !== 'touch';
    if (INPUT.follow) {
      INPUT.cx = e.clientX; INPUT.cy = e.clientY;
      joy.classList.remove('hidden');
      UI.followTick();
      try { touch.setPointerCapture(e.pointerId); } catch (er) { /* なし */ }
      e.preventDefault();
      return;
    }
    INPUT.ox = e.clientX; INPUT.oy = e.clientY;
    joy.style.left = e.clientX + 'px'; joy.style.top = e.clientY + 'px';
    knob.style.transform = 'translate(0,0)';
    joy.classList.remove('hidden');
    try { touch.setPointerCapture(e.pointerId); } catch (er) { /* なし */ }
    e.preventDefault();
  };
  const move = (e) => {
    if (!INPUT.active || e.pointerId !== INPUT.pid) return;
    if (INPUT.follow) { INPUT.cx = e.clientX; INPUT.cy = e.clientY; UI.followTick(); e.preventDefault(); return; }
    let dx = e.clientX - INPUT.ox, dy = e.clientY - INPUT.oy;
    const d = Math.sqrt(dx * dx + dy * dy);
    // 指が大きく離れたら基点を引き寄せる
    if (d > MAXR * 1.6) { INPUT.ox += dx * (1 - MAXR * 1.6 / d); INPUT.oy += dy * (1 - MAXR * 1.6 / d); joy.style.left = INPUT.ox + 'px'; joy.style.top = INPUT.oy + 'px'; dx = e.clientX - INPUT.ox; dy = e.clientY - INPUT.oy; }
    const dd = Math.sqrt(dx * dx + dy * dy);
    const k = Math.min(1, dd / MAXR);
    const nx = dd > 0 ? dx / dd : 0, ny = dd > 0 ? dy / dd : 0;
    const dead = 7;
    if (dd < dead) { INPUT.jx = 0; INPUT.jy = 0; }
    else { const m = clamp((dd - dead) / (MAXR - dead), 0.35, 1); INPUT.jx = nx * m; INPUT.jy = ny * m; }
    knob.style.transform = `translate(${nx * k * MAXR}px,${ny * k * MAXR}px)`;
    e.preventDefault();
  };
  const end = (e) => {
    if (e && INPUT.pid != null && e.pointerId !== INPUT.pid) return;
    UI.releaseJoy();
  };
  touch.addEventListener('pointerdown', start);
  {
    const pb = $('potbtn');
    let pd = null;
    pb.addEventListener('pointerdown', (e) => { pd = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
    pb.addEventListener('pointermove', (e) => {
      if (!pd || e.pointerId !== pd.id || !G || G.state !== 'play') return;
      if (Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 14) {
        const from = { pointerId: e.pointerId, clientX: pd.x, clientY: pd.y, preventDefault() {} };
        pd = null;
        UI.potDragged = performance.now();
        start(from); move(e);
      }
    });
    const clear = () => { pd = null; };
    pb.addEventListener('pointerup', clear);
    pb.addEventListener('pointercancel', clear);
  }
  touch.addEventListener('pointermove', move);
  touch.addEventListener('pointerup', end);
  touch.addEventListener('pointercancel', end);
  window.addEventListener('blur', () => { UI.releaseJoy(); INPUT.keys = {}; });

  // キーの操作は 14_ui_kb.js（キー設定 14_ui_keys.js の割り当てで動く）。ここでは押されているキーだけ覚える
  window.addEventListener('keydown', (e) => { audioInit(); INPUT.keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { INPUT.keys[e.code] = false; if (e.code === 'Space') e.preventDefault(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') UI.openPause(); });

  $('pausebtn').addEventListener('click', () => { if (G && G.state === 'play') UI.openPause(); });
  UI.isTouch = inputMode() === 'touch';
  document.body.dataset.input = inputMode();
  // 窯の上の「錬金する」の案内も押せる（錬金ボタンと同じ）。押した指で移動が始まらないようにする
  $('siteprompt').addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  $('siteprompt').addEventListener('click', (e) => { e.stopPropagation(); audioInit(); if (G && G.state === 'play' && nearSite() && potUI() !== 'D') UI.openPot(); });
  $('potbtn').addEventListener('click', () => { audioInit(); if (performance.now() - (UI.potDragged || 0) < 700) return; if (G && G.state === 'play') UI.openPot(); });
  // 凱旋：誤タップで終わらないよう二度押しで確定する
  $('returnbtn').addEventListener('click', () => {
    if (!G || !G.victory || G.state !== 'play') return;
    const b = $('returnbtn');
    if (b.dataset.armed) { endRun(); return; }
    b.dataset.armed = '1'; b.textContent = ctl('returnArmed');
    clearTimeout(UI.retT);
    UI.retT = setTimeout(() => { delete b.dataset.armed; b.textContent = ctl('returnBtn'); }, 3000);
  });
  // 窯ボタンのアイコン
  const pc = $('poticon').getContext('2d');
  pc.imageSmoothingEnabled = false;
  const s = SPR.cauldron, f = s.frames[0];
  pc.drawImage(atlasCanvas, f.x, f.y, s.w, s.h, Math.floor((26 - s.w) / 2), Math.floor((24 - s.h) / 2), s.w, s.h);
};

// マウスで動かしているとき：ネクロマンサーの画面上の位置を基点に、カーソルへの向きと強さを決める
// ネクロマンサーが動くたびに向きも変わるので、毎コマ呼ぶ（09_necro.js の入力の読み取りから）
UI.followTick = function () {
  if (!INPUT.active || !INPUT.follow || !G || !G.necro || !R.cssK) return;
  const N = G.necro, k = R.cssK, MAXR = 44, dead = 7;
  const ox = (N.x - R.camX) * k, oy = (N.y - 6 - R.camY) * k;
  INPUT.ox = ox; INPUT.oy = oy;
  const dx = INPUT.cx - ox, dy = INPUT.cy - oy, dd = Math.sqrt(dx * dx + dy * dy);
  const nx = dd > 0 ? dx / dd : 0, ny = dd > 0 ? dy / dd : 0;
  if (dd < dead) { INPUT.jx = 0; INPUT.jy = 0; }
  else { const m = clamp((dd - dead) / (MAXR - dead), 0.35, 1); INPUT.jx = nx * m; INPUT.jy = ny * m; }
  const joy = $('joy'), knob = $('joyk'), kk = Math.min(1, dd / MAXR);
  joy.style.left = ox + 'px'; joy.style.top = oy + 'px';
  knob.style.transform = `translate(${nx * kk * MAXR}px,${ny * kk * MAXR}px)`;
};
UI.releaseJoy = function () {
  INPUT.active = false; INPUT.pid = null; INPUT.jx = 0; INPUT.jy = 0; INPUT.follow = false;
  $('joy').classList.add('hidden');
};

// HUD の書き換え：前と同じ値なら触らない
function hudText(e, v) { v = String(v); if (e._ht !== v) { e._ht = v; e.textContent = v; } }
function hudStyle(e, k, v) { const c = e._hs || (e._hs = {}); if (c[k] !== v) { c[k] = v; e.style[k] = v; } }
function hudClass(e, k, on) { const c = e._hc || (e._hc = {}); on = !!on; if (c[k] !== on) { c[k] = on; e.classList.toggle(k, on); } }

UI.updateHud = function (dt) {
  if (!G) { bgmSet(0); return; }
  bgmSet(G.state === 'result' || G.necro.dead ? 0 : G.bossAlive.some((b) => !b.dead) ? 2 : 1);
  UI.hudT -= dt;
  if (UI.hudT > 0) return;
  UI.hudT = 0.1;
  const N = G.necro;
  // 変わったときだけ書き換える（スマホで描き直しを減らすため）
  hudText($('lv'), N.lv);
  hudStyle($('xpfill'), 'width', Math.round(200 * N.xp / xpNeed(N.lv)) / 2 + '%');
  hudStyle($('hpfill'), 'width', Math.round(200 * N.hp / N.mhp) / 2 + '%');
  hudText($('hptext'), Math.ceil(N.hp) + ' / ' + N.mhp);
  hudText($('kills'), G.stats.kills);
  // 上の表示：次の大きな出来事までのカウントダウン（「○○の出現まで」）。なければ今の状況と経過時間
  const tm = $('timer');
  const ev = nextEvent();
  let tlab, num, warn = 0;
  if (ev) {
    const left = Math.max(0, ev.t - G.t);
    tlab = ev.kind === 'siege' ? '包囲まで' : ev.name + 'の出現まで';
    if (ev.name === '神') tlab = '神の降臨まで';
    if (ev.name === '次のボス') tlab = '次のボスまで';
    num = fmtTime(Math.ceil(left));
    warn = left <= 10 ? 2 : left <= 30 ? 1 : 0;
  } else {
    const alive = (k) => G.bossAlive.some((b) => b.type === k && !b.dead);
    tlab = G.cleared ? '凱旋できる' : G.rush ? '総攻撃 ― 神の屍を蘇らせよ' : alive('god') ? '神と交戦中' : alive('hero') ? '勇者と交戦中' : '経過';
    num = fmtTime(G.t);
  }
  const key = tlab + '|' + num + '|' + warn;
  if (tm.dataset.k !== key) {
    tm.dataset.k = key;
    tm.innerHTML = `<small>${tlab}</small><span>${num}</span>`;
    tm.classList.toggle('warn', warn === 1);
    tm.classList.toggle('hot', warn === 2);
  }
  // 討伐隊の勢い（節目の直後は「猛攻」）
  const sv = G.t >= 150 ? surgeLevel(G.t) : 0;
  const th = $('threat');
  const tt = G.rush ? '総攻撃' : sv > 0.45 ? '討伐隊 猛攻' : sv > 0.2 ? '討伐隊 攻勢' : '';
  if (th.dataset.t !== tt) { th.dataset.t = tt; th.textContent = tt; th.className = G.rush || sv > 0.45 ? 'hot' : 'warm'; th.style.display = tt ? '' : 'none'; }
  // ボスの体力
  const bb = $('bossbars');
  const bosses = G.bossAlive.filter((b) => !b.dead).concat(G.midAlive.filter((b) => !b.dead));
  const gc = G.godCorpse && !G.godCorpse.dead ? G.godCorpse : null;
  const sig = (gc ? 'R,' : '') + bosses.map((b) => b.id).join(',');
  const bossChanged = UI.bossSig !== sig;
  if (bossChanged) {
    UI.bossSig = sig;
    bb.innerHTML = '';
    // 神の屍のネクロマンス（いちばん上に）
    if (gc) bb.appendChild(el('div', 'bossbar ritual', '<div class="nm"><span>神の屍をネクロマンス</span><span class="rt"></span></div><div class="bar"><i></i></div>'));
    for (const b of bosses) bb.appendChild(el('div', 'bossbar' + (b.mid ? ' mid' : ''), `<div class="nm"><span>${b.mid ? '中ボス ' + MIDBOSS[b.type].name : BOSSES[b.type].name}</span><span>Lv ${b.g}</span></div><div class="bar"><i></i></div>`));
  }
  // 上の表示を縦に積む：カウントダウン → 猛攻の札 → ボスの体力 → バナー（重ならないように）
  // 位置を測る（レイアウトの読み出し）のは、中身か画面の大きさが変わったときだけ
  const layKey = tm.dataset.k + '|' + tt + '|' + sig + '|' + window.innerWidth + 'x' + window.innerHeight;
  if (UI.hudLayKey !== layKey) {
    UI.hudLayKey = layKey;
    const tb = tm.offsetTop + tm.offsetHeight;
    th.style.top = (tb + 3) + 'px';
    bb.style.top = (tb + (tt ? th.offsetHeight + 7 : 5)) + 'px';
    const bnr = $('banners');
    const bt = bosses.length ? Math.round(bb.offsetTop + bb.offsetHeight + 10) + 'px' : '';
    if (bnr.style.top !== bt) bnr.style.top = bt;
    UI.edgeTop = Math.max(108, bb.childElementCount ? bb.offsetTop + bb.offsetHeight + 22 : 0);
  }
  if (gc) {
    const rb = bb.querySelector('.ritual');
    hudStyle(rb.querySelector('i'), 'width', Math.round(200 * (G.godProg || 0) / GOD_RAISE_T) / 2 + '%');
    hudText(rb.querySelector('.rt'), `${Math.floor(G.godProg || 0)} / ${GOD_RAISE_T}秒` + (G.godRitual ? '　儀式中' : '　屍の上で止まる'));
    hudClass(rb, 'on', !!G.godRitual);
  }
  // 倒したボスの亡骸（起こすか朽ちるまで）
  const bc = [];
  if (G.bossCorpses && G.bossCorpses.length) {
    G.bossCorpses = G.bossCorpses.filter((c) => !c.dead && c.decay > 0);
    for (const c of G.bossCorpses) bc.push({ x: c.x, y: c.y + 8, label: c.bossName + 'の亡骸', cls: 'corpse' + (c.mid ? ' mid' : ''), spawnT: c.t0 });
  }
  UI.updateEdgeInds((gc ? [{ x: gc.x, y: gc.y, label: '神の屍', cls: 'ritual', spawnT: G.godCorpseT }] : []).concat(bosses, bc));
  bosses.forEach((b, i) => { const n = bb.children[i + (gc ? 1 : 0)]; if (n) hudStyle(n.querySelector('i'), 'width', Math.round(200 * b.hp / b.mhp) / 2 + '%'); });
  // 窯
  const pots = activePots();
  const badge = $('potbadge');
  if (pots.length) {
    hudClass(badge, 'hidden', false);
    const rem = Math.min(...pots.map((p) => p.remain || 0));
    hudText(badge, Math.ceil(rem) + 's');
  } else hudClass(badge, 'hidden', true);
  const near = nearSite();
  // 窯の近くにいるときは、窯の上に操作の案内を出す
  const sp = $('siteprompt');
  if (near && G.state === 'play' && !G.necro.dead) {
    const k = R.cssK;
    hudStyle(sp, 'left', Math.round((near.x - R.camX) * k) + 'px');
    hudStyle(sp, 'top', Math.round((near.y - 30 - R.camY) * k) + 'px');
    const auto = potUI() === 'D';
    const txt = auto ? '<b>止まる</b>と自動で煮込む' : ctl('sitePrompt');
    if (sp.dataset.t !== txt) { sp.dataset.t = txt; sp.innerHTML = txt; }
    hudClass(sp, 'auto', auto);   // 自動で煮込む案内は押せない
    hudClass(sp, 'hidden', false);
  } else hudClass(sp, 'hidden', true);
  if (UI.demoBar) { const on = !!(G.demo && G.state === 'play'); UI.demoBar.classList.toggle('hidden', !on); document.body.classList.toggle('demo', on); }
  const pb = $('potbtn');
  hudClass(pb, 'busy', !near);
  const lab = near ? '錬金する' : G.sites.length ? '窯 ×' + G.sites.length : '窯なし';
  if (UI.potLab !== lab) { UI.potLab = lab; $('potlabel').textContent = lab; }
  // 被ダメージ演出
  const low = N.hp / N.mhp < 0.3;
  // 赤い縁は、影の形を変えずに濃さ（opacity）だけ変える（描き直しが軽い）
  hudStyle($('hurtfx'), 'opacity', N.hurtT > 0 ? '1' : low ? '0.5' : '0');
  // 状況に応じたヒント
  UI.hintT -= 0.1;
  if (UI.hintT <= 0) hudStyle($('hint'), 'opacity', '0');
  if (G.sites.length && G.stats.synths === 0 && G.t > 3) UI.hintCtl('hintSite', 'site', 7);
  else if (armyRoom() <= 1 && G.stats.synths === 0 && G.sites.length && G.t > 15) UI.hint('軍勢が上限。窯で合成すると枠が空く', 'pot', 8);
  if (G.seenEnemies.cremator && !UI.hints.crem) {
    for (const u of G.units) if (u.type === 'cremator' && u.team === ENEMY && inView(u.x, u.y, 0)) { UI.hint('火葬兵は死体を焼く。優先して倒そう', 'crem', 6); break; }
  }
  if (G.t > 40 && G.stats.raised < 3) UI.hintCtl('hintStop', 'stop', 6);
};

// 画面外のボス・中ボスの方向を、画面の端に名前と距離つきで出す（現れた直後は大きく点滅）
UI.updateEdgeInds = function (list) {
  const box = $('edgeinds');
  const N = G.necro;
  const k = R.cssK;
  const vw = window.innerWidth, vh = window.innerHeight;
  // 上の端の矢印は、カウントダウンとボスの体力の下に出す（重ならないように。位置は updateHud で測ったもの）
  const top = UI.edgeTop || 108, side = 30, bottom = 40;
  UI.edgePool = UI.edgePool || [];
  let n = 0;
  for (const u of list) {
    const sx = (u.x - R.camX) * k, sy = (u.y - 12 - R.camY) * k;
    const fresh = u.spawnT != null && G.t - u.spawnT < 5;
    const onScreen = sx > 10 && sx < vw - 10 && sy > 60 && sy < vh - 10;
    if (onScreen && !fresh) continue;
    let e = UI.edgePool[n];
    if (!e) { e = el('div', 'edgeind', '<i class="ar"></i><span class="lb"></span>'); box.appendChild(e); UI.edgePool[n] = e; }
    n++;
    const cx = vw / 2, cy = vh / 2;
    const dx = sx - cx, dy = sy - cy;
    let px = sx, py = sy;
    if (!onScreen) {
      const kx = (vw / 2 - side) / Math.max(1, Math.abs(dx)), ky = dy < 0 ? (vh / 2 - top) / Math.max(1, -dy) : (vh / 2 - bottom) / Math.max(1, dy);
      const kk = Math.min(kx, ky);
      px = cx + dx * kk; py = cy + dy * kk;
    } else py = Math.max(top, sy - 30);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const cls = 'edgeind ' + (u.cls || (u.mid ? 'mid' : 'boss')) + (fresh ? ' fresh' : '');
    const nm = u.label || (u.mid ? MIDBOSS[u.type].name : BOSSES[u.type].name);
    const d = Math.round(dist(u.x, u.y, N.x, N.y) / 10);
    const t = `${nm} ${d}m`;
    const lb = e._lb || (e._lb = e.querySelector('.lb'));
    hudText(lb, t);
    hudStyle(e, 'display', '');
    // 名前の札の大きさは、名前か見た目が変わったときだけ測る（毎回測ると重い）
    if (e.className !== cls || e._nm !== nm) { e.className = cls; e._nm = nm; e._hw = (e.offsetWidth || 90) / 2 + 8; e._hh = (e.offsetHeight || 36) / 2 + 2; }
    const hw = e._hw || 49, hh = e._hh || 20;
    hudStyle(e, 'left', Math.round(clamp(px, hw, vw - hw)) + 'px');
    hudStyle(e, 'top', Math.round(clamp(py, Math.max(hh, 64), vh - hh)) + 'px');
    hudStyle(e._ar || (e._ar = e.querySelector('.ar')), 'transform', `rotate(${Math.round(ang / 3) * 3}deg)`);
  }
  for (let i = n; i < UI.edgePool.length; i++) hudStyle(UI.edgePool[i], 'display', 'none');
};

// タイトルロゴの大きさ（横幅の9割・縦の4割に収まる最大の整数倍）
UI.fitLogo = function () {
  const img = document.querySelector('#title .logoimg');
  if (!img) return;
  const k = Math.max(1, Math.min(6, Math.floor(Math.min(window.innerWidth * 0.9 / LOGO_W, window.innerHeight * 0.4 / LOGO_H))));
  img.style.width = LOGO_W * k + 'px';
  img.style.height = LOGO_H * k + 'px';
};
window.addEventListener('resize', () => UI.fitLogo());

UI.hint = function (text, key, dur) {
  if (key && UI.hints[key]) return;
  UI.hintCtlKey = null;
  if (key) UI.hints[key] = true;
  const h = $('hint');
  h.textContent = text;
  hudStyle(h, 'opacity', '1');
  UI.hintT = dur || 5;
};

UI.banner = function (text, sub, kind) {
  const b = $('banners');
  if (!b) return;
  const n = el('div', 'banner ' + (kind || 'info'), `<div class="t">${text}</div>${sub ? `<div class="s">${sub}</div>` : ''}`);
  b.appendChild(n);
  while (b.childElementCount > 2) b.removeChild(b.firstChild);
  setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, 2900);
};

UI.showReturn = function (on) { const b = $('returnbtn'); b.classList.toggle('hidden', !on); delete b.dataset.armed; b.textContent = ctl('returnBtn'); };

// =========================================================
// レベルアップ
// =========================================================
UI.openLevelUp = function () {
  if (!G || G.pendingLv <= 0) return;
  G.state = 'levelup';
  UI.releaseJoy();
  UI.lvChoices = rollChoices();
  // キーボードは Space で窯を開こうとしていた手がそのまま押さないよう、少し長めに待つ（演出の間はさらに待つ）
  UI.lvLock = performance.now() + (inputMode() === 'kb' || inputMode() === 'kbm' ? 450 : 280);
  showScreen('levelup', true);
  UI.renderLevelUp('open');
};

// mode：演出の種類（'open' 最初・'next' 続けてのレベルアップ・'reroll' 引き直し）。なければ演出なし
UI.renderLevelUp = function (mode, old) {
  const s = $('levelup');
  s.innerHTML = '';
  const p = el('div', 'panel');
  p.appendChild(el('h2', '', `レベルアップ <span style="color:var(--green)">Lv ${G.necro.lv - G.pendingLv + 1}</span><span class="sub">${ctlEl('lvSub')}${G.pendingLv > 1 ? '（残り ' + G.pendingLv + '）' : ''}</span>`));
  const cards = el('div', 'cards');
  UI.lvChoices.forEach((c) => {
    const info = choiceInfo(c);
    const cat = CAT[info.cat];
    const card = el('button', 'card' + (c.type === 'evo' ? ' evo' : c.type === 'lead' ? ' lead' : ''));
    card.dataset.col = cat.color;
    card.appendChild(el('span', 'cat', cat.name)).style.background = cat.color;
    if (info.isNew) card.appendChild(el('span', 'new', c.type === 'evo' ? '秘術' : 'NEW'));
    // アイコン（ドット絵）と名前・段階
    const hd = el('div', 'chd');
    const ic = el('div', 'cic');
    ic.appendChild(spriteIcon(choiceIcon(c), 0, 3));
    hd.appendChild(ic);
    const tx = el('div', 'ctx');
    tx.appendChild(el('div', 'nm', info.name));
    if (info.max > 1) {
      const pips = el('div', 'pips');
      for (let i = 1; i <= info.max; i++) pips.appendChild(el('i', i < info.lv ? 'on' : i === info.lv ? 'nx' : ''));
      tx.appendChild(pips);
    }
    hd.appendChild(tx);
    card.appendChild(hd);
    card.appendChild(el('div', 'ds', info.desc + (info.req ? `<br><span class="small">${info.req}</span>` : '') + (info.note ? `<br><span class="small">${info.note}</span>` : '')
      + (info.master ? `<br><span class="small mst">最大Lv：さらに強化</span>` : '')));
    // 道の歩み（このカードを選んだ後）
    if (info.path) {
      const P = info.path;
      const pp = el('div', 'cpath' + (P.up ? ' up' : ''));
      pp.style.setProperty('--pc', cat.color);
      let pips = '';
      for (let i = 1; i <= 3; i++) pips += `<i class="${i <= P.tier ? 'on' : ''}"></i>`;
      pp.innerHTML = `<span class="pn">${P.name}</span><span class="tp">${pips}</span><span class="pt">${P.maxed ? '極み' : `Lv計 ${P.pts}/${P.next}`}</span><span class="pq">効果</span>`
        + (P.up ? `<div class="pu">位階${TIER_NAMES[P.tier]}：${P.up}</div>` : '');
      // 道の行を押すと、その道の効果を出す（カードは選ばない）
      UI.bindTip(pp, pathTipHtml(P.cat, P.pts, P.pts - 1), cat.color);
      card.appendChild(pp);
    }
    card.addEventListener('click', () => {
      if (performance.now() < UI.lvLock) return;
      // まだ飛んでいる途中（着地していない）カードは選べない（重い端末で演出が遅れたとき）
      // ただし演出の終わりを大きく過ぎても着地しないときは、着地させてから選ぶ（選べないまま止まらないように）
      if (card.style.opacity === '0') { if (performance.now() < LVFX.endAt + 800) return; UI.lvfxSkip(); }
      UI.lvfxSkip();
      UI.lvfxPick(card);
      applyChoice(c);
      G.pendingLv--;
      if (G.pendingLv > 0) { UI.lvChoices = rollChoices(); UI.lvLock = performance.now() + 200; UI.renderLevelUp('next'); }
      else UI.closeLevelUp();
    });
    cards.appendChild(card);
  });
  p.appendChild(cards);
  // 引き直し（祭壇「運命の書き換え」）
  if ((G.rerolls || 0) > 0) {
    const rb = el('button', 'btn rerollbtn', `引き直す <small>残り ${G.rerolls}</small>`);
    rb.addEventListener('click', () => {
      if (performance.now() < UI.lvLock || !(G.rerolls > 0)) return;
      UI.lvfxSkip();
      // 今のカードは窯へ吸い込まれ、新しいカードが噴き上がる
      const old = [...s.querySelectorAll('.cards .card')].map((c) => lvfxClone(c));
      G.rerolls--;
      UI.lvChoices = rollChoices();
      UI.lvLock = performance.now() + 200;
      sfx('ui');
      UI.renderLevelUp('reroll', old);
    });
    p.appendChild(rb);
  }
  p.appendChild(UI.ownedSkillsEl());
  s.appendChild(p);
  if (mode) UI.lvfxPlay(mode, old);
  else if (old) for (const g of old) g.el.remove();
};

// 術式の今の様子（説明の窓に添える）
function skillStatusHtml(k) {
  if (k === 'blood') {
    const n = G.linN || [0, 0, 0], L = ['bu', 'sha', 'jutsu'];
    const t = (i) => `<b style="color:${L[i] === G.mainLin ? 'var(--green)' : 'var(--mute)'}">${LIN[L[i]].name} ${n[i]}</b>`;
    return `<div class="dim">今：${t(0)}・${t(1)}・${t(2)}　${G.mainLin ? `強まっているのは${LIN[G.mainLin].name}系` : ''}</div>`;
  }
  if (k === 'harmony') {
    const n = G.linN || [0, 0, 0], L = ['bu', 'sha', 'jutsu'];
    const f = G.harmonyF || 0;
    return `<div class="dim">今：${L.map((l, i) => `<b style="color:${LIN[l].color}">${LIN[l].name} ${n[i]}</b>`).join('・')}　効き目 <b style="color:${f >= 1 ? 'var(--green)' : 'var(--bone)'}">${Math.round(100 * f)}%</b>（+${Math.round(100 * G.mods.harmony * f)}%）</div>`
      + (f < 1 ? `<div class="dim">一番少ない系統が軍勢の ${Math.round(100 * TU.harmony_share)}% になると満額</div>` : '');
  }
  if (k === 'kinship') {
    const n = G.linN || [0, 0, 0], L = ['bu', 'sha', 'jutsu'];
    return `<div class="dim">今：${L.map((l, i) => `<b style="color:${LIN[l].color}">${LIN[l].name} ${n[i]}体 +${Math.round(100 * G.mods.kinship * kinshipF(l))}%</b>`).join('・')}</div>`;
  }
  if (k === 'apex') {
    const M = G.mods;
    return `<div class="dim">武：前方の扇（左右${Math.round(M.apexArc)}°・奥行き+${Math.round(M.apexReach)}）をなぎ払う</div><div class="dim">射：太さ+${Math.round(M.apexWide)}の矢で敵を貫く</div><div class="dim">術：当てた所の円（半径${Math.round(M.apexJr)}）に広がる。もとから範囲の術は範囲 +${Math.round(100 * M.apexJgrow)}%</div>`
      + (G.stats.apexSweep || G.stats.apexPierce || G.stats.apexBlast ? `<div class="dim">この出撃で巻き込んだ敵：武 ${G.stats.apexSweep || 0}・射 ${G.stats.apexPierce || 0}・術 ${G.stats.apexBlast || 0}</div>` : '');
  }
  if (k === 'deathless' && G.stats.deathless) return `<div class="dim">この出撃で耐えた回数：${G.stats.deathless}</div>`;
  if (k === 'yomigaeri' && G.stats.yomigaeri) return `<div class="dim">この出撃で黄泉帰った数：${G.stats.yomigaeri}</div>`;
  if (k === 'kingaura') { let n = 0; for (const u of G.units) if (u.team === ALLY && !u.dead && inKingAura(u)) n++; return `<div class="dim">今、範囲の中の味方：${n}体（地面の金の輪）</div>`; }
  if (k === 'twinpot' && G.stats.twins) return `<div class="dim">この出撃で双子になった合成：${G.stats.twins}</div>`;
  if (k === 'infect' && G.stats.infected) return `<div class="dim">この出撃でその場で配下にした数：${G.stats.infected}</div>`;
  return '';
}

// 統率力の全段階（上の段階は下の段階の動きもすべて行う）。cur：今の段階。showNext：次の段階に「次」の印
function leadListHtml(cur, showNext) {
  let h = '<div class="leadlist">';
  for (let i = 1; i <= LEAD_MAX; i++) {
    const L = LEADERSHIP[i], on = i <= cur, nx = showNext && i === cur + 1;
    h += `<div class="${on ? 'pon' : nx ? 'pnx' : 'poff'}">${on ? '◆' : '◇'} ${L.name}：${L.desc}${nx ? ' <b class="pnew">次</b>' : ''}</div>`;
  }
  return h + `<div class="lnote">段階が上がっても下の段階の動きはそのまま。1段階ごとに軍勢の攻撃・守り +${Math.round(TU.lead_bonus * 100)}%（今 +${Math.round(TU.lead_bonus * 100 * cur)}%）</div></div>`;
}

// 道の説明（位階ごとの効果）。before があれば「選ぶと before → pts」として、新しく届く位階に印を付ける
function pathTipHtml(c, pts, before) {
  const P = PATHS[c], t = pathTierOf(c, pts);
  const t0 = before == null ? t : pathTierOf(c, before);
  const lines = P.tiers.map((d, i) => {
    const on = i < t, nw = i >= t0 && on;
    return `<div class="${on ? 'pon' : 'poff'}">${on ? '◆' : '◇'} 位階${TIER_NAMES[i + 1]}（Lv計${P.pts[i]}）：${d}${nw ? ' <b class="pnew">到達</b>' : ''}</div>`;
  }).join('');
  const sub = before != null ? `選ぶとLv計 ${before} → ${pts}` : pts ? `${CAT[c].name}の術式のLv合計 ${pts}` : `まだ歩んでいない（${CAT[c].name}の術式で進む）`;
  return `<div class="tph"><b>${P.name}</b><span class="dim">${sub}</span></div>${lines}`;
}

// 持っている強化の一覧（アイコン付き）。カーソルを合わせる（スマホはタップ）と、そのすぐ上に小さな説明の窓が出る
// 説明は一覧の外（画面の一番上の層）に浮かせるので、レベルアップの窓の大きさは変わらない
UI.ownedSkillsEl = function () {
  UI.hideTipPop();
  const o = el('div', 'owned');
  const chip = (it) => {
    const b = el('span', 'oc' + (it.icon ? '' : ' op') + (it.off ? ' off' : ''));
    b.style.borderColor = it.col;
    if (it.icon) b.appendChild(spriteIcon(it.icon, 0, 2));
    else b.style.color = it.col;
    b.appendChild(el('span', '', it.label));
    UI.bindTip(b, it.tip, it.col);
    return b;
  };
  // 1. 持っている強化（術式・補助・秘術）
  const mine = [];
  for (const k in G.skills) {
    const S = SKILLS[k], lv = G.skills[k];
    mine.push({ icon: 'ic_' + k, label: `${S.name} ${lv}`, col: CAT[S.cat].color,
      tip: `<div class="tph"><b>${S.name}</b><span class="dim">${CAT[S.cat].name}・Lv${lv}/${S.max}</span></div><div>${S.desc(skillEff(k, lv))}</div>` + skillStatusHtml(k) });
  }
  for (const k in G.evos) {
    const E = EVOS[k];
    mine.push({ icon: 'ic_' + k, label: `★${E.name}`, col: CAT.evo.color, tip: `<div class="tph"><b>★${E.name}</b><span class="dim">秘術</span></div><div>${E.desc}</div>` });
  }
  // 見出し（枠の数。1行で固定）
  o.appendChild(el('div', 'ohead oslots', `<span class="olab">持っている強化</span><span class="slots">術式 ${ownedCount(false)}/${MAX_SKILL_SLOTS}・補助 ${ownedCount(true)}/${MAX_SUB_SLOTS}</span>${ctlEl('ownedHint', 'span', 'dim')}`));
  const g1 = el('div', 'ochips omine');
  if (mine.length) for (const it of mine) g1.appendChild(chip(it));
  else g1.appendChild(el('span', 'dim onone', 'まだ強化を持っていない'));
  o.appendChild(g1);

// 説明の窓を付ける：マウスは乗せている間だけ出す／タッチはタップで出す（もう一度タップか、ほかの所をタップで消す）
// キーボードで選んだ時も出す（UI.kbFocus から呼ぶ）
UI.bindTip = function (b, html, col) {
  b.classList.add('tipt');
  b._tip = { html, col };
  b.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && UI.tipPin !== b) UI.showTipPop(b, html, col); });
  b.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && UI.tipPin !== b) UI.hideTipPop(); });
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (UI.tipPin === b) { UI.hideTipPop(); return; }
    UI.showTipPop(b, html, col);
    UI.tipPin = b;
  });
};
// 小さな説明の窓（画面の一番上の層。指した物のすぐ上、入らなければ下に出す）
UI.showTipPop = function (anchor, html, col) {
  let p = $('tippop');
  if (!p) { p = el('div', 'tippop'); p.id = 'tippop'; document.body.appendChild(p); }
  for (const x of document.querySelectorAll('.tipt.on')) x.classList.remove('on');
  anchor.classList.add('on');
  UI.tipPin = null;
  UI.tipAnchor = anchor;
  p.innerHTML = html;
  p.style.setProperty('--tc', col || 'var(--line)');
  p.classList.remove('hidden', 'below');
  p.style.left = '0px'; p.style.top = '0px';
  p.style.visibility = 'hidden';
  p.classList.add('on');
  const r = anchor.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  const w = p.offsetWidth, h = p.offsetHeight, m = 8, gap = 9;
  let top = r.top - h - gap, below = false;
  if (top < m) { top = r.bottom + gap; below = true; }
  if (below && top + h > vh - m) top = Math.max(m, vh - m - h);
  const cx = r.left + r.width / 2;
  const left = Math.round(Math.min(Math.max(m, cx - w / 2), vw - w - m));
  p.style.left = left + 'px';
  p.style.top = Math.round(top) + 'px';
  p.style.setProperty('--ax', Math.round(Math.min(Math.max(10, cx - left), w - 10)) + 'px');
  p.classList.toggle('below', below);
  p.style.visibility = '';
};
UI.hideTipPop = function () {
  const p = $('tippop');
  if (p) p.classList.remove('on');
  if (UI.tipAnchor) UI.tipAnchor.classList.remove('on');
  UI.tipAnchor = null;
  UI.tipPin = null;
};
// ほかの所を触った・スクロールした・大きさが変わったら消す
document.addEventListener('pointerdown', (e) => { if (UI.tipAnchor && !(e.target.closest && e.target.closest('.tipt'))) UI.hideTipPop(); }, true);
document.addEventListener('scroll', () => { if (UI.tipAnchor) UI.hideTipPop(); }, true);

function linTag(l) { return l ? `<span class="tag" style="background:${LIN[l].color}">${LIN[l].name}</span>` : ''; }
function colTag(c) { return `<span class="tag" style="background:${['#c88a7a', '#e6e1cf', '#8ff0cf'][c]}">${COL_NAMES[c]}</span>`; }
function starTag(r) { return r ? `<span class="star r${r}">★${r}</span>` : ''; }
function affixTag(k, dim) { return k ? `<span class="afx${dim ? ' dim' : ''}" style="color:${AFFIXES[k].color};border-color:${AFFIXES[k].color}">〈${AFFIXES[k].name}〉</span>` : ''; }
function rankCol(rk) { return rk ? 'rgb(' + RANK_RGB[rk].join(',') + ')' : 'var(--bone)'; }

// グループのうち、メインに選ばれていない死者（サブに使える）。格の高い順
UI.subPool = function (g) { return g.list.filter((u) => !u.dead && UI.potMains.indexOf(u) < 0); };
UI.mainsOf = function (g) { return UI.potMains.filter((u) => u && g.list.indexOf(u) >= 0).length; };
UI.selectedSubs = function () {
  const out = [];
  for (const g of UI.potGroups) {
    const n = UI.potSel.get(g.key) || 0;
    if (!n) continue;
    const pool = UI.subPool(g);
    for (let i = 0; i < n && i < pool.length; i++) out.push(pool[pool.length - 1 - i]); // 格の低いほうから
  }
  return out;
};
UI.clampSubs = function () { for (const h of UI.potGroups) { const n = UI.potSel.get(h.key) || 0; if (n) UI.potSel.set(h.key, Math.min(n, UI.subPool(h).length)); } };
UI.setSubs = function (list) {
  UI.potSel = new Map();
  const want = new Set(list.slice(0, subCap()));
  for (const g of UI.potGroups) {
    let n = 0;
    for (const u of UI.subPool(g)) if (want.has(u)) n++;
    if (n) UI.potSel.set(g.key, n);
  }
};
UI.mainList = function () { return UI.potMains.filter((u) => u && !u.dead); };

// メインを選ぶ（手順1）。タイルをタップするたびに：なし → メイン → メイン×2（同じ種類2体＝同族合成）→ なし
// 2体そろうとサブ選び（手順2）へ進む。メインを変えたいときは上の枠の×で外すと手順1に戻る
UI.pickMain = function (g) {
  UI.potMains = UI.potMains.filter((u) => u && !u.dead);
  const mine = UI.potMains.filter((u) => g.list.indexOf(u) >= 0);
  const pool = g.list.filter((u) => !u.dead && UI.potMains.indexOf(u) < 0);
  const full = UI.potMains.length >= 2;
  let r = 'add';
  if (mine.length === 0) {
    if (full) return 'full';
    if (!pool.length) return 'none';
    UI.potMains.push(pool[0]);
  } else if (mine.length === 1 && !full && pool.length) {
    UI.potMains.push(pool[0]);
  } else {
    UI.potMains = UI.potMains.filter((u) => mine.indexOf(u) < 0);
    r = 'remove';
  }
  UI.clampSubs();
  if (UI.flowAuto) UI.potMode = UI.mainList().length === 2 ? 'sub' : 'main';
  return r;
};
UI.removeMain = function (i) {
  UI.potMains = UI.potMains.filter((u) => u && !u.dead);
  UI.potMains.splice(i, 1);
  UI.clampSubs();
  // メイン設定に戻るときは、選んでいたサブも外す
  if (UI.flowAuto) { UI.potMode = 'main'; UI.potSel = new Map(); UI.subAuto = null; UI.lastGroup = null; }
};
// 手順を進める／戻る
UI.potStep = function (m) {
  if (m === 'sub' && UI.mainList().length !== 2) return;
  UI.potMode = m;
  UI.potFocus = null;
  UI.refreshPot();

};

// サブに入れたときに伸びる能力（上位2つ）を色つきの小さな札で
const STAT_COL = { hp: '#ff8a7a', atk: '#ffb84a', spd: '#6ad8ff', as: '#ffe066', size: '#c79bff' };
function growChips(gr, n) {
  const ks = STATS.filter((k) => gr && gr[k] > 0).sort((a, b) => gr[b] - gr[a]).slice(0, n || 2);
  const f = (v) => (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10);
  return ks.map((k) => `<i class="gc" style="color:${STAT_COL[k]};border-color:${STAT_COL[k]}">${STAT_SHORT[k]}+${f(gr[k])}</i>`).join('');
}
const POT_FILTERS = [['all', '全部'], ['syn', '合成体'], ['bu', '武'], ['sha', '射'], ['jutsu', '術']];
function potFilterOk(g) {

}

    const m1 = UI.potMode === 'main';
    const left = 2 - mains.length;
    const cap = subCap(), nSub = UI.selectedSubs().length;
    const capTxt = `<b>${nSub}/${cap}</b>体`;
    const msg = UI.flowAuto
      ? (m1 ? `メインを選ぶ<small>あと${left}体</small>` : `サブで強化<small>${capTxt}</small>`)
      : m1
      ? (left > 0 ? `メインを<b>${left}体</b>選んでください` : UI.autoSubs ? `サブは自動で入った。<b>煮込む</b>でOK` : '<b>決定 ▶</b> を押してサブ選びへ')
      : `サブを選ぶ<small>${capTxt}・0体でもよい</small>`;
    st.innerHTML = `<span class="sp ${m1 ? 'on' : 'done'}">① メイン</span><span class="arr">▶</span><span class="sp ${m1 ? '' : 'on'}">② サブ</span><span class="msg">${msg}</span>`;
    if (UI.lastMode !== UI.potMode) { st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash'); UI.lastMode = UI.potMode; }
    if (UI.potWarn) { st.querySelector('.msg').innerHTML = 'メインは2体まで。外すには<b>枠</b>を押す'; st.classList.add('warn'); UI.potWarn = 0; }
    else if (UI.subWarn) { st.querySelector('.msg').innerHTML = `サブは今<b>${cap}体</b>まで<small>Lv${subCapLv(cap + 1)}で${cap + 1}体</small>`; st.classList.add('warn'); UI.subWarn = 0; }
    else st.classList.remove('warn');
  }
  // 操作ボタン
  const ok = $('potok');
  if (ok) ok.disabled = mains.length !== 2;
  const go1 = $('potgo1');
  if (go1) go1.disabled = mains.length !== 2;
  if (potUI() === 'E' && UI.potMode === 'sub') UI.renderSlider();
  const clr1 = $('potclr1');
  if (clr1) clr1.disabled = !mains.length;
  // メインの枠
  const slots = $('potslots');
  if (slots) {
    slots.innerHTML = '';
    for (let i = 0; i < 2; i++) {
      const u = mains[i] || null;
      const act = UI.potMode === 'main' && i === mains.length;
      const sl = el('button', 'mslot2' + (u ? ' on' : '') + (act ? ' act' : ''));
      const ic = el('div', 'ic');
      if (u) ic.appendChild(spriteIcon(u.spr, 0, UI.potLarge ? 2 : 1));
      sl.appendChild(ic);
      sl.appendChild(el('div', 'tx', u ? `<div class="n">${unitTitle(u)}</div><div class="g">${starTag(unitSpRank(u))}<b style="color:${rankCol(unitRank(u))}">Lv${u.g}</b> ${linTag(u.lin)}${colTag(unitCol(u))}</div>` : `<div class="n dim">メイン${i + 1}</div><div class="g dim">${act ? '下のタイルから選ぶ' : '　'}</div>`));
      if (u && (UI.potMode === 'main' || UI.flowAuto)) { const x = el('span', 'x', '×'); sl.appendChild(x); x.addEventListener('click', (e) => { e.stopPropagation(); UI.removeMain(i); UI.refreshPot(); sfx('ui'); }); }
      // 入っているメインの枠を押すと、そのメインを外す（×を押さなくてよい）
      sl.addEventListener('click', () => {
        if (u && (UI.potMode === 'main' || UI.flowAuto)) { UI.removeMain(i); UI.refreshPot(); sfx('ui'); return; }
        if (!UI.flowAuto && UI.potMode !== 'main') UI.potStep('main');
      });
      if (u && UI.flowAuto && UI.potMode === 'sub') sl.title = '押すと外してメインを選び直せる';
      slots.appendChild(sl);
    }
  }
  // タイル
  const one = mains.length === 1 ? mains[0] : null;
  for (const T of UI.potTiles || []) {
    const { g, t, cnt, mark } = T;
    const pool = UI.subPool(g).length;
    const n = Math.min(UI.potSel.get(g.key) || 0, pool);
    const m = UI.mainsOf(g);
    if (UI.potMode === 'sub') cnt.textContent = n ? n + '/' + pool : '×' + pool;
    else cnt.textContent = '×' + g.list.length;
    t.classList.toggle('sel', n > 0);
    t.classList.toggle('main', m > 0);
    t.classList.toggle('focus', UI.potFocus === g.key);
    mark.textContent = m > 0 ? (m > 1 ? 'メイン×2' : 'メイン') : n > 0 && UI.potMode !== 'sub' ? 'サブ' + n : '';
    let isNew = false;
    if (UI.potMode === 'main' && one && m <= 1 && pool) {
      const r = synthPreview([one, UI.subPool(g)[0]], []);
      isNew = !!r && !r.known;
    }
    t.classList.toggle('new', isNew);
    t.classList.toggle('dimmed', UI.potMode === 'sub' && pool === 0);
  }
  UI.updatePotInfo();
  UI.updatePotPreview();
};

// 選んだ（最後に触った）タイルの説明
UI.updatePotInfo = function () {
  const box = $('potinfo');
  if (!box) return;
  const g = UI.potGroups.find((x) => x.key === UI.potFocus);
  if (!g) {
    box.innerHTML = ctl('potIdle');
    box.innerHTML += UI.potKbHelp();

  }
  const u = g.list[0];

  const sa = g.subAffix && !g.syn ? '　半分以上で' + affixTag(g.subAffix, true) : '';
  let mainTxt = '';

  if (UI.potMode === 'main' && one && UI.mainsOf(g) <= 1 && UI.subPool(g).length) {
    const r = synthPreview([one, UI.subPool(g)[0]], []);
    if (r) mainTxt = `<div>2体目にすると → <b>${r.known ? SYNTH[r.key].name : '？？？'}</b> ${starTag(r.rank)}${r.known ? '' : ' <b class="nw">新種</b>'}</div>`;
  }
  box.innerHTML = `<div class="ihead"><b>${g.title}</b>${g.form ? `<span class="dim">${g.form}</span>` : ''} ${starTag(g.rank)}<span style="color:${rankCol(unitRank(u))}">Lv${lo === hi ? hi : lo + '〜' + hi}</span> ${linTag(g.lin)}${colTag(g.col)} ${gradeTags(u)}</div>`
    + mainTxt
    + `<div class="dim">サブで伸びる：<span class="gw">${growText(g.grow) || 'なし'}</span>${sa}</div>` + UI.potKbHelp();
};
// キーボードの案内（PCだけ。説明の欄の一番下に、いつも同じ1行で出す）
UI.potKbHelp = function () {
  const t = ctl('potKb');
  return t ? '<div class="dim kbhelp">' + t + '</div>' : '';
};

// サブおまかせ：押すたびに次の選び方へ（バランス・体力重視・…・亜種狙い）
UI.cycleSub = function (forceIdx) {
  const mains = UI.mainList();
  if (mains.length !== 2) return;
  if (!UI.subAuto) UI.subAuto = { list: subPlanList(mains), i: forceIdx != null ? forceIdx - 1 : -1 };
  const A = UI.subAuto;
  if (!A.list.length) { UI.setSubs([]); UI.refreshPot(); return; }
  A.i = (A.i + 1) % A.list.length;
  UI.setSubs(A.list[A.i].subs);
  UI.lastGroup = null;
  UI.refreshPot();
  if (forceIdx == null) sfx('ui');
};
UI.autoPick = function () { UI.subAuto = null; UI.cycleSub(); };
UI.refreshRows = function () { UI.refreshPot(); };

// 次の格の色（銅・銀・金・紫）まで、あと何体サブを入れればよいか
UI.potGuide = function (mains, subs, r) {
  const lv = G.necro.lv;
  const rk = rankOfG(r.outG);
  const lo = rk ? Math.ceil(RANK_CUT[rk - 1] * lv) : 1;
  const hi = rk < 4 ? Math.ceil(RANK_CUT[rk] * lv) : null;
  const col = (k) => k ? 'rgb(' + RANK_RGB[k].join(',') + ')' : 'var(--dim)';
  const subSet = new Set(subs);
  let grp = UI.potGroups.find((g) => g.key === UI.lastGroup);
  if (!grp) { let best = 0; for (const g of UI.potGroups) { const n = UI.potSel.get(g.key) || 0; if (n > best) { best = n; grp = g; } } }
  let nextTxt = '';
  if (hi == null) nextTxt = '最上位';
  else if (grp) {
    const pool = UI.subPool(grp).filter((u) => !subSet.has(u));
    pool.sort((a, b) => a.g - b.g);
    let need = 0;
    for (let k = 1; k <= pool.length; k++) {
      const p = synthPreview(mains, subs.concat(pool.slice(0, k)));
      if (p && rankOfG(p.outG) > rk) { need = k; break; }
    }
    nextTxt = need ? `${RANK_NAME[rk + 1]}まで：サブ ${grp.title}×${need}` : `${RANK_NAME[rk + 1]}までLv +${hi - r.outG}`;
  } else nextTxt = `${RANK_NAME[rk + 1]}までLv +${hi - r.outG}`;
  const fill = hi == null ? 100 : Math.round(clamp((r.outG - lo) / Math.max(1, hi - lo), 0, 1) * 100);
  return `<div class="rankbar"><span class="rk" style="color:${col(rk)}">${RANK_NAME[rk]}</span><div class="bar"><i style="width:${fill}%;background:${col(Math.min(4, rk + 1))}"></i></div><span class="nx" style="color:${col(Math.min(4, rk + 1))}">${nextTxt}</span></div>`;
};

function synthSpr(key) { return 'syn_' + key; }

// 能力の得意・苦手（S〜D）と役割
function roleInfo(src) {
  let R = null, name = '';
  if (typeof src === 'string') { const S = SYNTH[src]; if (S && S.role) { R = ROLES[S.role]; name = R.name; } else if (S && S.unique) name = 'ボス'; }
  else if (src.kind === 'syn') return roleInfo(src.synKey);
  else if (ALLY_ROLE[src.type]) { R = ALLY_ROLE[src.type]; name = ''; }
  else if (src.isBoss) name = 'ボス';
  return { R, name };
}
function gradeTags(src) {
  const { R, name } = roleInfo(src);
  if (!R) return name ? `<span class="rolet">${name}</span>` : '';
  const g = [['体', R.hp], ['攻', R.atk], ['速', R.spd], ['手', R.as]].map(([k, m]) => { const gr = gradeOf(m); return `<span class="grd g${gr}">${k}${gr}</span>`; }).join('');
  return (name ? `<span class="rolet">${name}</span>` : '') + g;
}

// 亜種の説明（いまの亜種と、あと何体で亜種になるか）
function affixLine(r) {
  // 1行目：亜種の名前（どこから来たか）／2行目：効果だけ
  const ai = r.affixInfo;
  const two = (head, body, dimHead) => `<div class="ah${dimHead ? ' dim' : ''}">${head}</div><div class="af">${body}</div>`;
  if (r.affix) {
    const from = r.affixFrom === 'sub' ? (ai.boss ? 'ボスをサブに' : (ETYPES[ai.top] ? ETYPES[ai.top].name : '') + ' ' + ai.n + '/' + ai.total) : 'メインから受け継ぐ';
    return two(`亜種 ${affixTag(r.affix)}<span class="dim">（${from}）</span>${r.affixKnown ? '' : ' <b class="nw">新</b>'}`, AFFIXES[r.affix].feat);
  }
  const cap = subCap();
  if (cap < 3) return two('亜種なし', `<span class="dim">亜種はサブ3体から（Lv${subCapLv(3)}〜）</span>`, true);
  if (ai.top && ETYPES[ai.top]) {
    const over = ai.total + ai.need > cap;
    return two(`亜種なし<span class="dim">：${ETYPES[ai.top].name}をあと${ai.need}体で</span> ${affixTag(ai.top, true)}`, `<span class="dim">${over ? 'サブの上限を超える（入れ替えが要る）' : (AFFIXES[ai.top] ? AFFIXES[ai.top].feat : '')}</span>`);
  }
  return two('亜種なし', '<span class="dim">同じ種類のサブが半分以上で亜種</span>', true);
}

// 煮込み時間の色：あなたのLvを超えるほど（Lv差による伸びが大きいほど）黄→赤
function simmerCol(r) { return r.gapMul <= 1.001 ? 'var(--green)' : r.gapMul < 2.5 ? 'var(--gold)' : 'var(--red)'; }
// 煮込みが長い理由（Lv差による伸び）
function simmerGapText(r) {
  if (!(r.gap > 0)) return '';
  const tr = G && G.mods && G.mods.transcend > 0;
  if (!(r.gapMul > 1.001) && !tr) return '';
  const m = r.gapMul < 10 ? r.gapMul.toFixed(1) : Math.round(r.gapMul);
  return `<small class="gapx" style="color:${simmerCol(r)}">（Lv差 +${r.gap}${tr ? '・境界の超越' : ''} で ×${m}）</small>`;
}

// 合成結果の窓：何ができるかをいちばん大きく見せる
const RES_GLOW = [null, '#c8c0d0', '#ff6a6a', '#6aa8ff', '#ffd24a', '#c79bff'];
function resKindTags(r) {
  if (r.key.startsWith('l:')) return '<span class="rkind legend">伝承の死霊</span>';
  if (r.key.startsWith('k:')) return '<span class="rkind">同族合成</span>';
  if (r.key.startsWith('u:')) return '<span class="rkind boss">堕ちたボス</span>';
  const S = SYNTH[r.key];
  return S.cross ? `${linTag(S.lin)}<span class="rx">×</span>${linTag(S.cross)}` : `${linTag(S.lin)}<span class="rx">×</span>${linTag(S.lin)}`;
}
// 下見：メインが1体のとき、2体目の候補（カーソル・キーボードで選んでいるタイル）を入れた結果を見せる
// まだ選んではいないので、手順はメイン選びのまま（サブ解除・おまかせ・煮込むは出さない）
UI.peekUnit = function (g) {
  if (!g || UI.potMode !== 'main') return null;
  const mains = UI.mainList();
  if (mains.length !== 1) return null;
  const mine = g.list.filter((u) => mains.indexOf(u) >= 0);
  const pool = g.list.filter((u) => !u.dead && mains.indexOf(u) < 0);
  if (mine.length > 0 && !pool.length) return null;   // 押すと外れるタイル
  return pool[0] || null;
};
UI.setPotPeek = function (g) {
  if (g && !UI.peekUnit(g)) g = null;
  if (UI.potPeek === g) return;
  UI.potPeek = g;
  UI.updatePotPreview();
};
UI.updatePotPreview = function () {
  const pv = $('potpreview');
  if (!pv) return;
  let mains = UI.mainList();
  const subs = UI.selectedSubs();
  // マウスで合わせているタイル、なければキーボードで選んでいるタイル
  const kbG = typeof KB !== 'undefined' && KB.el && KB.el._g && KB.el.isConnected && KB.el.classList.contains('kbf') ? KB.el._g : null;
  const cand = mains.length === 1 ? UI.peekUnit(UI.potPeek || kbG) : null;
  if (!cand) UI.potPeek = null;
  if (cand) mains = [mains[0], cand];
  const peek = !!cand;
  const r = synthPreview(mains, subs);
  pv.classList.toggle('peek', peek);
  const B = UI.subAuto;
  const sub = $('potressub');
  const go = $('potgo');
  if (go) go.disabled = !r;
  const resWin = $('potres');
  if (!r) {
    if (sub) sub.textContent = '';
    if (resWin) resWin.classList.remove('has');
    const slot = (u, i) => `<div class="eslot${u ? ' on' : ''}" data-i="${i}">${u ? '' : 'メイン' + (i + 1)}</div>`;
    pv.innerHTML = `<div class="rempty">
      <div class="eform">${slot(mains[0], 0)}<span class="op">＋</span>${slot(mains[1], 1)}<span class="op">→</span><div class="eslot q">？</div></div>
      <div class="emsg">メインをあと<b>${2 - mains.length}体</b>選ぶと<br>ここに結果が出る</div>
      <div class="etip">メインで<b>種類</b>、サブで<b>強さ</b>が決まる。<br>作れるものは<b>レシピ図</b>で光る。</div></div>`;
    pv.querySelectorAll('.eslot.on').forEach((e) => { const u = mains[+e.dataset.i]; const c = spriteIcon(u.spr, 0, 2); e.appendChild(c); });
    UI.lastResKey = null;
    return;
  }
  if (resWin) resWin.classList.add('has');
  const S = SYNTH[r.key];
  const st = r.stats, bs = r.base;
  const lv = G.necro.lv;
  const tcol = simmerCol(r);
  const nm = r.known ? S.name : '？？？';
  const afx = r.affix ? `<span class="rafx" style="color:${AFFIXES[r.affix].color};border-color:${AFFIXES[r.affix].color}">〈${AFFIXES[r.affix].name}〉</span>` : '';
  const rk = rankOfG(r.outG);
  if (sub) sub.innerHTML = peek ? '<b class="peektag">選ぶと…</b>' : `煮込み <b style="color:${tcol}">${fmtSec(r.time)}秒</b>`;
  const gapTxt = simmerGapText(r);
  // 能力：最終の値と、サブによる伸び（灰＝メインだけのとき、緑＝サブで伸びた分、赤＝下がった分）
  const SL = { 体力: 'hp', 攻撃: 'atk', 素早さ: 'spd', 手数: 'as', 体格: 'size' };
  const row = (label, val, fin, base, hint) => {
    const d = fin / base - 1;
    const pct = Math.round(d * 100);
    const pcs = pct > 0 ? `<em class="up">+${pct}%</em>` : pct < 0 ? `<em class="dn">${pct}%</em>` : '<em></em>';
    // 目盛りは「メインだけの値」の2.5倍で固定。サブを入れるほど、緑が左から右へ伸びていく
    // 伸びた：灰（メインだけ）＋緑（サブの分）、下がった：灰（今の値）＋赤（減った分）
    const cap = base * 2.5;
    const bw = clamp(Math.min(base, fin) / cap, 0, 1) * 100;
    const gw = fin > base ? clamp((fin - base) / cap, 0, 1 - bw / 100) * 100 : 0;
    const rw = fin < base ? clamp((base - fin) / cap, 0, 1) * 100 : 0;
    const over = fin > cap;
    return `<div class="rsrow"><span class="sl" style="color:${STAT_COL[SL[label]]}">${label}</span><b class="sv">${val}</b>${pcs}<div class="sb${over ? ' over' : ''}"><i class="b" style="width:${bw}%"></i><i class="g" style="width:${gw}%"></i>${rw ? `<i class="r" style="width:${rw}%"></i>` : ''}</div>${hint ? `<span class="sh">${hint}</span>` : ''}</div>`;
  };
  const stats = row('体力', Math.round(st.hp), st.hp, bs.hp)
    + row('攻撃', Math.round(st.atk), st.atk, bs.atk)
    + row('素早さ', Math.round(st.spd), st.spd, bs.spd)
    + row('手数', (1 / st.cd).toFixed(2) + '<small>回/秒</small>', 1 / st.cd, 1 / bs.cd)
    + row('体格', SIZE_NAME[sizeClassOf(st.sz)], st.sz, bs.sz);
  const formula = `<span class="fu">${unitTitle(r.core)}<small>Lv${r.core.g}</small></span><span class="op">＋</span><span class="fu">${unitTitle(r.other)}<small>Lv${r.other.g}</small></span>`
    + (subs.length ? `<span class="op">＋</span><span class="fu sb">サブ${subs.length}体${B && B.list.length ? `<small>${B.list[B.i].name}</small>` : ''}</span>` : '');
  pv.innerHTML = `<div class="rbig">
    <div class="rhero">
      <div class="ric${r.known ? '' : ' unk'}" id="potresic" style="--gl:${RES_GLOW[r.rank]}"></div>
      <div class="rhtx">
        <div class="rtags">${starTag(r.rank)}${resKindTags(r)}${colTag(r.col)}${r.known ? '' : '<b class="nw big">新種</b>'}${r.affix && !r.affixKnown ? '<b class="nw">新たな亜種</b>' : ''}</div>
        <div class="rname${r.known ? '' : ' unknown'}">${nm}${afx}</div>
        <div class="rrole">${gradeTags(r.key)}</div>
      </div>
    </div>
    ${r.known && S.desc ? `<div class="rdesc">${S.desc}</div>` : ''}
    <div class="rgrade">
      <div class="gnum"><span>Lv</span><b>${r.baseG}</b>${r.outG > r.baseG ? `<i>→</i><b class="up">${r.outG}</b>` : ''}<span class="gc" style="color:${rankCol(rk)}">${RANK_NAME[rk]}</span></div>
      ${UI.potGuide(mains, subs, r)}
    </div>
    <div class="rsstats">${stats}</div>
    <div class="raffix">${affixLine(r)}</div>
    <div class="rform">${formula}</div>
    <div class="rmeta"><span>煮込み <b style="color:${tcol}">${fmtSec(r.time)}秒</b>${gapTxt}</span><span>合成で空く枠 <b>${r.count - 1}</b></span></div>
  </div>`;
  // 大きな絵：枠に収まる最大の整数倍で描く（ドットをにじませない）
  const box = $('potresic');
  const SP = SPR[synthSpr(r.key)];
  const room = Math.max(40, Math.min(box.clientWidth, box.clientHeight) - 10);
  const sc = SP ? Math.max(1, Math.floor(room / Math.max(SP.w, SP.h))) : 2;
  const icon = spriteIcon(synthSpr(r.key), 0, sc);
  box.appendChild(icon);
  if (UI.lastResKey !== r.key) { box.classList.add('pop'); const nmEl = pv.querySelector('.rname'); if (nmEl) nmEl.classList.add('pop'); }
  UI.lastResKey = r.key;
};

function holdRepeat(btn, fn) {
  let t = null, iv = null;
  const stop = () => { clearTimeout(t); clearInterval(iv); t = iv = null; };
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    fn(); sfx('ui');
    t = setTimeout(() => { iv = setInterval(fn, 70); }, 350);
  });
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}

// =========================================================
// 軍勢の一覧（Tab／右上の軍勢をタップ）
// =========================================================
const ATK_TYPE_NAME = { melee: '近接', cleave: '薙ぎ払い（範囲）', arrow: '射撃', pierce: '貫通する射撃', bolt: '追尾する魔弾', poison: '毒の塊（範囲）', curse: '呪い（範囲・鈍足）', fire: '火球', allyblast: '魔法の爆発（範囲）', blast: '魔法の爆発（範囲）' };
const ABILITY_TEXT = {
  spin: '大斧で周りを薙ぎ払う。近くの近接の味方を強化する', pyre: '炎をまとい、周りの敵を焼き続ける', pack: '死霊の狼を呼び寄せる',
  sanctify: '周りの味方の傷を癒やす', leap: '遠くの敵へ跳びかかって叩きつける', sanctum: '敵を遅くし蝕む呪いの領域を作る',
  hero: '聖剣の突進と聖なる波動で敵をなぎ倒す', slam: '地面を叩きつけて周りの敵を巻き込む', volley: '扇状に5発を撃つ',
};
function traitTexts(u) {
  const t = u.tr || {}, out = [];
  const pc = (v) => Math.round(v * 100) + '%';
  if (t.armor) out.push('受けるダメージ −' + pc(t.armor));
  if (t.regen) out.push('毎秒 体力の' + (t.regen * 100).toFixed(1) + '%を回復');
  if (t.lifesteal) out.push('与えたダメージの' + pc(t.lifesteal) + 'を吸収');
  if (t.healAura) out.push('周りの味方を毎秒 体力の' + (t.healAura * 100).toFixed(1) + '%回復');
  if (t.shrapnel) out.push('一撃が周りの敵にも' + pc(t.shrapnel) + 'のダメージ');
  if (t.split) out.push('遠距離攻撃が' + ((t.split === true ? 1 : t.split) + 1) + '体へ同時に飛ぶ');
  if (t.chain) out.push('魔弾が' + t.chain + '体へ連鎖する');
  if (t.slowHit) out.push('攻撃した敵を' + pc(t.slowHit) + '遅くする');
  if (t.poisonHit) out.push('攻撃した敵を蝕む（継続ダメージ）');
  if (t.fearAura) out.push('周りの敵をすくませ、足を鈍らせる');
  if (t.altShot) out.push({ lob: '殴るたびに肉塊を投げる', knife: '2回に1回、短剣も投げる', bolt: '2回に1回、魔弾も放つ' }[t.altShot] || '追加の攻撃');
  if (t.curseHeal) out.push('呪いの範囲の味方を癒やす');
  if (u.taunt) out.push('周りの敵を引きつける');
  if (u.phase) out.push('敵の群れをすり抜ける');
  if (u.dash) out.push('敵へ突進する');
  if (u.lich) out.push('周りで倒れた敵を、ときどき勝手に蘇らせる');
  if (u.altar) out.push('近くで止まると蘇生が速くなる');
  if (u.ability && ABILITY_TEXT[u.ability]) out.push('技：' + ABILITY_TEXT[u.ability]);
  return out;
}
function unitFeatureText(u) {
  if (u.kind === 'syn') return SYNTH[u.synKey].desc;
  if (u.isBoss) return BOSSES[u.type].risenDesc;
  if (u.mid) return '討伐隊の中ボスを蘇らせた配下。普通の死者よりずっと強い。';
  const t = ETYPES[u.type];
  return (t && t.desc ? t.desc : '') ;
}
function nextFormText(u) {
  if (u.kind === 'syn') { const n = synthDecayKey(u); return n ? '倒れると「' + SYNTH[n].name + '」の死体になる' : '倒れると消える'; }
  const f = FORMS[u.form];
  return f.next ? '倒れると' + FORMS[f.next].name + 'の死体になる' : '倒れると消える（' + Math.ceil(u.life || 0) + '秒で消える）';
}

UI.openRoster = function () {
  if (!G || G.state !== 'play') return;
  G.state = 'roster';
  UI.releaseJoy();
  sfx('ui');
  UI.rosterSel = null;
  UI.renderRoster();
  showScreen('roster', true);
};
UI.closeRoster = function () {
  showScreen('roster', false);
  if (G && G.state === 'roster') G.state = 'play';
  // 一時停止から開いたときは一時停止に戻る
  if (UI.rosterFromPause) { UI.rosterFromPause = false; UI.openPause(); }
};

UI.renderRoster = function () {
  const s = $('roster');
  s.innerHTML = '';
  const p = el('div', 'panel');
  const groups = armyGroups();
  const nSyn = G.units.filter((u) => u.team === ALLY && !u.dead && u.kind === 'syn').length;
  p.appendChild(el('h2', '', `軍勢<span class="sub">${armyUsed()}/${armyCap()}・合成体 ${nSyn}・煮込み中 ${activePots().length}</span>`));
  const body = el('div', 'rbody');
  const list = el('div', 'glist scroll rlist');
  const det = el('div', 'rdetail scroll');
  det.id = 'rdetail';
  if (!groups.length) list.appendChild(el('div', 'empty', 'まだ軍勢がいない。'));
  if (!UI.rosterSel || !groups.some((g) => g.key === UI.rosterSel)) UI.rosterSel = groups.length ? groups[0].key : null;
  for (const g of groups) {
    const u = g.list[0];
    const row = el('button', 'rrow' + (g.key === UI.rosterSel ? ' on' : '') + (g.isBoss || g.mid ? ' boss' : ''));
    const ic = el('div', 'ic');
    ic.appendChild(spriteIcon(g.spr, 0, 2));
    row.appendChild(ic);
    const rk = unitRank(u);
    const lo = g.list[g.list.length - 1].g, hi = g.list[0].g;
    let hp = 0, mhp = 0;
    for (const x of g.list) { hp += x.hp; mhp += x.mhp; }
    row.appendChild(el('div', 'info', `<div class="nm"><span class="tt">${g.title}</span>${g.form ? `<span class="fm">${g.form}</span>` : ''}${g.list.length > 1 ? `<span class="cntx">×${g.list.length}</span>` : ''}</div>
      <div class="meta">${starTag(g.rank)}<span class="gr" style="${rk ? 'color:rgb(' + RANK_RGB[rk].join(',') + ')' : ''}">Lv${lo === hi ? hi : lo + '〜' + hi}</span> ${linTag(g.lin)}${colTag(g.col)} ${gradeTags(u)}</div>
      <div class="hpb"><i style="width:${Math.round(100 * hp / Math.max(1, mhp))}%"></i></div>`));
    row.addEventListener('click', () => { UI.rosterSel = g.key; UI.renderRoster(); sfx('ui'); });
    list.appendChild(row);
  }
  body.appendChild(list);
  body.appendChild(det);
  p.appendChild(body);
  const foot = el('div', 'foot');
  const c = el('button', 'btn primary', ctlEl('rosterClose'));
  c.addEventListener('click', () => UI.closeRoster());
  foot.appendChild(c);
  p.appendChild(foot);
  s.appendChild(p);
  const g = groups.find((x) => x.key === UI.rosterSel);
  if (g) UI.renderRosterDetail(g, det);
};

UI.renderRosterDetail = function (g, det) {
  const u = g.list[0];
  const rk = unitRank(u);
  const atk = u.atk * allyAtkMul(u);
  const head = el('div', 'rhead');
  const ic = el('div', 'ic big');
  ic.appendChild(spriteIcon(u.spr, 0, 3));
  head.appendChild(ic);
  head.appendChild(el('div', '', `<div class="rnm">${unitDisplayName(u)} ${starTag(unitSpRank(u))}</div>
    <div class="meta">${linTag(u.lin)}${colTag(unitCol(u))}${u.affix ? affixTag(u.affix) : ''}</div>
    <div class="meta grds">${gradeTags(u)}</div>
    <div class="meta">Lv <b style="color:${rk ? 'rgb(' + RANK_RGB[rk].join(',') + ')' : 'var(--bone)'}">${u.g}</b>（${RANK_NAME[rk]}）${g.list.length > 1 ? `　同じ種類 ×${g.list.length}` : ''}</div>`));
  det.appendChild(head);
  const st = [
    ['体力', Math.round(u.hp) + ' / ' + u.mhp],
    ['攻撃', Math.round(atk)],
    ['素早さ', Math.round(u.spd)],
    ['手数', (1 / u.cd).toFixed(2) + '/秒'],
    ['体格', (u.sz || 1).toFixed(2) + ' ' + SIZE_NAME[sizeClassOf(u.sz || 1)]],
    ['射程', Math.round(u.range)],
    ['攻撃方法', ATK_TYPE_NAME[u.atkType] || u.atkType],
  ];
  det.appendChild(el('div', 'rstats', st.map((x) => `<span>${x[0]}<b>${x[1]}</b></span>`).join('')));
  const feats = traitTexts(u);
  if (u.affix) feats.unshift('亜種〈' + AFFIXES[u.affix].name + '〉：' + AFFIXES[u.affix].feat);
  det.appendChild(el('div', 'rsec', `<h4>特徴</h4><div class="rdesc">${unitFeatureText(u) || '　'}</div>${feats.length ? '<ul>' + feats.map((f) => '<li>' + f + '</li>').join('') + '</ul>' : ''}`));
  const gr = u.grow ? STATS.filter((k) => u.grow[k] > 0.05).map((k) => `${STAT_NAMES[k]} +${Math.round((growMul(k, u.grow[k]) - 1) * 100)}%`).join('　') : '';
  const sa = affixOfUnitType(u);
  det.appendChild(el('div', 'rsec', `<h4>合成</h4><ul>
    ${gr ? `<li>サブで伸びた能力：${gr}</li>` : ''}
    <li>サブに入れると伸びる：<span style="color:var(--green)">${growText(subGrowth(u)) || 'なし'}</span>${sa && u.kind !== 'syn' ? '　半分以上入れると ' + affixTag(sa) : ''}</li>
    <li>メインにすると：${u.kind === 'syn' ? '★' + unitSpRank(u) + '（★の近い相手となら★が上がる）' : u.isBoss ? 'ボスの派生（堕ちたボス）になる' : u.mid ? '★2 として扱う' : '系統「' + LIN[u.lin].name + '」・体の質「' + COL_NAMES[unitCol(u)] + '」'}</li>
    <li>${nextFormText(u)}</li></ul>`));
};

UI.openPause = function () {
  if (!G || G.state !== 'play') return;
  G.state = 'pause';
  UI.releaseJoy();
  const s = $('pause');
  s.innerHTML = '';
  const p = el('div', 'panel');
  p.style.maxWidth = '480px';
  p.appendChild(el('h2', '', `一時停止<span class="sub">${STAGES[G.stage].name}・${CHARS[G.char].name}・${fmtTime(G.t)}</span>`));
  const sc = el('div', 'scroll');
  const tg = (label, get, set) => {
    const r = el('div', 'toggle', `<span>${label}</span>`);
    const b = el('button', 'btn', get() ? 'オン' : 'オフ');
    b.addEventListener('click', () => { set(!get()); b.textContent = get() ? 'オン' : 'オフ'; saveMeta(); });
    r.appendChild(b); sc.appendChild(r);
  };
  tg('効果音', () => META.settings.sound, (v) => { META.settings.sound = v; AU.on = v; });
  tg('音楽', () => META.settings.music !== false, (v) => { META.settings.music = v; BGM.on = v; });
  tg('画面の揺れ', () => META.settings.shake, (v) => { META.settings.shake = v; });
  { const r = el('div', 'toggle', '<span>描画<small style="display:block;color:var(--dim);font-size:11px"></small></span>');
    const d = r.querySelector('small');
    const b = el('button', 'btn', '');
    const upd = () => { b.textContent = GFX_NAMES[perfMode()]; d.textContent = GFX_DESC[perfMode()] + (PERF.slow ? '（いまは30回/秒）' : ''); };
    b.addEventListener('click', () => { gfxCycle(); upd(); sfx('ui'); });
    upd(); r.appendChild(b); sc.appendChild(r); }
  { const r = el('div', 'toggle kbonly', '<span>キー設定<small style="display:block;color:var(--dim);font-size:11px">キーボードの割り当て</small></span>');
    const b = el('button', 'btn', '開く');
    b.addEventListener('click', () => { sfx('ui'); UI.openKeys(); });
    r.appendChild(b); sc.appendChild(r); }
  sc.appendChild(el('div', 'tbl-h', '習得した術式'));
  sc.appendChild(UI.ownedSkillsEl());
  p.appendChild(sc);
  const foot = el('div', 'foot');
  const quit = el('button', 'btn danger', 'あきらめる');
  quit.addEventListener('click', () => {
    if (quit.dataset.c) { showScreen('pause', false); G.state = 'play'; G.retired = true; G.necro.dead = true; G.necro.hp = 0; onNecroDeath(); G.ending = 0.01; return; }
    quit.dataset.c = '1'; quit.textContent = ctl('quitArmed');
  });
  const res = el('button', 'btn primary', '再開');
  res.addEventListener('click', () => UI.closePause());
  const rcb = el('button', 'btn', 'レシピ図');
  rcb.addEventListener('click', () => UI.openRecipe({}));
  foot.appendChild(rcb);
  const rsb = el('button', 'btn', '軍勢');
  rsb.addEventListener('click', () => { UI.hideTipPop(); showScreen('pause', false); G.state = 'play'; UI.openRoster(); UI.rosterFromPause = true; });
  foot.appendChild(rsb);
  if (G.victory) {
    const ret = el('button', 'btn', '凱旋する');
    ret.style.color = 'var(--gold)';
    ret.addEventListener('click', () => { showScreen('pause', false); G.state = 'play'; endRun(); });
    foot.appendChild(ret);
  } else foot.appendChild(quit);
  foot.appendChild(res);
  p.appendChild(foot);
  s.appendChild(p);
  showScreen('pause', true);
};
UI.closePause = function () { UI.hideTipPop(); showScreen('pause', false); if (G && G.state === 'pause') G.state = 'play'; };
