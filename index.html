<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<title>ネクロ・アルケミア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0a0f; --panel:#15121c; --panel2:#1d1826; --line:#3a3248; --bone:#e6dfc8; --dim:#9a92a8; --mute:#6a6278;
  --green:#5cf59a; --green2:#2fb46a; --gold:#ffd25a; --red:#ff5a4e; --purple:#b07aff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--bone);font-family:'DotGothic16','MS Gothic','Hiragino Kaku Gothic ProN',monospace;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 48%,rgba(5,3,10,.55) 85%,rgba(3,2,6,.85) 100%)}
#hurtfx{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 24px rgba(255,40,40,.35);opacity:0;transition:opacity .25s;will-change:opacity}
/* 軽量：メニューの後ろをぼかさない（スマホではぼかしがとても重い） */
body.lite .screen{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(6,4,10,.84)}
#touch{position:fixed;inset:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#xpbar{position:absolute;left:0;right:0;top:0;height:calc(7px + var(--safe-t));background:#0a0810;border-bottom:1px solid #000}
#xpfill{position:absolute;left:0;bottom:0;height:7px;width:0;background:linear-gradient(#8affd0,#2fbf8a);box-shadow:0 0 8px rgba(90,255,190,.6);transition:width .12s}
#hudtop{position:absolute;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(14px + var(--safe-t));display:flex;align-items:flex-start;gap:10px}
.lvbadge{min-width:46px;padding:3px 7px 4px;background:var(--panel);border:2px solid var(--green2);color:var(--green);font-size:15px;text-align:center;line-height:1;box-shadow:0 2px 0 #000}
.lvbadge small{display:block;font-size:9px;color:var(--dim);margin-bottom:1px}
#hpwrap{display:flex;flex-direction:column;gap:3px;min-width:110px}
#hpbar{position:relative;height:12px;width:clamp(110px,26vw,180px);background:#1a0e12;border:2px solid #000;box-shadow:0 0 0 1px #4a2a30}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff8a7a,#d03a32);transition:width .12s}
#hptext{font-size:11px;color:var(--dim);text-shadow:1px 1px 0 #000}
#timer{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + var(--safe-t));font-size:22px;letter-spacing:1px;padding:1px 10px 2px;background:rgba(8,6,12,.55);border-radius:3px;text-shadow:2px 2px 0 #000,0 0 10px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;line-height:1.05;white-space:nowrap}
#timer small{font-size:10px;letter-spacing:1px;color:var(--dim);margin-bottom:1px}
#timer.warn{color:var(--gold)} #timer.warn small{color:var(--gold)}
#timer.hot{color:#ff6a5a;animation:edgeblink .6s steps(2) infinite} #timer.hot small{color:#ff8a7a}
#threat{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + var(--safe-t));white-space:nowrap;font-size:11px;padding:1px 8px;pointer-events:none;letter-spacing:2px}
#threat.hot{color:#fff;background:#b8281e;animation:edgeblink .6s steps(2) infinite}
#threat.warm{color:#ffb090;background:rgba(80,20,14,.8)}
#bossbars{position:absolute;left:50%;transform:translateX(-50%);top:calc(42px + var(--safe-t));width:min(70vw,360px);display:flex;flex-direction:column;gap:4px}
.bossbar{background:rgba(10,6,12,.8);border:2px solid #000;box-shadow:0 0 0 1px #6a2a2a;padding:2px 4px 3px}
.bossbar .nm{font-size:11px;color:#ffb0a0;display:flex;justify-content:space-between}
.bossbar .bar{height:6px;background:#2a1010;margin-top:2px}
.bossbar .bar i{display:block;height:100%;background:linear-gradient(#ff7a5a,#c02a20)}
.bossbar.mid{box-shadow:0 0 0 1px #6a4a1a;padding:1px 4px 2px;display:flex;align-items:center;gap:6px;width:78%;margin:0 auto}
.bossbar.mid .nm{color:#ffd0a0;font-size:10px;flex:0 0 auto;gap:6px}
.bossbar.mid .bar{height:4px;flex:1;margin-top:0}
.bossbar.mid .bar i{background:linear-gradient(#ffb05a,#c0702a)}
#hudright{margin-left:auto;display:flex;align-items:flex-start;gap:8px}
.stat{background:rgba(16,12,22,.82);border:2px solid #000;box-shadow:0 0 0 1px var(--line);padding:3px 8px 4px;font-size:13px;line-height:1.1;text-align:right}
.stat small{display:block;font-size:9px;color:var(--dim)}
.stat.army b{color:var(--green)}
.stat.army.full b{color:var(--gold)}
.rankbar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px}
.rankbar .rk{flex:0 0 auto;min-width:2.2em}
.rankbar .bar{flex:1;height:7px;background:#0f0c14;border:1px solid #000;box-shadow:0 0 0 1px var(--line);min-width:40px}
.rankbar .bar i{display:block;height:100%}
.rankbar .nx{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hints{margin-top:5px;font-size:11px;color:var(--dim);line-height:1.5}
.hints b{color:var(--bone);font-weight:normal}
.comp{display:flex;gap:6px;margin-top:6px;font-size:10px;color:var(--dim)}
.comp span{flex:1;position:relative;background:#0f0c14;border:1px solid #000;padding:1px 4px;overflow:hidden;white-space:nowrap}
.comp i{position:absolute;left:0;top:0;bottom:0;opacity:.28}
#pausebtn{pointer-events:auto;width:44px;height:44px;background:var(--panel);border:2px solid var(--line);box-shadow:0 2px 0 #000;font-size:14px;padding:0;line-height:1}
#potbtn{pointer-events:auto;position:absolute;left:50%;margin-left:-37px;bottom:calc(16px + var(--safe-b));width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#2a2438,#120e18);border:3px solid var(--green2);box-shadow:0 0 0 2px #000,0 0 16px rgba(80,255,150,.25),inset 0 -6px 0 rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
#potbtn canvas{width:40px;height:37px;image-rendering:pixelated}
#potbtn span{font-size:11px;color:var(--green);margin-top:-2px}
#potbtn .badge{position:absolute;top:-6px;right:-4px;background:var(--panel);border:2px solid var(--green2);font-size:11px;padding:1px 5px;color:var(--bone);border-radius:3px}
#potbtn.busy{border-color:#6a6478;box-shadow:0 0 0 2px #000,inset 0 -6px 0 rgba(0,0,0,.4)}
#potbtn.busy canvas{filter:grayscale(.8) brightness(.6)}
#potbtn.busy #potlabel{color:var(--dim)}
/* 光の脈動は、影の形を変えずに濃さだけ動かす（スマホで描き直しが軽い） */
#potbtn::after{content:'';position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 22px rgba(80,255,150,.65);opacity:0;pointer-events:none;will-change:opacity}
#potbtn:not(.busy)::after{animation:potglow 1.2s ease-in-out infinite alternate}
@keyframes potglow{from{opacity:.25}to{opacity:1}}
.rerollbtn{display:block;margin:0 auto 10px;padding:7px 18px;font-size:14px}
.rerollbtn small{color:var(--dim);margin-left:6px;font-size:11px}
/* 日本語の改行：文節の切れ目で折り返し（対応ブラウザ）、行頭に句読点を置かない、最後の行が1〜2文字だけにならないよう整える */
body{word-break:auto-phrase;line-break:strict;text-wrap:pretty}
#hint,.banner,.card .ds,.cpath .pu,.keynote,.uh,.potstep .msg,.res-sub,.rdesc,.howto h3{text-wrap:balance}
@media (max-width:440px){ #pause .foot{gap:6px} #pause .foot .btn{padding-left:12px;padding-right:12px;min-width:0} }
/* スマホではキー設定を出さない */
body[data-input=touch] .kbonly{display:none!important}
/* スマホ：錬金のボタンは下の中央（高さは同じ） */
#returnbtn{pointer-events:auto;position:absolute;right:calc(10px + var(--safe-r));top:calc(62px + var(--safe-t));padding:8px 12px;min-height:40px;background:#2a2010;border:2px solid var(--gold);color:var(--gold);font-size:15px;box-shadow:0 3px 0 #000}
#edgeinds{position:absolute;inset:0;pointer-events:none}
.edgeind{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.edgeind .ar{display:block;width:24px;height:16px;background:#ff4a3a;clip-path:polygon(0 0,100% 50%,0 100%,30% 50%)}
.edgeind .lb{font-size:11px;white-space:nowrap;padding:1px 6px;background:rgba(40,6,6,.86);color:#ffb0a0;border:1px solid #c83a2a;text-shadow:1px 1px 0 #000}
.edgeind.mid .ar{background:#ff9a3a}
.edgeind.mid .lb{background:rgba(40,22,6,.86);color:#ffd0a0;border-color:#c87a2a}
.edgeind.fresh .lb{font-size:13px;animation:edgeblink .5s steps(2) infinite}
.edgeind.fresh .ar{transform-origin:50% 50%}
@keyframes edgeblink{50%{background:#c8301e;color:#fff}}
#siteprompt{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:#ffe6a8;background:rgba(20,14,6,.86);border:1px solid #c89a40;padding:3px 8px;white-space:nowrap;pointer-events:auto;cursor:pointer;text-shadow:1px 1px 0 #000;box-shadow:0 2px 0 #000}
#siteprompt b{display:inline-block;font-weight:normal;color:#1a1206;background:#ffd25a;padding:0 5px;margin-right:4px;border-radius:2px}
#siteprompt:hover{border-color:#ffd25a;background:rgba(40,28,10,.92)}
#siteprompt.auto{pointer-events:none;cursor:default}
.stat.army{pointer-events:auto;cursor:pointer}
#roster .panel{max-width:min(860px,100%);height:100%}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column}
.rlist{flex:1 1 50%;min-height:0;padding:6px 10px}
.rdetail{flex:1 1 50%;min-height:0;border-top:2px solid #000;box-shadow:0 -1px 0 var(--line) inset;padding:10px 14px;font-size:12px}
@media (orientation:landscape){ .rbody{flex-direction:row} .rlist{flex:1 1 52%} .rdetail{flex:1 1 48%;border-top:0;border-left:2px solid #000;box-shadow:inset 1px 0 0 var(--line)} }
.rrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #221c2a;padding:5px 6px;color:var(--bone);font-family:inherit}
.rrow.on{background:rgba(255,210,90,.12);box-shadow:inset 3px 0 0 var(--gold)}
.rrow.boss{background:rgba(255,80,200,.06)}
.rrow .ic{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;background:#0f0c14;border:1px solid #000}
.rrow .ic canvas{image-rendering:pixelated;max-width:38px;max-height:38px}
.rrow .info{flex:1;min-width:0}
.rrow .nm{font-size:14px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
.rrow .nm .tt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .nm .fm{font-size:10px;color:var(--dim)}
.rrow .nm .cntx{font-size:12px;color:var(--green);margin-left:auto}
.rrow .meta{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden}
.rrow .hpb{height:3px;background:#2a1a1a;margin-top:3px}
.rrow .hpb i{display:block;height:100%;background:var(--green2)}
.rhead{display:flex;gap:12px;align-items:center}
.rhead .ic.big{width:84px;height:84px;flex:0 0 84px;display:flex;align-items:center;justify-content:center;background:#0f0c14;border:1px solid #000}
.rhead .ic.big canvas{image-rendering:pixelated;max-width:80px;max-height:80px}
.rhead .rnm{font-size:17px}
.rhead .meta{font-size:12px;color:var(--dim);margin-top:3px}
.rhead .meta b{font-weight:normal}
.rstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;margin-top:10px}
.rstats span{display:flex;flex-direction:column;font-size:10px;color:var(--dim);background:#0f0c14;border:1px solid #221c2a;padding:3px 6px}
.rstats b{font-size:14px;color:var(--bone);font-weight:normal}
.rsec{margin-top:10px}
.rsec h4{font-size:12px;font-weight:normal;color:var(--gold);margin:0 0 3px}
.rsec .rdesc{color:#d8d0e0;line-height:1.5}
.rsec ul{margin:4px 0 0;padding-left:1.2em;line-height:1.6;color:#cfc8da}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));font-size:12px;color:var(--bone);background:rgba(10,8,14,.72);padding:6px 12px;border:1px solid var(--line);width:max-content;max-width:min(86vw,520px);text-align:center;line-height:1.5;transition:opacity .5s;text-shadow:1px 1px 0 #000}
@media (max-width:600px){
  #timer{top:calc(48px + var(--safe-t));font-size:18px}
  #threat{top:calc(88px + var(--safe-t))}
  #bossbars{top:calc(76px + var(--safe-t));width:84vw}
  #hpbar{width:clamp(90px,30vw,150px)}
  .stat{padding:2px 6px 3px;font-size:12px}
  .lvbadge{min-width:40px;font-size:14px}
  #hudtop{gap:7px}
  #potbtn{width:66px;height:66px}
  #potbtn{margin-left:-33px}
  #returnbtn{top:calc(112px + var(--safe-t))}
  #banners{top:calc(23% + var(--safe-t))}
}

/* バナー */
#banners{position:absolute;left:0;right:0;top:calc(19% + var(--safe-t));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.banner{text-align:center;padding:6px 22px 7px;background:linear-gradient(90deg,transparent,rgba(10,6,14,.82) 18%,rgba(10,6,14,.82) 82%,transparent);animation:bn 2.8s forwards;min-width:min(60vw,520px);max-width:94vw}
.banner .t{font-size:18px;letter-spacing:2px;text-shadow:2px 2px 0 #000}
.banner .s{font-size:11px;color:var(--dim);margin-top:2px}
.banner.legend .t{color:#d8c8ff;text-shadow:0 0 10px rgba(150,110,255,.9),0 0 2px #000} .banner.legend .s{color:#9af0e6} .banner.boss .t{color:var(--red)} .banner.enemy .t{color:#ff9a7a} .banner.ally .t{color:var(--green)} .banner.win .t{color:var(--gold)} .banner.info .t{color:var(--bone)}
@keyframes bn{0%{opacity:0;transform:translateY(8px) scaleX(.9)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* ジョイスティック */
#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(160,255,200,.28);background:rgba(20,40,30,.18);pointer-events:none}
#joyk{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(140,255,190,.35);border:2px solid rgba(200,255,220,.55)}

/* ---- 画面（オーバーレイ） ---- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));
  background:rgba(6,4,10,.72);backdrop-filter:blur(1.5px);pointer-events:auto;touch-action:pan-y}
.panel{background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 10px 40px rgba(0,0,0,.6);max-width:min(760px,100%);width:100%;max-height:100%;display:flex;flex-direction:column}
.panel h2{margin:0;padding:12px 16px 10px;font-size:18px;font-weight:normal;letter-spacing:2px;border-bottom:2px solid #000;box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:10px}
.panel h2 .sub{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.btn{background:var(--panel2);border:2px solid #000;box-shadow:0 0 0 1px var(--line),0 3px 0 #000;padding:10px 16px;font-size:15px;color:var(--bone)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 1px var(--line),0 1px 0 #000}
.btn.primary{background:linear-gradient(#1f5a3a,#123a24);box-shadow:0 0 0 1px var(--green2),0 3px 0 #000;color:#d8ffe8}
.btn.danger{box-shadow:0 0 0 1px #7a3030,0 3px 0 #000;color:#ffb0a0}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.foot{padding:12px 16px;border-top:2px solid #000;box-shadow:0 -1px 0 var(--line) inset;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* タイトル */
#title{background:radial-gradient(ellipse at 50% 35%,rgba(20,40,28,.35),rgba(5,4,8,.9) 75%);flex-direction:column;justify-content:flex-start;overflow-y:auto}
.logo{text-align:center;margin:clamp(8px,4vh,40px) 0 clamp(8px,2vh,18px)}
.logo h1{margin:0;font-weight:normal;font-size:clamp(30px,8.6vw,72px);letter-spacing:.06em;white-space:nowrap;color:#d9ffe6;text-shadow:0 0 18px rgba(80,255,150,.55),3px 3px 0 #0a1a10,6px 6px 0 #000}
.logo div{font-size:clamp(11px,3vw,14px);letter-spacing:.6em;color:var(--green2);margin-top:4px}
.tblock{width:min(720px,100%);margin:0 auto 12px}
.tlabel{font-size:12px;color:var(--dim);margin:0 0 6px 2px;letter-spacing:2px}
.chars{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;touch-action:pan-x}
.char{flex:0 0 auto;width:118px;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 1px var(--line);padding:8px 8px 9px;text-align:center;position:relative}
.char.sel{box-shadow:0 0 0 2px var(--green),0 0 14px rgba(90,255,160,.35)}
.char canvas{width:54px;height:54px;image-rendering:pixelated}
.char .nm{font-size:14px;margin-top:2px}
.char .cpathtag{display:inline-block;font-size:9.5px;border:1px solid;padding:0 5px;margin-top:3px;line-height:14px}
.char.lock canvas{filter:brightness(0) opacity(.5)}
.char.lock canvas.cstart{filter:grayscale(1) opacity(.6)}
.char.view:not(.sel){box-shadow:0 0 0 2px var(--dim)}
.char canvas.cstart{position:absolute;right:5px;top:5px;width:20px;height:20px}
.cdetail{margin:2px 2px 0;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 1px var(--line);padding:8px 10px 9px}
.cdetail .cdh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cdetail .cdh b{font-size:15px}
.cdetail .cpathtag{font-size:10px;border:1px solid;padding:0 5px;line-height:15px}
.cdetail .csel{margin-left:auto;font-size:10px;color:var(--green)}
.cdetail .cunlock{font-size:11px;color:var(--gold);margin-bottom:6px}
.cdetail .crow{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--line)}
.cdetail .ctag{flex:0 0 auto;width:62px;font-size:10px;text-align:center;padding:2px 0;border:1px solid var(--line);color:var(--dim);background:#0d0a12}
.cdetail .ctrait .ctag{color:var(--bone);border-color:var(--bone)}
.cdetail .cstartrow .ctag{color:var(--green);border-color:var(--green2)}
.cdetail .cbody{flex:1;min-width:0;font-size:12px;line-height:1.4}
.cdetail .cv{font-size:11px;color:var(--bone);opacity:.9}
.cdetail .cskill{display:flex;gap:7px;align-items:flex-start}
.cdetail .cskill canvas{width:28px;height:28px;image-rendering:pixelated;flex:0 0 auto}
.cdetail .clore{font-size:10.5px;color:var(--mute);margin-top:4px;font-style:italic}
.cdetail.lock .cbody{opacity:.75}
.char.lock .nm{color:var(--mute)}
.stages{display:flex;gap:8px}
.stage{flex:1;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 1px var(--line);padding:10px;text-align:left}
.stage.sel{box-shadow:0 0 0 2px var(--green)}
.stage .nm{font-size:15px} .stage .ds{font-size:11px;color:var(--dim);margin-top:3px}
.stage.lock{opacity:.45}
.tmenu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tmenu .btn{min-width:120px}

const KB_CLICK = new WeakSet();
(function () {
  const add = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, fn, opt) {
    if (type === 'click' && typeof Element !== 'undefined' && this instanceof Element) KB_CLICK.add(this);
    return add.call(this, type, fn, opt);
  };

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

// 再現性のある乱数（mulberry32）
function makeRng(seed) {
  let s = seed >>> 0;
  const f = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a, b) => a + (b - a) * f();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  f.weighted = (obj) => {
    let sum = 0;
    for (const k in obj) sum += obj[k];
    let r = f() * sum;
    for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
    for (const k in obj) return k;
  };
  return f;
}
let rng = makeRng(Date.now() & 0xffffffff);

const vrng = makeRng(12345);

// 座標ハッシュ（地面タイルなど決定的な見た目用）
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// 空間グリッド（近傍探索）。マップ全体を固定サイズのセルで覆い、セルの配列を使い回す
class Grid {
  constructor(size, extent) {
    this.size = size;
    this.off = 4;
    this.w = Math.ceil((extent || 2400) / size) + this.off * 2;
    this.cells = new Array(this.w * this.w);
    for (let i = 0; i < this.cells.length; i++) this.cells[i] = [];
    this.used = [];
  }
  clear() {
    const c = this.cells, u = this.used;
    for (let i = 0; i < u.length; i++) c[u[i]].length = 0;
    u.length = 0;
  }
  insert(o) {
    const w = this.w;
    let cx = Math.floor(o.x / this.size) + this.off, cy = Math.floor(o.y / this.size) + this.off;
    if (cx < 0) cx = 0; else if (cx >= w) cx = w - 1;
    if (cy < 0) cy = 0; else if (cy >= w) cy = w - 1;
    const i = cy * w + cx;
    const cell = this.cells[i];
    if (cell.length === 0) this.used.push(i);
    cell.push(o);
  }
  // 範囲内の候補をコールバックに渡す（false を返すと打ち切り）
  query(x, y, r, fn) {
    const s = this.size, w = this.w, off = this.off;
    let x0 = Math.floor((x - r) / s) + off, x1 = Math.floor((x + r) / s) + off;
    let y0 = Math.floor((y - r) / s) + off, y1 = Math.floor((y + r) / s) + off;
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
    if (x1 >= w) x1 = w - 1; if (y1 >= w) y1 = w - 1;
    const cells = this.cells;
    for (let cy = y0; cy <= y1; cy++) {
      const row = cy * w;
      for (let cx = x0; cx <= x1; cx++) {
        const b = cells[row + cx];
        for (let i = 0; i < b.length; i++) if (fn(b[i]) === false) return;
      }
    }
  }
}

function compact(arr, keep) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (keep(o)) arr[j++] = o; }
  arr.length = j;
  return arr;
}

  const c = hexToRgb(h);

function roleStats(def) {
  const R = ROLES[def.role], T = ATK_NEUTRAL[def.atkType] || ATK_NEUTRAL.melee;

}

const SP_RANKS = [
  null,
  { pre: '', tint: null, mul: 1.0 },
  { pre: '紅き', tint: ['#d8343e', 0.46, 1.0], mul: 1.45 },
  { pre: '蒼き', tint: ['#3c7cf0', 0.5, 1.05], mul: 2.0 },

  { pre: '黒曜の', tint: ['#5a3a8a', 0.78, 0.4], mul: 3.6 },
];
const SP_MAX = 5;

// SYNTH[キー]：体のキー + '#' + ★。例 'bu-0#1'（屍肉の巨漢）、'bu+sha-1#3'（蒼き骨槍兵）
const SYNTH = {};
const SYNTH_BODIES = [];
function defineBody(bodyKey, def) {
  SYNTH_BODIES.push(bodyKey);
  for (let r = 1; r <= SP_MAX; r++) {
    const R = SP_RANKS[r];
    const rs = def.role ? roleStats(def) : def;
    SYNTH[bodyKey + '#' + r] = Object.assign({}, def, {
      body: bodyKey, rank: r, baseName: def.name, name: R.pre + def.name,
      hp: rs.hp * R.mul, atk: rs.atk * R.mul, spd: rs.spd, cd: rs.cd,
    });
  }
}
for (const k in SYNTH_BASE) defineBody(k, Object.assign({ cross: null, traits: BASE_TRAITS[k] || {}, art: BASE_ART[k] }, SYNTH_BASE[k]));
for (const pair in SYNTH_CROSS) {
  const [cl, ml] = pair.split('+');
  SYNTH_CROSS[pair].forEach((d, col) => defineBody(pair + '-' + col, Object.assign({ cross: ml, lin: cl, col, traits: {}, art: 'xs_' + cl + '_' + ml + '_' + col }, d)));
}

// 主2体から体を決める（格の高いほうが「核」＝戦い方の系統）
function synthBodyKey(coreLin, otherLin, col) {
  return coreLin === otherLin ? coreLin + '-' + col : coreLin + '+' + otherLin + '-' + col;
}
// 主2体の★から結果の★を決める。★が近い（差が1以内）2体なら1段上がる
function resultRank(a, b) {
  const hi = Math.max(a, b);
  return Math.min(SP_MAX, Math.abs(a - b) <= 1 ? hi + 1 : hi);
}

  return AFFIXES[u.type] ? u.type : null;

  const o = Object.assign({}, a || {});
  for (const k in b || {}) {
    if (typeof b[k] === 'number' && typeof o[k] === 'number') o[k] = k === 'tauntR' ? Math.max(o[k], b[k]) : o[k] + b[k];
    else if (o[k] == null) o[k] = b[k];
  }
  if (o.armor) o.armor = Math.min(0.5, o.armor);

}

function synthNextKey(key) {
  const s = SYNTH[key];

  if (s && s.legend) return s.rank > 2 ? s.body + '#' + (s.rank - 1) : null;

}

  const k = 1 - Math.exp(-(pts || 0) / 14);

}

function lvOfEff(skill, e) {
  const S = SKILLS[skill];
  for (let lv = 1; lv <= S.max; lv++) if (Math.abs(skillEff(skill, lv) - e) < 1e-6) return lv;

function LV(key, e) {
  if (!(e > 0)) return 0;
  const d = LVP_BY[key];
  const t = TU_LV[key], b = TU_LV_BASE[key];
  if (t || b) {
    const lv = lvOfEff(d[1], e);
    if (lv && t && t[lv - 1] != null && isFinite(t[lv - 1])) return t[lv - 1];
    if (lv && b && b[lv - 1] != null) return b[lv - 1];
  }
  return d[4](e);
}

}

function altarVal(k, field, i) {
  const o = ALTAR_TU[k] && ALTAR_TU[k][field];
  if (o && o[i] != null && isFinite(o[i])) return o[i];

// ==== 03_sprites.js ====
// ---------- ドット絵生成とテクスチャアトラス ----------
const ATLAS_SIZE = 2048;
const SPR = {};          // name -> { frames:[{x,y}], w, h, ax, ay }
let atlasCanvas = null;

function shade(hex, amt) {
  const c = hexToRgb(hex);
  const f = (v) => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(c[0]) << 16) | (f(c[1]) << 8) | f(c[2])).toString(16).slice(1);
}
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return c;
}
function rr(ctx, x, y, w, h, col) { if (!col) return; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function pp(ctx, x, y, col) { if (!col) return; ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
// 点列をまとめて描く [[x,y],...]
function pts(ctx, arr, col) { ctx.fillStyle = col; for (const p of arr) ctx.fillRect(p[0], p[1], 1, 1); }

// ---- 画像処理 ----
function processPixels(src, fn) {
  const c = newCanvas(src.width, src.height);
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    if (a[i + 3] === 0) continue;
    fn(a, i, (i / 4) % c.width, Math.floor(i / 4 / c.width));
  }
  ctx.putImageData(d, 0, 0);
  return c;
}
function outlined(src, col) {
  const w = src.width + 2, h = src.height + 2;
  const c = newCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 1, 1);
  const d = ctx.getImageData(0, 0, w, h);
  const a = d.data;
  const rgb = hexToRgb(col);
  const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 40;
  const mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a[(y * w + x) * 4 + 3] > 40) continue;
    if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) mark.push(y * w + x);
  }
  for (const m of mark) { a[m * 4] = rgb[0]; a[m * 4 + 1] = rgb[1]; a[m * 4 + 2] = rgb[2]; a[m * 4 + 3] = 255; }
  ctx.putImageData(d, 0, 0);
  return c;
}
function desat(src, amt, tint) {
  const t = tint ? hexToRgb(tint) : null;
  return processPixels(src, (a, i) => {
    const l = a[i] * 0.3 + a[i + 1] * 0.59 + a[i + 2] * 0.11;
    let r = l, g = l, b = l;
    if (t) { r = l * t[0] / 200; g = l * t[1] / 200; b = l * t[2] / 200; }
    a[i] = clamp(lerp(a[i], r, amt), 0, 255);
    a[i + 1] = clamp(lerp(a[i + 1], g, amt), 0, 255);
    a[i + 2] = clamp(lerp(a[i + 2], b, amt), 0, 255);
  });
}
function darken(src, f) {
  return processPixels(src, (a, i) => { a[i] *= f; a[i + 1] *= f; a[i + 2] *= f; });
}
function rotateCW(src) {
  const c = newCanvas(src.height, src.width);
  const ctx = c.getContext('2d');
  ctx.translate(src.height, 0);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(src, 0, 0);
  return c;
}
// ゾンビ化（服を破る・肌を腐らせる）
function tatter(src, seed) {
  const r = makeRng(seed);
  return processPixels(src, (a, i, x, y) => {
    if (y < 7) return; // 頭は穴を開けない
    const v = r();
    if (v < 0.07) { a[i + 3] = 0; return; }
    if (v < 0.16) { a[i] = 58; a[i + 1] = 66; a[i + 2] = 44; }
    else if (v < 0.2) { a[i] = 200; a[i + 1] = 196; a[i + 2] = 176; } // 骨がのぞく
  });
}

// ---- アトラス ----
let packX = 1, packY = 1, packRowH = 0;
function addSprite(name, canvases, opts) {
  opts = opts || {};
  const w = canvases[0].width, h = canvases[0].height;
  const frames = [];
  const actx = atlasCanvas.getContext('2d');
  for (const cv of canvases) {
    if (packX + w + 1 > ATLAS_SIZE) { packX = 1; packY += packRowH + 1; packRowH = 0; }
    if (packY + h + 1 > ATLAS_SIZE) { console.warn('atlas full', name); break; }
    actx.drawImage(cv, packX, packY);
    frames.push({ x: packX, y: packY });
    packX += w + 1;
    packRowH = Math.max(packRowH, h);
  }
  SPR[name] = { frames, w, h, ax: opts.ax != null ? opts.ax : w / 2, ay: opts.ay != null ? opts.ay : h - 1 };
  return SPR[name];
}

// ドット絵の拡大：Scale2x（EPX）で2倍にしてから、目標の大きさへ最近傍で縮める（ギザギザの少ない拡大）
function scale2x(src) {
  const w = src.width, h = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = newCanvas(w * 2, h * 2);
  const octx = out.getContext('2d');
  const od = octx.createImageData(w * 2, h * 2);
  const px = (x, y) => { x = clamp(x, 0, w - 1); y = clamp(y, 0, h - 1); const i = (y * w + x) * 4; return (sd[i] << 24 | sd[i + 1] << 16 | sd[i + 2] << 8 | sd[i + 3]) >>> 0; };
  const put = (x, y, v) => { const i = (y * w * 2 + x) * 4; od.data[i] = v >>> 24; od.data[i + 1] = (v >>> 16) & 255; od.data[i + 2] = (v >>> 8) & 255; od.data[i + 3] = v & 255; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const P = px(x, y), A = px(x, y - 1), B = px(x + 1, y), C = px(x - 1, y), D = px(x, y + 1);
    let e0 = P, e1 = P, e2 = P, e3 = P;
    if (A !== D && C !== B) { if (C === A) e0 = A; if (A === B) e1 = B; if (D === C) e2 = C; if (B === D) e3 = D; }
    put(x * 2, y * 2, e0); put(x * 2 + 1, y * 2, e1); put(x * 2, y * 2 + 1, e2); put(x * 2 + 1, y * 2 + 1, e3);
  }
  octx.putImageData(od, 0, 0);
  return out;
}
function scaleArt(src, f) {
  if (f === 1) return src;
  let big = scale2x(src);
  if (f > 2) big = scale2x(big);
  const w = Math.max(1, Math.round(src.width * f)), h = Math.max(1, Math.round(src.height * f));
  const c = newCanvas(w, h);
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(big, 0, 0, w, h);
  return processPixels(c, (d, i) => { d[i + 3] = d[i + 3] > 100 ? 255 : 0; });
}

// 体格で大きくなった合成体の絵は、必要になったときに作ってアトラスへ足す
const SRC = {};
function ensureSprite(name) {
  if (SPR[name]) return name;
  const at = name.indexOf('@');
  if (at < 0) return name;
  const base = name.slice(0, at), f = +name.slice(at + 1);
  const src = SRC[base];
  if (!src) return base;
  const fr = src.fr.map((c) => outlined(scaleArt(c, f), src.out));
  const y0 = packY;
  addSprite(name, fr);
  if (typeof uploadAtlasRegion === 'function' && R.gl) {
    // 追加した範囲だけ GPU に送る（段が変わった場合は前の段の頭から）
    const ys = Math.min(y0, SPR[name].frames[0].y), ye = packY + packRowH + 1;
    uploadAtlasRegion(0, ys, ATLAS_SIZE, Math.min(ATLAS_SIZE, ye) - ys);
  }
  return name;
}

// =========================================================
// ドット絵データ（ART）から canvas を作る
// =========================================================
function artFrame(key, fi, palOv) {
  const a = ART[key];
  const f = a.frames[fi % a.frames.length];
  const c = newCanvas(a.w, a.h);
  const x = c.getContext('2d');
  for (let y = 0; y < a.h; y++) {
    const row = f[y];
    for (let i = 0; i < a.w; i++) {
      const ch = row[i];
      if (ch === '.') continue;
      const col = (palOv && palOv[ch]) || a.pal[ch];
      if (!col) continue;
      x.fillStyle = col;
      x.fillRect(i, y, 1, 1);
    }
  }
  return c;
}
function artFrames(key, palOv) { return ART[key].frames.map((_, i) => artFrame(key, i, palOv)); }

// パレット単位の色変換
function mixHex(h, to, t) {
  const a = hexToRgb(h), b = hexToRgb(to);
  const f = (i) => clamp(Math.round(lerp(a[i], b[i], t)), 0, 255);
  return '#' + ((1 << 24) | (f(0) << 16) | (f(1) << 8) | f(2)).toString(16).slice(1);
}
function desatHex(h, amt, tint, dark) {
  const c = hexToRgb(h);
  const l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
  const t = hexToRgb(tint);
  const g = [l * t[0] / 200, l * t[1] / 200, l * t[2] / 200];
  const f = (i) => clamp(Math.round(lerp(c[i], g[i], amt) * dark), 0, 255);
  return '#' + ((1 << 24) | (f(0) << 16) | (f(1) << 8) | f(2)).toString(16).slice(1);
}
function palMap(key, fn) { const o = {}; const p = ART[key].pal; for (const k in p) o[k] = fn(k, p[k]); return o; }
// 蘇った姿：肌は土気色、目は燐光、衣は色褪せる
const PAL_RISEN = (k, c) => k === 's' ? '#a6b591' : k === 'S' ? '#788a61' : k === 'e' ? '#6dff9a' : desatHex(c, 0.38, '#bcdcb2', 0.96);
// ゾンビ：さらに腐り、暗くなる
const PAL_ZOMBIE = (k, c) => k === 's' ? '#7f9a66' : k === 'S' ? '#56703f' : k === 'e' ? '#c4ff6a' : desatHex(c, 0.62, '#a8c898', 0.8);
// 堕ちたボス（合成の特殊レシピ）：紫がかった呪いの色
const PAL_FALLEN = (k, c) => k === 's' ? '#a898b8' : k === 'S' ? '#76668a' : k === 'e' ? '#ff6aff' : desatHex(c, 0.5, '#d0b0f0', 0.86);

function tintCanvas(src, hex, amt, bright) {
  const t = hexToRgb(hex);
  const tl = t[0] * 0.3 + t[1] * 0.59 + t[2] * 0.11;
  return processPixels(src, (a, i) => {
    const l = a[i] * 0.3 + a[i + 1] * 0.59 + a[i + 2] * 0.11;
    const k = l / Math.max(40, tl) * (bright || 1);
    for (let j = 0; j < 3; j++) a[i + j] = clamp(Math.round(lerp(a[i + j], t[j] * k, amt)), 0, 255);
  });
}

// 外側にもう1重、明るい縁を付ける（主人公を群れの中で見失わないように）
function halo(src, col) {
  const w = src.width + 2, h = src.height + 2;
  const c = newCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 1, 1);
  const d = ctx.getImageData(0, 0, w, h), a = d.data, rgb = hexToRgb(col);
  const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 40;
  const mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a[(y * w + x) * 4 + 3] > 40) continue;
    if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) mark.push(y * w + x);
  }
  for (const m of mark) { a[m * 4] = rgb[0]; a[m * 4 + 1] = rgb[1]; a[m * 4 + 2] = rgb[2]; a[m * 4 + 3] = 150; }
  ctx.putImageData(d, 0, 0);
  return c;
}
function alphaCap(c, a) { return processPixels(c, (d, i) => { d[i + 3] = Math.min(d[i + 3], a); }); }
function corpseOf(c) { return outlined(darken(rotateCW(c), 0.62), '#120a0e'); }

function registerArtUnit(name, artKey, opts) {
  opts = opts || {};
  const h = ART[artKey].h;
  const base = artFrames(artKey);
  const risen = artFrames(artKey, palMap(artKey, PAL_RISEN));
  const zombie = artFrames(artKey, palMap(artKey, PAL_ZOMBIE)).map((c, i) => tatter(c, 77 + i, Math.round(h * 0.42)));
  addSprite(name + '_e', base.map((c) => outlined(c, OUT_ENEMY)));
  addSprite(name + '_g', base.map((c) => outlined(c, OUT_ELITE)));
  addSprite(name + '_r', risen.map((c) => outlined(c, OUT_ALLY)));
  addSprite(name + '_z', zombie.map((c) => outlined(c, OUT_ALLY)));
  addSprite(name + '_e_c', [corpseOf(base[0])]);
  addSprite(name + '_r_c', [corpseOf(risen[0])]);
  addSprite(name + '_z_c', [corpseOf(zombie[0])]);
  if (opts.unique) {
    const uq = artFrames(artKey, palMap(artKey, PAL_FALLEN));
    addSprite(name + '_u', uq.map((c) => outlined(c, OUT_UNIQUE)));
    addSprite(name + '_u_c', [corpseOf(uq[0])]);
  }
}

// 地面タイル
function drawTiles() {
  for (const sk in STAGES) {
    const st = STAGES[sk];
    for (let v = 0; v < 8; v++) {
      const c = newCanvas(16, 16); const x = c.getContext('2d');
      const r = makeRng(1000 + v * 17 + (sk === 'holy' ? 999 : 0));
      const base = st.ground[v % st.ground.length];
      rr(x, 0, 0, 16, 16, base);
      if (sk === 'holy') {
        // 石畳
        const ln = shade(base, -0.25), hl = shade(base, 0.12);
        rr(x, 0, 7, 16, 1, ln); rr(x, 0, 15, 16, 1, ln);
        const o = v % 2 ? 4 : 10;
        rr(x, o, 0, 1, 7, ln); rr(x, (o + 8) % 16, 8, 1, 7, ln);
        rr(x, 0, 0, 16, 1, hl); rr(x, 0, 8, 16, 1, hl);
        for (let i = 0; i < 6; i++) pp(x, r.int(0, 15), r.int(0, 15), r() < 0.5 ? shade(base, -0.12) : hl);
        if (v >= 6) { for (let i = 0; i < 4; i++) pp(x, r.int(0, 15), r.int(0, 15), '#4a5a3a'); }
      } else {
        for (let i = 0; i < 10; i++) pp(x, r.int(0, 15), r.int(0, 15), r() < 0.5 ? shade(base, -0.09) : shade(base, 0.06));
        if (v >= 5) { // 土
          const d = st.dirt;
          for (let i = 0; i < 30; i++) pp(x, r.int(0, 15), r.int(0, 15), r() < 0.6 ? d : shade(d, -0.15));
        } else {
          for (let i = 0; i < 3; i++) { const gx = r.int(1, 14), gy = r.int(2, 15); pp(x, gx, gy, shade(base, 0.16)); pp(x, gx, gy - 1, shade(base, 0.1)); }
        }
      }
      addSprite('tile_' + sk + v, [c], { ax: 0, ay: 0 });
    }
  }
}

// =========================================================
// ユニットのスプライト一式を登録
// =========================================================
const OUT_ENEMY = '#140c12', OUT_ALLY = '#2fae6a', OUT_ELITE = '#ffd24a', OUT_UNIQUE = '#d06aff';

// ゾンビ化（服を破る・肌を腐らせる）。頭の行は穴を開けない
function tatter(src, seed, headRows) {
  const r = makeRng(seed);
  const hr = headRows == null ? 7 : headRows;
  return processPixels(src, (a, i, x, y) => {
    if (y < hr) return;
    const v = r();
    if (v < 0.06) { a[i + 3] = 0; return; }
    if (v < 0.14) { a[i] = 58; a[i + 1] = 66; a[i + 2] = 44; }
    else if (v < 0.18) { a[i] = 200; a[i + 1] = 196; a[i + 2] = 176; } // 骨がのぞく
  });
}

function buildAtlas() {
  atlasCanvas = newCanvas(ATLAS_SIZE, ATLAS_SIZE);
  packX = 1; packY = 1; packRowH = 0;

  drawFx();
  drawFont();
  drawTiles();
  drawProps();
  drawCauldron();

  // ネクロマンサー（歩き2枚＋詠唱1枚）
  for (const ck in CHARS) {
    const pal = NECRO_PAL[ck] || {};
    const ak = ART['nc_' + ck] ? 'nc_' + ck : 'necro';   // 墓守以外は形も違う（帽子・仮面・杖など）
    const fr = artFrames(ak, pal);
    const p2 = Object.assign({}, pal);
    p2.y = pal.f || ART[ak].pal.f; p2.Y = pal.y || ART[ak].pal.y;
    fr.push(artFrame(ak, 0, p2));
    addSprite('necro_' + ck, fr.map((c) => halo(outlined(c, '#0a0610'), '#e6d8ff')));
  }
  // 敵（人間側）
  for (const k in ETYPES) registerArtUnit(k, k);
  // ボス
  for (const k in BOSSES) registerArtUnit(k, BOSS_ART[k], { unique: !BOSSES[k].final });
  // 死神：元の色のまま、味方の縁取りで
  addSprite('reaper_a', artFrames('boss_reaper').map((c) => outlined(c, OUT_ALLY)));
  // スケルトン・怨霊（系統ごと）
  for (const l of LIN_KEYS) {
    const sk = artFrames('skel_' + LIN_ART[l]);
    addSprite('skel_' + l, sk.map((c) => outlined(c, OUT_ALLY)));
    const wr = artFrames('wraith_' + LIN_ART[l]).map((c) => alphaCap(c, 215));
    addSprite('wr_' + l, wr.map((c) => outlined(c, OUT_ALLY)));
  }
  addSprite('skel_c', [ART.bone_pile ? outlined(darken(artFrame('bone_pile', 0), 0.8), '#120a0e') : newCanvas(1, 1)]);
  // レベルアップの項目のアイコン
  for (const k in ART) if (k.startsWith('ic_')) addSprite(k, [outlined(artFrame(k, 0), '#0a0610')]);
  // 合成体（拡大用に、縁取り前の絵と縁取りの色を SRC に残す）
  const kinBase = {};
  for (const k in SYNTH) {
    const s = SYNTH[k];
    // 堕ちたボス：ボスの絵を形態の色に塗り替える（★5はさらに黒く）
    if (s.unique) {
      const ak = BOSS_ART[s.boss];
      let fr = artFrames(ak, palMap(ak, FALLEN_PALS[s.col]));
      if (s.col === 2) fr = fr.map((c) => alphaCap(c, 210));
      if (s.rank === 5) fr = fr.map((c) => tintCanvas(c, '#5a3a8a', 0.5, 0.62));
      const out = s.rank === 5 ? '#ff5ad8' : OUT_UNIQUE;
      SRC['syn_' + k] = { fr, out };
      addSprite('syn_' + k, fr.map((c) => outlined(c, out)));
      addSprite('syn_' + k + '_c', [corpseOf(fr[0])]);
      continue;
    }
    // 同族合成：元の種族の絵を形態の色に塗り、1.5倍に描き直す
    if (s.kin) {
      const bk = s.kin + '-' + s.col;
      if (!kinBase[bk]) {
        let b = artFrames(s.kin, palMap(s.kin, KIN_PALS[s.col])).map((c) => scaleArt(c, 1.5));
        if (s.col === 2) b = b.map((c) => alphaCap(c, 215));
        kinBase[bk] = b;
      }
      let fr = kinBase[bk];
      const T = SP_RANKS[s.rank].tint;
      if (T) fr = fr.map((c) => tintCanvas(c, T[0], T[1], T[2]));
      SRC['syn_' + k] = { fr, out: OUT_ALLY };
      addSprite('syn_' + k, fr.map((c) => outlined(c, OUT_ALLY)));
      addSprite('syn_' + k + '_c', [corpseOf(fr[0])]);
      continue;
    }
    // 伝承の死霊：専用の絵。★2はそのままの色、★3からは★の色を薄くかける（絵の個性を残す）
    if (s.legend) {
      let fr = artFrames(s.art);
      const T = s.rank > 2 ? SP_RANKS[s.rank].tint : null;
      if (T) fr = fr.map((c) => tintCanvas(c, T[0], T[1] * 0.55, T[2]));
      SRC['syn_' + k] = { fr, out: OUT_ALLY };
      addSprite('syn_' + k, fr.map((c) => outlined(c, OUT_ALLY)));
      addSprite('syn_' + k + '_c', [corpseOf(fr[0])]);
      continue;
    }
    let fr = artFrames(s.art);
    const T = SP_RANKS[s.rank].tint;
    if (T) fr = fr.map((c) => tintCanvas(c, T[0], T[1], T[2]));
    const isGhost = s.col === 2;
    const fr2 = isGhost ? fr.map((c) => alphaCap(c, 225)) : fr;
    SRC['syn_' + k] = { fr: fr2, out: OUT_ALLY };
    addSprite('syn_' + k, fr2.map((c) => outlined(c, OUT_ALLY)));
    addSprite('syn_' + k + '_c', [corpseOf(fr[0])]);
  }
  return atlasCanvas;
}

// UI用に、アトラスから1枚切り出して拡大したcanvasを返す
function spriteIcon(name, frame, scale) {
  const s = SPR[name];
  if (!s) return newCanvas(1, 1);
  const f = s.frames[frame || 0] || s.frames[0];
  const c = newCanvas(s.w * scale, s.h * scale);
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(atlasCanvas, f.x, f.y, s.w, s.h, 0, 0, s.w * scale, s.h * scale);
  c.className = 'sprite-icon';
  return c;
}

// ==== 04_perf.js ====
// ---------- 軽量化（スマホ・重い端末向け） ----------
// 設定「描画」：auto（自動）／lite（軽量）／full（標準）
// 軽量のとき：
//  ・粒（エフェクト）の数を減らす（上限 1400 → 500、細かい粒の4割を省く）
//  ・メニューの後ろのぼかし（backdrop-filter）を使わない
//  ・とても重いときは、描く回数を30回/秒にそろえる（ばらつくより安定して見える）
// 自動のとき：スマホ（指で操作）は粒を減らす。どの端末でも、遊んでいる間に3秒続けて重ければ30回/秒にする（軽量でも同じ）。標準では何も減らさない
const PERF = { lite: false, slow: false, updCost: 0, win: 0, winN: 0, slowT: 0 };
const FX_CAP_FULL = 1400, FX_CAP_LITE = 500;

function perfMode() { return (META.settings && META.settings.gfx) || 'auto'; }
function perfApply() {
  const m = perfMode();
  const touch = typeof inputMode === 'function' ? inputMode() === 'touch' : false;
  if (m === 'full') PERF.slow = false;
  PERF.lite = m === 'lite' || (m === 'auto' && (touch || PERF.slow));
  document.body.classList.toggle('lite', PERF.lite);
}
// 描く間隔の下限（ミリ秒）。少しだけ余裕を持たせて、画面の更新の揺らぎで飛ばしすぎないようにする
function perfMinGap() { return PERF.slow ? 1000 / 30 - 3 : 1000 / 60 - 3; }
// 遊んでいる間の重さを見張る（1秒ごとの平均の間隔）
function perfWatch(dt) {
  PERF.win += dt; PERF.winN++;
  if (PERF.win < 1) return;
  const avg = PERF.win / PERF.winN;
  PERF.win = 0; PERF.winN = 0;
  if (perfMode() === 'full') return;
  if (PERF.slow) return;
  // 42回/秒を下回る状態が3秒続いたら、その出撃の間は30回/秒にそろえる
  // （行ったり来たりするとかえってカクつくので、途中では戻さない。次の出撃・設定の切り替えで戻す）
  PERF.slowT = avg > 1 / 42 ? PERF.slowT + 1 : 0;
  if (PERF.slowT >= 3) { PERF.slow = true; PERF.slowT = 0; perfApply(); }
}
// 出撃の始めに戻す
function perfReset() { PERF.slow = false; PERF.slowT = 0; PERF.win = 0; PERF.winN = 0; perfApply(); }
function fxCap() { return PERF.lite ? FX_CAP_LITE : FX_CAP_FULL; }

const GFX_NAMES = { auto: '自動', lite: '軽量', full: '標準' };
const GFX_DESC = { auto: 'スマホと重い端末では自動で軽くする', lite: 'エフェクトを減らし、重いときは30回/秒', full: '減らさない（速い端末向け）' };
function gfxCycle() {
  const order = ['auto', 'lite', 'full'];
  META.settings.gfx = order[(order.indexOf(perfMode()) + 1) % order.length];
  PERF.slow = false; PERF.slowT = 0;
  saveMeta();
  perfApply();
}

// ==== 04_render.js ====
// ---------- WebGL スプライト描画 ----------
const R = {
  gl: null, canvas: null, W: 320, H: 240, scale: 1,
  MAXQ: 12000, verts: null, f32: null, u32: null, n: 0, blend: 0,
  camX: 0, camY: 0, stats: { quads: 0, draws: 0 },
};

function initRenderer(canvas) {
  R.canvas = canvas;
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
  if (!gl) throw new Error('WebGL が使えません');
  R.gl = gl;
  const vs = `
    attribute vec2 aPos; attribute vec2 aUV; attribute vec4 aMul; attribute vec4 aAdd;
    uniform vec2 uRes; uniform vec2 uTex;
    varying vec2 vUV; varying vec4 vMul; varying vec4 vAdd;
    void main(){
      gl_Position = vec4(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0, 0.0, 1.0);
      vUV = aUV / uTex; vMul = aMul; vAdd = aAdd;
    }`;
  const fs = `
    precision mediump float;
    uniform sampler2D uS;
    varying vec2 vUV; varying vec4 vMul; varying vec4 vAdd;
    void main(){
      vec4 t = texture2D(uS, vUV);
      vec4 c = t * vMul;
      c.rgb = mix(c.rgb, vAdd.rgb * t.a, vAdd.a);
      if (c.a < 0.004) discard;
      gl_FragColor = c;
    }`;
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  gl.useProgram(p);
  R.prog = p;
  R.uRes = gl.getUniformLocation(p, 'uRes');
  R.uTex = gl.getUniformLocation(p, 'uTex');

  // 頂点: pos(2f) uv(2f) mul(4ub) add(4ub) = 24byte
  R.verts = new ArrayBuffer(R.MAXQ * 4 * 24);
  R.f32 = new Float32Array(R.verts);
  R.u32 = new Uint32Array(R.verts);
  R.vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, R.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, R.verts.byteLength, gl.DYNAMIC_DRAW);
  const idx = new Uint16Array(R.MAXQ * 6);
  // 16bitインデックスの上限に合わせて分割描画する
  for (let i = 0, v = 0; i < idx.length; i += 6, v += 4) {
    const vv = v % 65536;
    idx[i] = vv; idx[i + 1] = vv + 1; idx[i + 2] = vv + 2; idx[i + 3] = vv; idx[i + 4] = vv + 2; idx[i + 5] = vv + 3;
  }
  R.ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  const loc = (n) => gl.getAttribLocation(p, n);
  const aPos = loc('aPos'), aUV = loc('aUV'), aMul = loc('aMul'), aAdd = loc('aAdd');
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 24, 8);
  gl.enableVertexAttribArray(aMul); gl.vertexAttribPointer(aMul, 4, gl.UNSIGNED_BYTE, true, 24, 16);
  gl.enableVertexAttribArray(aAdd); gl.vertexAttribPointer(aAdd, 4, gl.UNSIGNED_BYTE, true, 24, 20);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.DEPTH_TEST);
}

function uploadAtlas(cv) {
  const gl = R.gl;
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  R.tex = t;
  gl.uniform2f(R.uTex, cv.width, cv.height);
}

// 画面サイズに合わせて、内部解像度（ドット）と拡大率を決める
function resizeRenderer() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = window.innerWidth, ch = window.innerHeight;
  const devW = cw * dpr, devH = ch * dpr;
  const shortDev = Math.min(devW, devH);
  // 短い辺が 260 ドット以上になる最大の整数倍率（狭すぎる視界を避ける）
  let s = Math.max(1, Math.floor(shortDev / 260));
  R.scale = s;
  R.W = Math.ceil(devW / s);
  R.H = Math.ceil(devH / s);
  R.canvas.width = R.W;
  R.canvas.height = R.H;
  R.canvas.style.width = (R.W * s / dpr) + 'px';
  R.cssK = s / dpr;   // 描画の1ドットが画面の何px か（HUD の位置合わせ。毎回 clientWidth を読むと重いので覚えておく）
  R.canvas.style.height = (R.H * s / dpr) + 'px';
  R.gl.viewport(0, 0, R.W, R.H);
  R.gl.uniform2f(R.uRes, R.W, R.H);
}

// アトラスの一部だけを GPU に送り直す（後から足した絵のため）
function uploadAtlasRegion(x, y, w, h) {
  if (w <= 0 || h <= 0) return;
  const c = newCanvas(w, h);
  c.getContext('2d').drawImage(atlasCanvas, x, y, w, h, 0, 0, w, h);
  flush();
  R.gl.bindTexture(R.gl.TEXTURE_2D, R.tex);
  R.gl.texSubImage2D(R.gl.TEXTURE_2D, 0, x, y, R.gl.RGBA, R.gl.UNSIGNED_BYTE, c);
}

function beginFrame(r, g, b) {
  const gl = R.gl;
  gl.clearColor(r, g, b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  R.n = 0;
  R.stats.quads = 0; R.stats.draws = 0;
  R.frames = (R.frames || 0) + 1;   // 描いた回数（検証用）
  setBlend(0);
}

function flush() {
  if (R.n === 0) return;
  const gl = R.gl;
  // MAXQ*4 頂点は 65536 未満なので、16bitインデックス1回で描ける
  // 毎回新しい領域として送る（同じ領域を書き換えると、スマホの GPU が前の描画の終わりを待って止まることがある）
  gl.bufferData(gl.ARRAY_BUFFER, R.f32.subarray(0, R.n * 4 * 6), gl.STREAM_DRAW);
  gl.drawElements(gl.TRIANGLES, R.n * 6, gl.UNSIGNED_SHORT, 0);
  R.stats.draws++;
  R.n = 0;
}

// 0=通常合成 1=加算
function setBlend(m) {
  if (R.blend === m && R.n === 0) { R.blend = m; return; }
  if (R.blend !== m) flush();
  R.blend = m;
  const gl = R.gl;
  if (m === 1) gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
}

// 画面座標(px)に矩形を描く。sx,sy,sw,shはアトラス上の領域
function pushQuad(sx, sy, sw, sh, dx, dy, dw, dh, flip, mul, add) {
  if (R.n >= R.MAXQ) flush();
  const f = R.f32, u = R.u32;
  let o = R.n * 24;
  const u0 = flip ? sx + sw : sx, u1 = flip ? sx : sx + sw;
  const x1 = dx + dw, y1 = dy + dh, v1 = sy + sh;
  f[o] = dx; f[o + 1] = dy; f[o + 2] = u0; f[o + 3] = sy; u[o + 4] = mul; u[o + 5] = add; o += 6;
  f[o] = x1; f[o + 1] = dy; f[o + 2] = u1; f[o + 3] = sy; u[o + 4] = mul; u[o + 5] = add; o += 6;
  f[o] = x1; f[o + 1] = y1; f[o + 2] = u1; f[o + 3] = v1; u[o + 4] = mul; u[o + 5] = add; o += 6;
  f[o] = dx; f[o + 1] = y1; f[o + 2] = u0; f[o + 3] = v1; u[o + 4] = mul; u[o + 5] = add;
  R.n++;
  R.stats.quads++;
}

// 回転つき（矢などの小さい弾用）
function pushQuadRot(sx, sy, sw, sh, cx, cy, ax, ay, ang, scale, mul, add) {
  if (R.n >= R.MAXQ) flush();
  const f = R.f32, u = R.u32;
  let o = R.n * 24;
  const c = Math.cos(ang) * scale, s = Math.sin(ang) * scale;
  const corners = [[-ax, -ay, sx, sy], [sw - ax, -ay, sx + sw, sy], [sw - ax, sh - ay, sx + sw, sy + sh], [-ax, sh - ay, sx, sy + sh]];
  for (let i = 0; i < 4; i++) {
    const p = corners[i];
    f[o] = cx + p[0] * c - p[1] * s; f[o + 1] = cy + p[0] * s + p[1] * c; f[o + 2] = p[2]; f[o + 3] = p[3];
    u[o + 4] = mul; u[o + 5] = add; o += 6;
  }
  R.n++;
  R.stats.quads++;
}

// ワールド座標でスプライトを描く（足元基準）
function drawSprite(name, frame, wx, wy, flip, mul, add, scale) {
  const s = SPR[name];
  if (!s) return;
  const fr = s.frames[frame % s.frames.length];
  const sc = scale || 1;
  const ax = flip ? (s.w - s.ax) : s.ax;
  const dx = Math.round(wx - R.camX - ax * sc);
  const dy = Math.round(wy - R.camY - s.ay * sc);
  if (dx > R.W || dy > R.H || dx + s.w * sc < 0 || dy + s.h * sc < 0) return;
  pushQuad(fr.x, fr.y, s.w, s.h, dx, dy, s.w * sc, s.h * sc, flip, mul == null ? WHITE32 : mul, add || 0);
}

// 中心基準・任意サイズ（円板など）
function drawSpriteSized(name, wx, wy, w, h, mul, add) {
  const s = SPR[name];
  if (!s) return;
  const fr = s.frames[0];
  const dx = Math.round(wx - R.camX - w / 2), dy = Math.round(wy - R.camY - h / 2);
  if (dx > R.W || dy > R.H || dx + w < 0 || dy + h < 0) return;
  pushQuad(fr.x, fr.y, s.w, s.h, dx, dy, Math.round(w), Math.round(h), false, mul, add || 0);
}

function drawRot(name, frame, wx, wy, ang, mul, scale) {
  const s = SPR[name];
  if (!s) return;
  const fr = s.frames[frame % s.frames.length];
  const cx = Math.round(wx - R.camX), cy = Math.round(wy - R.camY);
  if (cx < -20 || cy < -20 || cx > R.W + 20 || cy > R.H + 20) return;
  pushQuadRot(fr.x, fr.y, s.w, s.h, cx, cy, s.ax, s.ay, ang, scale || 1, mul == null ? WHITE32 : mul, 0);
}

// 1ドットの点
function drawDot(wx, wy, mul, size) {
  const s = SPR.px.frames[0];
  const z = size || 1;
  const dx = Math.round(wx - R.camX), dy = Math.round(wy - R.camY);
  if (dx < -2 || dy < -2 || dx > R.W + 2 || dy > R.H + 2) return;
  pushQuad(s.x, s.y, 1, 1, dx, dy, z, z, false, mul, 0);
}

// 任意の四角形（ワールド座標の4点）を単色で塗る（予告の帯・扇・輪に使う）
function drawQuad4(x0, y0, x1, y1, x2, y2, x3, y3, mul) {
  if (R.n >= R.MAXQ) flush();
  const px = SPR.px.frames[0];
  const f = R.f32, u = R.u32;
  let o = R.n * 24;
  const uu = px.x + 0.5, vv = px.y + 0.5;
  const pts = [x0, y0, x1, y1, x2, y2, x3, y3];
  for (let i = 0; i < 4; i++) {
    f[o] = pts[i * 2] - R.camX; f[o + 1] = pts[i * 2 + 1] - R.camY; f[o + 2] = uu; f[o + 3] = vv; u[o + 4] = mul; u[o + 5] = 0; o += 6;
  }
  R.n++;
  R.stats.quads++;
}

// 点線の円（ドット絵風）
function drawDotCircle(wx, wy, r, mul, dash, phase, progress, mul2) {
  const n = Math.max(12, Math.floor(r * TAU / 2));
  for (let i = 0; i < n; i++) {
    if (dash && ((i + Math.floor(phase || 0)) % dash) >= dash / 2) continue;
    const a = (i / n) * TAU - Math.PI / 2;
    const c = (progress != null && i / n <= progress) ? mul2 : mul;
    drawDot(wx + Math.cos(a) * r, wy + Math.sin(a) * r * 0.75, c, (progress != null && i / n <= progress) ? 2 : 1);
  }
}

// ドット数字（画面座標ではなくワールド座標）
function drawText(str, wx, wy, mul, scale) {
  const sc = scale || 1;
  let x = Math.round(wx - R.camX - (str.length * 4 * sc) / 2);
  const y = Math.round(wy - R.camY);
  for (const ch of str) {
    const s = SPR['ch_' + ch];
    if (s) {
      const fr = s.frames[0];
      // 縁取り（黒）
      pushQuad(fr.x, fr.y, 3, 5, x + 1, y + 1, 3 * sc, 5 * sc, false, rgba32(0, 0, 0, 200), 0);
      pushQuad(fr.x, fr.y, 3, 5, x, y, 3 * sc, 5 * sc, false, mul, 0);
    }
    x += 4 * sc;
  }
}

// ---------- 効果音（WebAudioで合成） ----------
const AU = { ctx: null, master: null, on: true, last: {}, noiseBuf: null };

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AU.ctx = new C();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.45;
    AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate * 0.5;
    AU.noiseBuf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = AU.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AU.ctx = null; }
  if (AU.ctx) bgmStart();
}

// 同じ音の連打を間引く
function sfxGate(name, minGap) {
  const t = performance.now();
  if (AU.last[name] && t - AU.last[name] < minGap) return false;
  AU.last[name] = t;
  return true;
}

function tone(freq, dur, type, vol, slide, delay) {
  const c = AU.ctx; if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AU.master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function noise(dur, vol, filt, delay) {
  const c = AU.ctx; if (!c || !AU.noiseBuf) return;
  const t0 = c.currentTime + (delay || 0);
  const s = c.createBufferSource(); s.buffer = AU.noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt || 1200;
  const g = c.createGain();
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AU.master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

function sfx(name, arg) {
  if (!AU.on || !AU.ctx || AU.ctx.state !== 'running') return;
  switch (name) {
    case 'hit': if (sfxGate(name, 45)) noise(0.06, 0.06, 1800); break;
    case 'die': if (sfxGate(name, 60)) { noise(0.12, 0.08, 700); tone(160, 0.12, 'square', 0.03, 0.5); } break;
    case 'shoot': if (sfxGate(name, 70)) tone(900, 0.05, 'triangle', 0.025, 0.6); break;
    case 'magic': if (sfxGate(name, 90)) tone(520, 0.18, 'sine', 0.05, 1.8); break;
    case 'blast': if (sfxGate(name, 80)) { noise(0.25, 0.14, 500); tone(90, 0.25, 'sawtooth', 0.05, 0.5); } break;
    case 'soul': if (sfxGate(name, 35)) tone(1200 + Math.random() * 300, 0.05, 'sine', 0.035, 1.3); break;
    case 'chantStart': if (sfxGate(name, 200)) tone(220, 0.25, 'sine', 0.05, 1.5); break;
    case 'raise': if (sfxGate(name, 120)) { tone(196, 0.35, 'triangle', 0.08, 2); tone(294, 0.4, 'sine', 0.06, 2, 0.05); noise(0.3, 0.05, 900); } break;
    case 'raiseBig': tone(130, 0.7, 'sawtooth', 0.06, 2); tone(196, 0.8, 'triangle', 0.08, 2, 0.08); tone(392, 0.6, 'sine', 0.05, 1.5, 0.2); break;
    // レベルアップ：窯が浮かび、低くうなって煮え立つ
    case 'levelup':
      tone(73.4, 0.6, 'sawtooth', 0.05, 2.2); tone(110, 0.5, 'triangle', 0.05, 2.0, 0.04); noise(0.4, 0.035, 500);
      for (let i = 0; i < 5; i++) tone(180 + i * 45 + Math.random() * 40, 0.08, 'sine', 0.045, 0.5, 0.05 + i * 0.06);
      break;
    // 窯が術式を噴き上げる（ニ短調の和音）
    case 'lvburst':
      noise(0.45, 0.1, 1500); tone(55, 0.45, 'sine', 0.12, 0.5);
      [293.66, 349.23, 440, 587.33].forEach((f, i) => { tone(f, 0.55, 'triangle', 0.045, 1, i * 0.045); tone(f * 2.01, 0.4, 'sine', 0.015, 1, i * 0.045); });
      break;
    // カードが表になる（1枚ごとに少し高く）
    case 'lvland': if (sfxGate(name, 40)) { const f = [587.33, 698.46, 880, 1046.5][Math.min(3, arg || 0)]; tone(f, 0.18, 'sine', 0.05, 1.01); tone(f * 1.5, 0.12, 'triangle', 0.02, 1, 0.02); } break;
    case 'lvevo': [587.33, 880, 1174.66, 1396.9].forEach((f, i) => tone(f, 0.8, 'sine', 0.05, 1.003, i * 0.06)); noise(0.6, 0.04, 3000); break;
    // 選んだ術式が魂になって吸い込まれる
    case 'lvpick': tone(330, 0.35, 'triangle', 0.06, 2.4); noise(0.3, 0.05, 2400); tone(784, 0.3, 'sine', 0.04, 1.6, 0.1); tone(1174.66, 0.35, 'sine', 0.03, 1.01, 0.3); break;
    case 'pick': tone(700, 0.06, 'square', 0.04, 1.2); break;
    case 'pot': tone(150, 0.3, 'sine', 0.08, 0.6); noise(0.3, 0.06, 400); break;
    case 'whoosh': if (sfxGate(name, 120)) { noise(0.35, 0.05, 1400); tone(320, 0.3, 'sine', 0.03, 1.8); } break;
    case 'plop': if (sfxGate(name, 70)) { tone(240 + Math.random() * 120, 0.09, 'sine', 0.05, 0.45); noise(0.06, 0.03, 700); } break;
    case 'potDone': [392, 523, 659].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, 1, i * 0.09)); break;
    case 'potBreak': noise(0.5, 0.2, 900); tone(110, 0.5, 'sawtooth', 0.07, 0.4); break;
    case 'burn': if (sfxGate(name, 250)) noise(0.3, 0.05, 2400); break;
    case 'holy': if (sfxGate(name, 200)) { tone(880, 0.4, 'sine', 0.05, 1.01); tone(1320, 0.4, 'sine', 0.03, 1.01, 0.05); } break;
    case 'boss': tone(80, 1.2, 'sawtooth', 0.09, 0.8); tone(120, 1.2, 'square', 0.04, 0.8, 0.1); noise(1, 0.08, 300); break;
    case 'hurt': if (sfxGate(name, 140)) { tone(200, 0.12, 'square', 0.06, 0.5); noise(0.1, 0.08, 1200); } break;
    case 'win': [392, 494, 587, 784, 988].forEach((f, i) => tone(f, 0.3, 'triangle', 0.07, 1, i * 0.12)); break;
    case 'lose': [330, 262, 196, 131].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.05, 0.9, i * 0.18)); break;
    case 'heal': [660, 880, 1100].forEach((f, i) => tone(f, 0.12, 'sine', 0.05, 1, i * 0.05)); break;
    case 'ui': tone(600, 0.04, 'square', 0.03); break;
  }
}

// ---------- 音楽（その場で合成する暗い環境音楽） ----------
// 低いうなり（ドローン）の上に、ニ短調の鐘のような音がまばらに鳴る。ボス戦では太鼓が加わる
const BGM = { on: true, started: false, gain: null, drone: null, timer: null, step: 0, next: 0, level: 0, target: 0 };
const BGM_SCALE = [146.83, 174.61, 196.0, 220.0, 261.63, 293.66, 349.23, 392.0, 440.0]; // D F G A C D F G A

function bgmStart() {
  const c = AU.ctx;
  if (!c || BGM.started) return;
  BGM.started = true;
  BGM.gain = c.createGain();
  BGM.gain.gain.value = 0;
  BGM.gain.connect(AU.master);
  // ドローン
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 3;
  const dg = c.createGain(); dg.gain.value = 0.07;
  for (const f of [73.42, 73.9, 110.0]) {
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    o.connect(lp); o.start();
  }
  // うなりをゆっくり揺らす
  const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
  const lg = c.createGain(); lg.gain.value = 90;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(dg); dg.connect(BGM.gain);
  BGM.drone = dg;
  BGM.next = c.currentTime + 0.1;
  BGM.timer = setInterval(bgmTick, 120);
}

function bgmBell(f, t, vol, dur) {
  const c = AU.ctx;
  const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = f;
  o2.type = 'triangle'; o2.frequency.value = f * 2.01;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); o2.connect(g); g.connect(BGM.gain);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function bgmDrum(t, vol) {
  const c = AU.ctx;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(95, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.28);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(BGM.gain);
  o.start(t); o.stop(t + 0.4);
}

function bgmTick() {
  const c = AU.ctx;
  if (!c || c.state !== 'running') return;
  const want = (BGM.on && !document.hidden) ? [0.35, 0.8, 1.0][BGM.target] : 0;
  BGM.level += (want - BGM.level) * 0.08;
  BGM.gain.gain.setTargetAtTime(BGM.level * 0.55, c.currentTime, 0.3);
  if (BGM.level < 0.02) { BGM.next = c.currentTime + 0.1; return; }
  const beat = BGM.target === 2 ? 0.32 : 0.42;
  while (BGM.next < c.currentTime + 0.4) {
    const t = BGM.next, s = BGM.step % 16;
    // 鐘：まばらに、上下にさまよう
    const p = BGM.target === 0 ? 0.18 : BGM.target === 2 ? 0.42 : 0.3;
    if (s % 2 === 0 && Math.random() < p) {
      const i = Math.floor(Math.random() * BGM_SCALE.length);
      bgmBell(BGM_SCALE[i] * (Math.random() < 0.25 ? 0.5 : 1), t, 0.05, 1.6);
    }
    if (s === 0 && Math.random() < 0.6) bgmBell(BGM_SCALE[0] * 0.5, t, 0.06, 3.0);
    if (BGM.target === 2 && (s === 0 || s === 6 || s === 8 || s === 11)) bgmDrum(t, s === 0 ? 0.22 : 0.13);
    else if (BGM.target === 1 && s === 0) bgmDrum(t, 0.08);
    BGM.step++;
    BGM.next += beat;
  }
}
function bgmSet(level) { BGM.target = level; if (AU.ctx && !BGM.started) bgmStart(); }

// ---------- ゲーム状態とワールド生成 ----------
const MAP = 2400;
const MAPC = MAP / 2;

let G = null;

function newGameState(stageKey, charKey) {
  return {
    state: 'play', t: 0, stage: stageKey, char: charKey, seed: 0,
    necro: null,
    units: [], corpses: [], souls: [], pickups: [], sites: [], midAlive: [], projs: [], fx: [], fxAdd: [], teles: [], zones: [], pots: [], texts: [], flyers: [],
    props: [], flatProps: [], graveyards: [],
    tgrid: [new Grid(64, MAP), new Grid(64, MAP)], sgrid: new Grid(16, MAP), cgrid: new Grid(40, MAP),
    // 両陣営をまとめて調べる（検証用ボットや雑多な判定用）
    ugrid: { query(x, y, r, fn) { G.tgrid[0].query(x, y, r, fn); G.tgrid[1].query(x, y, r, fn); } },
    skills: {}, evos: {}, mods: null, eff: {}, pathT: {}, wrath: 0, armyN: 0, lead: Math.min(LEAD_MAX, LEAD_BASE + ((META.up && META.up.lead) || 0)), brain: null, rerolls: upEff('reroll', (META.up && META.up.reroll) || 0),
    stats: { kills: 0, raised: 0, synths: 0, maxArmy: 0, bossKills: 0, raisedSkeleton: 0, reraised: 0, infected: 0, lost: 0, bossesRaised: 0, heroRaised: 0 },
    spawnAcc: 0, siegeDone: {}, bossDone: {}, bossAlive: [], nextEndlessBoss: 0,
    heroDown: false, heroCorpse: null, endless: false, victory: false, ending: 0,
    shake: 0, idSeq: 1, pendingLv: 0, hellgateT: 14, banners: [],
    discovered: {}, seenEnemies: {},
    perf: { upd: 0 },
  };
}

// ---- 死体 ----
function corpseSprite(c) {
  if (c.kind === 'syn') return 'syn_' + c.sprKey + '_c';
  if (c.kind === 'skel') return 'skel_c';
  return c.type + (c.look === 'e' ? '_e_c' : c.look === 'r' ? '_r_c' : '_z_c');
}

function addCorpse(o) {
  const c = Object.assign({
    x: 0, y: 0, kind: 'h', type: 'soldier', look: 'e', raiseForm: 'risen', lin: 'bu', g: 1,
    decay: Infinity, decayMax: Infinity, burn: 0, elite: false, boss: false, unique: false,
    synKey: null, sprKey: null, flip: vrng() < 0.5, dead: false, robbed: false, born: G ? G.t : 0,
  }, o);
  c.spr = corpseSprite(c);
  c.scale = c.mid ? 1.5 : 1;
  c.big = !!(c.boss || c.mid || BOSSES[c.type] || c.kind === 'syn');
  G.corpses.push(c);
  return c;
}

// ---- 小物 ----
function addProp(spr, x, y, flat) {
  const p = { spr, x: Math.round(x), y: Math.round(y), flip: vrng() < 0.5 };
  if (flat) G.flatProps.push(p); else G.props.push(p);
  return p;
}

// ---- ワールド生成 ----
function generateWorld() {
  const r = makeRng(G.seed);
  const stage = STAGES[G.stage];
  const holy = G.stage === 'holy';
  const free = (x, y, d) => {
    for (const gy of G.graveyards) if (dist(x, y, gy.x, gy.y) < gy.r + d) return false;
    return true;
  };

  // 墓地（4か所、中心から中距離）
  const ga0 = r() * TAU;
  for (let i = 0; i < 4; i++) {
    const a = ga0 + i * TAU / 4 + r.range(-0.3, 0.3);
    const d = r.range(430, 620);
    const gy = { x: MAPC + Math.cos(a) * d, y: MAPC + Math.sin(a) * d, r: 54, spawnT: r.range(2, 6), spots: [] };
    G.graveyards.push(gy);
    for (let yy = -2; yy <= 2; yy++) for (let xx = -3; xx <= 3; xx++) {
      if (r() < 0.25) continue;
      const tx = gy.x + xx * 15 + r.range(-2, 2), ty = gy.y + yy * 17 + r.range(-2, 2);
      addProp(r() < 0.75 ? 'tomb' + r.int(0, 2) : 'crossgrave', tx, ty, false);
      gy.spots.push({ x: tx + r.range(-3, 3), y: ty + 7 });
    }
    // 柵
    for (let k = -3; k <= 3; k++) {
      if (k === 0) continue;
      addProp('fence', gy.x + k * 16, gy.y - 52, false);
      addProp('fence', gy.x + k * 16, gy.y + 52, false);
    }
  }

  // 地形の飾り
  const nTree = holy ? 40 : 110;
  for (let i = 0; i < nTree; i++) {
    const x = r.range(40, MAP - 40), y = r.range(40, MAP - 40);
    if (dist(x, y, MAPC, MAPC) < 90 || !free(x, y, 20)) continue;
    addProp(holy ? (r() < 0.5 ? 'pillar' : 'wall') : 'tree' + r.int(0, 1), x, y, false);
  }
  for (let i = 0; i < 220; i++) {
    const x = r.range(20, MAP - 20), y = r.range(20, MAP - 20);
    if (!free(x, y, 6)) continue;
    const k = r();
    if (k < 0.3) addProp('rock' + r.int(0, 1), x, y, false);
    else if (k < 0.5) addProp('stucksword', x, y, false);
    else if (k < 0.62) addProp('banner' + r.int(0, 1), x, y, false);
    else if (k < 0.75) addProp('wheel', x, y, true);
    else addProp(holy ? 'wall' : 'pillar', x, y, false);
  }
  for (let i = 0; i < 800; i++) {
    const x = r.range(10, MAP - 10), y = r.range(10, MAP - 10);
    const k = r();
    if (k < 0.78) addProp('grass' + r.int(0, 2), x, y, true);
    else if (k < 0.92) addProp('bones', x, y, true);
    else addProp('skull', x, y, true);
  }
  // 境界の枯れ木
  for (let i = 0; i < MAP; i += 22) {
    for (const [x, y] of [[i, 6], [i, MAP - 2], [6, i], [MAP - 6, i]]) {
      addProp(holy ? 'wall' : 'tree' + ((i / 22) % 2 | 0), x + r.range(-4, 4), y, false);
    }
  }

  // 古戦場の死体（中心から遠いほど格が高い）
  const types = [
    { d: 0, list: ['militia', 'militia', 'soldier', 'archer'], g: [1, 2] },
    { d: 320, list: ['soldier', 'archer', 'knight', 'militia'], g: [2, 6] },
    { d: 620, list: ['knight', 'soldier', 'archer', 'mage', 'priest'], g: [6, 14] },
    { d: 880, list: ['knight', 'heavy', 'mage', 'cavalry'], g: [14, 28] },
    { d: 1080, list: ['heavy', 'cavalry', 'knight'], g: [28, 46] },
  ];
  const nSites = 56;
  for (let i = 0; i < nSites; i++) {
    const a = r() * TAU;
    const d = Math.sqrt(r()) * 1100 + 110;
    const x = MAPC + Math.cos(a) * d, y = MAPC + Math.sin(a) * d;
    if (!free(x, y, 30)) continue;
    let tier = types[0];
    for (const t of types) if (d >= t.d) tier = t;
    const n = r.int(3, 8);
    if (r() < 0.6) addProp('banner' + r.int(0, 1), x + r.range(-20, 20), y + r.range(-20, 20), false);
    if (r() < 0.55) addProp('spears', x + r.range(-24, 24), y + r.range(-18, 18), false);
    for (let k = 0; k < n; k++) {
      const type = r.pick(tier.list);
      const g = r.int(tier.g[0], tier.g[1]);
      // 一部はすでに骨になっている
      if (r() < 0.25 && tier.d >= 320) {
        addCorpse({ x: x + r.range(-26, 26), y: y + r.range(-20, 20), kind: 'skel', lin: ETYPES[type].lin, raiseForm: 'skeleton', g, type });
      } else {
        addCorpse({ x: x + r.range(-26, 26), y: y + r.range(-20, 20), kind: 'h', type, look: 'e', raiseForm: 'risen', lin: ETYPES[type].lin, g, elite: g >= 30 && r() < 0.3 });
      }
    }
  }
  // 四隅の英雄の亡骸（非常に格が高い）
  for (const [cx, cy] of [[220, 220], [MAP - 220, 220], [220, MAP - 220], [MAP - 220, MAP - 220]]) {
    addCorpse({ x: cx, y: cy, kind: 'h', type: r.pick(['heavy', 'knight', 'cavalry']), look: 'e', raiseForm: 'risen', lin: 'bu', g: r.int(55, 70), elite: true });
    for (let k = 0; k < 4; k++) addCorpse({ x: cx + r.range(-30, 30), y: cy + r.range(-30, 30), kind: 'h', type: 'knight', look: 'e', raiseForm: 'risen', lin: 'bu', g: r.int(30, 40) });
    addProp('banner0', cx + 10, cy - 14, false);
  }
  // スタート地点に近い小さな戦場（レベル1でもすぐ起こせる新兵の亡骸。倒れた兵の補充用）
  const nNear = 11;
  const na0 = r() * TAU;
  for (let i = 0; i < nNear; i++) {
    const a = na0 + i * TAU / nNear + r.range(-0.22, 0.22);
    const d = i % 2 ? r.range(110, 210) : r.range(200, 360);
    const x = MAPC + Math.cos(a) * d, y = MAPC + Math.sin(a) * d;
    if (!free(x, y, 24)) continue;
    if (r() < 0.45) addProp('banner' + r.int(0, 1), x + r.range(-16, 16), y + r.range(-16, 16), false);
    const n = r.int(5, 8);
    for (let k = 0; k < n; k++) {
      const type = r.pick(['militia', 'militia', 'soldier', 'archer']);
      const q = r();
      const g = q < 0.6 ? 1 : q < 0.9 ? 2 : 3;
      // 序盤の補充用。中盤には朽ちて土に還る（後半に弱い兵で軍勢が埋まらないように）
      const dk = r.range(360, 540);
      addCorpse({ x: x + r.range(-22, 22), y: y + r.range(-16, 16), kind: 'h', type, look: 'e', raiseForm: 'risen', lin: ETYPES[type].lin, g, decay: dk, decayMax: dk, seed: true });
    }
  }
  // スタート地点のまわり（必ず最初の軍勢が作れるように）
  const startN = 12;
  for (let k = 0; k < startN; k++) {
    const a = (k / startN) * TAU + r.range(-0.2, 0.2);
    const d = r.range(14, 33);
    addCorpse({ x: MAPC + Math.cos(a) * d, y: MAPC + Math.sin(a) * d, kind: 'h', type: k % 4 === 3 ? 'archer' : k % 4 === 1 ? 'soldier' : 'militia', look: 'e', raiseForm: 'risen', lin: k % 4 === 3 ? 'sha' : 'bu', g: 1 });
  }

  G.props.sort((a, b) => a.y - b.y);
}

// 墓地から死体が湧く
function updateGraveyards(dt) {
  const e = expectedLevel(G.t / 60);
  for (const gy of G.graveyards) {
    gy.spawnT -= dt;
    if (gy.spawnT > 0) continue;
    gy.spawnT = 6.5;
    let n = 0;
    G.cgrid.query(gy.x, gy.y, gy.r + 10, (c) => { if (!c.dead && dist2(c.x, c.y, gy.x, gy.y) < (gy.r + 10) ** 2) n++; });
    if (n >= 9) continue;
    const s = rng.pick(gy.spots);
    const type = rng.pick(['militia', 'soldier', 'archer', 'soldier']);
    const g = Math.max(1, Math.round(e * 0.55 * STAGES[G.stage].gradeMul));
    const c = addCorpse({ x: s.x, y: s.y, kind: rng() < 0.4 ? 'skel' : 'h', type, look: 'e', raiseForm: 'risen', lin: ETYPES[type].lin, g });
    if (c.kind === 'skel') { c.raiseForm = 'skeleton'; c.spr = corpseSprite(c); }
    for (let i = 0; i < 6; i++) spawnFx(s.x + rng.range(-5, 5), s.y, 0, -rng.range(8, 20), 0.6, 'px2', rgba32(90, 80, 70, 200), false);
  }
}

// ==== 07_brain.js ====
// ---------- 軍勢の頭脳（統率力） ----------
// 統率力 0「烏合」：各自が勝手に一番近い敵へ向かう（ばらばらに動く）
// 1「陣形」  ：あなたの周りに陣を組む。近接は敵の来る側の前列、射手・術師は後列。深追いしない
// 2「護衛」  ：あなたに迫る敵・あなたを傷つけた敵へ、近くの兵が駆けつける（危ないほど大勢で）
// 3「将狙い」：ボス・中ボスには合成体と兵の一部が向かい、残りが取り巻きを受け持つ
// 4「連携」  ：倒れかけの敵への無駄撃ちと群がりすぎを避ける。射手は敵の射手・術師・司祭を先に
// 5「見切り」：敵の予告攻撃から飛びのく。倒れかけの合成体はあなたのそばへ下がる
// 頭脳はまとめて0.15秒ごとに状況を読み、各兵は索敵のたびにそれを参照する（兵ごとの重い計算を避ける）

function leadLv() { return G.lead || 0; }
// 陣の大きさ（兵が多いほど広い）
function armyRadius() { return 22 + Math.sqrt(G.allyCount || 0) * 7.5; }
function isRangedAlly(u) { return unitRange(u) > 40; }
// ボスへ向かう役：合成体・配下のボス・兵の3体に1体
function isHunter(u) { return u.kind === 'syn' || u.isBoss || u.unique || u.mid || u.id % 3 === 0; }

function newBrain() {
  return { t: 0, ang: 0, gAng: 0, threat: false, ring: true, danger: [], urgent: false, boss: null, wasDanger: false, wasBoss: null, alertT: 0 };
}

function updateArmyBrain(dt) {
  const L = leadLv();
  if (L <= 0) return;
  const B = G.brain || (G.brain = newBrain());
  const N = G.necro;
  // 陣の向きは毎フレームなめらかに追う（急に振り回さない）
  let da = B.gAng - B.ang;
  while (da > Math.PI) da -= TAU;
  while (da < -Math.PI) da += TAU;
  const turn = 2.4 * dt;
  B.ang += Math.abs(da) < turn ? da : Math.sign(da) * turn;
  B.alertT -= dt;
  B.t -= dt;
  if (B.t > 0) return;
  B.t = 0.15;

  // ---- 1. 敵の来る向き（近い敵・大きな敵ほど重く） ----
  let sx = 0, sy = 0, sw = 0, n = 0;
  G.tgrid[ENEMY].query(N.x, N.y, 330, (e) => {
    if (e.team !== ENEMY || e.dead) return;
    const dx = e.x - N.x, dy = e.y - N.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d > 330) return;
    const w = (e.isBoss ? 5 : e.mid ? 2.5 : 1) / (40 + d);
    sx += dx / d * w; sy += dy / d * w; sw += w; n++;
  });
  B.threat = n > 0;
  // 四方から来ているときは前後を作らず、円陣で迎える
  const conc = sw > 0 ? Math.sqrt(sx * sx + sy * sy) / sw : 0;
  B.ring = !B.threat || conc < 0.3;
  if (B.threat && conc >= 0.15) B.gAng = Math.atan2(sy, sx);

  // ---- 2. あなたの危機（護衛） ----
  for (const e of B.danger) e.guardN = 0;
  B.danger.length = 0;
  if (L >= 2 && !N.dead) {
    B.urgent = N.hp < N.mhp * 0.5;
    const hurt = N.hurtT > 0 || (G.necroHitT != null && G.t - G.necroHitT < 1.5);
    const near = B.urgent ? 110 : 70;
    G.tgrid[ENEMY].query(N.x, N.y, 190, (e) => {
      if (e.team !== ENEMY || e.dead || e.air > 0) return;
      const d2 = dist2(e.x, e.y, N.x, N.y);
      const close = d2 < (near + e.size) * (near + e.size);
      // あなたを狙って向かってくる敵（近接は近づいてから、射手・術師は傷を負わされたら）
      const aiming = e.tgt === N && (e.range > 40 ? hurt && d2 < 190 * 190 : d2 < 150 * 150);
      if (close || aiming) B.danger.push(e);
    });
    const a = G.necroAttacker;
    if (a && isAlive(a) && a.team === ENEMY && G.t - G.necroHitT < 1.5 && dist2(a.x, a.y, N.x, N.y) < 280 * 280 && !B.danger.includes(a)) B.danger.push(a);
    for (const e of B.danger) { e.guardN = 0; e.guardQ = (B.urgent ? 6 : 3) + Math.round(e.size / 8) + (e.isBoss ? 4 : 0); }
    // 突進の構えに入った騎兵の前に、近くの兵が立ちはだかる（合成体なら1体、普通の兵なら3体で止まる）
    G.tgrid[ENEMY].query(N.x, N.y, 300, (e) => {
      if (e.team !== ENEMY || e.dead || !(e.windT > 0) || e.blockAt > G.t - 3) return;
      if (dist2(e.cx, e.cy, N.x, N.y) > 40 * 40) return;
      e.blockAt = G.t;
      const dx = e.x - N.x, dy = e.y - N.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const ux = dx / d, uy = dy / d;
      const px = N.x + ux * Math.min(16, d * 0.5), py = N.y + uy * Math.min(16, d * 0.5);
      const cand = [];
      G.tgrid[ALLY].query(px, py, 95, (a) => {
        if (a.team !== ALLY || a.dead || a.air > 0 || a.immortal || a.dodgeT > 0) return;
        const dd = dist2(a.x, a.y, px, py);
        if (dd > 95 * 95) return;
        cand.push({ a, s: dd * (a.kind === 'syn' || a.isBoss ? 0.35 : 1) });
      });
      cand.sort((p, q) => p.s - q.s);
      let need = 3, k = 0;
      for (let i = 0; i < cand.length && need > 0; i++, k++) {
        // 突進の線の上に縦に並ぶ（あなたに近い順に）
        const a = cand[i].a;
        a.blockX = px + ux * k * 9; a.blockY = py + uy * k * 9;
        a.blockT = e.windT + 1.2; a.markT = 0.7; a.hunt = false;
        need -= a.kind === 'syn' || a.isBoss ? 3 : 1;
      }
    });
  } else B.urgent = false;

  // ---- 3. 近くのボス（将狙い） ----
  B.boss = null;
  if (L >= 3) {
    let bd = 420 * 420;
    const look = (b) => { if (b.dead || b.team !== ENEMY || b.air > 0) return; const d = dist2(b.x, b.y, N.x, N.y); if (d < bd) { bd = d; B.boss = b; } };
    for (const b of G.bossAlive) look(b);
    if (!B.boss) for (const b of G.midAlive) look(b);
  }

  // ---- 4. 誰が何を狙っているか（護衛の人数と、連携の無駄撃ち判定） ----
  if (L >= 4) for (const e of G.units) if (e.team === ENEMY) { e.aimN = 0; e.aimDps = 0; }
  for (const u of G.units) {
    if (u.team !== ALLY || u.dead) continue;
    if (u.guardOf) { if (isAlive(u.guardOf) && B.danger.includes(u.guardOf) && u.tgt === u.guardOf) u.guardOf.guardN++; else u.guardOf = null; }
    if (L >= 4 && u.tgt && u.tgt.team === ENEMY && !u.tgt.dead) { u.tgt.aimN++; u.tgt.aimDps += u.atk / Math.max(0.2, u.cd || 1); }
  }

  // ---- 5. 見切り：新しく見えた敵の予告攻撃から飛びのく ----
  if (L >= 5) {
    for (const t of G.teles) {
      if (t.dodgeScan || t.team !== ENEMY || t.kind === 'mark' || !(t.dmg > 0 || t.necro) || !teleActive(t)) continue;
      t.dodgeScan = true;
      const reach = teleReach(t) + 10;
      G.tgrid[ALLY].query(t.x, t.y, reach, (a) => {
        if (a.team !== ALLY || a.dead || a.immortal || a.air > 0) return;
        const pad = a.size * 0.5 + 3;
        if (!teleHit(t, a.x, a.y, pad)) return;
        const p = teleEscape(t, a.x, a.y, pad);
        a.dodgeX = clamp(p[0], 24, MAP - 24); a.dodgeY = clamp(p[1], 24, MAP - 24);
        a.dodgeT = Math.max(a.dodgeT || 0, t.t + 0.12);
      });
    }
  }

  // ---- 合図（初めて起きたときだけ、何が起きたかを知らせる） ----
  const dangerNow = B.danger.length > 0;
  if (L >= 2 && dangerNow && !B.wasDanger && B.alertT <= 0) {
    B.alertT = 4;
    UI.hint('統率力「護衛」：兵があなたを守りに駆けつけた', 'lead_guard', 3.5);
  }
  B.wasDanger = dangerNow;
  if (L >= 3 && B.boss && B.boss !== B.wasBoss) UI.hint('統率力「将狙い」：合成体と兵の一部がボスに向かった', 'lead_boss', 3.5);
  B.wasBoss = B.boss;
}

// 陣の中の持ち場（兵ごとに決まった場所。陣は敵の来る向きへ回る）
function formationSlot(u) {
  const N = G.necro, B = G.brain, R = armyRadius();
  const ranged = isRangedAlly(u);
  let a, d;
  if (!B || B.ring) {
    a = u.fa * TAU;
    d = ranged ? 12 + u.fd * R * 0.45 : R * 0.45 + u.fd * R * 0.6;
  } else if (ranged) {
    // 後列：あなたの後ろから脇にかけて
    a = B.ang + Math.PI + (u.fa * 2 - 1) * 1.9;
    d = 10 + u.fd * R * 0.42;
  } else if (u.fa < 0.26) {
    // 近衛：近接の4体に1体はあなたのすぐ周りを固める（回り込んだ敵への備え）
    a = u.fa / 0.26 * TAU;
    d = R * 0.28 + u.fd * R * 0.22;
  } else {
    // 前列：敵の来る側に扇形に並ぶ
    a = B.ang + ((u.fa - 0.26) / 0.74 * 2 - 1) * 1.3;
    d = R * 0.5 + u.fd * R * 0.62;
  }
  return [N.x + Math.cos(a) * d, N.y + Math.sin(a) * d * 0.8];
}

// 予告攻撃の外へ出る地点
function teleEscape(t, x, y, pad) {
  const m = 7 + pad;
  const dx = x - t.x, dy = y - t.y;
  switch (t.kind) {
    case 'line': {
      const c = Math.cos(t.ang), s = Math.sin(t.ang);
      const pe = -dx * s + dy * c;
      const sg = pe >= 0 ? 1 : -1;
      const need = t.w / 2 - Math.abs(pe) + m;
      return [x - s * sg * need, y + c * sg * need];
    }
    case 'cone': {
      const d = Math.max(14, Math.sqrt(dx * dx + dy * dy));
      let da = Math.atan2(dy, dx) - t.ang;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      const na = t.ang + (da >= 0 ? 1 : -1) * (t.spread + 0.3);
      return [t.x + Math.cos(na) * d, t.y + Math.sin(na) * d];
    }
    default: {
      // 円・輪：画面の奥行きに合わせて縦を潰した楕円で考える
      let ex = dx, ey = dy / 0.75;
      let e = Math.sqrt(ex * ex + ey * ey);
      if (e < 1) { const a = rng() * TAU; ex = Math.cos(a); ey = Math.sin(a); e = 1; }
      let rt;
      if (t.kind === 'ring') rt = t.r0 > 12 && e < (t.r0 + t.r1) / 2 ? Math.max(0, t.r0 - m) : t.r1 + m;
      else rt = t.r + m;
      return [t.x + ex / e * rt, t.y + ey / e * rt * 0.75];
    }
  }
}

// 統率力1以上の索敵（あなたについている兵だけ。窯の守りは昔のまま）
function retargetLed(u, L) {
  const N = G.necro, B = G.brain || (G.brain = newBrain()), M = G.mods;
  const R = armyRadius();
  const dN2 = dist2(u.x, u.y, N.x, N.y);
  u.hunt = false;
  // 見切り：倒れかけの合成体はあなたのそばへ下がる（4秒。何度も逃げ続けはしない）
  if (L >= 5) {
    if (u.retreatT > 0) { u.tgt = null; return; }
    if ((u.kind === 'syn' || u.isBoss) && !u.immortal && u.hp < u.mhp * 0.3 && B.threat && !(u.retreatCd > G.t) && dN2 > 30 * 30) {
      u.retreatT = 4; u.retreatCd = G.t + 14; u.tgt = null; u.guardOf = null; return;
    }
  }
  // 護衛：あなたの近くにいる兵が、迫る敵へ駆けつける（敵1体ごとに人数を決めて群がりすぎない）
  if (L >= 2 && B.danger.length) {
    const gr = B.urgent ? 300 : R + 110;
    if (dN2 < gr * gr) {
      let best = null, bd = 1e18;
      for (const e of B.danger) {
        if (e.dead || e.air > 0) continue;
        if (u.guardOf !== e && (e.guardN || 0) >= e.guardQ) continue;
        const d = dist2(u.x, u.y, e.x, e.y);
